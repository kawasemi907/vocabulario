{w:"el puerto",p:"nm",en:"port, harbor",fr:"le port",ex:"Desde el puerto de Cádiz salían los barcos hacia América con vino, aceite y aventureros.",exEn:"Ships left the port of Cádiz for America with wine, oil and adventurers.",exFr:"Du port de Cadix partaient les bateaux vers l'Amérique avec du vin, de l'huile et des aventuriers.",n:"ラテン語portus（港）から。英port・passport、仏portと同源。山の「峠」もpuertoと言う。カディスは新大陸との交易で栄えた港町。"},
{w:"la isla",p:"nf",en:"island",fr:"l'île",ex:"En la isla de La Gomera la gente hablaba con silbidos de una montaña a otra.",exEn:"On the island of La Gomera people talked by whistling from one mountain to another.",exFr:"Sur l'île de La Gomera, les gens se parlaient en sifflant d'une montagne à l'autre.",n:"ラテン語insula（島）から。英isle・insulate、仏îleと同源。ラ・ゴメラ島の口笛言語Silbo gomeroはユネスコの無形文化遺産。"},
{w:"el bosque",p:"nm",en:"forest, woods",fr:"la forêt, le bois",ex:"Cuando era pequeño, pensaba que en el bosque de Irati vivían brujas y no quería entrar.",exEn:"When I was little, I thought witches lived in the Irati forest and I did not want to go in.",exFr:"Quand j'étais petit, je pensais que des sorcières vivaient dans la forêt d'Irati et je ne voulais pas y entrer.",n:"ゲルマン語起源の語とされ、英bush、仏boisと同源。ナバラのイラティの森はヨーロッパ有数のブナとモミの森で、魔女の伝説も残る。"},
{w:"la tierra",p:"nf",en:"earth, land, soil",fr:"la terre",ex:"Mi abuelo cogía un poco de tierra de su huerta y decía: aquí hay más vida que en la ciudad.",exEn:"My grandfather would pick up a little soil from his vegetable garden and say: there is more life here than in the city.",exFr:"Mon grand-père prenait un peu de terre de son potager et disait : ici, il y a plus de vie qu'en ville.",n:"ラテン語terra（土地）から。英terrain・territory、仏terreと同源。「地球」はla Tierraと大文字で書く。mi tierraで「私の故郷」の意味にもなる。"},
{w:"el fuego",p:"nm",en:"fire",fr:"le feu",ex:"En las Fallas de Valencia queman enormes figuras en el fuego, y la gente llora de emoción.",exEn:"In the Fallas of Valencia they burn huge figures in the fire, and people cry with emotion.",exFr:"Pendant les Fallas de Valence, on brûle d'énormes figures dans le feu, et les gens pleurent d'émotion.",n:"ラテン語focus（炉）から。英focus、仏feuと同源。fuegos artificialesは「花火」。バレンシアの火祭りFallasでは3月19日の夜に人形を燃やす。"},
{w:"la piedra",p:"nf",en:"stone, rock",fr:"la pierre",ex:"Los incas construyeron Machu Picchu con piedras tan perfectas que no necesitaban cemento.",exEn:"The Incas built Machu Picchu with stones so perfect that they did not need cement.",exFr:"Les Incas ont construit le Machu Picchu avec des pierres si parfaites qu'ils n'avaient pas besoin de ciment.",n:"ギリシャ語petra（岩）がラテン語を経て入った語。英petroleum、仏pierre、人名Peter / Pedroと同源。"},
{w:"el animal",p:"nm",en:"animal",fr:"l'animal",ex:"El animal más famoso de Galápagos es la tortuga gigante, que puede vivir más de cien años.",exEn:"The most famous animal of the Galápagos is the giant tortoise, which can live more than a hundred years.",exFr:"L'animal le plus célèbre des Galápagos est la tortue géante, qui peut vivre plus de cent ans.",n:"ラテン語anima（息、魂）から、「息をするもの」が原義。英animal・animation、仏animalと同源。スペイン語ではロバや牛のように振る舞う人を冗談でanimalと呼ぶこともある。"},
{w:"el toro",p:"nm",en:"bull",fr:"le taureau",ex:"El famoso toro de Osborne era un anuncio de brandy, pero ahora es un símbolo de las carreteras españolas.",exEn:"The famous Osborne bull was an advertisement for brandy, but now it is a symbol of Spanish roads.",exFr:"Le célèbre taureau d'Osborne était une publicité pour du brandy, mais c'est maintenant un symbole des routes espagnoles.",n:"ラテン語taurus（雄牛）から。英Taurus（牡牛座）、仏taureauと同源。道路沿いに立つ黒い雄牛の看板は元は酒の広告で、今は文化的な象徴として残されている。"},
{w:"el caballo",p:"nm",en:"horse",fr:"le cheval",ex:"Don Quijote tenía un caballo muy flaco que se llamaba Rocinante.",exEn:"Don Quixote had a very skinny horse called Rocinante.",exFr:"Don Quichotte avait un cheval très maigre qui s'appelait Rossinante.",n:"ラテン語caballus（駄馬）から。仏cheval、英cavalryと同源。古典ラテン語の「馬」equusは英equestrianに残る。ドン・キホーテの愛馬ロシナンテは有名。"},
{w:"el jamón",p:"nm",en:"ham",fr:"le jambon",ex:"En casa de mis tíos siempre había un jamón en la cocina, y nadie sabía quién lo cortaba por la noche.",exEn:"At my aunt and uncle's there was always a ham in the kitchen, and nobody knew who was cutting it at night.",exFr:"Chez mon oncle et ma tante, il y avait toujours un jambon dans la cuisine, et personne ne savait qui le coupait la nuit.",n:"仏jambon（jambe＝脚から）からの借用語とされる。スペインでは脚一本を専用の台に固定して家で切る家庭が多い。イベリコ豚の生ハムはjamón ibérico。"},
{w:"la patata",p:"nf",en:"potato",fr:"la pomme de terre",ex:"La tortilla de mi madre tenía patata y cebolla; la de mi padre tenía patata y problemas.",exEn:"My mother's tortilla had potato and onion; my father's had potato and problems.",exFr:"La tortilla de ma mère avait des pommes de terre et de l'oignon ; celle de mon père avait des pommes de terre et des problèmes.",n:"タイノ語batata（サツマイモ）とケチュア語papa（ジャガイモ）が混ざった形とされる。英potatoの語源でもある。スペイン以外の中南米ではpapaが一般的。トルティーヤに玉ねぎを入れるかは永遠の論争。"},
{w:"el tomate",p:"nm",en:"tomato",fr:"la tomate",ex:"Antes de llegar a Europa, el tomate era mexicano; ahora es el rey del gazpacho.",exEn:"Before reaching Europe, the tomato was Mexican; now it is the king of gazpacho.",exFr:"Avant d'arriver en Europe, la tomate était mexicaine ; maintenant, c'est la reine du gazpacho.",n:"アステカのナワトル語tomatlから。英tomato、仏tomateもスペイン語経由で広まった。chocolateやaguacateも同じくナワトル語起源。"},
{w:"el ajo",p:"nm",en:"garlic",fr:"l'ail",ex:"Mi abuela decía que la sopa de ajo curaba todo, desde el frío hasta el amor.",exEn:"My grandmother used to say that garlic soup cured everything, from cold to love.",exFr:"Ma grand-mère disait que la soupe à l'ail guérissait tout, du froid jusqu'à l'amour.",n:"ラテン語allium（ニンニク）から。仏ailと同源。sopa de ajoはパンとニンニク、卵のカスティーリャの素朴なスープ。estar en el ajoは「事情に通じている・関わっている」。"},
{w:"la sal",p:"nf",en:"salt",fr:"le sel",ex:"En Lanzarote sacaban la sal del mar, y todavía se puede ver cómo lo hacían.",exEn:"In Lanzarote they took salt from the sea, and you can still see how they did it.",exFr:"À Lanzarote, on extrayait le sel de la mer, et on peut encore voir comment on le faisait.",n:"ラテン語sal（塩）から。英salary・salad・sauce、仏selと同源。古代ローマ兵の給料の一部が塩だったことがsalaryの語源と言われるが、確かではない。スペイン語では女性名詞。"},
{w:"el azúcar",p:"nm",en:"sugar",fr:"le sucre",ex:"Cuando era niño, merendaba pan con aceite y azúcar, y era el más feliz del barrio.",exEn:"When I was a child, I had bread with oil and sugar as an afternoon snack, and I was the happiest kid in the neighborhood.",exFr:"Quand j'étais enfant, je goûtais du pain avec de l'huile et du sucre, et j'étais le plus heureux du quartier.",n:"アラビア語as-sukkarに由来するとされ、語頭のa-はアラビア語の定冠詞の名残。英sugar、仏sucreと同じ起源。el azúcarが基本だが、la azúcar morenaのように女性扱いされることもある。"},
{w:"el chocolate",p:"nm",en:"chocolate, hot chocolate",fr:"le chocolat",ex:"Después de la fiesta, a las seis de la mañana, siempre tomábamos chocolate con churros.",exEn:"After the party, at six in the morning, we always had hot chocolate with churros.",exFr:"Après la fête, à six heures du matin, nous prenions toujours un chocolat avec des churros.",n:"ナワトル語に由来するとされ、スペイン語経由で英chocolate、仏chocolatとして広まった。スペインのchocolateはスプーンが立つほど濃いホットチョコレート。"},
{w:"la taza",p:"nf",en:"cup, mug",fr:"la tasse",ex:"En la cafetería de mi pueblo, el café se servía en vaso y el chocolate en taza.",exEn:"In my village café, coffee was served in a glass and hot chocolate in a cup.",exFr:"Dans le café de mon village, le café était servi dans un verre et le chocolat dans une tasse.",n:"アラビア語tassa（鉢）に由来するとされ、仏tasseと同源。vaso（コップ）、copa（脚付きグラス）、taza（取っ手付きカップ）を使い分ける。"},
{w:"el cuchillo",p:"nm",en:"knife",fr:"le couteau",ex:"En el norte, los pastores llevaban siempre un cuchillo pequeño para cortar el pan y el queso.",exEn:"In the north, shepherds always carried a small knife to cut bread and cheese.",exFr:"Dans le nord, les bergers portaient toujours un petit couteau pour couper le pain et le fromage.",n:"ラテン語cultellus（小さなナイフ）から。仏couteauと同源。英cutlery（食器類）も同じ系統。フォークはel tenedor、スプーンはla cuchara。"},
{w:"la guitarra",p:"nf",en:"guitar",fr:"la guitare",ex:"Mi abuelo tocaba la guitarra española y cantaba coplas hasta que los vecinos se unían.",exEn:"My grandfather played the Spanish guitar and sang coplas until the neighbors joined in.",exFr:"Mon grand-père jouait de la guitare espagnole et chantait des coplas jusqu'à ce que les voisins se joignent à lui.",n:"ギリシャ語kithara（竪琴）がアラビア語を経て入ったとされる。英guitar、仏guitareもスペイン語経由。クラシックギターは英語でもSpanish guitarと呼ばれる。"},
{w:"el cuadro",p:"nm",en:"painting, picture, square",fr:"le tableau",ex:"En el Prado estuve una hora delante de un cuadro de Velázquez y no entendí nada, pero me encantó.",exEn:"In the Prado I spent an hour in front of a painting by Velázquez and understood nothing, but I loved it.",exFr:"Au Prado, je suis resté une heure devant un tableau de Vélasquez et je n'ai rien compris, mais j'ai adoré.",n:"ラテン語quadrus（四角い）から。英quadrant・square、仏carréと同源。「絵画」のほか「四角・格子柄（a cuadros）」の意味もある。"},
{w:"la canción",p:"nf",en:"song",fr:"la chanson",ex:"En el coche, mis padres cantaban canciones de los años ochenta y nosotros fingíamos dormir.",exEn:"In the car, my parents sang songs from the eighties and we pretended to be asleep.",exFr:"En voiture, mes parents chantaient des chansons des années quatre-vingt et nous faisions semblant de dormir.",n:"ラテン語cantio（歌うこと）から。仏chanson、英chantと同源。-ciónで終わる名詞は女性名詞。"},
{w:"la costumbre",p:"nf",en:"custom, habit",fr:"la coutume, l'habitude",ex:"En España tenemos la costumbre de dar dos besos, pero en Japón mis amigos se asustaban.",exEn:"In Spain we have the custom of giving two kisses, but in Japan my friends got scared.",exFr:"En Espagne, nous avons l'habitude de faire deux bises, mais au Japon mes amis prenaient peur.",n:"ラテン語consuetudo（習慣）から。英custom・costume、仏coutumeと同源。-umbreで終わる名詞は女性名詞。tener la costumbre de〜で「〜する習慣がある」。"},
{w:"el siglo",p:"nm",en:"century",fr:"le siècle",ex:"En el siglo XVI el español se hablaba en medio mundo, y hoy lo hablan casi quinientos millones de personas.",exEn:"In the 16th century Spanish was spoken in half the world, and today almost five hundred million people speak it.",exFr:"Au XVIe siècle, l'espagnol se parlait dans la moitié du monde, et aujourd'hui presque cinq cents millions de personnes le parlent.",n:"ラテン語saeculum（世代、時代）から。仏siècle、英secularと同源。世紀はローマ数字で書き、siglo XXI（veintiuno）のように基数で読む。"},
{w:"el rey",p:"nm",en:"king",fr:"le roi",ex:"El 6 de enero los niños esperan a los Reyes Magos, y los mayores esperan el roscón.",exEn:"On January 6th children wait for the Three Kings, and grown-ups wait for the roscón.",exFr:"Le 6 janvier, les enfants attendent les Rois mages, et les adultes attendent le roscón.",n:"ラテン語rex, regis（王）から。英royal・regal、仏roiと同源。los Reyesは「国王夫妻」または「東方の三博士」。roscónは1月6日に食べるリング型の菓子パン。"},
{w:"amarillo",p:"adj",en:"yellow",fr:"jaune",ex:"En Argentina el taxi era negro y amarillo, y el conductor hablaba de fútbol todo el viaje.",exEn:"In Argentina the taxi was black and yellow, and the driver talked about football the whole ride.",exFr:"En Argentine, le taxi était noir et jaune, et le chauffeur a parlé de football pendant tout le trajet.",n:"後期ラテン語amarellus（やや苦い）から来たとされ、胆汁の色に由来するという説がある。仏jaune（galbinus由来）とは別語源。"},
{w:"oscuro",p:"adj",en:"dark",fr:"sombre, foncé",ex:"En diciembre en Madrid ya era oscuro a las seis, pero las calles estaban llenas de luces.",exEn:"In December in Madrid it was already dark at six, but the streets were full of lights.",exFr:"En décembre à Madrid, il faisait déjà nuit à six heures, mais les rues étaient pleines de lumières.",n:"ラテン語obscurus（暗い）から。英obscure、仏obscurと同源。色の前ではazul oscuro（紺色）のように「濃い」を表す。反対語はclaro。"},
{w:"claro",p:"adj",en:"clear, light, of course",fr:"clair, bien sûr",ex:"—¿Vendrás a la fiesta del pueblo? —¡Claro! Mi abuela ya me hizo la maleta.",exEn:"Will you come to the village festival? — Of course! My grandmother has already packed my suitcase.",exFr:"Tu viendras à la fête du village ? — Bien sûr ! Ma grand-mère m'a déjà fait ma valise.",n:"ラテン語clarus（明るい、明らかな）から。英clear・clarify、仏clairと同源。¡Claro!（もちろん！）は会話で非常によく使う。azul claroは「水色」。"},
{w:"dulce",p:"adj",en:"sweet",fr:"doux, sucré",ex:"Los dulces de los conventos de Sevilla eran tan buenos que la gente hacía cola delante de una pared.",exEn:"The sweets from the convents of Seville were so good that people queued in front of a wall.",exFr:"Les douceurs des couvents de Séville étaient si bonnes que les gens faisaient la queue devant un mur.",n:"ラテン語dulcis（甘い）から。仏douxと同源。名詞el dulceは「お菓子」。スペインの修道院では、回転式の小窓（torno）越しに尼僧の手作り菓子を買う習慣がある。"},
{w:"picante",p:"adj",en:"spicy, hot",fr:"piquant, épicé",ex:"En México pedí una salsa poco picante y lloré durante toda la comida.",exEn:"In Mexico I asked for a not very spicy sauce and cried through the whole meal.",exFr:"Au Mexique, j'ai demandé une sauce pas trop piquante et j'ai pleuré pendant tout le repas.",n:"picar（刺す）の現在分詞から。仏piquantと同源。スペイン料理は一般に辛くないが、メキシコ料理ではチリの辛さが欠かせない。"},
{w:"fresco",p:"adj",en:"fresh, cool",fr:"frais",ex:"En el mercado de Vigo el pescado era tan fresco que todavía nos miraba.",exEn:"At the market in Vigo the fish was so fresh that it was still looking at us.",exFr:"Au marché de Vigo, le poisson était si frais qu'il nous regardait encore.",n:"ゲルマン語frisk（新しい）から来たとされる。英fresh、仏fraisと同源。hace frescoは「涼しい・肌寒い」。¡Qué fresco!は「なんて図々しい！」の意味にもなる。"},
{w:"seco",p:"adj",en:"dry",fr:"sec",ex:"En La Mancha el verano era tan seco que Don Quijote veía gigantes donde había molinos.",exEn:"In La Mancha summer was so dry that Don Quixote saw giants where there were windmills.",exFr:"Dans la Manche, l'été était si sec que Don Quichotte voyait des géants là où il y avait des moulins.",n:"ラテン語siccus（乾いた）から。仏sec、英desiccateと同源。vino secoは「辛口のワイン」。"},
{w:"duro",p:"adj",en:"hard, tough",fr:"dur",ex:"El pan de ayer estaba tan duro que lo usamos para hacer migas.",exEn:"Yesterday's bread was so hard that we used it to make migas.",exFr:"Le pain d'hier était si dur que nous l'avons utilisé pour faire des migas.",n:"ラテン語durus（硬い）から。英durable・endure、仏durと同源。migasは固くなったパンを炒めた羊飼いの料理。昔の5ペセタ硬貨もun duroと呼ばれた。"},
{w:"raro",p:"adj",en:"strange, rare",fr:"bizarre, rare",ex:"A mis amigos ingleses les parecía raro cenar a las diez, y a mí me parecía raro cenar a las seis.",exEn:"My English friends found it strange to have dinner at ten, and I found it strange to have dinner at six.",exFr:"Mes amis anglais trouvaient bizarre de dîner à dix heures, et moi je trouvais bizarre de dîner à six heures.",n:"ラテン語rarus（まばらな、珍しい）から。英rare、仏rareと同源だが、スペイン語では「変な・奇妙な」の意味で使うことが多い。"},
{w:"peligroso",p:"adj",en:"dangerous",fr:"dangereux",ex:"El Caminito del Rey en Málaga era el camino más peligroso del mundo, pero ahora es seguro.",exEn:"The Caminito del Rey in Málaga was the most dangerous path in the world, but now it is safe.",exFr:"Le Caminito del Rey, près de Málaga, était le chemin le plus dangereux du monde, mais maintenant il est sûr.",n:"peligro（危険、ラテン語periculum）から。英peril、仏périlと同源。マラガの断崖の遊歩道カミニート・デル・レイは2015年に改修されて安全になった。"},
{w:"cómodo",p:"adj",en:"comfortable",fr:"confortable, pratique",ex:"Las alpargatas eran los zapatos más cómodos del verano, y todos los pueblos las vendían.",exEn:"Espadrilles were the most comfortable shoes of the summer, and every village sold them.",exFr:"Les espadrilles étaient les chaussures les plus confortables de l'été, et tous les villages en vendaient.",n:"ラテン語commodus（適した）から。英commodity・accommodate、仏commodeと同源。ponerse cómodo（くつろぐ）。alpargataは麻底の布靴で、英espadrilleの元になった。"},
{w:"delicioso",p:"adj",en:"delicious",fr:"délicieux",ex:"El pulpo a la gallega estaba delicioso, pero mi hermano no quería comer algo con ocho piernas.",exEn:"The Galician-style octopus was delicious, but my brother did not want to eat something with eight legs.",exFr:"Le poulpe à la galicienne était délicieux, mais mon frère ne voulait pas manger quelque chose avec huit pattes.",n:"ラテン語deliciae（喜び）から。英delicious、仏délicieuxと同源。口語では¡Qué rico!（おいしい！）のほうがよく使われる。"},
{w:"lento",p:"adj",en:"slow",fr:"lent",ex:"El tren a Galicia era tan lento que en el viaje leí el Quijote entero.",exEn:"The train to Galicia was so slow that I read the whole of Don Quixote on the journey.",exFr:"Le train pour la Galice était si lent que j'ai lu tout le Don Quichotte pendant le voyage.",n:"ラテン語lentus（ゆっくりした）から。仏lent、音楽用語lentoと同源。副詞はlentamente、または口語でdespacio。"},
{w:"ancho",p:"adj",en:"wide, broad",fr:"large",ex:"La avenida 9 de Julio de Buenos Aires es tan ancha que no la pudimos cruzar en un solo semáforo.",exEn:"The 9 de Julio Avenue in Buenos Aires is so wide that we could not cross it in one green light.",exFr:"L'avenue 9 de Julio de Buenos Aires est si large que nous n'avons pas pu la traverser en un seul feu vert.",n:"ラテン語amplus（広い）から。英ample、仏ampleと同源。ラテン語のpl-がスペイン語でch-になった例。a sus anchasは「のびのびと・くつろいで」。"},
{w:"estrecho",p:"adj",en:"narrow, tight",fr:"étroit",ex:"Las calles del barrio de Santa Cruz eran tan estrechas que los vecinos se pasaban la sal por la ventana.",exEn:"The streets of the Santa Cruz quarter were so narrow that neighbors passed each other the salt through the window.",exFr:"Les rues du quartier de Santa Cruz étaient si étroites que les voisins se passaient le sel par la fenêtre.",n:"ラテン語strictus（締めつけられた）から。英strict、仏étroitと同源。名詞el estrechoは「海峡」（el estrecho de Gibraltar）。セビーリャのサンタ・クルス地区は細い路地で有名。"},
{w:"precioso",p:"adj",en:"beautiful, lovely, precious",fr:"magnifique, précieux",ex:"El atardecer desde el mirador de San Nicolás, con la Alhambra delante, era precioso.",exEn:"The sunset from the San Nicolás viewpoint, with the Alhambra in front, was beautiful.",exFr:"Le coucher de soleil depuis le mirador de San Nicolás, avec l'Alhambra en face, était magnifique.",n:"ラテン語pretiosus（高価な）から。英precious、仏précieuxと同源。スペイン語では「高価な」よりも「とても美しい・すてきな」の意味で日常的に使う。"},
{w:"tan",p:"adv",en:"so, as",fr:"si, aussi",ex:"En mi vida comí algo tan bueno como el cochinillo de Segovia.",exEn:"Never in my life did I eat anything as good as the suckling pig in Segovia.",exFr:"De ma vie, je n'ai rien mangé d'aussi bon que le cochon de lait de Ségovie.",n:"ラテン語tam（それほど）から。tan＋形容詞・副詞＋queで「とても〜なので…」、tan〜como…で「…と同じくらい〜」。名詞の前ではtanto/tantaを使う。"},
{w:"tanto",p:"adj",en:"so much, so many",fr:"tant, autant",ex:"Había tanta gente en la Puerta del Sol que no pudimos ver el reloj a las doce.",exEn:"There were so many people in the Puerta del Sol that we could not see the clock at midnight.",exFr:"Il y avait tant de monde à la Puerta del Sol que nous n'avons pas pu voir l'horloge à minuit.",n:"ラテン語tantus（それほど大きな）から。仏tantと同源。名詞に合わせてtanto/tanta/tantos/tantasと変化する。大晦日にはマドリードのプエルタ・デル・ソルの時計に合わせてブドウを食べる。"},
{w:"fuera",p:"adv",en:"outside, out",fr:"dehors",ex:"Hacía tanto calor dentro que cenamos fuera, en la calle, con todos los vecinos.",exEn:"It was so hot inside that we had dinner outside, in the street, with all the neighbors.",exFr:"Il faisait si chaud à l'intérieur que nous avons dîné dehors, dans la rue, avec tous les voisins.",n:"ラテン語foris（戸外で）から。英foreign、仏forainと同源とされる。fuera de〜で「〜の外に」。レストランのテラス席はfueraと言う。"},
{w:"dentro",p:"adv",en:"inside",fr:"dedans, à l'intérieur",ex:"En el roscón de Reyes hay una sorpresa dentro, y quien la encuentra paga el roscón.",exEn:"In the roscón de Reyes there is a surprise inside, and whoever finds it pays for the roscón.",exFr:"Dans le roscón des Rois, il y a une surprise à l'intérieur, et celui qui la trouve paie le roscón.",n:"de＋intro（中へ）から。dentro de〜で「〜の中に」、時間ではdentro de una hora（1時間後に）。ロスコンの中には人形とソラマメが入っていて、ソラマメが当たった人が次の年に代金を払う習慣がある。"},
{w:"detrás",p:"adv",en:"behind",fr:"derrière",ex:"Detrás de la catedral había una pastelería donde las monjas vendían yemas.",exEn:"Behind the cathedral there was a pastry shop where the nuns sold yemas.",exFr:"Derrière la cathédrale, il y avait une pâtisserie où les religieuses vendaient des yemas.",n:"de＋tras（後ろに、ラテン語trans）から。detrás de〜で「〜の後ろに」。反対語はdelante。yemasは卵黄と砂糖で作るアビラなどの名物菓子。"},
{w:"delante",p:"adv",en:"in front",fr:"devant",ex:"Nos sentamos delante en el cine y vimos la película con dolor de cuello.",exEn:"We sat at the front in the cinema and watched the film with a sore neck.",exFr:"Nous nous sommes assis devant au cinéma et nous avons regardé le film avec un torticolis.",n:"de＋en＋ante（前に）から。delante de〜で「〜の前に」（場所）。時間の「〜の前に」はantes de〜を使う。"},
{w:"enseguida",p:"adv",en:"right away, immediately",fr:"tout de suite",ex:"El camarero dijo enseguida vuelvo, y volvió cuarenta minutos después.",exEn:"The waiter said I will be right back, and he came back forty minutes later.",exFr:"Le serveur a dit je reviens tout de suite, et il est revenu quarante minutes plus tard.",n:"en＋seguida（続いて）から。en seguidaと2語で書くこともできる。仏tout de suiteと同じ「続けてすぐに」という発想。"},
{w:"por fin",p:"loc",en:"at last, finally",fr:"enfin",ex:"Después de tres horas en la cola del Prado, por fin vimos Las Meninas.",exEn:"After three hours in the queue at the Prado, we finally saw Las Meninas.",exFr:"Après trois heures de queue au Prado, nous avons enfin vu Les Ménines.",n:"直訳は「終わりによって」。fin（終わり）はラテン語finisから、英final・finish、仏finと同源。待ちに待った気持ちを込めて使う。"},
{w:"de nuevo",p:"loc",en:"again",fr:"de nouveau",ex:"El año que viene iremos de nuevo a Cádiz, porque sin el carnaval ya no podemos vivir.",exEn:"Next year we will go to Cádiz again, because we can no longer live without the carnival.",exFr:"L'année prochaine, nous irons de nouveau à Cadix, parce que nous ne pouvons plus vivre sans le carnaval.",n:"nuevo（新しい）を使った表現で、仏de nouveauとまったく同じ組み立て。otra vezと同じ意味。"},
{w:"hacia",p:"prep",en:"towards, around (time)",fr:"vers",ex:"Hacia las nueve de la noche, toda la ciudad salía a la calle a tomar algo.",exEn:"Around nine in the evening, the whole city went out into the street for a drink.",exFr:"Vers neuf heures du soir, toute la ville sortait dans la rue boire un verre.",n:"古スペイン語faza（〜に向かって）から来たとされ、faz（顔、ラテン語facies）に遡る。「〜の方へ」の方向と、「〜ごろ」のおおよその時間を表す。"},
{w:"sino",p:"conj",en:"but (rather)",fr:"mais (plutôt)",ex:"El gazpacho no se toma caliente, sino muy frío.",exEn:"Gazpacho is not eaten hot, but very cold.",exFr:"Le gazpacho ne se mange pas chaud, mais très froid.",n:"si＋no から。否定の後で「AではなくB」と訂正するときはperoではなくsinoを使う。no solo〜sino también…（〜だけでなく…も）も重要。"},
{w:"ni",p:"conj",en:"nor, not even",fr:"ni",ex:"En aquel pueblo no había ni cobertura ni wifi, así que hablamos con los vecinos.",exEn:"In that village there was neither coverage nor wifi, so we talked with the neighbors.",exFr:"Dans ce village, il n'y avait ni réseau ni wifi, alors nous avons parlé avec les voisins.",n:"ラテン語nec（〜もない）から。仏niと同源。ni〜ni…で「〜も…もない」、ni siquiera（〜さえない）もよく使う。"}
]},
  {id:6, title:"Nivel 6", range:"501–600", words:[
{w:"aconsejar",p:"v",en:"to advise",fr:"conseiller",ex:"Te aconsejo que pruebes el salmorejo en Córdoba; luego no querrás gazpacho nunca más.",exEn:"I advise you to try salmorejo in Córdoba; afterwards you will never want gazpacho again.",exFr:"Je te conseille de goûter le salmorejo à Cordoue ; après, tu ne voudras plus jamais de gazpacho.",n:"consejo（助言、ラテン語consilium）から作られた動詞。英counsel、仏conseillerと同源。aconsejar que＋接続法で「〜するよう勧める」。salmorejoはトマトとパンで作るコルドバの濃い冷製スープ。"},
{w:"recomendar",p:"v",en:"to recommend",fr:"recommander",ex:"El camarero siempre recomienda el pulpo, pero yo te recomiendo que pidas las croquetas.",exEn:"The waiter always recommends the octopus, but I recommend you order the croquettes.",exFr:"Le serveur recommande toujours le poulpe, mais moi, je te recommande de commander les croquettes.",n:"re-＋encomendar（任せる）から。英recommend、仏recommanderと同源。e→ie変化（recomiendo）。recomendar que＋接続法で「〜するよう勧める」。"},
{w:"prohibir",p:"v",en:"to forbid, to ban",fr:"interdire",ex:"En mi casa estaba prohibido hablar durante el partido del Betis.",exEn:"In my house it was forbidden to talk during the Betis match.",exFr:"Chez moi, il était interdit de parler pendant le match du Betis.",n:"ラテン語prohibere（遠ざける）から。英prohibit、仏prohiberと同源。看板のProhibido fumar（禁煙）、Prohibido el paso（立入禁止）でよく見る。prohibir que＋接続法。"},
{w:"permitir",p:"v",en:"to allow, to permit",fr:"permettre",ex:"Mis padres no permiten que lleguemos tarde a la comida del domingo, ni siquiera por un partido.",exEn:"My parents do not allow us to be late for Sunday lunch, not even for a match.",exFr:"Mes parents ne permettent pas que nous arrivions en retard au déjeuner du dimanche, même pas pour un match.",n:"ラテン語permittere（通す、許す）から。英permit、仏permettreと同源。permitir que＋接続法で「〜することを許す」。¿Me permite?（よろしいですか）は丁寧な表現。"},
{w:"desear",p:"v",en:"to wish, to desire",fr:"souhaiter, désirer",ex:"Te deseo que tengas un buen viaje y que no pierdas la maleta en Barajas.",exEn:"I wish you a good trip and that you do not lose your suitcase at Barajas.",exFr:"Je te souhaite un bon voyage et que tu ne perdes pas ta valise à Barajas.",n:"ラテン語desiderare（切望する）から。英desire、仏désirerと同源。desear que＋接続法で「〜であることを願う」。Barajasはマドリードの空港の通称。"},
{w:"alegrarse",p:"v refl",en:"to be glad",fr:"se réjouir, être content",ex:"Me alegro de que vengas a la Semana Santa de Sevilla; prepárate para no dormir.",exEn:"I am glad you are coming to Holy Week in Seville; get ready not to sleep.",exFr:"Je suis content que tu viennes à la Semaine sainte de Séville ; prépare-toi à ne pas dormir.",n:"alegre（陽気な）から作られた動詞。alegrarse de que＋接続法で「〜をうれしく思う」。感情を表す動詞の後のque節は接続法になる。"},
{w:"temer",p:"v",en:"to fear, to be afraid",fr:"craindre",ex:"Temo que no haya mesa libre: en San Sebastián todos los bares están llenos a esta hora.",exEn:"I am afraid there will not be a free table: in San Sebastián all the bars are full at this time.",exFr:"Je crains qu'il n'y ait pas de table libre : à Saint-Sébastien, tous les bars sont pleins à cette heure-ci.",n:"ラテン語timere（恐れる）から。英timidと同源。temer que＋接続法。口語ではme temo que〜で「残念ながら〜のようだ」と控えめに伝える。"},
{w:"dudar",p:"v",en:"to doubt",fr:"douter",ex:"Dudo que mi abuelo quiera probar el sushi; para él, el pescado se come frito.",exEn:"I doubt my grandfather will want to try sushi; for him, fish is eaten fried.",exFr:"Je doute que mon grand-père veuille goûter les sushis ; pour lui, le poisson se mange frit.",n:"ラテン語dubitare（ためらう）から。英doubt、仏douterと同源。疑いを表すdudar que＋接続法。no dudo que〜（疑わない）なら直説法になる。"},
{w:"quejarse",p:"v refl",en:"to complain",fr:"se plaindre",ex:"No te quejes del calor: estás en Córdoba en agosto y fue idea tuya.",exEn:"Do not complain about the heat: you are in Córdoba in August and it was your idea.",exFr:"Ne te plains pas de la chaleur : tu es à Cordoue en août et c'était ton idée.",n:"俗ラテン語quassiare（打つ）に由来するとされる。「〜について文句を言う」はquejarse de〜。否定命令はno＋接続法（no te quejes）で、代名詞は動詞の前に置く。"},
{w:"enfadarse",p:"v refl",en:"to get angry",fr:"se fâcher",ex:"No te enfades, pero me comí el último trozo de tortilla.",exEn:"Do not get angry, but I ate the last piece of tortilla.",exFr:"Ne te fâche pas, mais j'ai mangé le dernier morceau de tortilla.",n:"語源ははっきりしない。「〜に腹を立てる」はenfadarse con〜。中南米ではenojarseが一般的。スペインでは最後の一切れ（el trozo de la vergüenza）に誰も手を出さない習慣がある。"},
{w:"acordarse",p:"v refl",en:"to remember",fr:"se souvenir",ex:"Acuérdate de comprar pan, que hoy viene la abuela a comer.",exEn:"Remember to buy bread, because Grandma is coming for lunch today.",exFr:"Pense à acheter du pain, parce que Mamie vient déjeuner aujourd'hui.",n:"ラテン語cor, cordis（心）から作られた語で、英record・cordial、仏se souvenirとは別語源。o→ue変化。acordarse de〜で「〜を覚えている・思い出す」。肯定命令では代名詞が後ろに付く（acuérdate）。"},
{w:"equivocarse",p:"v refl",en:"to be wrong, to make a mistake",fr:"se tromper",ex:"Si te equivocas de tren en Atocha, no te preocupes: todos los caminos llevan a Madrid.",exEn:"If you get on the wrong train at Atocha, do not worry: all roads lead to Madrid.",exFr:"Si tu te trompes de train à Atocha, ne t'inquiète pas : tous les chemins mènent à Madrid.",n:"ラテン語aequivocus（二通りに取れる）から。英equivocal（曖昧な）と同源。equivocarse de〜で「〜を間違える」。スペインの道路網はマドリードを中心に放射状に延びている。"},
{w:"mentir",p:"v",en:"to lie (tell lies)",fr:"mentir",ex:"No me mientas: sé que fuiste tú quien se comió el turrón de la abuela.",exEn:"Do not lie to me: I know it was you who ate Grandma's turrón.",exFr:"Ne me mens pas : je sais que c'est toi qui as mangé le touron de Mamie.",n:"ラテン語mentiri（うそをつく）から。仏mentirと同源。e→ie変化（miento）。名詞はla mentira（うそ）。"},
{w:"ahorrar",p:"v",en:"to save (money, time)",fr:"économiser, épargner",ex:"Ahorra un poco cada mes para que puedas ir a la Feria de Abril el año que viene.",exEn:"Save a little every month so that you can go to the April Fair next year.",exFr:"Économise un peu chaque mois pour que tu puisses aller à la Feria de Abril l'année prochaine.",n:"アラビア語hurr（自由な）に由来するとされ、元は「奴隷を解放する」の意味だったという。お金・時間・労力を「節約する」。para que＋接続法で「〜するために」。"},
{w:"conseguir",p:"v",en:"to get, to manage to",fr:"obtenir, réussir à",ex:"Espero que consigas entradas para el Bernabéu; si no, lo vemos en el bar.",exEn:"I hope you manage to get tickets for the Bernabéu; if not, we will watch it at the bar.",exFr:"J'espère que tu arriveras à avoir des billets pour le Bernabéu ; sinon, on le regarde au bar.",n:"con-＋seguir（追う）から「追いついて手に入れる」。e→i変化（consigo, consigas）。conseguir＋不定詞で「なんとか〜する」。esperar que＋接続法で「〜することを願う」。"},
{w:"evitar",p:"v",en:"to avoid",fr:"éviter",ex:"Evita la Gran Vía los sábados por la tarde, a menos que te gusten las multitudes.",exEn:"Avoid the Gran Vía on Saturday afternoons, unless you like crowds.",exFr:"Évite la Gran Vía le samedi après-midi, à moins que tu n'aimes la foule.",n:"ラテン語evitare（避ける）から。英inevitable、仏éviterと同源。a menos que（〜でない限り）の後は必ず接続法。グラン・ビアはマドリードの目抜き通り。"},
{w:"aceptar",p:"v",en:"to accept",fr:"accepter",ex:"Si una abuela española te ofrece comida, acéptala; decir que no es imposible.",exEn:"If a Spanish grandmother offers you food, accept it; saying no is impossible.",exFr:"Si une grand-mère espagnole t'offre à manger, accepte ; dire non est impossible.",n:"ラテン語acceptare（受け取る）から。英accept、仏accepterと同源。肯定命令で目的語の代名詞が付くと、アクセント記号が必要になる（acepta→acéptala）。"},
{w:"añadir",p:"v",en:"to add",fr:"ajouter",ex:"Añade el arroz cuando el caldo hierva y, sobre todo, no lo remuevas.",exEn:"Add the rice when the stock boils and, above all, do not stir it.",exFr:"Ajoute le riz quand le bouillon bout et, surtout, ne le remue pas.",n:"ラテン語inaddere（付け加える）から来たとされる。仏ajouterとは別語源。cuando＋接続法（hierva）はこれから起きることを表す。パエリアは米を入れた後に混ぜないのが鉄則。"},
{w:"calentar",p:"v",en:"to heat, to warm up",fr:"chauffer, réchauffer",ex:"Calienta la leche, pero no dejes que hierva, que la abuela lo nota.",exEn:"Heat the milk, but do not let it boil, because Grandma notices.",exFr:"Fais chauffer le lait, mais ne le laisse pas bouillir, parce que Mamie le remarque.",n:"caliente（熱い、ラテン語calere）から作られた動詞。英calorie、仏chaleurと同源。e→ie変化（caliento）。dejar que＋接続法で「〜させておく」。"},
{w:"freír",p:"v",en:"to fry",fr:"faire frire",ex:"Fríe las patatas despacio, con mucho aceite de oliva, como hacen en Andalucía.",exEn:"Fry the potatoes slowly, with plenty of olive oil, as they do in Andalusia.",exFr:"Fais frire les pommes de terre doucement, avec beaucoup d'huile d'olive, comme en Andalousie.",n:"ラテン語frigere（炒める）から。英fry、仏frireと同源。e→i変化（frío, fríes）。過去分詞はfritoが普通（patatas fritas）。アンダルシアは揚げ物（pescaíto frito）の本場。"},
{w:"mezclar",p:"v",en:"to mix",fr:"mélanger",ex:"Mezcla el vino con gaseosa y fruta, y tendrás un tinto de verano mejor que la sangría.",exEn:"Mix the wine with lemonade and fruit, and you will have a tinto de verano better than sangria.",exFr:"Mélange le vin avec de la limonade et des fruits, et tu auras un tinto de verano meilleur que la sangria.",n:"俗ラテン語misculare（混ぜる）から。英mix・mixture、仏mélangerと同じ仲間。tinto de veranoは赤ワインを炭酸で割ったスペインの夏の定番。"},
{w:"apetecer",p:"v",en:"to feel like, to fancy",fr:"avoir envie de",ex:"¿Te apetece que vayamos a tomar unas cañas antes de cenar?",exEn:"Do you feel like going for a few beers before dinner?",exFr:"Ça te dit qu'on aille boire quelques bières avant le dîner ?",n:"ラテン語appetere（求める）から。英appetite、仏appétitと同源。gustarと同じ構文（me apetece〜）で、スペインで非常によく使う。caña（小さなグラスの生ビール）もスペインらしい語。"},
{w:"llorar",p:"v",en:"to cry",fr:"pleurer",ex:"No llores, que la cebolla no es para tanto; en la tortilla la vas a querer.",exEn:"Do not cry, the onion is not that bad; in the tortilla you are going to love it.",exFr:"Ne pleure pas, l'oignon n'est pas si terrible ; dans la tortilla, tu vas l'adorer.",n:"ラテン語plorare（泣く）から。英deplore・explore、仏pleurerと同源。ラテン語のpl-がスペイン語でll-になる例。no es para tantoは「大したことない」。"},
{w:"gritar",p:"v",en:"to shout",fr:"crier",ex:"No grites, que en España ya hablamos bastante alto sin gritar.",exEn:"Do not shout; in Spain we already speak quite loudly without shouting.",exFr:"Ne crie pas ; en Espagne, on parle déjà assez fort sans crier.",n:"ラテン語quiritare（助けを求めて叫ぶ）から来たとされる。英cry、仏crierと同源。名詞はel grito。"},
{w:"besar",p:"v",en:"to kiss",fr:"embrasser",ex:"En España besa dos veces, primero a la derecha; en Argentina, solo una.",exEn:"In Spain, kiss twice, first on the right; in Argentina, only once.",exFr:"En Espagne, fais deux bises, d'abord à droite ; en Argentine, une seule.",n:"ラテン語basiare（キスする）から。仏baiserと同源。名詞はel beso。スペインでは右頬から2回、アルゼンチンやメキシコでは1回が一般的。"},
{w:"abrazar",p:"v",en:"to hug, to embrace",fr:"serrer dans ses bras, étreindre",ex:"Cuando llegues a casa, abraza a tu abuela aunque diga que no hace falta.",exEn:"When you get home, hug your grandmother even if she says it is not necessary.",exFr:"Quand tu arriveras à la maison, serre ta grand-mère dans tes bras même si elle dit que ce n'est pas la peine.",n:"a-＋brazo（腕）から「腕で包む」。仏embrasser（bras＝腕から）も同じ発想。名詞はel abrazo。手紙の結びのUn abrazoは「ではまた」の親しいあいさつ。"},
{w:"saludar",p:"v",en:"to greet, to say hello",fr:"saluer",ex:"Al entrar en el ascensor, saluda a los vecinos, aunque no los conozcas.",exEn:"When you get into the lift, greet the neighbors, even if you do not know them.",exFr:"En entrant dans l'ascenseur, salue les voisins, même si tu ne les connais pas.",n:"ラテン語salutare（健康を祈る）から。salud（健康）と同源で、英salute、仏saluerも同じ仲間。Saludosはメールの結びの定番。"},
{w:"despedirse",p:"v refl",en:"to say goodbye",fr:"dire au revoir, prendre congé",ex:"En España la gente tarda media hora en despedirse, así que no esperes irte pronto.",exEn:"In Spain people take half an hour to say goodbye, so do not expect to leave early.",exFr:"En Espagne, les gens mettent une demi-heure à se dire au revoir, alors ne t'attends pas à partir tôt.",n:"des-＋pedir（頼む）で、元は「辞去の許しを求める」。e→i変化（me despido）。despedirse de〜で「〜に別れを告げる」。スペインでは玄関での長い別れ話が名物。"},
{w:"presentar",p:"v",en:"to introduce, to present",fr:"présenter",ex:"Te presento a mi primo; no le hables de política, que empieza y no termina.",exEn:"Let me introduce you to my cousin; do not talk to him about politics, because once he starts, he never stops.",exFr:"Je te présente mon cousin ; ne lui parle pas de politique, parce qu'une fois lancé, il ne s'arrête plus.",n:"ラテン語praesentare（前に置く）から。英present、仏présenterと同源。Te presento a〜（〜を紹介するね）は人を紹介する決まり文句。"},
{w:"bañarse",p:"v refl",en:"to bathe, to swim",fr:"se baigner",ex:"No te bañes justo después de comer, dice mi madre, aunque nadie sabe por qué.",exEn:"Do not go swimming right after eating, says my mother, although nobody knows why.",exFr:"Ne te baigne pas juste après manger, dit ma mère, même si personne ne sait pourquoi.",n:"baño（風呂、ラテン語balneum）から。仏se baignerと同源。「風呂に入る」のほか海やプールで「泳ぐ・水浴びする」にも使う。食後2時間は泳がないというのはスペインの親の定番の注意。"},
{w:"ponerse",p:"v refl",en:"to put on, to become",fr:"mettre, devenir",ex:"Ponte crema, que el sol de Canarias no perdona ni en invierno.",exEn:"Put on sun cream, because the Canary sun does not forgive even in winter.",exFr:"Mets de la crème, parce que le soleil des Canaries ne pardonne pas, même en hiver.",n:"poner（置く）の再帰形で「身につける」。ponerse＋形容詞で「（一時的に）〜になる」（ponerse rojo）。tú の命令形は不規則でpon、代名詞が付いてponte。"},
{w:"quitarse",p:"v refl",en:"to take off (clothes)",fr:"enlever, retirer",ex:"Quítate los zapatos antes de entrar, que en Japón se hace así y en casa de mi madre también.",exEn:"Take off your shoes before coming in; that is how it is done in Japan, and in my mother's house too.",exFr:"Enlève tes chaussures avant d'entrer ; c'est comme ça au Japon, et chez ma mère aussi.",n:"quitar（取り除く）の再帰形。ラテン語quietare（静める）に由来するとされ、英quit、仏quitterと同源。反対語はponerse。"},
{w:"cuidar",p:"v",en:"to take care of, to look after",fr:"prendre soin de, s'occuper de",ex:"Cuida bien a mi gato mientras estoy en Mallorca, y no le des jamón.",exEn:"Look after my cat well while I am in Mallorca, and do not give him ham.",exFr:"Prends bien soin de mon chat pendant que je suis à Majorque, et ne lui donne pas de jambon.",n:"ラテン語cogitare（考える）から「気にかける」へ意味が変わった。英cogitate と同源。cuidar a〜（人・動物の世話をする）、cuidarse（体に気をつける）。¡Cuídate!は別れ際の「元気でね」。"},
{w:"aparcar",p:"v",en:"to park",fr:"se garer",ex:"No aparques en el centro de Cádiz; es más fácil encontrar un tesoro que un sitio libre.",exEn:"Do not park in the center of Cádiz; it is easier to find a treasure than a free space.",exFr:"Ne te gare pas dans le centre de Cadix ; il est plus facile de trouver un trésor qu'une place libre.",n:"parque（公園、駐車場）から作られた語で、英park、仏parcと同源。否定命令では-car→-queとつづりが変わる（no aparques）。中南米ではestacionarが一般的。"},
{w:"la salud",p:"nf",en:"health",fr:"la santé",ex:"¡Salud! En España se dice al brindar y también cuando alguien estornuda.",exEn:"Cheers! In Spain you say it when toasting and also when someone sneezes.",exFr:"Santé ! En Espagne, on le dit en trinquant et aussi quand quelqu'un éternue.",n:"ラテン語salus, salutis（健康、無事）から。英saluteと同源で、仏santéはラテン語sanitas由来の別語源。乾杯の¡Salud!と、くしゃみへの¡Salud! / ¡Jesús!は定番。"},
{w:"el dolor",p:"nm",en:"pain, ache",fr:"la douleur",ex:"Si tienes dolor de cabeza, no vayas a la mascletà de Valencia: es pura pólvora.",exEn:"If you have a headache, do not go to the mascletà in Valencia: it is pure gunpowder.",exFr:"Si tu as mal à la tête, ne va pas à la mascletà de Valence : c'est de la poudre pure.",n:"ラテン語dolor（痛み）から。仏douleurと同源。動詞doler（痛む）の名詞形。tener dolor de〜で「〜が痛い」。mascletàはファジャスの昼に鳴らす爆竹の轟音ショー。"},
{w:"la fiebre",p:"nf",en:"fever",fr:"la fièvre",ex:"Tienes fiebre: quédate en la cama y no vayas a la fiesta, aunque sea la de tu pueblo.",exEn:"You have a fever: stay in bed and do not go to the party, even if it is your village festival.",exFr:"Tu as de la fièvre : reste au lit et ne va pas à la fête, même si c'est celle de ton village.",n:"ラテン語febris（熱）から。英fever、仏fièvreと同源。tener fiebreで「熱がある」。aunque＋接続法で「たとえ〜でも」。"},
{w:"la gripe",p:"nf",en:"flu",fr:"la grippe",ex:"Cuando tengas gripe, mi abuela te hará un caldo de pollo que cura todo.",exEn:"When you have the flu, my grandmother will make you a chicken broth that cures everything.",exFr:"Quand tu auras la grippe, ma grand-mère te fera un bouillon de poulet qui guérit tout.",n:"仏grippeからの借用語。英gripe（腹痛）と関係があるとされる。cuando＋接続法はこれから起きることを表し、未来のことでも未来形は使わない。"},
{w:"la receta",p:"nf",en:"recipe, prescription",fr:"la recette, l'ordonnance",ex:"Mi abuela nunca me dio la receta de sus croquetas; dice que la tendré cuando me case.",exEn:"My grandmother never gave me the recipe for her croquettes; she says I will get it when I get married.",exFr:"Ma grand-mère ne m'a jamais donné la recette de ses croquettes ; elle dit que je l'aurai quand je me marierai.",n:"ラテン語recepta（受け取られたもの）から。英recipe・receipt、仏recetteと同源。「料理のレシピ」と「処方箋」の両方の意味。"},
{w:"el dentista",p:"nm",en:"dentist",fr:"le dentiste",ex:"No comas tanto turrón, o pasarás las Navidades en el dentista.",exEn:"Do not eat so much turrón, or you will spend Christmas at the dentist's.",exFr:"Ne mange pas tant de touron, ou tu passeras Noël chez le dentiste.",n:"diente（歯）から。-istaで終わる職業名は男女同形（el/la dentista）。スペインの子どもの乳歯はネズミのRatón Pérezが取りに来てお金を置いていく。"},
{w:"el brazo",p:"nm",en:"arm",fr:"le bras",ex:"Cuando bailes sevillanas, levanta los brazos como para coger una manzana del árbol.",exEn:"When you dance sevillanas, raise your arms as if to pick an apple from a tree.",exFr:"Quand tu danses des sevillanas, lève les bras comme pour cueillir une pomme sur l'arbre.",n:"ラテン語bracchium（腕）から。仏bras、英bracelet・embraceと同源。brazo de gitanoは「ロールケーキ」（直訳はジプシーの腕）。"},
{w:"la pierna",p:"nf",en:"leg",fr:"la jambe",ex:"Estira bien las piernas antes de correr la maratón de Sevilla; es llana, pero larga.",exEn:"Stretch your legs well before running the Seville marathon; it is flat, but long.",exFr:"Étire-toi bien les jambes avant de courir le marathon de Séville ; il est plat, mais long.",n:"ラテン語perna（もも肉）から。人の脚はpierna、動物や家具の脚はpataと言う。英のham（もも肉）に近い意味から人の脚に広がった。"},
{w:"el dedo",p:"nm",en:"finger, toe",fr:"le doigt",ex:"No señales a la gente con el dedo, que es de mala educación.",exEn:"Do not point at people with your finger; it is bad manners.",exFr:"Ne montre pas les gens du doigt, c'est mal élevé.",n:"ラテン語digitus（指）から。英digit・digital、仏doigtと同源。手の指も足の指もdedoで、足の指はdedo del pieと区別する。"},
{w:"la espalda",p:"nf",en:"back",fr:"le dos",ex:"Me duele la espalda: ayer ayudé a mi tío a llevar el paso de Semana Santa.",exEn:"My back hurts: yesterday I helped my uncle carry the Holy Week float.",exFr:"J'ai mal au dos : hier, j'ai aidé mon oncle à porter le char de la Semaine sainte.",n:"ラテン語spatula（へら、肩甲骨）から。英spatula、仏épauleと同源。「背中」はla espalda。セマナ・サンタのpaso（聖像の山車）は大勢の担ぎ手が肩で担ぐ。"},
{w:"el estómago",p:"nm",en:"stomach",fr:"l'estomac",ex:"Si te duele el estómago, toma una manzanilla y no comas más callos.",exEn:"If your stomach hurts, have a chamomile tea and do not eat any more tripe.",exFr:"Si tu as mal au ventre, prends une camomille et ne mange plus de tripes.",n:"ギリシャ語stomachos（胃の入り口）からラテン語を経て入った語。英stomach、仏estomacと同源。manzanilla（カモミールティー）は胃薬代わりの定番。callosはマドリード名物の牛の胃の煮込み。"},
{w:"el diente",p:"nm",en:"tooth",fr:"la dent",ex:"Lávate los dientes antes de dormir, aunque el Ratón Pérez no venga esta noche.",exEn:"Brush your teeth before going to bed, even if the Tooth Mouse does not come tonight.",exFr:"Brosse-toi les dents avant de dormir, même si la petite souris ne vient pas ce soir.",n:"ラテン語dens, dentis（歯）から。英dentist・dental、仏dentと同源。e→ie の二重母音化で diente となった。Ratón Pérezはスペイン語圏の「歯のネズミ」。"},
{w:"la nariz",p:"nf",en:"nose",fr:"le nez",ex:"No metas la nariz en los asuntos de los vecinos, aunque en mi pueblo todos lo hacen.",exEn:"Do not stick your nose into the neighbors' business, even though in my village everyone does.",exFr:"Ne mets pas ton nez dans les affaires des voisins, même si dans mon village tout le monde le fait.",n:"ラテン語naris（鼻孔）から。英nasal・nose、仏nezと同源。女性名詞で、複数形はnarices。¡Narices!は「冗談じゃない」という口語の驚き。"},
{w:"la oreja",p:"nf",en:"ear",fr:"l'oreille",ex:"Si vas a un restaurante gallego, pide oreja de cerdo; es mejor de lo que parece.",exEn:"If you go to a Galician restaurant, order pig's ear; it is better than it sounds.",exFr:"Si tu vas dans un restaurant galicien, commande de l'oreille de porc ; c'est meilleur qu'il n'y paraît.",n:"ラテン語auricula（小さな耳）から。仏oreille、英auricleと同源。外側の耳はoreja、聴覚器官としての耳はoído。ガリシアでは豚の耳の料理が定番のタパ。"},
{w:"el cuerpo",p:"nm",en:"body",fr:"le corps",ex:"Mueve el cuerpo, que la cumbia no se baila solo con los pies.",exEn:"Move your body, because cumbia is not danced only with your feet.",exFr:"Bouge ton corps, parce que la cumbia ne se danse pas seulement avec les pieds.",n:"ラテン語corpus（体）から。英corpse・corporation、仏corpsと同源。o→ueの二重母音化の典型例。"},
{w:"el consejo",p:"nm",en:"piece of advice, council",fr:"le conseil",ex:"Un consejo: nunca le digas a un valenciano que la paella lleva chorizo.",exEn:"A piece of advice: never tell a Valencian that paella has chorizo in it.",exFr:"Un conseil : ne dis jamais à un Valencien que la paella contient du chorizo.",n:"ラテン語consilium（助言、会議）から。英counsel・council、仏conseilと同源。「助言」は数えられる名詞で、un consejo（ひとつの助言）、unos consejosと言う。"},
{w:"el deporte",p:"nm",en:"sport",fr:"le sport",ex:"Para mi abuelo, el mejor deporte era ver el fútbol desde el sofá.",exEn:"For my grandfather, the best sport was watching football from the sofa.",exFr:"Pour mon grand-père, le meilleur sport était de regarder le foot depuis le canapé.",n:"古フランス語deport（楽しみ）から来たとされ、英sportも同じ語から。hacer deporte（スポーツをする）と動詞hacerを使う。"},
{w:"el ejercicio",p:"nm",en:"exercise",fr:"l'exercice",ex:"El médico quiere que haga más ejercicio, así que ahora voy andando al bar.",exEn:"The doctor wants me to do more exercise, so now I walk to the bar.",exFr:"Le médecin veut que je fasse plus d'exercice, alors maintenant je vais au bar à pied.",n:"ラテン語exercitium（訓練）から。英exercise、仏exerciceと同源。hacer ejercicio（運動する）。「練習問題」の意味にもなる。"},
{w:"la bicicleta",p:"nf",en:"bicycle",fr:"la bicyclette, le vélo",ex:"Si vas a Sevilla, alquila una bicicleta y recorre el parque de María Luisa.",exEn:"If you go to Seville, rent a bike and ride around María Luisa Park.",exFr:"Si tu vas à Séville, loue un vélo et fais le tour du parc María Luisa.",n:"bi-（二つ）＋ギリシャ語kyklos（輪）から。英bicycle、仏bicycletteと同源。口語ではla bici。montar en bici（自転車に乗る）。"},
{w:"la piscina",p:"nf",en:"swimming pool",fr:"la piscine",ex:"En agosto, la piscina municipal era el único lugar fresco del pueblo.",exEn:"In August, the municipal pool was the only cool place in the village.",exFr:"En août, la piscine municipale était le seul endroit frais du village.",n:"ラテン語piscina（養魚池、piscis＝魚から）。仏piscineと同源。英Pisces（魚座）も同じ語根。メキシコではalberca、アルゼンチンではpiletaとも言う。"},
{w:"el partido",p:"nm",en:"match, game, (political) party",fr:"le match, le parti",ex:"Cuando juegue el Real Madrid contra el Barça, no hables con mi padre hasta que termine el partido.",exEn:"When Real Madrid plays against Barça, do not talk to my father until the match is over.",exFr:"Quand le Real Madrid jouera contre le Barça, ne parle pas à mon père avant la fin du match.",n:"partir（分ける）の過去分詞から。「試合」と「政党」の両方の意味がある。hasta que＋接続法で「〜するまで」（未来のこと）。"},
{w:"el equipo",p:"nm",en:"team, equipment",fr:"l'équipe, l'équipement",ex:"En Bilbao el equipo solo tiene jugadores vascos, y la gente está muy orgullosa.",exEn:"In Bilbao the team only has Basque players, and people are very proud of it.",exFr:"À Bilbao, l'équipe n'a que des joueurs basques, et les gens en sont très fiers.",n:"仏équipe（元は船の乗組員）からの借用語。英equip、仏équiperと同源。「チーム」と「装備」の両方の意味。アスレティック・ビルバオはバスク出身の選手だけで戦う方針で有名。"},
{w:"la carretera",p:"nf",en:"road, highway",fr:"la route",ex:"Conduce despacio por la carretera de la costa, que las curvas de Asturias no perdonan.",exEn:"Drive slowly on the coast road; the bends in Asturias do not forgive.",exFr:"Conduis lentement sur la route de la côte, les virages des Asturies ne pardonnent pas.",n:"carro（荷車）から作られた語で、元は「荷車の通る道」。英car・carry、仏charと同じ仲間。町の中の通りはcalle、町と町を結ぶ道はcarretera。"},
{w:"el semáforo",p:"nm",en:"traffic light",fr:"le feu de circulation",ex:"Espera a que el semáforo se ponga verde, aunque no venga ningún coche.",exEn:"Wait for the traffic light to turn green, even if no car is coming.",exFr:"Attends que le feu passe au vert, même si aucune voiture n'arrive.",n:"ギリシャ語sēma（しるし）＋phoros（運ぶもの）から。英semaphoreと同源。esperar a que＋接続法で「〜するのを待つ」。"},
{w:"la esquina",p:"nf",en:"corner (outside)",fr:"le coin",ex:"Gira a la derecha en la esquina y verás una churrería; dile a Paco que vas de mi parte.",exEn:"Turn right at the corner and you will see a churro shop; tell Paco I sent you.",exFr:"Tourne à droite au coin et tu verras une churrería ; dis à Paco que tu viens de ma part.",n:"ゲルマン語skina（すね）から来たとされる。外から見た「角」はesquina、部屋の内側の「隅」はrincón。decir que vas de parte de〜は「〜の紹介で来た」。"},
{w:"el mapa",p:"nm",en:"map",fr:"la carte",ex:"No mires el mapa en el barrio de Santa Cruz: piérdete, que es lo mejor.",exEn:"Do not look at the map in the Santa Cruz quarter: get lost, it is the best part.",exFr:"Ne regarde pas la carte dans le quartier de Santa Cruz : perds-toi, c'est ce qu'il y a de mieux.",n:"ラテン語mappa（布）から。英map、仏mappemondeと同源。-aで終わるが男性名詞（el mapa）。el día、el problemaと同じ例外。"},
{w:"la dirección",p:"nf",en:"address, direction",fr:"l'adresse, la direction",ex:"Escríbeme tu dirección para que te mande una caja de mantecados en Navidad.",exEn:"Write me your address so that I can send you a box of mantecados at Christmas.",exFr:"Écris-moi ton adresse pour que je t'envoie une boîte de mantecados à Noël.",n:"ラテン語directio（まっすぐにすること）から。英direction、仏directionと同源。「住所」「方向」「経営陣」の意味がある。mantecadosはラードで作るクリスマスの焼き菓子。"},
{w:"el ascensor",p:"nm",en:"lift, elevator",fr:"l'ascenseur",ex:"No uses el ascensor si solo vives en el primero; tu abuela sube andando al quinto.",exEn:"Do not use the lift if you only live on the first floor; your grandmother walks up to the fifth.",exFr:"Ne prends pas l'ascenseur si tu habites seulement au premier ; ta grand-mère monte à pied au cinquième.",n:"ラテン語ascendere（上る）から。英ascend、仏ascenseurと同源。スペインでは1階をplanta baja、2階をprimeroと数えるので注意。"},
{w:"la escalera",p:"nf",en:"stairs, ladder",fr:"l'escalier, l'échelle",ex:"Sube la escalera despacio, que en esta casa del siglo XVII cada escalón es diferente.",exEn:"Go up the stairs slowly; in this 17th-century house every step is different.",exFr:"Monte l'escalier doucement ; dans cette maison du XVIIe siècle, chaque marche est différente.",n:"ラテン語scala（はしご）から。英escalator・scale、仏escalierと同源。「階段」も「はしご」もescalera。"},
{w:"el suelo",p:"nm",en:"floor, ground",fr:"le sol, le plancher",ex:"En los bares de Madrid, antes se tiraban las servilletas al suelo: cuanto más sucio, mejor el bar.",exEn:"In Madrid bars, people used to throw their napkins on the floor: the dirtier, the better the bar.",exFr:"Dans les bars de Madrid, on jetait autrefois les serviettes par terre : plus c'était sale, meilleur était le bar.",n:"ラテン語solum（地面）から。英soil、仏solと同源。「床」と「地面」の両方の意味。昔のスペインのバルでは床の紙ナプキンの多さが人気の証とされた。"},
{w:"el jardín",p:"nm",en:"garden",fr:"le jardin",ex:"Riega el jardín por la noche, para que el agua no se evapore con este sol.",exEn:"Water the garden at night, so that the water does not evaporate in this sun.",exFr:"Arrose le jardin le soir, pour que l'eau ne s'évapore pas avec ce soleil.",n:"仏jardinからの借用語で、ゲルマン語gard（囲い）に遡り、英garden・yardと同源。para que＋接続法で「〜するように」。"},
{w:"la basura",p:"nf",en:"rubbish, garbage",fr:"les ordures, la poubelle",ex:"Saca la basura después de las ocho, que en mi barrio antes no se puede.",exEn:"Take out the rubbish after eight, because in my neighborhood you cannot do it earlier.",exFr:"Sors la poubelle après huit heures, parce que dans mon quartier on ne peut pas avant.",n:"俗ラテン語versura（掃くこと）に由来するとされる。sacar la basura（ごみを出す）。スペインの多くの町ではごみを夜に出す決まりがある。"},
{w:"la luz",p:"nf",en:"light, electricity",fr:"la lumière, l'électricité",ex:"Apaga la luz cuando salgas, que la factura de la luz está carísima.",exEn:"Turn off the light when you go out, because the electricity bill is very expensive.",exFr:"Éteins la lumière quand tu sors, parce que la facture d'électricité est très chère.",n:"ラテン語lux, lucis（光）から。英lucid、仏lumièreと同じ仲間。複数形はluces（z→c）。「電気（代）」の意味にもなる。dar a luzは「出産する」。"},
{w:"el ruido",p:"nm",en:"noise",fr:"le bruit",ex:"No hagas ruido después de las once, o el vecino del tercero llamará a la policía.",exEn:"Do not make noise after eleven, or the neighbor on the third floor will call the police.",exFr:"Ne fais pas de bruit après onze heures, sinon le voisin du troisième appellera la police.",n:"ラテン語rugitus（ほえ声）から。英rut、仏rugir（ほえる）と関係があるとされる。hacer ruido（音を立てる）。仏bruitとは別語源。"},
{w:"la suerte",p:"nf",en:"luck",fr:"la chance",ex:"¡Que tengas suerte en el examen! Y si no, siempre nos quedará el bar.",exEn:"Good luck on the exam! And if not, we will always have the bar.",exFr:"Bonne chance pour l'examen ! Et sinon, il nous restera toujours le bar.",n:"ラテン語sors, sortis（くじ、運命）から。英sort、仏sortと同源。¡Que＋接続法！で相手への願いを表す（¡Que te vaya bien!）。¡Buena suerte!とも言う。"},
{w:"el miedo",p:"nm",en:"fear",fr:"la peur",ex:"No tengas miedo del toro de fuego; solo es un hombre con fuegos artificiales.",exEn:"Do not be afraid of the fire bull; it is just a man with fireworks.",exFr:"N'aie pas peur du taureau de feu ; c'est juste un homme avec des feux d'artifice.",n:"ラテン語metus（恐れ）から。tener miedo de〜（〜が怖い）、dar miedo（怖がらせる）。toro de fuegoは花火を背負った張りぼての牛で、夏祭りの名物。"},
{w:"la verdad",p:"nf",en:"truth",fr:"la vérité",ex:"Dime la verdad: ¿te gusta mi paella o solo lo dices para que no llore?",exEn:"Tell me the truth: do you like my paella, or are you only saying it so that I do not cry?",exFr:"Dis-moi la vérité : tu aimes ma paella ou tu dis ça seulement pour que je ne pleure pas ?",n:"ラテン語veritas（真実）から。英verity、仏véritéと同源。-dadで終わる名詞は女性名詞。¿Verdad?は文末で「〜でしょう？」の確認にも使う。"},
{w:"el examen",p:"nm",en:"exam",fr:"l'examen",ex:"Antes del examen del DELE, duerme bien y no estudies más: ya sabes bastante.",exEn:"Before the DELE exam, sleep well and do not study any more: you already know enough.",exFr:"Avant l'examen du DELE, dors bien et n'étudie plus : tu en sais déjà assez.",n:"ラテン語examen（針、吟味）から。英examine、仏examenと同源。複数形はexámenesとアクセント記号が付く。DELEはスペイン政府公認のスペイン語検定。"},
{w:"sano",p:"adj",en:"healthy",fr:"sain, en bonne santé",ex:"Come más fruta y verdura para que estés sano, como los abuelos de Okinawa o de Galicia.",exEn:"Eat more fruit and vegetables so that you stay healthy, like the grandparents of Okinawa or Galicia.",exFr:"Mange plus de fruits et de légumes pour être en bonne santé, comme les grands-parents d'Okinawa ou de Galice.",n:"ラテン語sanus（健康な）から。英sane・sanitary、仏sainと同源。sano y salvoは「無事に」。ガリシアはスペインでも長寿の人が多い地域として知られる。"},
{w:"nervioso",p:"adj",en:"nervous",fr:"nerveux",ex:"No te pongas nervioso en la entrevista; habla despacio y sonríe.",exEn:"Do not get nervous in the interview; speak slowly and smile.",exFr:"Ne sois pas nerveux pendant l'entretien ; parle lentement et souris.",n:"nervio（神経、ラテン語nervus）から。英nervous、仏nerveuxと同源。ponerse nervioso（緊張する・いらいらする）。"},
{w:"enfadado",p:"adj",en:"angry",fr:"fâché",ex:"Mi madre está enfadada porque llegamos tarde; que nadie mencione el partido.",exEn:"My mother is angry because we arrived late; nobody mention the match.",exFr:"Ma mère est fâchée parce que nous sommes arrivés en retard ; que personne ne parle du match.",n:"enfadar（怒らせる）の過去分詞。状態なのでestar enfadado。中南米ではenojadoが一般的。que＋接続法で第三者への命令・願望を表す（que nadie mencione）。"},
{w:"tímido",p:"adj",en:"shy",fr:"timide",ex:"No seas tímido: en una fiesta española, si no bailas, te sacan a bailar.",exEn:"Do not be shy: at a Spanish party, if you do not dance, someone will pull you onto the dance floor.",exFr:"Ne sois pas timide : dans une fête espagnole, si tu ne danses pas, on vient te chercher pour danser.",n:"ラテン語timidus（臆病な）から。英timid、仏timideと同源。tú のser の否定命令はno seas（接続法）。"},
{w:"amable",p:"adj",en:"kind, nice",fr:"aimable, gentil",ex:"Sé amable con el camarero, y te pondrá la mejor tapa de la barra.",exEn:"Be nice to the waiter, and he will give you the best tapa on the counter.",exFr:"Sois gentil avec le serveur, et il te servira la meilleure tapa du comptoir.",n:"ラテン語amabilis（愛すべき）から。英amiable、仏aimableと同源。-bleで終わる形容詞は男女同形。tú のser の肯定命令はsé（不規則）。"},
{w:"serio",p:"adj",en:"serious",fr:"sérieux",ex:"No te pongas tan serio; es solo una partida de mus con los abuelos.",exEn:"Do not get so serious; it is only a game of mus with the grandparents.",exFr:"Ne sois pas si sérieux ; ce n'est qu'une partie de mus avec les grands-parents.",n:"ラテン語serius（まじめな）から。英serious、仏sérieuxと同源。¿En serio?（本当に？）は会話の定番。musはバスク地方発祥のスペインのトランプゲーム。"},
{w:"alegre",p:"adj",en:"cheerful, happy",fr:"joyeux, gai",ex:"Pon música alegre, que hoy es sábado y toca limpiar la casa.",exEn:"Put on some cheerful music, because today is Saturday and it is time to clean the house.",exFr:"Mets de la musique gaie, parce qu'aujourd'hui c'est samedi et c'est le jour du ménage.",n:"ラテン語alacer（活発な）から。英alacrity、仏allègreと同源。-eで終わるので男女同形。スペインでは土曜の朝に音楽をかけて大掃除する家庭が多い。"},
{w:"inteligente",p:"adj",en:"intelligent, clever",fr:"intelligent",ex:"Mi perro es tan inteligente que se esconde cuando oye la palabra baño.",exEn:"My dog is so clever that he hides when he hears the word bath.",exFr:"Mon chien est si intelligent qu'il se cache quand il entend le mot bain.",n:"ラテン語intelligere（理解する）の現在分詞から。英intelligent、仏intelligentと同源。-nteで終わる形容詞は男女同形。"},
{w:"perezoso",p:"adj",en:"lazy",fr:"paresseux",ex:"No seas perezoso y ven a correr conmigo, que después hay churros.",exEn:"Do not be lazy and come running with me, because afterwards there are churros.",exFr:"Ne sois pas paresseux et viens courir avec moi, parce qu'après il y a des churros.",n:"pereza（怠惰、ラテン語pigritia）から。仏paresseuxと同源。動物のナマケモノもel perezoso。¡Qué pereza!は「面倒くさい！」の口語表現。"},
{w:"puntual",p:"adj",en:"punctual",fr:"ponctuel",ex:"Sé puntual en la entrevista, aunque en la fiesta de la noche nadie lo sea.",exEn:"Be on time for the interview, even if nobody is on time at the party in the evening.",exFr:"Sois ponctuel à l'entretien, même si personne ne l'est à la fête du soir.",n:"punto（点）から。英punctual、仏ponctuelと同源。仕事では時間厳守、友人の集まりでは15分程度の遅れは普通とされるのがスペイン流。"},
{w:"educado",p:"adj",en:"polite, well-mannered",fr:"poli, bien élevé",ex:"Sé educado y di buen provecho a la gente que come cuando entres en un bar.",exEn:"Be polite and say enjoy your meal to the people eating when you walk into a bar.",exFr:"Sois poli et dis bon appétit aux gens qui mangent quand tu entres dans un bar.",n:"educar（しつける、教育する）の過去分詞。英educated（教育を受けた）と違い、スペイン語では「礼儀正しい」の意味が中心。mal educadoは「行儀が悪い」。"},
{w:"necesario",p:"adj",en:"necessary",fr:"nécessaire",ex:"Es necesario que reserves con tiempo si quieres ver la Alhambra en verano.",exEn:"It is necessary to book in advance if you want to see the Alhambra in summer.",exFr:"Il est nécessaire que tu réserves à l'avance si tu veux voir l'Alhambra en été.",n:"ラテン語necessarius（必要な）から。英necessary、仏nécessaireと同源。es necesario que＋接続法（〜する必要がある）は4級頻出の構文。"},
{w:"posible",p:"adj",en:"possible",fr:"possible",ex:"Es posible que llueva en Bilbao, así que lleva paraguas, como todos los días.",exEn:"It may rain in Bilbao, so take an umbrella, like every day.",exFr:"Il est possible qu'il pleuve à Bilbao, alors prends un parapluie, comme tous les jours.",n:"ラテン語possibilis（可能な）から。英possible、仏possibleと同源。es posible que＋接続法（〜かもしれない）。"},
{w:"imposible",p:"adj",en:"impossible",fr:"impossible",ex:"Es imposible que termines el cocido entero; la sopa sola ya es una comida.",exEn:"You cannot possibly finish the whole cocido; the soup alone is already a meal.",exFr:"Il est impossible que tu finisses tout le cocido ; la soupe seule est déjà un repas.",n:"in-（否定）＋posible。bやpの前ではin-がim-になる。es imposible que＋接続法。cocido madrileñoはスープ、ひよこ豆と野菜、肉の順に3段階で食べる。"},
{w:"probable",p:"adj",en:"likely, probable",fr:"probable",ex:"Es probable que el tren llegue tarde, así que compra un bocadillo en la estación.",exEn:"The train will probably arrive late, so buy a sandwich at the station.",exFr:"Il est probable que le train arrive en retard, alors achète un sandwich à la gare.",n:"ラテン語probabilis（証明できる）から。英probable、仏probableと同源。es probable que＋接続法。bocadillo（バゲットのサンドイッチ）はスペインの旅の友。"},
{w:"útil",p:"adj",en:"useful",fr:"utile",ex:"Aprende estas palabras útiles antes del viaje: cerveza, gracias y otra, por favor.",exEn:"Learn these useful words before the trip: beer, thank you, and another one, please.",exFr:"Apprends ces mots utiles avant le voyage : bière, merci et une autre, s'il vous plaît.",n:"ラテン語utilis（役に立つ）から。英utility、仏utileと同源。反対語はinútil。男女同形で、複数形はútiles。"},
{w:"ojalá",p:"interj",en:"I hope, hopefully",fr:"pourvu que, si seulement",ex:"¡Ojalá haga sol mañana, que tenemos una paella en el campo!",exEn:"I hope it is sunny tomorrow, because we are having a paella in the countryside!",exFr:"Pourvu qu'il fasse beau demain, parce que nous faisons une paella à la campagne !",n:"アラビア語の「神が望むならば」という表現に由来するとされる。後ろには必ず接続法が来る（ojalá＋接続法）。"},
{w:"tal vez",p:"loc",en:"maybe, perhaps",fr:"peut-être",ex:"Tal vez vayamos a Granada en Semana Santa, si encontramos hotel.",exEn:"Maybe we will go to Granada at Easter, if we find a hotel.",exFr:"Peut-être que nous irons à Grenade pour Pâques, si nous trouvons un hôtel.",n:"直訳は「そのような回」。後ろに接続法を使うと疑いが強く、直説法だと実現の可能性が高い感じになる。"},
{w:"quizás",p:"adv",en:"perhaps, maybe",fr:"peut-être",ex:"Quizás mi abuela nos enseñe a hacer torrijas esta Semana Santa.",exEn:"Perhaps my grandmother will teach us how to make torrijas this Easter.",exFr:"Peut-être que ma grand-mère nous apprendra à faire des torrijas pour Pâques.",n:"古スペイン語qui sabe（誰が知ろう）から変化したとされる。quizáとも書く。tal vezと同じく、接続法も直説法も取れる。torrijasは聖週間に食べるフレンチトースト風の菓子。"},
{w:"para que",p:"conj",en:"so that, in order that",fr:"pour que, afin que",ex:"Te dejo la llave debajo de la maceta para que puedas entrar sin despertarnos.",exEn:"I am leaving the key under the flowerpot so that you can get in without waking us.",exFr:"Je te laisse la clé sous le pot de fleurs pour que tu puisses entrer sans nous réveiller.",n:"para（〜のために）＋que。目的を表し、後ろは必ず接続法。主語が同じならpara＋不定詞になる（para entrar）。"},
{w:"antes de que",p:"conj",en:"before",fr:"avant que",ex:"Vámonos antes de que empiece a llover, que no tenemos paraguas.",exEn:"Let us go before it starts to rain, because we do not have an umbrella.",exFr:"Allons-nous-en avant qu'il commence à pleuvoir, parce que nous n'avons pas de parapluie.",n:"antes de（〜の前に）＋que。後ろは必ず接続法。主語が同じならantes de＋不定詞（antes de salir）。vámonosは「行こう」の命令形。"},
{w:"en cuanto",p:"conj",en:"as soon as",fr:"dès que",ex:"En cuanto llegues a Madrid, llámame y te llevo a comer un bocadillo de calamares.",exEn:"As soon as you arrive in Madrid, call me and I will take you to eat a squid sandwich.",exFr:"Dès que tu arriveras à Madrid, appelle-moi et je t'emmène manger un sandwich aux calamars.",n:"cuanto（〜するだけ）を使った表現。未来のことを表す時の副詞節では接続法を使う（en cuanto llegues）。bocadillo de calamaresはマドリードの名物。"},
{w:"hasta que",p:"conj",en:"until",fr:"jusqu'à ce que",ex:"No te levantes de la mesa hasta que termine la sobremesa: es sagrada.",exEn:"Do not get up from the table until the after-dinner chat is over: it is sacred.",exFr:"Ne te lève pas de table avant la fin de la sobremesa : elle est sacrée.",n:"hasta（〜まで）＋que。未来のことなら接続法、過去の事実なら直説法。sobremesaは食後にテーブルでおしゃべりを楽しむスペインの習慣。"},
{w:"despacio",p:"adv",en:"slowly",fr:"lentement, doucement",ex:"Habla más despacio, por favor; los andaluces se comen la mitad de las letras.",exEn:"Speak more slowly, please; Andalusians swallow half the letters.",exFr:"Parle plus lentement, s'il te plaît ; les Andalous avalent la moitié des lettres.",n:"de＋espacio（間隔、ゆとり）から。「ゆっくり」の意味でlentamenteより口語的。アンダルシアの発音では語末のsなどが弱くなることが多い。"},
{w:"a menudo",p:"loc",en:"often",fr:"souvent",ex:"Visita a tus abuelos a menudo, que la comida de su casa es la mejor.",exEn:"Visit your grandparents often, because the food at their house is the best.",exFr:"Rends souvent visite à tes grands-parents, parce que la cuisine de chez eux est la meilleure.",n:"menudo（小さい、細かい）から、「細かく刻んで」→「たびたび」となった。con frecuenciaと同じ意味。menudoだけだと¡Menudo día!（なんて日だ！）の意味になる。"},
{w:"cuidado",p:"interj",en:"careful!, watch out!",fr:"attention !",ex:"¡Cuidado con el bolso en el metro! Y cuidado con el vermú, que sube rápido.",exEn:"Watch your bag on the metro! And be careful with the vermouth, it goes to your head fast.",exFr:"Attention à ton sac dans le métro ! Et attention au vermouth, il monte vite.",n:"cuidar（気をつける）の過去分詞から。¡Cuidado con〜!で「〜に気をつけて」。tener cuidado（注意する）も重要。vermú（ベルモット）は日曜の昼前に飲む習慣がある。"},
{w:"vale",p:"interj",en:"OK, all right",fr:"d'accord",ex:"—Quedamos a las nueve en la Puerta del Sol. —Vale, pero a las nueve y cuarto, que es España.",exEn:"Let us meet at nine at the Puerta del Sol. — OK, but at a quarter past nine, this is Spain.",exFr:"On se retrouve à neuf heures à la Puerta del Sol. — D'accord, mais à neuf heures et quart, on est en Espagne.",n:"valer（価値がある）の3人称現在から、「それでいい」→「OK」。スペインで非常によく使い、中南米ではdaleやokが多い。"},
{w:"por supuesto",p:"loc",en:"of course",fr:"bien sûr",ex:"—¿Puedo llevar a mi perro a la terraza? —Por supuesto, y le traemos agua.",exEn:"Can I bring my dog to the terrace? — Of course, and we will bring him some water.",exFr:"Je peux amener mon chien en terrasse ? — Bien sûr, et on lui apporte de l'eau.",n:"supuesto（前提、suponerの過去分詞）を使った表現で、直訳は「前提として」。¡Claro!より少し改まった「もちろん」。"}
]},
  {id:7, title:"Nivel 7", range:"601–700", words:[
{w:"devolver",p:"v",en:"to give back, to return",fr:"rendre, rapporter",ex:"Devuélveme el táper cuando puedas; mi madre los cuenta.",exEn:"Give me back the plastic container when you can; my mother counts them.",exFr:"Rends-moi la boîte en plastique quand tu pourras ; ma mère les compte.",n:"de-＋volver（戻る）から。o→ue変化（devuelvo）で、過去分詞はdevuelto。スペインでは母親が持たせた料理の容器（táper）を返すのは大事な礼儀。"},
{w:"cobrar",p:"v",en:"to charge, to get paid",fr:"encaisser, faire payer",ex:"No dejes que te cobren el pan: en muchos restaurantes lo ponen sin preguntar.",exEn:"Do not let them charge you for the bread: in many restaurants they bring it without asking.",exFr:"Ne les laisse pas te faire payer le pain : dans beaucoup de restaurants, on le sert sans demander.",n:"ラテン語recuperare（取り戻す）が短くなった形とされ、英recover、仏recouvrerと同源。「代金を受け取る」「給料をもらう」の意味。¿Me cobra, por favor?は「お会計お願いします」。"},
{w:"prestar",p:"v",en:"to lend",fr:"prêter",ex:"Préstame tu paraguas, que en Bilbao ha empezado a llover otra vez.",exEn:"Lend me your umbrella, because in Bilbao it has started raining again.",exFr:"Prête-moi ton parapluie, parce qu'à Bilbao il a recommencé à pleuvoir.",n:"ラテン語praestare（提供する）から。仏prêterと同源。prestar atención（注意を払う）という表現もある。「借りる」はpedir prestadoと言う。"},
{w:"deber",p:"v",en:"must, should, to owe",fr:"devoir",ex:"Debes probar el pulpo en Galicia, pero no le pidas kétchup al camarero.",exEn:"You must try the octopus in Galicia, but do not ask the waiter for ketchup.",exFr:"Tu dois goûter le poulpe en Galice, mais ne demande pas de ketchup au serveur.",n:"ラテン語debere（負っている）から。英debt、仏devoirと同源。deber＋不定詞は「〜すべきだ」、deber de＋不定詞は「〜に違いない」。名詞los deberesは「宿題」。"},
{w:"tratar",p:"v",en:"to treat, to try",fr:"traiter, essayer",ex:"Trata de llegar a las nueve, aunque sepas que la cena empieza a las diez.",exEn:"Try to arrive at nine, even though you know dinner starts at ten.",exFr:"Essaie d'arriver à neuf heures, même si tu sais que le dîner commence à dix heures.",n:"ラテン語tractare（扱う）から。英treat・treaty、仏traiterと同源。tratar de＋不定詞で「〜しようと努める」、tratarse de〜で「〜に関することだ」。"},
{w:"sonreír",p:"v",en:"to smile",fr:"sourire",ex:"Sonríe en la foto, que es para la abuela y la va a poner en el salón.",exEn:"Smile in the photo, because it is for Grandma and she is going to put it in the living room.",exFr:"Souris sur la photo, parce que c'est pour Mamie et elle va la mettre dans le salon.",n:"ラテン語subridere（ほほえむ、sub＝下で＋ridere＝笑う）から。仏sourireと同源。reírと同じくe→i変化（sonrío, sonríe）。名詞はla sonrisa。"},
{w:"charlar",p:"v",en:"to chat",fr:"bavarder",ex:"Quedemos en la terraza para charlar un rato; el café lo pago yo.",exEn:"Let us meet on the terrace to chat for a while; I will pay for the coffee.",exFr:"Retrouvons-nous en terrasse pour bavarder un moment ; le café, c'est moi qui paie.",n:"イタリア語ciarlare（おしゃべりする）からの借用とされる。名詞はla charla（おしゃべり、講演）。quedemosは「〜しよう」の意味の接続法（nosotros の命令）。"},
{w:"discutir",p:"v",en:"to argue, to discuss",fr:"se disputer, discuter",ex:"No discutas con tu tío sobre la tortilla: él la quiere con cebolla y no va a cambiar.",exEn:"Do not argue with your uncle about the tortilla: he wants it with onion and he is not going to change.",exFr:"Ne te dispute pas avec ton oncle au sujet de la tortilla : il la veut avec de l'oignon et il ne changera pas.",n:"ラテン語discutere（打ち砕く）から。英discuss、仏discuterと同源。スペイン語では「議論する」のほか「口論する」の意味で使うことが多い。"},
{w:"perdonar",p:"v",en:"to forgive, to excuse",fr:"pardonner, excuser",ex:"Perdone, ¿sabe dónde está la parada del autobús que va a la playa?",exEn:"Excuse me, do you know where the stop is for the bus that goes to the beach?",exFr:"Excusez-moi, vous savez où est l'arrêt du bus qui va à la plage ?",n:"per-＋donar（与える）から。英pardon、仏pardonnerと同じ組み立て。usted への命令Perdone、tú への命令Perdonaは人に話しかけるときの「すみません」。"},
{w:"agradecer",p:"v",en:"to thank, to be grateful for",fr:"remercier, être reconnaissant",ex:"Te agradezco que me enseñes a bailar salsa, aunque te pise cada dos minutos.",exEn:"I am grateful that you are teaching me to dance salsa, even though I step on you every two minutes.",exFr:"Je te remercie de m'apprendre à danser la salsa, même si je te marche sur les pieds toutes les deux minutes.",n:"grado（好意）から作られた動詞で、gracias（ありがとう）と同じ語根。1人称現在はagradezco。agradecer que＋接続法で「〜してくれてありがたい」。"},
{w:"felicitar",p:"v",en:"to congratulate",fr:"féliciter",ex:"Llama a tu abuela para felicitarla; hoy es su santo y se acuerda de quién llama.",exEn:"Call your grandmother to congratulate her; today is her saint's day and she remembers who calls.",exFr:"Appelle ta grand-mère pour la féliciter ; aujourd'hui, c'est sa fête et elle se souvient de qui appelle.",n:"ラテン語felix（幸福な）から。英felicity、仏féliciterと同源。¡Felicidades!（おめでとう）も同じ語根。スペインでは誕生日のほかに、自分と同じ名前の聖人の日（santo）も祝う習慣がある。"},
{w:"organizar",p:"v",en:"to organize",fr:"organiser",ex:"Organicemos una barbacoa el domingo, pero que nadie traiga ensalada, que ya la hace mi madre.",exEn:"Let us organize a barbecue on Sunday, but nobody bring salad, because my mother is already making it.",exFr:"Organisons un barbecue dimanche, mais que personne n'apporte de salade, ma mère en fait déjà une.",n:"ギリシャ語organon（道具）から。英organize、仏organiserと同源。接続法でz→cに変わる（organice, organicemos）。"},
{w:"regar",p:"v",en:"to water",fr:"arroser",ex:"Riega los geranios del balcón todos los días, que en Córdoba en agosto no sobreviven sin agua.",exEn:"Water the geraniums on the balcony every day, because in Córdoba in August they do not survive without water.",exFr:"Arrose les géraniums du balcon tous les jours, parce qu'à Cordoue en août, ils ne survivent pas sans eau.",n:"ラテン語rigare（水を引く）から。英irrigate と同源。e→ie変化（riego）。バルコニーをゼラニウムで飾るのはアンダルシアの伝統。"},
{w:"recoger",p:"v",en:"to pick up, to collect, to tidy",fr:"ramasser, aller chercher, ranger",ex:"Recoge la mesa antes de que llegue tu padre, que viene con los primos.",exEn:"Clear the table before your father arrives, because he is coming with the cousins.",exFr:"Débarrasse la table avant que ton père arrive, parce qu'il vient avec les cousins.",n:"re-＋coger（取る、ラテン語colligere）から。英collect と同源。「拾う」「迎えに行く」「片付ける」と用途が広い。1人称現在はrecojo（g→j）。"},
{w:"ordenar",p:"v",en:"to tidy, to order, to arrange",fr:"ranger, ordonner",ex:"Ordena tu cuarto, o los Reyes Magos no van a encontrar dónde dejar los regalos.",exEn:"Tidy your room, or the Three Kings will not find anywhere to leave the presents.",exFr:"Range ta chambre, sinon les Rois mages ne trouveront pas où laisser les cadeaux.",n:"orden（順序、命令、ラテン語ordo）から。英order、仏ordonnerと同源。「整頓する」「命令する」「並べる」の意味がある。中南米では「注文する」の意味にもなる。"},
{w:"secar",p:"v",en:"to dry",fr:"sécher",ex:"Seca la ropa al sol, como en todos los balcones de Nápoles y de Sevilla.",exEn:"Dry the clothes in the sun, like on every balcony in Naples and Seville.",exFr:"Fais sécher le linge au soleil, comme sur tous les balcons de Naples et de Séville.",n:"seco（乾いた、ラテン語siccus）から作られた動詞。仏sécherと同源。接続法ではc→qu（seque）。secarseで「体を拭く」。"},
{w:"planchar",p:"v",en:"to iron",fr:"repasser",ex:"No planches la camisa de lino, que en verano todos la llevan arrugada.",exEn:"Do not iron the linen shirt; in summer everyone wears it wrinkled.",exFr:"Ne repasse pas la chemise en lin ; en été, tout le monde la porte froissée.",n:"plancha（鉄板、アイロン）から作られた動詞。仏planche（板）と同源。a la plancha（鉄板焼き）は料理の定番の調理法。"},
{w:"colgar",p:"v",en:"to hang, to hang up",fr:"accrocher, raccrocher",ex:"No me cuelgues el teléfono, que todavía no te he contado lo del vecino.",exEn:"Do not hang up on me, because I have not told you about the neighbor yet.",exFr:"Ne me raccroche pas au nez, je ne t'ai pas encore raconté l'histoire du voisin.",n:"ラテン語collocare（置く）から来たとされる。o→ue変化（cuelgo）。「つるす」「電話を切る」「SNSに投稿する」の意味がある。否定命令ではg→gu（no cuelgues）。"},
{w:"girar",p:"v",en:"to turn",fr:"tourner",ex:"Gira a la izquierda en la plaza y sigue recto hasta que veas la catedral.",exEn:"Turn left at the square and go straight on until you see the cathedral.",exFr:"Tourne à gauche sur la place et continue tout droit jusqu'à ce que tu voies la cathédrale.",n:"ラテン語gyrare（回る）から。英gyroscope と同源。道案内ではgirar / doblar a la derecha（右に曲がる）を使う。hasta que＋接続法。"},
{w:"mudarse",p:"v refl",en:"to move (house)",fr:"déménager",ex:"Cuando te mudes a Madrid, invítanos; te llevamos cervezas y una planta.",exEn:"When you move to Madrid, invite us; we will bring you beers and a plant.",exFr:"Quand tu déménageras à Madrid, invite-nous ; on t'apportera des bières et une plante.",n:"ラテン語mutare（変える）から。英mutation と同源。mudarse de casa（引っ越す）。cuando＋接続法はこれから起きること。"},
{w:"apuntarse",p:"v refl",en:"to sign up, to join",fr:"s'inscrire",ex:"Apúntate a clases de flamenco; en tres meses bailarás como una sevillana.",exEn:"Sign up for flamenco lessons; in three months you will dance like a woman from Seville.",exFr:"Inscris-toi à des cours de flamenco ; dans trois mois, tu danseras comme une Sévillane.",n:"punto（点）から作られたapuntar（書き留める）の再帰形。apuntarse a〜で「〜に申し込む・参加する」。¿Te apuntas?（一緒にどう？）は誘いの定番。"},
{w:"participar",p:"v",en:"to take part",fr:"participer",ex:"Si participas en los castells de Tarragona, sube tú arriba, que pesas menos.",exEn:"If you take part in the human towers in Tarragona, you go up to the top, because you weigh less.",exFr:"Si tu participes aux castells de Tarragone, monte en haut, toi, tu pèses moins.",n:"ラテン語participare（分け前をもらう）から。英participate、仏participerと同源。participar en〜で「〜に参加する」。castellsはカタルーニャの人間の塔。"},
{w:"confiar",p:"v",en:"to trust",fr:"faire confiance",ex:"Confía en mí: este bar no tiene carta, pero todo lo que sale de la cocina es buenísimo.",exEn:"Trust me: this bar has no menu, but everything that comes out of the kitchen is excellent.",exFr:"Fais-moi confiance : ce bar n'a pas de carte, mais tout ce qui sort de la cuisine est excellent.",n:"ラテン語fidere（信じる）から。英confide・confidence、仏confierと同源。confiar en〜で「〜を信頼する」。現在形でiにアクセント（confío）。"},
{w:"sorprender",p:"v",en:"to surprise",fr:"surprendre",ex:"Me sorprende que no conozcas el turrón de Jijona; hay que remediarlo ahora mismo.",exEn:"I am surprised you do not know Jijona turrón; we must fix that right now.",exFr:"Ça me surprend que tu ne connaisses pas le touron de Jijona ; il faut y remédier tout de suite.",n:"仏surprendreからの借用語とされる。英surprise と同源。gustarと同じ構文で、me sorprende que＋接続法（〜に驚く）。ヒホナはアリカンテ州のトゥロンの産地。"},
{w:"extrañar",p:"v",en:"to miss, to find strange",fr:"manquer (à qqn), étonner",ex:"Cuando vivas fuera, vas a extrañar el pan de aquí más que a tu familia.",exEn:"When you live abroad, you are going to miss the bread from here more than your family.",exFr:"Quand tu vivras à l'étranger, le pain d'ici va te manquer plus que ta famille.",n:"extraño（奇妙な、外国の、ラテン語extraneus）から。英strange、仏étrangerと同源。「〜が恋しい」の意味は中南米で多く、スペインではechar de menosが一般的。"},
{w:"odiar",p:"v",en:"to hate",fr:"détester, haïr",ex:"Odio que me despierten los domingos antes de las once, aunque sea para ir a por churros.",exEn:"I hate being woken up on Sundays before eleven, even if it is to go and get churros.",exFr:"Je déteste qu'on me réveille le dimanche avant onze heures, même si c'est pour aller chercher des churros.",n:"odio（憎しみ、ラテン語odium）から。英odious と同源。odiar que＋接続法（〜されるのが大嫌い）。"},
{w:"encantar",p:"v",en:"to love, to delight",fr:"adorer, enchanter",ex:"Me encanta que cenemos en la terraza en verano, con el ruido de la calle.",exEn:"I love it when we have dinner on the terrace in summer, with the noise of the street.",exFr:"J'adore qu'on dîne en terrasse en été, avec le bruit de la rue.",n:"ラテン語incantare（呪文をかける）から。英enchant、仏enchanterと同源。gustarと同じ構文で、gustarより強い「大好き」。¡Encantado!は「はじめまして」。"},
{w:"aburrirse",p:"v refl",en:"to get bored",fr:"s'ennuyer",ex:"Si te aburres en el museo, busca los cuadros de Goya con monstruos.",exEn:"If you get bored at the museum, look for Goya's paintings with monsters.",exFr:"Si tu t'ennuies au musée, cherche les tableaux de Goya avec des monstres.",n:"ラテン語abhorrere（嫌う）から。英abhor と同源。形容詞aburrido は ser なら「退屈な」、estar なら「退屈している」。ゴヤの「黒い絵」はプラド美術館にある。"},
{w:"relajarse",p:"v refl",en:"to relax",fr:"se détendre",ex:"Relájate: en las termas de Ourense el agua sale caliente de la tierra y es gratis.",exEn:"Relax: at the hot springs in Ourense the water comes out of the ground hot and it is free.",exFr:"Détends-toi : aux thermes d'Ourense, l'eau sort chaude de la terre et c'est gratuit.",n:"ラテン語relaxare（緩める）から。英relax、仏relâcherと同源。オウレンセ（ガリシア）には川沿いに無料の温泉がある。"},
{w:"callarse",p:"v refl",en:"to be quiet, to shut up",fr:"se taire",ex:"¡Cállate, que va a empezar la procesión y aquí todos guardan silencio!",exEn:"Be quiet, the procession is about to start and everyone here keeps silent!",exFr:"Tais-toi, la procession va commencer et ici tout le monde garde le silence !",n:"ラテン語calare（降ろす）に由来するとされる。¡Cállate!は強い言い方なので、丁寧には¡Silencio, por favor!などを使う。形容詞callado（無口な）。"},
{w:"tardar",p:"v",en:"to take (time), to be late",fr:"mettre (du temps), tarder",ex:"No tardes, que el museo cierra a las ocho y quiero ver Las Meninas.",exEn:"Do not be long, because the museum closes at eight and I want to see Las Meninas.",exFr:"Ne tarde pas, le musée ferme à huit heures et je veux voir Les Ménines.",n:"ラテン語tardare（遅らせる）から。英tardy、仏tarderと同源。tardar＋時間＋en＋不定詞で「〜するのに…かかる」。副詞tarde（遅く）と同じ語根。"},
{w:"durar",p:"v",en:"to last",fr:"durer",ex:"Ojalá que la fiesta dure hasta la mañana, como las de Ibiza.",exEn:"I hope the party lasts until the morning, like the ones in Ibiza.",exFr:"Pourvu que la fête dure jusqu'au matin, comme celles d'Ibiza.",n:"ラテン語durare（持ちこたえる）から。英durable・during、仏durerと同源。durante（〜の間）もこの動詞から生まれた。"},
{w:"soler",p:"v",en:"to usually do",fr:"avoir l'habitude de",ex:"En España solemos comer a las dos, así que no reserves a las doce.",exEn:"In Spain we usually eat at two, so do not book for twelve.",exFr:"En Espagne, nous déjeunons généralement à deux heures, alors ne réserve pas pour midi.",n:"ラテン語solere（〜するのが常である）から。o→ue変化（suelo）。soler＋不定詞で「よく〜する、たいてい〜する」。単独では使わない。"},
{w:"depender",p:"v",en:"to depend",fr:"dépendre",ex:"—¿Vamos a la playa? —Depende: si hace viento en Tarifa, mejor quedémonos en casa.",exEn:"Shall we go to the beach? — It depends: if it is windy in Tarifa, we had better stay at home.",exFr:"On va à la plage ? — Ça dépend : s'il y a du vent à Tarifa, restons plutôt à la maison.",n:"ラテン語dependere（ぶら下がる）から。英depend、仏dépendreと同源。depender de〜で「〜次第だ」。Depende.（場合による）だけでも会話で使える。"},
{w:"la camisa",p:"nf",en:"shirt",fr:"la chemise",ex:"Ponte una camisa blanca para la boda, pero no la de las fiestas del pueblo.",exEn:"Put on a white shirt for the wedding, but not the one from the village festival.",exFr:"Mets une chemise blanche pour le mariage, mais pas celle des fêtes du village.",n:"後期ラテン語camisia（下着）から。仏chemiseと同源。camiseta（Tシャツ）はその縮小形。"},
{w:"el vestido",p:"nm",en:"dress",fr:"la robe",ex:"Elige un vestido de flamenca con lunares, que en la Feria todas los llevan.",exEn:"Choose a flamenco dress with polka dots, because at the Fair all the women wear them.",exFr:"Choisis une robe de flamenca à pois, parce qu'à la Feria, toutes les femmes en portent.",n:"vestir（着せる、ラテン語vestire）の過去分詞から。英vest、仏vêtementと同源。水玉模様はlunares（小さな月）と言う。"},
{w:"la falda",p:"nf",en:"skirt",fr:"la jupe",ex:"Si vas a visitar la catedral, no lleves una falda muy corta, que no te dejarán entrar.",exEn:"If you are going to visit the cathedral, do not wear a very short skirt, or they will not let you in.",exFr:"Si tu vas visiter la cathédrale, ne porte pas une jupe trop courte, sinon on ne te laissera pas entrer.",n:"ゲルマン語falda（ひだ）から来たとされ、英fold と同源。「山のふもと」の意味もある（la falda de la montaña）。"},
{w:"los pantalones",p:"nm pl",en:"trousers, pants",fr:"le pantalon",ex:"Lleva pantalones largos en el Camino, aunque haga calor, por los mosquitos.",exEn:"Wear long trousers on the Camino, even if it is hot, because of the mosquitoes.",exFr:"Porte un pantalon long sur le Chemin, même s'il fait chaud, à cause des moustiques.",n:"イタリアの喜劇の登場人物Pantaloneの名から、仏pantalonを経て入った。英pants と同源。スペイン語では複数形で1本を指すことが多い。"},
{w:"la chaqueta",p:"nf",en:"jacket",fr:"la veste",ex:"Coge una chaqueta, que en Madrid por la noche refresca aunque sea junio.",exEn:"Take a jacket, because in Madrid it gets cool at night even in June.",exFr:"Prends une veste, parce qu'à Madrid il fait frais le soir, même en juin.",n:"仏jaquette（上着）からの借用語。英jacket と同源。coger は「取る」で、スペインでは普通の語だが、中南米の一部では避けられる。"},
{w:"el abrigo",p:"nm",en:"coat",fr:"le manteau",ex:"No te olvides el abrigo en Burgos; allí dicen que hay nueve meses de invierno y tres de infierno.",exEn:"Do not forget your coat in Burgos; they say there it is nine months of winter and three of hell.",exFr:"N'oublie pas ton manteau à Burgos ; là-bas, on dit qu'il y a neuf mois d'hiver et trois d'enfer.",n:"abrigar（覆って守る）から。ラテン語apricus（日当たりのよい）に由来するとされる。カスティーリャの内陸の気候を表すことわざが有名。"},
