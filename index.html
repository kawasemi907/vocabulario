{w:"la iglesia",p:"nf",en:"church",fr:"l'église",ex:"En cada pueblo de España hay una iglesia y un bar, como mínimo.",exEn:"In every village in Spain there is a church and a bar, at least.",exFr:"Dans chaque village d'Espagne il y a une église et un bar, au minimum.",n:"ギリシャ語ekklesia（集会）から。仏église、英ecclesiasticalと同源。"},
{w:"el pueblo",p:"nm",en:"village, people",fr:"le village, le peuple",ex:"El pueblo de mis abuelos tiene doscientos habitantes y tres fiestas al año.",exEn:"My grandparents' village has two hundred inhabitants and three festivals a year.",exFr:"Le village de mes grands-parents a deux cents habitants et trois fêtes par an.",n:"ラテン語populus（民衆）から。仏peuple、英people・popularと同源。「村」と「民衆・国民」の両方の意味がある。"},
{w:"el barrio",p:"nm",en:"neighbourhood, district",fr:"le quartier",ex:"En mi barrio todos se conocen, y todos opinan.",exEn:"In my neighbourhood everybody knows each other, and everybody has an opinion.",exFr:"Dans mon quartier tout le monde se connaît, et tout le monde donne son avis.",n:"アラビア語起源の語。se conocenのseは「互いに」を表す相互用法。"},
{w:"la montaña",p:"nf",en:"mountain",fr:"la montagne",ex:"Los Pirineos son las montañas entre España y Francia.",exEn:"The Pyrenees are the mountains between Spain and France.",exFr:"Les Pyrénées sont les montagnes entre l'Espagne et la France.",n:"俗ラテン語montanea（mons「山」から）。仏montagne、英mountainと同源。仏gnと西ñの対応（montagne/montaña、Espagne/España）はよく見られる。"},
{w:"el río",p:"nm",en:"river",fr:"la rivière, le fleuve",ex:"El río Guadalquivir pasa por Córdoba y Sevilla.",exEn:"The Guadalquivir river passes through Córdoba and Seville.",exFr:"Le Guadalquivir passe par Cordoue et Séville.",n:"ラテン語rivus（小川）から。英rivuletと同源。グアダルキビルはアラビア語の「大きな川」が語源。"},
{w:"el árbol",p:"nm",en:"tree",fr:"l'arbre",ex:"En la plaza del pueblo hay un árbol de trescientos años.",exEn:"In the village square there is a three-hundred-year-old tree.",exFr:"Sur la place du village il y a un arbre de trois cents ans.",n:"ラテン語arborem。仏arbre、英arborと同源。語末のrがlに入れ替わった（arbore>árbol）。"},
{w:"la fruta",p:"nf",en:"fruit",fr:"le fruit, les fruits",ex:"En el mercado la fruta es barata y huele de verdad a fruta.",exEn:"At the market the fruit is cheap and really smells like fruit.",exFr:"Au marché les fruits sont bon marché et ils sentent vraiment le fruit.",n:"ラテン語fructus。仏fruit、英fruitと同源だが、スペイン語では女性名詞で、単数のまま集合的に使うことが多い。"},
{w:"el huevo",p:"nm",en:"egg",fr:"l'œuf",ex:"Una tortilla de patatas necesita huevos, patatas, aceite y paciencia.",exEn:"A potato omelette needs eggs, potatoes, oil and patience.",exFr:"Une tortilla aux pommes de terre demande des œufs, des pommes de terre, de l'huile et de la patience.",n:"ラテン語ovum。仏œuf、英ovalと同源。o→ueの二重母音化の結果、綴りの決まりで語頭にhが付いた（ue-で始まる語はhue-と書く）。"},
{w:"el queso",p:"nm",en:"cheese",fr:"le fromage",ex:"El queso manchego va perfecto con membrillo.",exEn:"Manchego cheese goes perfectly with quince paste.",exFr:"Le fromage manchego va parfaitement avec la pâte de coing.",n:"ラテン語caseus。英caseinと同源。仏fromage（型に入れたもの）とは別系統。マンチェゴはラ・マンチャ地方の羊乳チーズ。"},
{w:"la cerveza",p:"nf",en:"beer",fr:"la bière",ex:"Una cerveza bien fría después del trabajo no tiene precio.",exEn:"A really cold beer after work is priceless.",exFr:"Une bière bien fraîche après le travail, ça n'a pas de prix.",n:"ガリア語起源のラテン語cervesiaから。仏cervoise（昔のビール）と同源。スペインでは小さめの生ビールをcañaと呼ぶ。"},
{w:"la cuenta",p:"nf",en:"bill, check, account",fr:"l'addition, le compte",ex:"—La cuenta, por favor. —No, no, hoy invito yo.",exEn:"The bill, please. — No, no, today it is my treat.",exFr:"L'addition, s'il vous plaît. — Non, non, aujourd'hui c'est moi qui invite.",n:"contar（数える）の名詞形。仏compte、英accountと同源。invitarは「招待する」から「おごる」の意味にもなる。darse cuenta de〜は「〜に気づく」。"},
{w:"el precio",p:"nm",en:"price",fr:"le prix",ex:"El precio del menú incluye pan, bebida y postre.",exEn:"The price of the set menu includes bread, a drink and dessert.",exFr:"Le prix du menu comprend le pain, la boisson et le dessert.",n:"ラテン語pretium。仏prix、英price・preciousと同源。"},
{w:"la llave",p:"nf",en:"key",fr:"la clé",ex:"¿Dónde están las llaves? En la puerta, por fuera. Otra vez.",exEn:"Where are the keys? In the door, on the outside. Again.",exFr:"Où sont les clés ? Sur la porte, à l'extérieur. Encore.",n:"ラテン語clavem。仏clé、英clavicle（鍵の形の骨）と同源。cl→llの変化（clavem>llave、clamare>llamar）。"},
{w:"la ventana",p:"nf",en:"window",fr:"la fenêtre",ex:"Desde mi ventana veo la Sagrada Familia... y una grúa.",exEn:"From my window I can see the Sagrada Família... and a crane.",exFr:"De ma fenêtre je vois la Sagrada Família... et une grue.",n:"ラテン語ventus（風）から、「風の通り道」が原義。英vent・ventilateと同源。仏fenêtre（fenestra）とは別系統。サグラダ・ファミリアは長く建設中のためクレーンが名物。"},
{w:"el teléfono",p:"nm",en:"telephone",fr:"le téléphone",ex:"Mi abuela todavía contesta el teléfono con un ¿Diga?",exEn:"My grandmother still answers the phone with a Hello?",exFr:"Ma grand-mère répond encore au téléphone avec un Allô ?",n:"ギリシャ語tele（遠く）＋phone（声）。スペインでは電話に¿Diga?や¿Sí?と出る。携帯電話はel móvil。"},
{w:"la película",p:"nf",en:"film, movie",fr:"le film",ex:"Vimos una película de Almodóvar y discutimos hasta las dos.",exEn:"We watched an Almodóvar film and argued until two.",exFr:"Nous avons vu un film d'Almodóvar et nous en avons discuté jusqu'à deux heures.",n:"ラテン語pellicula（薄い皮）から、映画フィルムの「膜」を経て映画そのものを指すようになった。アルモドバルはスペインを代表する映画監督。"},
{w:"el regalo",p:"nm",en:"gift, present",fr:"le cadeau",ex:"El mejor regalo es el que no tienes que devolver.",exEn:"The best present is the one you do not have to return.",exFr:"Le meilleur cadeau est celui qu'on n'a pas besoin de rendre.",n:"仏régaler（もてなす）と同源とされる。動詞はregalar（プレゼントする）。el que〜で「〜するもの」。"},
{w:"el cumpleaños",p:"nm",en:"birthday",fr:"l'anniversaire",ex:"En mi cumpleaños mis amigos me tiraron de las orejas, una vez por cada año.",exEn:"On my birthday my friends pulled my ears, once for each year.",exFr:"Pour mon anniversaire mes amis m'ont tiré les oreilles, une fois pour chaque année.",n:"cumplir（満たす）＋años（年）の合成語で、単数も複数も同じ形。スペインでは誕生日に年の数だけ耳を引っ張る習慣がある。"},
{w:"el abuelo",p:"nm",en:"grandfather",fr:"le grand-père",ex:"Mi abuelo tiene noventa años y todavía juega al dominó cada tarde.",exEn:"My grandfather is ninety and still plays dominoes every afternoon.",exFr:"Mon grand-père a quatre-vingt-dix ans et joue encore aux dominos chaque après-midi.",n:"俗ラテン語aviolus（avus「祖父」の縮小形）から。los abuelosは「祖父母」。"},
{w:"el novio",p:"nm",en:"boyfriend, fiancé, groom",fr:"le petit ami, le fiancé",ex:"Mi hermana tiene novio nuevo, y mi madre ya está preparando la boda.",exEn:"My sister has a new boyfriend, and my mother is already planning the wedding.",exFr:"Ma sœur a un nouveau petit ami, et ma mère prépare déjà le mariage.",n:"ラテン語novius（新しい人）から、nuevoと同語源。「恋人」「婚約者」「新郎」をすべて表す。女性形はnovia。estar + 現在分詞は進行形。"},
{w:"la clase",p:"nf",en:"class, lesson",fr:"le cours, la classe",ex:"En clase de español aprendí más con las canciones que con los libros.",exEn:"In Spanish class I learned more from songs than from books.",exFr:"En cours d'espagnol j'ai appris plus avec les chansons qu'avec les livres.",n:"ラテン語classis（区分）から。英class、仏classeと同源。「授業」「教室」「種類」の意味がある。más... que...で比較。"},
{w:"el viaje",p:"nm",en:"trip, journey",fr:"le voyage",ex:"¡Buen viaje! Y trae turrón a la vuelta.",exEn:"Have a good trip! And bring turrón when you come back.",exFr:"Bon voyage ! Et rapporte du touron au retour.",n:"ラテン語viaticum（旅の糧）から。仏voyage、英voyageと同源。a la vueltaで「帰りに」。"},
{w:"rico",p:"adj",en:"rich, delicious",fr:"riche, délicieux",ex:"Esta paella está riquísima; el cocinero no es rico, pero debería serlo.",exEn:"This paella is delicious; the cook is not rich, but he should be.",exFr:"Cette paella est délicieuse ; le cuisinier n'est pas riche, mais il devrait l'être.",n:"ゲルマン語起源で、仏riche、英richと同源。ser rico（金持ちだ）とestar rico（おいしい）で意味が変わる、ser/estarの違いの典型例。"},
{w:"caliente",p:"adj",en:"hot (temperature)",fr:"chaud",ex:"Cuidado, el plato está muy caliente.",exEn:"Careful, the plate is very hot.",exFr:"Attention, l'assiette est très chaude.",n:"ラテン語calentem（温かい）から、calorと同じ語根。辛い意味のhotはpicante、気温はhace calorと言い、calienteは物の温度に使う。"},
{w:"limpio",p:"adj",en:"clean",fr:"propre",ex:"La casa está limpia porque viene mi suegra.",exEn:"The house is clean because my mother-in-law is coming.",exFr:"La maison est propre parce que ma belle-mère vient.",n:"ラテン語limpidus（澄んだ）から。状態を表すのでestarと使う。"},
{w:"sucio",p:"adj",en:"dirty",fr:"sale",ex:"Después del partido, las botas están sucias y los jugadores también.",exEn:"After the match, the boots are dirty and so are the players.",exFr:"Après le match, les chaussures sont sales et les joueurs aussi.",n:"ラテン語sucidus（汁気の多い）から。limpioの反対語。仏sale（ゲルマン語起源）とは別語源。"},
{w:"lleno",p:"adj",en:"full",fr:"plein",ex:"El metro va lleno; espera al siguiente, que también va lleno.",exEn:"The metro is full; wait for the next one, which is full too.",exFr:"Le métro est plein ; attends le suivant, qui est plein aussi.",n:"ラテン語plenus。仏plein、英plenty・completeと同源。pl→llの規則的な変化。"},
{w:"rápido",p:"adj",en:"fast, quick",fr:"rapide",ex:"Los madrileños hablan rápido, andan rápido y comen despacio.",exEn:"Madrilenians talk fast, walk fast and eat slowly.",exFr:"Les Madrilènes parlent vite, marchent vite et mangent lentement.",n:"ラテン語rapidus（奪い去る）から。形容詞のまま副詞としても使える（hablar rápido）。反対語はlento、副詞ではdespacio。"},
{w:"fuerte",p:"adj",en:"strong",fr:"fort",ex:"El café aquí es tan fuerte que te despierta solo con mirarlo.",exEn:"The coffee here is so strong it wakes you up just by looking at it.",exFr:"Le café ici est si fort qu'il te réveille rien qu'en le regardant.",n:"ラテン語fortis。仏fort、英fortitudeと同源。o→ueの二重母音化の例。"},
{w:"simpático",p:"adj",en:"nice, friendly",fr:"sympathique",ex:"El camarero es muy simpático, pero se olvida de todo.",exEn:"The waiter is very friendly, but he forgets everything.",exFr:"Le serveur est très sympathique, mais il oublie tout.",n:"ギリシャ語sympatheia（共感）から。仏sympathiqueと意味も同じ。英sympatheticは「同情的な」なので偽の友。"},
{w:"guapo",p:"adj",en:"good-looking",fr:"beau",ex:"—¡Qué guapo estás hoy! —¿Solo hoy?",exEn:"You look great today! — Only today?",exFr:"Tu es beau aujourd'hui ! — Seulement aujourd'hui ?",n:"語源は諸説ある。スペインでは男女ともに「かっこいい・きれい」に使い、親しみを込めた呼びかけにもなる。estar guapoは「今日は素敵に見える」。"},
{w:"divertido",p:"adj",en:"fun, funny",fr:"amusant",ex:"La fiesta fue muy divertida, pero no recuerdo el final.",exEn:"The party was a lot of fun, but I do not remember the end.",exFr:"La fête était très amusante, mais je ne me souviens pas de la fin.",n:"divertir（楽しませる）の過去分詞から。英diversionと同源。fueはserの点過去。"},
{w:"aburrido",p:"adj",en:"bored, boring",fr:"ennuyé, ennuyeux",ex:"La película es tan aburrida que el perro se durmió.",exEn:"The film is so boring that the dog fell asleep.",exFr:"Le film est si ennuyeux que le chien s'est endormi.",n:"aburrir（退屈させる）の過去分詞。ser aburrido（退屈な）とestar aburrido（退屈している）で意味が変わる。"},
{w:"tranquilo",p:"adj",en:"calm, quiet",fr:"calme, tranquille",ex:"Tranquilo, en España nadie cena antes de las nueve.",exEn:"Relax, in Spain nobody has dinner before nine.",exFr:"Du calme, en Espagne personne ne dîne avant neuf heures.",n:"ラテン語tranquillus。仏tranquille、英tranquilと同源。¡Tranquilo!は「落ち着いて・大丈夫」という定番の声かけ。"},
{w:"contento",p:"adj",en:"happy, pleased",fr:"content",ex:"Estoy contento porque mañana empiezan las vacaciones.",exEn:"I am happy because the holidays start tomorrow.",exFr:"Je suis content parce que les vacances commencent demain.",n:"ラテン語contentus（満たされた）から。仏content、英contentと同源。一時的な気分なのでestarと使う。"},
{w:"enfermo",p:"adj",en:"ill, sick",fr:"malade",ex:"Estoy enfermo, pero no tanto como para no ver el partido.",exEn:"I am ill, but not so ill that I cannot watch the match.",exFr:"Je suis malade, mais pas au point de ne pas regarder le match.",n:"ラテン語infirmus（弱い）から。英infirm・infirmaryと同源。仏maladeとは別系統。"},
{w:"listo",p:"adj",en:"ready, clever",fr:"prêt, malin",ex:"Mi gato es listo: siempre está listo para comer.",exEn:"My cat is clever: it is always ready to eat.",exFr:"Mon chat est malin : il est toujours prêt à manger.",n:"語源ははっきりしない。ser listo（賢い）とestar listo（準備ができている）で意味が変わる、ser/estarの違いの典型例。"},
{w:"quién",p:"pron",en:"who",fr:"qui",ex:"¿Quién se ha comido el último trozo de tortilla?",exEn:"Who has eaten the last piece of tortilla?",exFr:"Qui a mangé le dernier morceau de tortilla ?",n:"ラテン語quemから。仏quiと同源。複数形quiénesがある点がフランス語と違う。"},
{w:"cuál",p:"pron",en:"which, what",fr:"quel, lequel",ex:"¿Cuál es tu plato favorito? ¿Y cuál es el segundo?",exEn:"What is your favourite dish? And what is the second?",exFr:"Quel est ton plat préféré ? Et quel est le deuxième ?",n:"ラテン語qualis（どのような）から。仏quel、英qualityと同源。「〜は何ですか」と選ぶときはquéではなくcuál esを使う（¿Cuál es tu nombre?）。"},
{w:"cuánto",p:"adj/pron",en:"how much, how many",fr:"combien",ex:"—¿Cuánto cuesta este abanico? —Para ti, veinte euros. —¿Y para los demás?",exEn:"How much is this fan? — For you, twenty euros. — And for everyone else?",exFr:"Combien coûte cet éventail ? — Pour toi, vingt euros. — Et pour les autres ?",n:"ラテン語quantus。英quantityと同源。後ろの名詞に合わせてcuánta/cuántos/cuántasと変化する（¿Cuántos años tienes?）。"},
{w:"cómo",p:"adv",en:"how",fr:"comment",ex:"¿Cómo se dice sobremesa en inglés? No se dice.",exEn:"How do you say sobremesa in English? You do not.",exFr:"Comment dit-on sobremesa en anglais ? On ne le dit pas.",n:"ラテン語quomodo（どのように）から。仏commentと同源。記号なしのcomoは「〜のように」「〜なので」。"},
{w:"por qué",p:"adv",en:"why",fr:"pourquoi",ex:"—¿Por qué cenáis tan tarde? —¿Y por qué no?",exEn:"Why do you have dinner so late? — And why not?",exFr:"Pourquoi dînez-vous si tard ? — Et pourquoi pas ?",n:"por + qué（何のために）で、仏pourquoiと同じ構造。答えは一語のporque。cenáisはスペイン本国で使うvosotros（君たち）の活用。"},
{w:"alguno",p:"adj/pron",en:"some, any",fr:"quelque, un",ex:"—¿Tienes alguna pregunta? —Sí, ¿a qué hora comemos?",exEn:"Do you have any questions? — Yes, what time do we eat?",exFr:"Tu as des questions ? — Oui, à quelle heure on mange ?",n:"ラテン語aliquis unus（ある一つ）から。男性単数名詞の前ではalgúnになる（algún día）。"},
{w:"ninguno",p:"adj/pron",en:"no, none",fr:"aucun",ex:"No tengo ningún problema con madrugar... si es a las diez.",exEn:"I have no problem at all with getting up early... if it is at ten.",exFr:"Je n'ai aucun problème pour me lever tôt... si c'est à dix heures.",n:"nec unus（一つもない）から。男性単数名詞の前ではningún。動詞の後ろに置くときはno... ningúnの二重否定になる。madrugarは「早起きする」。"},
{w:"cada",p:"adj",en:"each, every",fr:"chaque",ex:"Cada pueblo tiene su fiesta, y cada fiesta tiene su comida.",exEn:"Every village has its festival, and every festival has its food.",exFr:"Chaque village a sa fête, et chaque fête a son plat.",n:"ギリシャ語kata（〜ごとに）がラテン語経由で入った語。仏chaqueと同源。性数変化せず、常にcadaのまま。"},
{w:"entre",p:"prep",en:"between, among",fr:"entre",ex:"Entre tú y yo, la tortilla de tu madre es mejor que la mía.",exEn:"Between you and me, your mother's omelette is better than mine.",exFr:"Entre toi et moi, l'omelette de ta mère est meilleure que la mienne.",n:"ラテン語inter。仏entre、英inter-と同源。前置詞の後ろは普通mí・tiだが、entreだけはtú y yoと主格を使う例外。"},
{w:"sobre",p:"prep",en:"on, about, over",fr:"sur, au sujet de",ex:"Dejé una nota sobre la mesa sobre la cena de mañana.",exEn:"I left a note on the table about tomorrow's dinner.",exFr:"J'ai laissé un mot sur la table au sujet du dîner de demain.",n:"ラテン語super（上に）。仏sur、英superと同源。「〜の上に」と「〜について」の両方。名詞el sobreは「封筒」。"},
{w:"desde",p:"prep",en:"from, since",fr:"depuis, de",ex:"Desde la terraza se ve toda la ciudad.",exEn:"You can see the whole city from the terrace.",exFr:"Depuis la terrasse on voit toute la ville.",n:"de + ex + de の合成から。場所の起点「〜から」と時間の「〜以来」を表す。desde hace + 期間で「〜前から」（desde hace dos años）。"},
{w:"durante",p:"prep",en:"during, for",fr:"pendant",ex:"Durante la siesta, la ciudad se queda en silencio.",exEn:"During the siesta, the city goes quiet.",exFr:"Pendant la sieste, la ville reste silencieuse.",n:"durar（続く）の現在分詞から生まれた前置詞。英duringもdure（続く）から同じように生まれた。"},
{w:"aunque",p:"conj",en:"although, even if",fr:"bien que, même si",ex:"Aunque llueva, iremos a la playa. Somos optimistas.",exEn:"Even if it rains, we will go to the beach. We are optimists.",exFr:"Même s'il pleut, nous irons à la plage. Nous sommes optimistes.",n:"aun（〜さえ）+ que。後ろが直説法なら「〜だけれども」（事実）、接続法（llueva）なら「たとえ〜でも」（仮定）と意味が変わる。4級でよく問われる。"},
{w:"entonces",p:"adv",en:"then, so",fr:"alors",ex:"—No hay pan. —Entonces comemos churros.",exEn:"There is no bread. — Then we eat churros.",exFr:"Il n'y a pas de pain. — Alors on mange des churros.",n:"ラテン語in tunc（その時に）から。「その時」と「それなら」の両方の意味で、仏alorsと使い方がほぼ同じ。"},
{w:"pronto",p:"adv",en:"soon, early",fr:"bientôt, tôt",ex:"¡Hasta pronto! Volveré en verano, con más español.",exEn:"See you soon! I will come back in summer, with more Spanish.",exFr:"À bientôt ! Je reviendrai en été, avec plus d'espagnol.",n:"ラテン語promptus（準備された）から。英promptと同源。¡Hasta pronto!は「またすぐにね」。volveréは未来形。"}
]},
  {id:4, title:"Nivel 4", range:"301–400", words:[
{w:"preguntar",p:"v",en:"to ask (a question)",fr:"demander, poser une question",ex:"Le pregunté al camarero qué era el gazpacho y me trajo una sopa fría con una sonrisa.",exEn:"I asked the waiter what gazpacho was and he brought me a cold soup with a smile.",exFr:"J'ai demandé au serveur ce qu'était le gazpacho et il m'a apporté une soupe froide avec un sourire.",n:"ラテン語percontari（問いただす）に由来するとされる。質問をして「尋ねる」がpreguntar、物を「頼む」はpedirと使い分ける。仏demanderは両方を兼ねるので注意。"},
{w:"contestar",p:"v",en:"to answer, to reply",fr:"répondre",ex:"Llamé tres veces a mi hermano, pero no contestó: estaba viendo el Clásico.",exEn:"I called my brother three times, but he did not answer: he was watching El Clásico.",exFr:"J'ai appelé mon frère trois fois, mais il n'a pas répondu : il regardait le Clásico.",n:"ラテン語contestari（証人を呼ぶ）から。英contest・testifyと同源。点過去（contestó）は一回の出来事、線過去（estaba viendo）はその時の背景を表す。el Clásicoはレアル・マドリードとバルセロナの伝統の一戦。"},
{w:"pedir",p:"v",en:"to ask for, to order",fr:"demander, commander",ex:"En Granada pedimos una cerveza y el camarero nos trajo una tapa gratis.",exEn:"In Granada we ordered a beer and the waiter brought us a free tapa.",exFr:"À Grenade, nous avons commandé une bière et le serveur nous a apporté une tapa gratuite.",n:"ラテン語petere（求める）から。英petition・appetiteと同源。e→i変化（pido, pidió）。グラナダでは飲み物を頼むとタパが無料で付く習慣が有名。"},
{w:"servir",p:"v",en:"to serve, to be useful",fr:"servir",ex:"Mi abuela servía el cocido a las dos en punto, y nadie llegaba tarde.",exEn:"My grandmother served the cocido at two o'clock sharp, and nobody arrived late.",exFr:"Ma grand-mère servait le cocido à deux heures pile, et personne n'arrivait en retard.",n:"ラテン語servire（仕える）から。英serve、仏servirと同源。e→i変化。servir para〜で「〜の役に立つ」。線過去servíaは過去の習慣を表す。cocidoはひよこ豆と肉の煮込みでマドリードの名物。"},
{w:"repetir",p:"v",en:"to repeat",fr:"répéter",ex:"El profesor repetía la misma frase cada día: el subjuntivo es tu amigo.",exEn:"The teacher repeated the same sentence every day: the subjunctive is your friend.",exFr:"Le professeur répétait la même phrase chaque jour : le subjonctif est ton ami.",n:"ラテン語repetere（再び求める）から。英repeat、仏répéterと同源。e→i変化（repito）。スペインの学校ではrepetir curso（留年する）という表現もよく使う。"},
{w:"explicar",p:"v",en:"to explain",fr:"expliquer",ex:"Mi amiga mexicana me explicó que el Día de Muertos no es triste, sino una fiesta.",exEn:"My Mexican friend explained to me that the Day of the Dead is not sad, but a celebration.",exFr:"Mon amie mexicaine m'a expliqué que le Jour des morts n'est pas triste, mais une fête.",n:"ラテン語explicare（折り目を広げる）から。英explain・explicit、仏expliquerと同源。点過去1人称はexpliquéとつづりが変わる（-car→-qué）。"},
{w:"llover",p:"v",en:"to rain",fr:"pleuvoir",ex:"Cuando llegamos a Santiago de Compostela, llovía, como siempre.",exEn:"When we arrived in Santiago de Compostela, it was raining, as always.",exFr:"Quand nous sommes arrivés à Saint-Jacques-de-Compostelle, il pleuvait, comme toujours.",n:"ラテン語pluere（雨が降る）の俗ラテン語形から。仏pleuvoirと同源。o→ue変化（llueve）の無人称動詞。点過去（llegamos）が出来事、線過去（llovía）がその場の状況を表す。"},
{w:"nevar",p:"v",en:"to snow",fr:"neiger",ex:"Casi nunca nieva en Sevilla, pero en Sierra Nevada se puede esquiar por la mañana e ir a la playa por la tarde.",exEn:"It almost never snows in Seville, but in Sierra Nevada you can ski in the morning and go to the beach in the afternoon.",exFr:"Il ne neige presque jamais à Séville, mais dans la Sierra Nevada on peut skier le matin et aller à la plage l'après-midi.",n:"ラテン語nix, nivis（雪）から派生した動詞。仏neigerと同源。e→ie変化（nieva）の無人称動詞。Sierra Nevadaは「雪に覆われた山脈」という意味。"},
{w:"nacer",p:"v",en:"to be born",fr:"naître",ex:"Mi abuelo nació en un pueblo de Asturias que tenía más vacas que personas.",exEn:"My grandfather was born in a village in Asturias that had more cows than people.",exFr:"Mon grand-père est né dans un village des Asturies qui avait plus de vaches que d'habitants.",n:"ラテン語nasci（生まれる）から。英native・nation、仏naîtreと同源。1人称現在はnazco。生まれた出来事は点過去（nació）、村の様子は線過去（tenía）で表す。"},
{w:"morir",p:"v",en:"to die",fr:"mourir",ex:"Cervantes y Shakespeare murieron en 1616, casi el mismo día.",exEn:"Cervantes and Shakespeare died in 1616, almost on the same day.",exFr:"Cervantès et Shakespeare sont morts en 1616, presque le même jour.",n:"ラテン語mori（死ぬ）から。英mortal、仏mourirと同源。o→ue変化（muere）、点過去3人称はo→u（murió）。4月23日が「世界本の日」になったのは、この二人の命日にちなむ。"},
{w:"crecer",p:"v",en:"to grow, to grow up",fr:"grandir, pousser",ex:"Crecí en Buenos Aires, donde todos los domingos comíamos asado con la familia.",exEn:"I grew up in Buenos Aires, where every Sunday we ate asado with the family.",exFr:"J'ai grandi à Buenos Aires, où tous les dimanches nous mangions un asado en famille.",n:"ラテン語crescere（育つ）から。英increase・crescent、仏croîtreと同源。1人称現在はcrezco。アルゼンチンのasado（炭火焼き肉）は日曜の家族の集まりの定番。"},
{w:"conducir",p:"v",en:"to drive",fr:"conduire",ex:"En Inglaterra conduje por la izquierda y casi me volví loco en la primera rotonda.",exEn:"In England I drove on the left and I almost went mad at the first roundabout.",exFr:"En Angleterre, j'ai conduit à gauche et j'ai failli devenir fou au premier rond-point.",n:"ラテン語conducere（導く）から。英conduct、仏conduireと同源。点過去は不規則でconduje, condujo。中南米では「運転する」にmanejarを使うことが多い。"},
{w:"visitar",p:"v",en:"to visit",fr:"visiter, rendre visite",ex:"Cuando visitamos la Alhambra, había tanta gente que vimos más cabezas que azulejos.",exEn:"When we visited the Alhambra, there were so many people that we saw more heads than tiles.",exFr:"Quand nous avons visité l'Alhambra, il y avait tant de monde que nous avons vu plus de têtes que d'azulejos.",n:"ラテン語visitare（何度も見に行く）から。英visit、仏visiterと同源。人を訪ねるときは前置詞aが必要（visitar a mi abuela）。azulejoは装飾タイルで、アラビア語起源とされる。"},
{w:"invitar",p:"v",en:"to invite, to treat",fr:"inviter",ex:"Hoy invito yo: en España, quien invita paga la cuenta de todos.",exEn:"Today it is on me: in Spain, whoever invites pays the bill for everyone.",exFr:"Aujourd'hui, c'est moi qui invite : en Espagne, celui qui invite paie l'addition de tout le monde.",n:"ラテン語invitare（招く）から。英invite、仏inviterと同源。Te invito.は「おごるよ」の意味でも使い、スペインでは割り勘より順番におごり合う習慣がよく見られる。"},
{w:"celebrar",p:"v",en:"to celebrate",fr:"célébrer, fêter",ex:"El año pasado celebramos la Nochevieja comiendo doce uvas, una por cada campanada.",exEn:"Last year we celebrated New Year's Eve eating twelve grapes, one for each chime.",exFr:"L'année dernière, nous avons fêté la Saint-Sylvestre en mangeant douze raisins, un à chaque coup de cloche.",n:"ラテン語celebrare（大勢で祝う）から。英celebrate、仏célébrerと同源。スペインでは大晦日の真夜中、鐘の音に合わせて12粒のブドウを食べると1年幸運になるとされる。"},
{w:"recibir",p:"v",en:"to receive",fr:"recevoir",ex:"Ayer recibí una postal de Cuba; tardó tres meses en llegar.",exEn:"Yesterday I received a postcard from Cuba; it took three months to arrive.",exFr:"Hier, j'ai reçu une carte postale de Cuba ; elle a mis trois mois à arriver.",n:"ラテン語recipere（受け取る）から。英receive・recipe、仏recevoirと同源。-ir動詞の規則活用の代表例。tardar＋期間＋en＋不定詞で「〜するのに…かかる」。"},
{w:"enviar",p:"v",en:"to send",fr:"envoyer",ex:"Mi madre me enviaba chorizo por correo cada mes porque creía que en Londres no había comida.",exEn:"My mother used to send me chorizo by mail every month because she thought there was no food in London.",exFr:"Ma mère m'envoyait du chorizo par la poste chaque mois parce qu'elle croyait qu'il n'y avait pas de nourriture à Londres.",n:"ラテン語via（道）を含む俗ラテン語inviare（道に送り出す）から。仏envoyerと同源。現在形ではiにアクセントが付く（envío, envías）。線過去は過去の繰り返しの習慣を表す。"},
{w:"decidir",p:"v",en:"to decide",fr:"décider",ex:"Después de mucho pensar, decidimos pasar el verano en Cádiz y no en la oficina.",exEn:"After much thought, we decided to spend the summer in Cádiz and not in the office.",exFr:"Après avoir beaucoup réfléchi, nous avons décidé de passer l'été à Cadix et pas au bureau.",n:"ラテン語decidere（切り離す）から。英decide、仏déciderと同源。decidir＋不定詞で「〜することに決める」。仏décider deと違い前置詞は不要。"},
{w:"elegir",p:"v",en:"to choose, to elect",fr:"choisir, élire",ex:"Había veinte tipos de jamón y no sabía cuál elegir, así que probé todos.",exEn:"There were twenty kinds of ham and I did not know which to choose, so I tried them all.",exFr:"Il y avait vingt sortes de jambon et je ne savais pas lequel choisir, alors je les ai tous goûtés.",n:"ラテン語eligere（選び出す）から。英elect・elegant、仏élireと同源。e→i変化で、1人称現在はelijo（g→j）。"},
{w:"intentar",p:"v",en:"to try",fr:"essayer, tenter",ex:"Intenté pronunciar la erre doble toda la tarde, pero solo conseguí asustar al perro.",exEn:"I tried to pronounce the rolled R all afternoon, but I only managed to scare the dog.",exFr:"J'ai essayé de prononcer le R roulé tout l'après-midi, mais j'ai seulement réussi à faire peur au chien.",n:"ラテン語intentare（向ける）から。英intend・intent、仏tenterと同源。intentar＋不定詞で「〜しようとする」。"},
{w:"prometer",p:"v",en:"to promise",fr:"promettre",ex:"Mi padre me prometió que iríamos a ver el mar, y lo cumplió al día siguiente.",exEn:"My father promised me that we would go to see the sea, and he kept his word the next day.",exFr:"Mon père m'a promis que nous irions voir la mer, et il a tenu parole le lendemain.",n:"ラテン語promittere（前に送る）から。英promise、仏promettreと同源。過去の時点から見た未来は過去未来（iríamos）で表す。"},
{w:"costar",p:"v",en:"to cost",fr:"coûter",ex:"En 1990 un café costaba cien pesetas; ahora cuesta casi dos euros.",exEn:"In 1990 a coffee cost a hundred pesetas; now it costs almost two euros.",exFr:"En 1990, un café coûtait cent pesetas ; maintenant il coûte presque deux euros.",n:"ラテン語constare（〜に値する）から。英cost、仏coûterと同源。o→ue変化（cuesta）。スペインは2002年にペセタからユーロに切り替えた。"},
{w:"doler",p:"v",en:"to hurt, to ache",fr:"faire mal",ex:"Después de la Tomatina me dolían los ojos y olía a gazpacho.",exEn:"After the Tomatina my eyes hurt and I smelled like gazpacho.",exFr:"Après la Tomatina, j'avais mal aux yeux et je sentais le gazpacho.",n:"ラテン語dolere（痛む）から。仏douleurと同源。gustarと同じ構文で、痛む部位が主語になる（me duele la cabeza / me duelen los ojos）。トマティーナはバレンシア州ブニョールのトマト投げ祭り。"},
{w:"gastar",p:"v",en:"to spend, to use up",fr:"dépenser",ex:"En el viaje a Barcelona gasté más en helados que en el hotel.",exEn:"On the trip to Barcelona I spent more on ice cream than on the hotel.",exFr:"Pendant le voyage à Barcelone, j'ai dépensé plus en glaces qu'à l'hôtel.",n:"ラテン語vastare（荒らす、空にする）に由来するとされ、英waste・devastateと同源。お金だけでなく時間やエネルギーを「使う・消費する」にも使う。"},
{w:"alquilar",p:"v",en:"to rent",fr:"louer",ex:"Alquilamos un piso en Valencia y el dueño nos regaló una paella de bienvenida.",exEn:"We rented a flat in Valencia and the owner gave us a welcome paella.",exFr:"Nous avons loué un appartement à Valence et le propriétaire nous a offert une paella de bienvenue.",n:"アラビア語の「賃料」を表す語に由来するとされ、al-はアラビア語の定冠詞の名残。英rentや仏louerとは別系統。「貸す」「借りる」の両方の意味で使う。"},
{w:"reservar",p:"v",en:"to book, to reserve",fr:"réserver",ex:"Si no reservas mesa, el sábado no encontrarás sitio en ningún bar de San Sebastián.",exEn:"If you do not book a table, on Saturday you will not find room in any bar in San Sebastián.",exFr:"Si tu ne réserves pas de table, samedi tu ne trouveras de place dans aucun bar de Saint-Sébastien.",n:"ラテン語reservare（取っておく）から。英reserve、仏réserverと同源。si＋現在形、主節は未来形（encontrarás）が基本の条件文。サン・セバスティアンは小皿料理ピンチョスで知られる美食の町。"},
{w:"acabar",p:"v",en:"to finish, to end",fr:"finir, terminer",ex:"Cuando acabó la telenovela, eran las doce y mi abuela todavía lloraba.",exEn:"When the soap opera ended, it was midnight and my grandmother was still crying.",exFr:"Quand la telenovela s'est terminée, il était minuit et ma grand-mère pleurait encore.",n:"cabo（端・終わり）から作られた語で、ラテン語caput（頭）に遡る。仏achever、英achieveと同源。acabar de＋不定詞は「〜したばかり」という重要表現。"},
{w:"casarse",p:"v refl",en:"to get married",fr:"se marier",ex:"Mis padres se casaron en Sevilla en abril, justo durante la Feria.",exEn:"My parents got married in Seville in April, right during the Fair.",exFr:"Mes parents se sont mariés à Séville en avril, juste pendant la Feria.",n:"casa（家）から派生し、「家庭を持つ」が原義。「〜と結婚する」はcasarse con〜。セビーリャの春祭りFeria de Abrilは、フラメンコ衣装とセビジャーナスの踊りで有名。"},
{w:"despertarse",p:"v refl",en:"to wake up",fr:"se réveiller",ex:"En Valencia, durante las Fallas, me despertaba cada día a las ocho por los petardos.",exEn:"In Valencia, during the Fallas, I woke up every day at eight because of the firecrackers.",exFr:"À Valence, pendant les Fallas, je me réveillais chaque jour à huit heures à cause des pétards.",n:"ラテン語expergisci（目覚める）の分詞形から生まれたとされる。e→ie変化（me despierto）。seのないdespertarは「（他人を）起こす」。"},
{w:"vestirse",p:"v refl",en:"to get dressed, to dress up",fr:"s'habiller, se déguiser",ex:"En el Carnaval de Cádiz me vestí de pirata y nadie me reconoció.",exEn:"At the Cádiz Carnival I dressed up as a pirate and nobody recognized me.",exFr:"Au carnaval de Cadix, je me suis déguisé en pirate et personne ne m'a reconnu.",n:"ラテン語vestire（衣服を着せる）から。英vest、仏vêtementと同源。e→i変化（me visto）。vestirse de〜で「〜の格好をする・仮装する」。"},
{w:"preocuparse",p:"v refl",en:"to worry",fr:"s'inquiéter",ex:"Mi madre se preocupaba mucho cuando yo volvía tarde de la verbena del barrio.",exEn:"My mother worried a lot when I came home late from the neighborhood street party.",exFr:"Ma mère s'inquiétait beaucoup quand je rentrais tard de la fête du quartier.",n:"ラテン語praeoccupare（先に占める）から。英preoccupy、仏préoccuperと同源。「〜を心配する」はpreocuparse por〜。verbenaは夏の夜に開かれる地区のお祭り。"},
{w:"divertirse",p:"v refl",en:"to have fun, to enjoy oneself",fr:"s'amuser",ex:"En las fiestas de mi pueblo nos divertimos tanto que terminamos desayunando churros a las siete.",exEn:"At my village festival we had so much fun that we ended up having churros for breakfast at seven.",exFr:"Aux fêtes de mon village, nous nous sommes tellement amusés que nous avons fini par prendre des churros au petit-déjeuner à sept heures.",n:"ラテン語divertere（向きを変える）から。英divert、仏divertirと同源。e→ie変化（me divierto）、点過去3人称はe→i（se divirtió）。形容詞divertido（楽しい）の元の動詞。"},
{w:"reírse",p:"v refl",en:"to laugh",fr:"rire",ex:"Cuando dije estoy embarazada en vez de tengo vergüenza, toda la clase se rio.",exEn:"When I said I am pregnant instead of I am embarrassed, the whole class laughed.",exFr:"Quand j'ai dit je suis enceinte au lieu de j'ai honte, toute la classe a ri.",n:"ラテン語ridere（笑う）から。英ridiculous、仏rireと同源。「〜を笑う」はreírse de〜。英embarrassedに似たembarazadaは「妊娠している」なので要注意。"},
{w:"soñar",p:"v",en:"to dream",fr:"rêver",ex:"De pequeña soñaba con vivir en una de las casas colgadas de Cuenca.",exEn:"As a little girl I dreamed of living in one of the hanging houses of Cuenca.",exFr:"Petite, je rêvais de vivre dans une des maisons suspendues de Cuenca.",n:"ラテン語somniare（夢を見る）から。英insomnia、仏songeと同源。o→ue変化（sueño）。「〜を夢見る・〜の夢を見る」はsoñar con〜で、前置詞conを使う。"},
{w:"nadar",p:"v",en:"to swim",fr:"nager",ex:"El año que viene nadaré en el Mediterráneo el día de Año Nuevo; mi abuelo lo hacía cada año.",exEn:"Next year I will swim in the Mediterranean on New Year's Day; my grandfather did it every year.",exFr:"L'année prochaine, je nagerai dans la Méditerranée le jour de l'An ; mon grand-père le faisait chaque année.",n:"ラテン語natare（泳ぐ）から。仏nagerと同源。未来形は不定詞に語尾-é, -ás, -áなどを付けるだけで、-ar/-er/-ir動詞に共通。"},
{w:"el tío",p:"nm",en:"uncle",fr:"l'oncle",ex:"Mi tío de México siempre traía mole y tequila cuando venía a vernos.",exEn:"My uncle from Mexico always brought mole and tequila when he came to see us.",exFr:"Mon oncle du Mexique apportait toujours du mole et de la tequila quand il venait nous voir.",n:"ギリシャ語theios（おじ）が後期ラテン語thiusを経て入った語。女性形はla tía。スペインの若者ことばではtío / tíaを「おまえ・あいつ」という呼びかけにも使う。"},
{w:"el primo",p:"nm",en:"cousin",fr:"le cousin",ex:"En verano, mis primos y yo pasábamos las tardes en la piscina del pueblo.",exEn:"In summer, my cousins and I spent the afternoons at the village pool.",exFr:"En été, mes cousins et moi passions les après-midi à la piscine du village.",n:"ラテン語primus（第一の）から。consobrinus primus（第一のいとこ）の略とされ、英primeと同源。女性形はla prima。口語のhacer el primoは「カモにされる」。"},
{w:"el marido",p:"nm",en:"husband",fr:"le mari",ex:"Mi marido prometió que aprendería a bailar salsa, pero todavía pisa a todo el mundo.",exEn:"My husband promised he would learn to dance salsa, but he still steps on everyone.",exFr:"Mon mari a promis qu'il apprendrait à danser la salsa, mais il marche encore sur les pieds de tout le monde.",n:"ラテン語maritus（夫）から。仏mari、英maritalと同源。「夫」はesposoとも言う。過去から見た未来はaprendería（過去未来）で表す。"},
{w:"la esposa",p:"nf",en:"wife",fr:"l'épouse, la femme",ex:"Mi vecino dice que su esposa cocina la mejor fabada de Asturias, y tiene razón.",exEn:"My neighbor says his wife cooks the best fabada in Asturias, and he is right.",exFr:"Mon voisin dit que sa femme cuisine la meilleure fabada des Asturies, et il a raison.",n:"ラテン語sponsa（婚約した女性）から。英spouse、仏épouseと同源。複数形esposasには「手錠」の意味もある。fabadaは白インゲン豆と腸詰めの煮込み。"},
{w:"el vecino",p:"nm",en:"neighbor",fr:"le voisin",ex:"Nuestro vecino tocaba la guitarra cada noche, y así aprendimos todas las sevillanas.",exEn:"Our neighbor played the guitar every night, and that is how we learned all the sevillanas.",exFr:"Notre voisin jouait de la guitare tous les soirs, et c'est ainsi que nous avons appris toutes les sevillanas.",n:"ラテン語vicinus（近所の）から。英vicinity、仏voisinと同源。スペインでは同じマンションの住民がcomunidad de vecinos（住民組合）をつくる。"},
{w:"el camarero",p:"nm",en:"waiter",fr:"le serveur",ex:"En Madrid, el camarero gritaba los pedidos a la cocina y nadie se equivocaba.",exEn:"In Madrid, the waiter shouted the orders to the kitchen and nobody made mistakes.",exFr:"À Madrid, le serveur criait les commandes à la cuisine et personne ne se trompait.",n:"cámara（部屋）から派生し、元は王宮の部屋付きの役人を指した。英chamber、仏chambreと同源。中南米ではmesero（メキシコなど）やmozo（アルゼンチンなど）とも言う。"},
{w:"el profesor",p:"nm",en:"teacher, professor",fr:"le professeur",ex:"Mi profesor de español era de Colombia y nos enseñaba a bailar cumbia los viernes.",exEn:"My Spanish teacher was from Colombia and taught us to dance cumbia on Fridays.",exFr:"Mon professeur d'espagnol était colombien et il nous apprenait à danser la cumbia le vendredi.",n:"ラテン語professor（公に教える者）から。英professor、仏professeurと同源。大学に限らず学校の先生一般に使う。女性形はla profesora。"},
{w:"el hotel",p:"nm",en:"hotel",fr:"l'hôtel",ex:"El hotel de Toledo era un antiguo palacio y la habitación tenía más años que mi país.",exEn:"The hotel in Toledo was an old palace and the room was older than my country.",exFr:"L'hôtel de Tolède était un ancien palais et la chambre était plus vieille que mon pays.",n:"仏hôtelからの借用語で、ラテン語hospitale（客のための）に遡り、英hospital・hostと同源。hは無音で「オテル」と読む。スペインには古城や修道院を改装した国営ホテルParadorがある。"},
{w:"el aeropuerto",p:"nm",en:"airport",fr:"l'aéroport",ex:"Llegamos al aeropuerto de Madrid a las seis y a las siete ya estábamos comiendo churros.",exEn:"We arrived at Madrid airport at six and by seven we were already eating churros.",exFr:"Nous sommes arrivés à l'aéroport de Madrid à six heures et à sept heures nous mangions déjà des churros.",n:"aero-（空気、ギリシャ語aēr）＋puerto（港、ラテン語portus）の合成語。英airport、仏aéroportと同じ組み立て。"},
{w:"el billete",p:"nm",en:"ticket, banknote",fr:"le billet",ex:"Compré un billete de tren a Córdoba, pero me subí al tren de Cádiz.",exEn:"I bought a train ticket to Córdoba, but I got on the train to Cádiz.",exFr:"J'ai acheté un billet de train pour Cordoue, mais je suis monté dans le train pour Cadix.",n:"仏billetからの借用語。スペインでは乗車券も紙幣もbillete。中南米では乗車券にboletoを使うことが多い。"},
{w:"la maleta",p:"nf",en:"suitcase",fr:"la valise",ex:"Mi maleta viajó a Canarias mientras yo esperaba en Bilbao.",exEn:"My suitcase traveled to the Canaries while I waited in Bilbao.",exFr:"Ma valise est partie aux Canaries pendant que j'attendais à Bilbao.",n:"古フランス語male（旅行かばん）に由来するとされ、英mail（元は郵便袋）と同源。hacer la maleta（荷造りする）は旅の前の定番表現。"},
{w:"la carta",p:"nf",en:"letter, menu",fr:"la lettre, la carte",ex:"De pequeño, cada diciembre escribía una carta a los Reyes Magos con una lista enorme.",exEn:"As a child, every December I wrote a letter to the Three Wise Men with a huge list.",exFr:"Petit, chaque décembre, j'écrivais une lettre aux Rois mages avec une liste énorme.",n:"ラテン語charta（紙）から。英card・chart、仏carteと同源。レストランの「メニュー」もla carta。スペインでは1月6日に東方の三博士がプレゼントを届ける。"},
{w:"el periódico",p:"nm",en:"newspaper",fr:"le journal",ex:"Mi abuelo leía el periódico en el bar todas las mañanas, con un café y un churro.",exEn:"My grandfather read the newspaper at the bar every morning, with a coffee and a churro.",exFr:"Mon grand-père lisait le journal au bar tous les matins, avec un café et un churro.",n:"形容詞periódico（定期的な）から「定期刊行物」の意味になった。ギリシャ語periodos（周期）に遡り、英periodと同源。仏journalはjour（日）から来ており、発想が異なる。"},
{w:"la noticia",p:"nf",en:"news, piece of news",fr:"la nouvelle",ex:"Cuando oímos la noticia del Gordo de Navidad, todo el barrio salió a la calle con cava.",exEn:"When we heard the news about the Christmas Gordo, the whole neighborhood went out into the street with cava.",exFr:"Quand nous avons entendu la nouvelle du Gordo de Noël, tout le quartier est sorti dans la rue avec du cava.",n:"ラテン語notitia（知らせ、知識）から。英notice、仏noticeと同源。El Gordoはスペインのクリスマス宝くじの1等で、当選者の出た町は大騒ぎになる。"},
{w:"el restaurante",p:"nm",en:"restaurant",fr:"le restaurant",ex:"El restaurante más antiguo del mundo está en Madrid y todavía sirve cochinillo asado.",exEn:"The oldest restaurant in the world is in Madrid and it still serves roast suckling pig.",exFr:"Le plus ancien restaurant du monde se trouve à Madrid et il sert encore du cochon de lait rôti.",n:"仏restaurantからの借用語で、restaurer（元気を回復させる）の現在分詞から。英restoreと同源。マドリードの老舗Botínは1725年創業で、世界最古のレストランとしてギネスに登録されている。"},
{w:"el desayuno",p:"nm",en:"breakfast",fr:"le petit-déjeuner",ex:"En Andalucía, el desayuno típico era pan con tomate y aceite, y lo sigue siendo.",exEn:"In Andalusia, the typical breakfast was bread with tomato and oil, and it still is.",exFr:"En Andalousie, le petit-déjeuner typique était du pain à la tomate et à l'huile, et il l'est toujours.",n:"des-（否定）＋ayuno（断食）で「断食を破る」が原義。英breakfast（break＋fast）、仏déjeuner（断食をやめる）とまったく同じ発想。"},
{w:"la cena",p:"nf",en:"dinner, supper",fr:"le dîner",ex:"En España la cena es a las diez; a las siete solo cenan los turistas.",exEn:"In Spain dinner is at ten; only tourists have dinner at seven.",exFr:"En Espagne, le dîner est à dix heures ; à sept heures, seuls les touristes dînent.",n:"ラテン語cena（食事）から。動詞はcenar（夕食をとる）。スペインの夕食は21〜22時ごろが普通で、ヨーロッパでも特に遅い。"},
{w:"el postre",p:"nm",en:"dessert",fr:"le dessert",ex:"De postre pedimos crema catalana, y el camarero la quemó delante de nosotros.",exEn:"For dessert we ordered crema catalana, and the waiter caramelized it in front of us.",exFr:"En dessert, nous avons commandé une crème catalane, et le serveur l'a caramélisée devant nous.",n:"ラテン語postremus（最後の）に由来するとされ、「食事の最後に出るもの」。英post-（後の）と同じ語根。de postreで「デザートに」。"},
{w:"el arroz",p:"nm",en:"rice",fr:"le riz",ex:"Mi abuela valenciana decía que la paella de mi novio no era paella, sino arroz con cosas.",exEn:"My Valencian grandmother used to say that my boyfriend's paella was not paella, but rice with stuff.",exFr:"Ma grand-mère valencienne disait que la paella de mon copain n'était pas une paella, mais du riz avec des trucs.",n:"アラビア語ar-ruzzに由来するとされ、語頭のa-はアラビア語の定冠詞の名残。英rice、仏rizとは遠い起源を共有する。バレンシアは米どころで、パエリアの本場。"},
{w:"la leche",p:"nf",en:"milk",fr:"le lait",ex:"Cuando era niño, tomaba un vaso de leche con cacao todas las mañanas antes del colegio.",exEn:"When I was a child, I drank a glass of milk with cocoa every morning before school.",exFr:"Quand j'étais enfant, je buvais un verre de lait au cacao tous les matins avant l'école.",n:"ラテン語lac, lactis（乳）から。英lactose、仏laitと同源。café con leche（カフェオレ）はスペインの朝の定番。"},
{w:"el aceite",p:"nm",en:"oil",fr:"l'huile",ex:"España produce casi la mitad del aceite de oliva del mundo, y mi madre lo pone en todo.",exEn:"Spain produces almost half of the world's olive oil, and my mother puts it on everything.",exFr:"L'Espagne produit presque la moitié de l'huile d'olive du monde, et ma mère en met partout.",n:"アラビア語az-zaytに由来するとされ、アラビア語起源の語の代表例。一方、olivo（オリーブの木）や英oil・仏huileはラテン語oleum系。"},
{w:"la sopa",p:"nf",en:"soup",fr:"la soupe",ex:"En agosto, en vez de sopa caliente, tomábamos gazpacho frío con hielo.",exEn:"In August, instead of hot soup, we had cold gazpacho with ice.",exFr:"En août, au lieu de soupe chaude, nous prenions du gazpacho froid avec des glaçons.",n:"ゲルマン語起源とされ、元はスープに浸したパンのこと。英soup、仏soupeと同源。gazpachoやsalmorejoはアンダルシアの冷たいスープ。"},
{w:"el pollo",p:"nm",en:"chicken",fr:"le poulet",ex:"En Perú probé el pollo a la brasa y desde entonces sueño con él.",exEn:"In Peru I tried rotisserie chicken and since then I have been dreaming about it.",exFr:"Au Pérou, j'ai goûté le poulet à la braise et depuis, j'en rêve.",n:"ラテン語pullus（ひな鳥）から。仏poulet、英poultryと同源。生きている鶏はgallina（雌鶏）、gallo（雄鶏）で、料理になったものをpolloと呼ぶことが多い。"},
{w:"la naranja",p:"nf",en:"orange",fr:"l'orange",ex:"En Sevilla hay naranjos en todas las calles, pero sus naranjas son amargas y se usan para mermelada.",exEn:"In Seville there are orange trees on every street, but their oranges are bitter and are used for marmalade.",exFr:"À Séville, il y a des orangers dans toutes les rues, mais leurs oranges sont amères et servent à faire de la marmelade.",n:"アラビア語nāranjに由来するとされ、さらにペルシャ語やサンスクリット語に遡る。英orangeもこの語から来ており、語頭のnが落ちた形。果樹はel naranjo。"},
{w:"el vaso",p:"nm",en:"glass (for drinking)",fr:"le verre",ex:"En Asturias, el camarero echaba la sidra desde muy alto y casi nada caía en el vaso.",exEn:"In Asturias, the waiter poured the cider from very high and almost nothing fell into the glass.",exFr:"Dans les Asturies, le serveur versait le cidre de très haut et presque rien ne tombait dans le verre.",n:"ラテン語vas（容器）から。英vase・vessel、仏vaseと同源。飲み物の「コップ」はvaso、ワイングラスはcopa、カップはtazaと使い分ける。"},
{w:"la botella",p:"nf",en:"bottle",fr:"la bouteille",ex:"Abrimos una botella de cava a las doce y el corcho acabó en la sopa del vecino.",exEn:"We opened a bottle of cava at midnight and the cork ended up in the neighbor's soup.",exFr:"Nous avons ouvert une bouteille de cava à minuit et le bouchon a fini dans la soupe du voisin.",n:"仏bouteilleからの借用語とされ、ラテン語butticula（小さな樽）に遡る。英bottleと同源。cavaはカタルーニャを中心に造られるスパークリングワイン。"},
{w:"el plato",p:"nm",en:"plate, dish, course",fr:"l'assiette, le plat",ex:"En el menú del día hay primer plato, segundo plato y postre, y todo por doce euros.",exEn:"In the menú del día there is a first course, a second course and dessert, and all for twelve euros.",exFr:"Dans le menú del día, il y a une entrée, un plat principal et un dessert, et tout ça pour douze euros.",n:"俗ラテン語plattus（平らな）に由来するとされ、英plate・flat、仏platと同源。「皿」と「料理」の両方の意味。スペインの昼の定食menú del díaはprimer plato、segundo plato、postreの3品が基本。"},
{w:"la silla",p:"nf",en:"chair",fr:"la chaise",ex:"En los pueblos, por la noche la gente sacaba las sillas a la calle para hablar con los vecinos.",exEn:"In villages, at night people took their chairs out into the street to talk with the neighbors.",exFr:"Dans les villages, le soir, les gens sortaient leurs chaises dans la rue pour parler avec les voisins.",n:"ラテン語sella（座席）から。仏selle（鞍）と同源で、スペイン語でも「鞍」はsilla de montar。夏の夜に椅子を外に出して涼むことをtomar el frescoと言う。"},
{w:"el baño",p:"nm",en:"bathroom, bath",fr:"la salle de bains, le bain",ex:"—¿Dónde está el baño? —Al fondo a la derecha, como en todos los bares de España.",exEn:"Where is the bathroom? — At the back on the right, like in every bar in Spain.",exFr:"Où sont les toilettes ? — Au fond à droite, comme dans tous les bars d'Espagne.",n:"ラテン語balneum（浴場）から。仏bainと同源で、balneario（温泉地）も同じ語から。英bathはゲルマン語系で別語源。スペインではトイレをservicioやaseoとも言う。"},
{w:"el piso",p:"nm",en:"floor, flat, apartment",fr:"l'étage, l'appartement",ex:"Vivíamos en un quinto piso sin ascensor, así que no necesitábamos ir al gimnasio.",exEn:"We lived on a fifth floor with no lift, so we did not need to go to the gym.",exFr:"Nous vivions au cinquième étage sans ascenseur, alors nous n'avions pas besoin d'aller à la salle de sport.",n:"pisar（踏む）から派生し、「踏む面」→「床・階」となった。スペインではマンションの一室もpisoと言い、中南米ではdepartamentoが一般的。"},
{w:"la plaza",p:"nf",en:"square, plaza",fr:"la place",ex:"Todas las tardes, los niños jugaban al fútbol en la plaza mientras los abuelos miraban.",exEn:"Every afternoon, the children played football in the square while the grandparents watched.",exFr:"Tous les après-midi, les enfants jouaient au foot sur la place pendant que les grands-parents regardaient.",n:"ラテン語platea（広い通り）から。仏place、英placeと同源。Plaza Mayor（中央広場）はスペインの多くの町の中心。"},
{w:"el campo",p:"nm",en:"countryside, field",fr:"la campagne, le champ",ex:"Los fines de semana íbamos al campo a comer tortilla y dormir la siesta bajo un olivo.",exEn:"On weekends we went to the countryside to eat tortilla and nap under an olive tree.",exFr:"Le week-end, nous allions à la campagne manger de la tortilla et faire la sieste sous un olivier.",n:"ラテン語campus（平地）から。英camp・campus・champion、仏champと同源。「田舎」「畑」のほか、campo de fútbol（サッカー場）のようにも使う。"},
{w:"el cielo",p:"nm",en:"sky, heaven",fr:"le ciel",ex:"En La Palma el cielo es tan limpio que hay telescopios de todo el mundo.",exEn:"On La Palma the sky is so clear that there are telescopes from all over the world.",exFr:"À La Palma, le ciel est si pur qu'il y a des télescopes du monde entier.",n:"ラテン語caelum（空）から。仏ciel、英celestialと同源。「空」と「天国」の両方の意味を持つ。カナリア諸島のラ・パルマ島には世界有数の天文台がある。"},
{w:"el viento",p:"nm",en:"wind",fr:"le vent",ex:"En Tarifa hacía tanto viento que mi sombrero llegó a África antes que yo.",exEn:"In Tarifa it was so windy that my hat reached Africa before me.",exFr:"À Tarifa, il y avait tellement de vent que mon chapeau est arrivé en Afrique avant moi.",n:"ラテン語ventus（風）から。英vent・ventilate、仏ventと同源。天気の表現ではhacer vientoとhacerを使う。タリファはヨーロッパ大陸最南端の町で、カイトサーフィンの聖地。"},
{w:"la luna",p:"nf",en:"moon",fr:"la lune",ex:"La noche de San Juan, bajo la luna, saltamos las hogueras en la playa de Alicante.",exEn:"On the night of San Juan, under the moon, we jumped over the bonfires on the beach in Alicante.",exFr:"La nuit de la Saint-Jean, sous la lune, nous avons sauté par-dessus les feux de joie sur la plage d'Alicante.",n:"ラテン語luna（月）から。英lunar、仏luneと同源。estar en la luna（上の空である）という慣用句もある。6月23日のSan Juanの夜は、海辺で焚き火を跳び越える習慣がある。"},
{w:"la flor",p:"nf",en:"flower",fr:"la fleur",ex:"En mayo, los patios de Córdoba estaban llenos de flores y de turistas con cámaras.",exEn:"In May, the patios of Córdoba were full of flowers and of tourists with cameras.",exFr:"En mai, les patios de Cordoue étaient remplis de fleurs et de touristes avec des appareils photo.",n:"ラテン語flos, floris（花）から。英flower・flora、仏fleurと同源。コルドバでは5月に、花で飾った中庭を競うパティオ祭りが開かれる。"},
{w:"el pájaro",p:"nm",en:"bird",fr:"l'oiseau",ex:"Cuando vivía en el pueblo, me despertaban los pájaros; ahora, en Madrid, me despiertan las motos.",exEn:"When I lived in the village, the birds woke me up; now, in Madrid, the motorbikes wake me up.",exFr:"Quand j'habitais au village, les oiseaux me réveillaient ; maintenant, à Madrid, ce sont les motos.",n:"ラテン語passer（スズメ）の俗ラテン語形から。仏passereau（スズメ）と同源。飛ぶ小鳥一般はpájaro、鶏なども含む鳥類全般はaveと言う。"},
{w:"el color",p:"nm",en:"color",fr:"la couleur",ex:"En Guatemala, los mercados tenían tantos colores que parecían un cuadro.",exEn:"In Guatemala, the markets had so many colors that they looked like a painting.",exFr:"Au Guatemala, les marchés avaient tant de couleurs qu'ils ressemblaient à un tableau.",n:"ラテン語colorから。英color、仏couleurと同源。仏語では女性名詞だが、スペイン語では男性名詞でel color。¿De qué color es?で「何色ですか」。"},
{w:"blanco",p:"adj",en:"white",fr:"blanc",ex:"En Andalucía los pueblos son blancos para protegerse del sol del verano.",exEn:"In Andalusia the villages are white to protect themselves from the summer sun.",exFr:"En Andalousie, les villages sont blancs pour se protéger du soleil de l'été.",n:"ゲルマン語blank（輝く）から入ったとされる。仏blanc、英blankと同源。ラテン語の「白」albusはalbúmina（卵白）などに残る。"},
{w:"negro",p:"adj",en:"black",fr:"noir",ex:"En Galicia, mi abuela siempre vestía de negro y cocinaba el mejor pulpo del pueblo.",exEn:"In Galicia, my grandmother always dressed in black and cooked the best octopus in the village.",exFr:"En Galice, ma grand-mère s'habillait toujours en noir et cuisinait le meilleur poulpe du village.",n:"ラテン語niger（黒い）から。仏noirと同源。口語でestar negroは「ひどく怒っている」、verlo todo negroは「悲観的になる」という意味になる。"},
{w:"rojo",p:"adj",en:"red",fr:"rouge",ex:"En Pamplona, durante San Fermín, todo el mundo llevaba un pañuelo rojo al cuello.",exEn:"In Pamplona, during San Fermín, everyone wore a red scarf around their neck.",exFr:"À Pampelune, pendant la San Fermín, tout le monde portait un foulard rouge autour du cou.",n:"ラテン語russeus（赤みがかった）から。仏rouge、英russetと同源とされる。ponerse rojoで「顔が赤くなる」。"},
{w:"azul",p:"adj",en:"blue",fr:"bleu",ex:"El pueblo de Júzcar, en Málaga, era blanco, pero en 2011 lo pintaron de azul para una película de los Pitufos.",exEn:"The village of Júzcar, in Málaga, was white, but in 2011 they painted it blue for a Smurfs film.",exFr:"Le village de Júzcar, près de Málaga, était blanc, mais en 2011 on l'a peint en bleu pour un film des Schtroumpfs.",n:"ペルシャ語lāzhward（ラピスラズリ）がアラビア語を経て入ったとされる。英azure、仏azurと同源。男女同形で、複数形はazules。"},
{w:"verde",p:"adj",en:"green, unripe",fr:"vert",ex:"En Asturias todo es verde porque llueve casi todos los días.",exEn:"In Asturias everything is green because it rains almost every day.",exFr:"Dans les Asturies, tout est vert parce qu'il pleut presque tous les jours.",n:"ラテン語viridis（緑の）から。仏vert、英verdantと同源。estar verdeは「（果物が）熟していない」「（人が）未熟だ」という意味になる。"},
{w:"triste",p:"adj",en:"sad",fr:"triste",ex:"El tango siempre me parecía triste, hasta que lo bailé en Buenos Aires.",exEn:"Tango always seemed sad to me, until I danced it in Buenos Aires.",exFr:"Le tango m'a toujours semblé triste, jusqu'à ce que je le danse à Buenos Aires.",n:"ラテン語tristis（悲しい）から。仏tristeと同形・同源。-eで終わる形容詞は男女同形。ser tristeは性質、estar tristeはその時の気分を表す。"},
{w:"ocupado",p:"adj",en:"busy, occupied",fr:"occupé",ex:"Mi padre siempre estaba ocupado, excepto a la hora de la siesta.",exEn:"My father was always busy, except at siesta time.",exFr:"Mon père était toujours occupé, sauf à l'heure de la sieste.",n:"動詞ocupar（占める）の過去分詞から。ラテン語occupareに遡り、英occupied、仏occupéと同源。状態なのでestar ocupadoとestarを使う。トイレの「使用中」表示もOcupado。"},
{w:"libre",p:"adj",en:"free, available",fr:"libre",ex:"—¿Está libre esta mesa? —Sí, pero aquí la gente prefiere tomar las tapas de pie en la barra.",exEn:"Is this table free? — Yes, but here people prefer to have their tapas standing at the bar.",exFr:"Cette table est libre ? — Oui, mais ici les gens préfèrent prendre les tapas debout au comptoir.",n:"ラテン語liber（自由な）から。英liberty、仏libreと同源。「空いている」「自由な」の意味で、「無料の」にはgratisを使う。"},
{w:"importante",p:"adj",en:"important",fr:"important",ex:"Para mi abuelo, lo más importante del día era la comida del mediodía y la siesta de después.",exEn:"For my grandfather, the most important thing of the day was lunch and the siesta afterwards.",exFr:"Pour mon grand-père, le plus important de la journée, c'était le déjeuner et la sieste d'après.",n:"ラテン語importare（持ち込む）の現在分詞から。英important、仏importantと同源。lo＋形容詞で「〜なこと」という抽象的な意味になる（lo importante）。"},
{w:"interesante",p:"adj",en:"interesting",fr:"intéressant",ex:"La visita al Museo del Prado fue interesante, pero yo solo buscaba la cafetería.",exEn:"The visit to the Prado Museum was interesting, but I was only looking for the cafeteria.",exFr:"La visite du musée du Prado était intéressante, mais moi, je cherchais seulement la cafétéria.",n:"ラテン語interesse（間にある、関わる）から。英interesting、仏intéressantと同源。「〜に興味がある」はme interesa〜で、gustarと同じ構文になる。"},
{w:"seguro",p:"adj",en:"sure, safe",fr:"sûr",ex:"Estaba seguro de que el museo abría los lunes, pero estaba cerrado.",exEn:"I was sure the museum opened on Mondays, but it was closed.",exFr:"J'étais sûr que le musée ouvrait le lundi, mais il était fermé.",n:"ラテン語securus（心配のない）から。英secure・sure、仏sûrと同源。estar seguro de〜で「〜を確信している」、ser seguroで「安全だ」。名詞el seguroは「保険」。"},
{w:"antiguo",p:"adj",en:"old, ancient, former",fr:"ancien",ex:"El acueducto de Segovia es tan antiguo que los romanos lo construyeron sin cemento.",exEn:"The aqueduct of Segovia is so old that the Romans built it without cement.",exFr:"L'aqueduc de Ségovie est si ancien que les Romains l'ont construit sans ciment.",n:"ラテン語antiquus（昔の）から。英antique・ancient、仏ancienと同源。viejoは人や物の老い・古びた様子に、antiguoは歴史的な古さや「かつての」に使うことが多い。"},
{w:"moderno",p:"adj",en:"modern",fr:"moderne",ex:"El Museo Guggenheim de Bilbao es tan moderno que al principio parecía un barco de metal.",exEn:"The Guggenheim Museum in Bilbao is so modern that at first it looked like a metal ship.",exFr:"Le musée Guggenheim de Bilbao est si moderne qu'au début il ressemblait à un bateau en métal.",n:"ラテン語modo（今しがた）から作られた後期ラテン語modernusから。英modern、仏moderneと同源。反対語はantiguo。"},
{w:"típico",p:"adj",en:"typical, traditional",fr:"typique",ex:"El plato típico de Valencia no es la paella de marisco, sino la de pollo y conejo.",exEn:"The typical dish of Valencia is not seafood paella, but the one with chicken and rabbit.",exFr:"Le plat typique de Valence n'est pas la paella aux fruits de mer, mais celle au poulet et au lapin.",n:"ギリシャ語typos（型）から。英typical、仏typiqueと同源。スペイン語では「その土地らしい・名物の」という意味でよく使い、comida típicaは郷土料理。"},
{w:"famoso",p:"adj",en:"famous",fr:"célèbre, fameux",ex:"Antes nadie conocía la playa de Itzurun, pero después de Juego de Tronos se hizo famosa.",exEn:"Before, nobody knew Itzurun beach, but after Game of Thrones it became famous.",exFr:"Avant, personne ne connaissait la plage d'Itzurun, mais après Game of Thrones, elle est devenue célèbre.",n:"ラテン語fama（評判、うわさ）から。英famous・fame、仏fameuxと同源。hacerse famosoで「有名になる」。"},
{w:"mientras",p:"conj",en:"while",fr:"pendant que",ex:"Mientras mi padre veía el fútbol, mi madre y yo preparábamos las croquetas.",exEn:"While my father watched football, my mother and I made the croquettes.",exFr:"Pendant que mon père regardait le foot, ma mère et moi préparions les croquettes.",n:"古スペイン語domientre(s)から変化した語で、ラテン語dum interim（その間に）に由来するとされる。同時に進行していた2つの過去の行為は、どちらも線過去で表すことが多い。mientras tantoで「その間に」。"},
{w:"casi",p:"adv",en:"almost",fr:"presque",ex:"Casi perdí el tren a Toledo porque me quedé mirando un escaparate de mazapanes.",exEn:"I almost missed the train to Toledo because I stood looking at a shop window full of marzipan.",exFr:"J'ai failli rater le train pour Tolède parce que je suis resté à regarder une vitrine de massepains.",n:"ラテン語quasi（あたかも）から。英quasi-と同源。casi＋点過去で「もう少しで〜するところだった」の意味になり、実際には起きていない。トレドはマサパン（マジパン）の名産地。"},
{w:"solo",p:"adv",en:"only, just",fr:"seulement",ex:"Fui a Salamanca solo por un fin de semana y volví con tres kilos de jamón.",exEn:"I went to Salamanca for just one weekend and came back with three kilos of ham.",exFr:"Je suis allé à Salamanque seulement pour un week-end et je suis revenu avec trois kilos de jambon.",n:"ラテン語solus（ひとりの）から。英solo・sole、仏seulと同源。副詞「〜だけ」にも形容詞「ひとりの」にも使う。以前は副詞をsóloと書き分けたが、現在のRAEの規範ではアクセント記号なしが基本。"},
{w:"bastante",p:"adv",en:"quite, enough",fr:"assez",ex:"El examen del DELE era bastante difícil, pero después fuimos a celebrarlo con tapas.",exEn:"The DELE exam was quite difficult, but afterwards we went to celebrate with tapas.",exFr:"L'examen du DELE était assez difficile, mais après nous sommes allés fêter ça avec des tapas.",n:"bastar（足りる）の現在分詞から。仏assezと同じく「かなり」と「十分に」の両方の意味がある。形容詞として名詞の前にも置ける（bastante gente）。"},
{w:"demasiado",p:"adv",en:"too, too much",fr:"trop",ex:"Comimos demasiado en la boda y después nadie podía bailar.",exEn:"We ate too much at the wedding and afterwards nobody could dance.",exFr:"Nous avons trop mangé au mariage et après personne ne pouvait danser.",n:"demás（そのほかの、余分な）から派生。英too、仏tropと同じく「〜すぎる」。形容詞として名詞の性数に合わせることもある（demasiada gente）。スペインの結婚式は食事が何時間も続くことで有名。"},
{w:"además",p:"adv",en:"besides, moreover",fr:"en plus, de plus",ex:"El piso era barato y, además, estaba al lado del Retiro.",exEn:"The flat was cheap and, besides, it was next to the Retiro park.",exFr:"L'appartement était bon marché et, en plus, il était à côté du parc du Retiro.",n:"a＋demás（そのほか）から。además de〜で「〜に加えて」。理由や情報を付け足すときの便利なつなぎ言葉。Retiroはマドリード中心部の大きな公園。"},
{w:"de repente",p:"loc",en:"suddenly",fr:"soudain, tout à coup",ex:"Estábamos en la playa de San Sebastián tomando el sol cuando de repente empezó a llover.",exEn:"We were on the beach in San Sebastián sunbathing when suddenly it started to rain.",exFr:"Nous étions sur la plage de Saint-Sébastien en train de bronzer quand soudain il a commencé à pleuvoir.",n:"repente（突然の衝動）はラテン語repens（突然の）から。線過去で背景（estábamos）、点過去で突然の出来事（empezó）を表す典型的な文型。"},
{w:"a veces",p:"loc",en:"sometimes",fr:"parfois",ex:"A veces, en Madrid, cenábamos a medianoche y nadie lo encontraba raro.",exEn:"Sometimes, in Madrid, we had dinner at midnight and nobody found it strange.",exFr:"Parfois, à Madrid, nous dînions à minuit et personne ne trouvait ça bizarre.",n:"vez（回・度）の複数形を使った慣用表現で、複数形ではzがcに変わる。頻度はsiempre、a menudo、a veces、casi nunca、nuncaの順に覚えるとよい。"},
{w:"luego",p:"adv",en:"later, then",fr:"plus tard, ensuite",ex:"Primero fuimos a la Sagrada Familia y luego comimos en el mercado de la Boquería.",exEn:"First we went to the Sagrada Familia and then we ate at the Boquería market.",exFr:"D'abord, nous sommes allés à la Sagrada Família, puis nous avons mangé au marché de la Boqueria.",n:"ラテン語loco（その場で）から。元は「すぐに」の意味だったが、現在は「あとで・それから」。¡Hasta luego!（またあとで）は別れのあいさつの定番。"},
{w:"anoche",p:"adv",en:"last night",fr:"hier soir",ex:"Anoche cenamos en casa de mis tíos y nos fuimos a la una: fue una cena corta.",exEn:"Last night we had dinner at my aunt and uncle's and we left at one: it was a short dinner.",exFr:"Hier soir, nous avons dîné chez mon oncle et ma tante et nous sommes partis à une heure : c'était un dîner court.",n:"a＋noche（夜）から。「昨夜」の一語。anteayer（おととい）、anteanoche（おとといの夜）も同じ仲間。anocheやayerは点過去と一緒に使うことが多い。"},
{w:"sin embargo",p:"loc",en:"however, nevertheless",fr:"cependant, pourtant",ex:"El vuelo llegó con tres horas de retraso; sin embargo, llegamos a tiempo para la cena española.",exEn:"The flight arrived three hours late; however, we arrived in time for the Spanish dinner.",exFr:"Le vol est arrivé avec trois heures de retard ; cependant, nous sommes arrivés à temps pour le dîner espagnol.",n:"直訳は「妨げなしに」。embargoは「差し押さえ・禁輸」の意味で、英embargoはスペイン語からの借用。文と文をつなぐ「しかし」で、peroより改まった響き。"},
{w:"según",p:"prep",en:"according to",fr:"selon, d'après",ex:"Según mi abuela, el mejor jamón del mundo venía de Jabugo, y nadie se atrevía a discutir.",exEn:"According to my grandmother, the best ham in the world came from Jabugo, and nobody dared to argue.",exFr:"Selon ma grand-mère, le meilleur jambon du monde venait de Jabugo, et personne n'osait discuter.",n:"ラテン語secundum（〜に従って）から。英second（後に続く）と同源。según＋人称代名詞は主格を使い、según tú、según yoと言う。"}
]},
  {id:5, title:"Nivel 5", range:"401–500", words:[
{w:"ofrecer",p:"v",en:"to offer",fr:"offrir, proposer",ex:"En Marruecos y en Andalucía siempre te ofrecen un té; en Galicia, un orujo.",exEn:"In Morocco and in Andalusia they always offer you a tea; in Galicia, an orujo.",exFr:"Au Maroc et en Andalousie, on t'offre toujours un thé ; en Galice, un orujo.",n:"ラテン語offerre（差し出す）の俗ラテン語形から。英offer、仏offrirと同源。1人称現在はofrezco。orujoはブドウの搾りかすから造るガリシアの蒸留酒。"},
{w:"mostrar",p:"v",en:"to show",fr:"montrer",ex:"Mi abuelo nos mostraba fotos de su pueblo y siempre decía que allí el sol era más grande.",exEn:"My grandfather used to show us photos of his village and always said that the sun was bigger there.",exFr:"Mon grand-père nous montrait des photos de son village et disait toujours que là-bas le soleil était plus grand.",n:"ラテン語monstrare（示す）から。英demonstrate・monster、仏montrerと同源。o→ue変化（muestro）。日常会話ではenseñarも「見せる」の意味でよく使う。"},
{w:"sacar",p:"v",en:"to take out, to get",fr:"sortir, retirer, obtenir",ex:"Saqué un diez en el examen de historia y mi madre lo celebró con churros.",exEn:"I got a ten on the history exam and my mother celebrated with churros.",exFr:"J'ai eu dix sur dix à l'examen d'histoire et ma mère a fêté ça avec des churros.",n:"ゴート語の「争う・訴える」を表す語に由来するとされる。「取り出す」のほか、sacar una foto（写真を撮る）、sacar una nota（点を取る）など用途が広い。点過去1人称はsaqué（-car→-qué）。スペインの成績は10点満点。"},
{w:"guardar",p:"v",en:"to keep, to put away",fr:"garder, ranger",ex:"Mi abuela guardaba el turrón en un armario secreto, pero todos sabíamos dónde estaba.",exEn:"My grandmother kept the turrón in a secret cupboard, but we all knew where it was.",exFr:"Ma grand-mère gardait le touron dans un placard secret, mais nous savions tous où il était.",n:"ゲルマン語wardōn（見張る）から。英guard・ward、仏garderと同源。英語のw-がロマンス語でgu-になる例（war→guerra）の一つ。turrónはクリスマスに欠かせないアーモンドのお菓子。"},
{w:"cortar",p:"v",en:"to cut",fr:"couper",ex:"En Salamanca vimos a un hombre que cortaba jamón tan fino que se podía leer a través de él.",exEn:"In Salamanca we saw a man who cut ham so thin that you could read through it.",exFr:"À Salamanque, nous avons vu un homme qui coupait le jambon si finement qu'on pouvait lire à travers.",n:"ラテン語curtare（短くする）から。英curt、仏courtと同源。生ハムを薄く切る職人はcortadorと呼ばれ、スペインでは専門の技術として尊敬される。"},
{w:"romper",p:"v",en:"to break",fr:"casser, rompre",ex:"El año pasado rompí tres platos en una boda griega; en una española solo rompí la dieta.",exEn:"Last year I broke three plates at a Greek wedding; at a Spanish one I only broke my diet.",exFr:"L'année dernière, j'ai cassé trois assiettes à un mariage grec ; à un mariage espagnol, je n'ai rompu que mon régime.",n:"ラテン語rumpere（壊す）から。英rupture・interrupt、仏rompreと同源。過去分詞は不規則でroto。"},
{w:"caerse",p:"v refl",en:"to fall (down)",fr:"tomber",ex:"Mientras bailaba la jota, mi tío se cayó, pero siguió bailando en el suelo.",exEn:"While he was dancing the jota, my uncle fell, but he kept dancing on the floor.",exFr:"Pendant qu'il dansait la jota, mon oncle est tombé, mais il a continué à danser par terre.",n:"ラテン語cadere（落ちる）から。英cadence・accident、仏choirと同源。1人称現在はme caigo、点過去3人称はse cayó。jotaはアラゴンなどの伝統的な踊り。"},
{w:"tocar",p:"v",en:"to touch, to play (an instrument)",fr:"toucher, jouer (d'un instrument)",ex:"Mi primo tocaba la gaita en las fiestas de Galicia y los perros del pueblo aullaban con él.",exEn:"My cousin played the bagpipes at the festivals in Galicia and the village dogs howled along with him.",exFr:"Mon cousin jouait de la cornemuse aux fêtes de Galice et les chiens du village hurlaient avec lui.",n:"擬音語toc（トン）から生まれたとされ、英touch、仏toucherと同源。楽器を「演奏する」、me toca a mí（私の番だ）の意味もある。ガリシアやアストゥリアスではバグパイプ（gaita）が伝統楽器。"},
{w:"echar",p:"v",en:"to throw, to put in, to pour",fr:"jeter, mettre, verser",ex:"Mi padre echaba azúcar al café con leche y, además, mojaba una magdalena.",exEn:"My father put sugar in his milky coffee and, on top of that, dunked a magdalena in it.",exFr:"Mon père mettait du sucre dans son café au lait et, en plus, il y trempait une madeleine.",n:"ラテン語iactare（投げる）から。英eject・project、仏jeterと同源。「投げる・入れる・注ぐ」など意味が広い。echar de menos（〜が恋しい）は重要表現。"},
{w:"apagar",p:"v",en:"to turn off, to put out",fr:"éteindre",ex:"A las doce de la noche apagaron las luces de la plaza y empezaron los fuegos artificiales.",exEn:"At midnight they turned off the lights in the square and the fireworks began.",exFr:"À minuit, on a éteint les lumières de la place et le feu d'artifice a commencé.",n:"a-＋pagar（払う、元は「静める」の意味）から。明かりや火、電化製品を「消す」。反対語はencender。点過去1人称はapagué（-gar→-gué）。"},
{w:"encender",p:"v",en:"to turn on, to light",fr:"allumer",ex:"En Nochebuena mi abuela encendía todas las velas de la casa y apagaba la televisión.",exEn:"On Christmas Eve my grandmother lit all the candles in the house and turned off the television.",exFr:"Le soir de Noël, ma grand-mère allumait toutes les bougies de la maison et éteignait la télévision.",n:"ラテン語incendere（火をつける）から。英incendiary、仏incendieと同源。e→ie変化（enciendo）。Nochebuenaは12月24日の夜で、家族で夕食を囲む大切な日。"},
{w:"cumplir",p:"v",en:"to fulfil, to turn (an age)",fr:"accomplir, avoir (un âge)",ex:"Cuando mi abuela cumplió cien años, el alcalde le regaló una tarta y ella le pidió otra.",exEn:"When my grandmother turned a hundred, the mayor gave her a cake and she asked him for another.",exFr:"Quand ma grand-mère a eu cent ans, le maire lui a offert un gâteau et elle lui en a demandé un autre.",n:"ラテン語complere（満たす）から。英complete・comply、仏accomplirと同源。cumplir años（誕生日を迎える）、cumplir una promesa（約束を守る）のように使う。"},
{w:"compartir",p:"v",en:"to share",fr:"partager",ex:"En España las tapas se comparten, así que nunca sabía cuántas croquetas comía.",exEn:"In Spain tapas are shared, so I never knew how many croquettes I was eating.",exFr:"En Espagne, on partage les tapas, alors je ne savais jamais combien de croquettes je mangeais.",n:"com-（共に）＋partir（分ける）から。仏partager、英partと同じpars（部分）の仲間。se comparten（共有される）はseを使った受け身の言い方。"},
{w:"construir",p:"v",en:"to build",fr:"construire",ex:"Gaudí empezó a construir la Sagrada Familia en 1883, y todavía no está terminada.",exEn:"Gaudí began to build the Sagrada Familia in 1883, and it is still not finished.",exFr:"Gaudí a commencé à construire la Sagrada Família en 1883, et elle n'est toujours pas terminée.",n:"ラテン語construere（積み上げる）から。英construct、仏construireと同源。現在形でyが入る（construyo, construyes）のが特徴。サグラダ・ファミリアは着工から140年以上が経つ。"},
{w:"descansar",p:"v",en:"to rest",fr:"se reposer",ex:"Después de comer, los abuelos descansaban una hora y el pueblo entero se quedaba en silencio.",exEn:"After lunch, the grandparents rested for an hour and the whole village went silent.",exFr:"Après le déjeuner, les grands-parents se reposaient une heure et tout le village restait silencieux.",n:"des-＋cansar（疲れさせる）で「疲れを取る」。形容詞cansado（疲れた）と同じ語根。仏se reposerと違い、再帰代名詞なしで使う。"},
{w:"faltar",p:"v",en:"to be missing, to lack",fr:"manquer",ex:"Faltaban cinco minutos para las doce y a mi hermano le faltaban tres uvas.",exEn:"It was five minutes to midnight and my brother was still missing three grapes.",exFr:"Il était minuit moins cinq et il manquait trois raisins à mon frère.",n:"俗ラテン語fallitare（欠ける）から。英fault・fail、仏fauteと同源。gustarと同じ構文で、足りないものが主語になる（me falta dinero）。faltar〜para…で「…まであと〜」。"},
{w:"importar",p:"v",en:"to matter, to mind, to import",fr:"importer, avoir de l'importance",ex:"A mi abuelo no le importaba perder a las cartas; le importaba ganar a mi abuela.",exEn:"My grandfather did not mind losing at cards; what mattered to him was beating my grandmother.",exFr:"Mon grand-père se moquait de perdre aux cartes ; ce qui comptait pour lui, c'était de battre ma grand-mère.",n:"ラテン語importare（持ち込む）から。英import、仏importerと同源。gustarと同じ構文で「〜にとって重要だ」。¿Te importa si abro la ventana?（窓を開けてもいい？）は丁寧な頼み方。"},
{w:"molestar",p:"v",en:"to bother, to annoy",fr:"déranger, gêner",ex:"Nos molestaba el ruido de la calle, pero en Madrid la gente cena en la terraza hasta la una.",exEn:"The noise from the street bothered us, but in Madrid people eat dinner on the terrace until one o'clock.",exFr:"Le bruit de la rue nous dérangeait, mais à Madrid, les gens dînent en terrasse jusqu'à une heure.",n:"ラテン語molestus（厄介な）から。英molest（強い意味になる）、仏molesterと同源。gustarと同じ構文（me molesta el ruido）。¿Le molesta si fumo?（たばこを吸ってもいいですか）のように丁寧に尋ねるのにも使う。"},
{w:"parar",p:"v",en:"to stop",fr:"arrêter, s'arrêter",ex:"El autobús paró en medio del campo porque había cien ovejas en la carretera.",exEn:"The bus stopped in the middle of the countryside because there were a hundred sheep on the road.",exFr:"Le bus s'est arrêté en pleine campagne parce qu'il y avait cent moutons sur la route.",n:"ラテン語parare（準備する）から。英prepare、仏parerと同源で、「身構える」から「止める」へ意味が変わった。sin parar（休まずに）もよく使う。"},
{w:"andar",p:"v",en:"to walk, to go",fr:"marcher, aller",ex:"Los peregrinos anduvieron ochocientos kilómetros hasta Santiago y al llegar solo querían una cama.",exEn:"The pilgrims walked eight hundred kilometers to Santiago and when they arrived they only wanted a bed.",exFr:"Les pèlerins ont marché huit cents kilomètres jusqu'à Saint-Jacques et, en arrivant, ils ne voulaient qu'un lit.",n:"語源ははっきりせず、ラテン語ambulare（歩く）との関係が考えられている。点過去が不規則でanduve, anduvo。サンティアゴ巡礼の「フランス人の道」は約800km。"},
{w:"montar",p:"v",en:"to ride, to get on, to set up",fr:"monter, faire du cheval",ex:"En la Feria de Jerez, mi prima montaba a caballo mejor que los hombres del pueblo.",exEn:"At the Jerez Fair, my cousin rode a horse better than the men of the town.",exFr:"À la Feria de Jerez, ma cousine montait à cheval mieux que les hommes de la ville.",n:"monte（山）から、「高いところに上がる」が原義。英mount、仏monterと同源。montar a caballo（馬に乗る）、montar en bicicleta（自転車に乗る）。ヘレスは馬とシェリー酒で有名。"},
{w:"pintar",p:"v",en:"to paint",fr:"peindre",ex:"Picasso pintó el Guernica en solo un mes, en 1937.",exEn:"Picasso painted Guernica in just one month, in 1937.",exFr:"Picasso a peint Guernica en seulement un mois, en 1937.",n:"ラテン語pingere（描く）の過去分詞pictusから。英paint・picture、仏peindreと同源。ゲルニカはスペイン内戦中の爆撃を描いた作品で、マドリードのソフィア王妃芸術センターにある。"},
{w:"dibujar",p:"v",en:"to draw",fr:"dessiner",ex:"De niño dibujaba toros en todos los libros de la escuela, y el profesor no estaba contento.",exEn:"As a child I drew bulls in all my school books, and the teacher was not happy.",exFr:"Enfant, je dessinais des taureaux dans tous mes livres d'école, et le professeur n'était pas content.",n:"古フランス語deboissier（彫る）から来たとされる。名詞はel dibujo（絵・デッサン）で、dibujos animadosは「アニメ」。色を塗る絵はpintar、線で描くのはdibujar。"},
{w:"probar",p:"v",en:"to try, to taste, to test",fr:"goûter, essayer",ex:"En Asturias probé el queso de Cabrales y durante una hora no pude decir nada.",exEn:"In Asturias I tried Cabrales cheese and for an hour I could not say anything.",exFr:"Dans les Asturies, j'ai goûté le fromage de Cabrales et pendant une heure je n'ai rien pu dire.",n:"ラテン語probare（試す、証明する）から。英prove・probe、仏prouverと同源。o→ue変化（pruebo）。「味見する」「試着する（probarse）」の意味にもなる。カブラレスは香りの強い青かびチーズ。"},
{w:"mandar",p:"v",en:"to send, to order",fr:"envoyer, ordonner",ex:"Cuando estaba en Erasmus, mi madre me mandaba mensajes cada hora para saber si comía bien.",exEn:"When I was on Erasmus, my mother sent me messages every hour to find out whether I was eating well.",exFr:"Quand j'étais en Erasmus, ma mère m'envoyait des messages toutes les heures pour savoir si je mangeais bien.",n:"ラテン語mandare（任せる、命じる）から。英mandate・command、仏mander・commanderと同源。「送る」と「命令する」の両方の意味がある。¿Mande?はメキシコで「はい？何でしょう？」という聞き返しの丁寧な表現。"},
{w:"regresar",p:"v",en:"to return, to go back",fr:"revenir, rentrer",ex:"Mi abuelo emigró a Argentina en 1950 y regresó a Galicia treinta años después.",exEn:"My grandfather emigrated to Argentina in 1950 and returned to Galicia thirty years later.",exFr:"Mon grand-père a émigré en Argentine en 1950 et il est revenu en Galice trente ans plus tard.",n:"ラテン語regressus（戻ること）から。英regress、仏régresserと同源。volverとほぼ同じ意味で、中南米でよく使われる。20世紀にはガリシアから多くの人が中南米へ移住した。"},
{w:"cruzar",p:"v",en:"to cross",fr:"traverser",ex:"Cruzamos el estrecho de Gibraltar en barco y en una hora estábamos en África.",exEn:"We crossed the Strait of Gibraltar by boat and within an hour we were in Africa.",exFr:"Nous avons traversé le détroit de Gibraltar en bateau et en une heure nous étions en Afrique.",n:"cruz（十字架）から。英cross・cruise、仏croixと同じ系統。点過去1人称はcrucé（z→c）。ジブラルタル海峡はいちばん狭い所で約14km。"},
{w:"sonar",p:"v",en:"to sound, to ring",fr:"sonner",ex:"El despertador sonó a las siete, pero yo seguí durmiendo hasta las diez: era domingo.",exEn:"The alarm clock rang at seven, but I kept sleeping until ten: it was Sunday.",exFr:"Le réveil a sonné à sept heures, mais j'ai continué à dormir jusqu'à dix heures : c'était dimanche.",n:"ラテン語sonare（鳴る）から。英sound・sonic、仏sonnerと同源。o→ue変化（suena）。me suena（聞き覚えがある）という便利な表現もある。"},
{w:"llenar",p:"v",en:"to fill",fr:"remplir",ex:"Mi abuela llenaba el plato de todo el mundo dos veces sin preguntar.",exEn:"My grandmother filled everyone's plate twice without asking.",exFr:"Ma grand-mère remplissait l'assiette de tout le monde deux fois sans demander.",n:"形容詞lleno（いっぱいの、ラテン語plenus）から。英plenty・full、仏pleinと同じ系統。ラテン語のpl-がスペイン語でll-になる例（plorare→llorar）の一つ。"},
{w:"mover",p:"v",en:"to move",fr:"bouger, déplacer",ex:"Para bailar la salsa en Cali, había que mover las caderas y no pensar en nada.",exEn:"To dance salsa in Cali, you had to move your hips and not think about anything.",exFr:"Pour danser la salsa à Cali, il fallait bouger les hanches et ne penser à rien.",n:"ラテン語movere（動かす）から。英move・motor、仏mouvoirと同源。o→ue変化（muevo）。コロンビアのカリは「サルサの世界首都」と呼ばれる。"},
{w:"seguir",p:"v",en:"to follow, to continue",fr:"suivre, continuer",ex:"Seguimos a la banda de música por todo el pueblo hasta que llegamos a la iglesia.",exEn:"We followed the band through the whole village until we reached the church.",exFr:"Nous avons suivi la fanfare dans tout le village jusqu'à l'église.",n:"ラテン語sequi（従う）から。英sequence・second、仏suivreと同源。e→i変化で、1人称現在はsigo。seguir＋現在分詞で「〜し続ける」（sigue lloviendo）。"},
{w:"ocurrir",p:"v",en:"to happen, to occur",fr:"arriver, se produire",ex:"¿Qué ocurrió anoche? Solo recuerdo una fiesta, una peluca y un karaoke.",exEn:"What happened last night? I only remember a party, a wig and a karaoke.",exFr:"Qu'est-ce qui s'est passé hier soir ? Je me souviens seulement d'une fête, d'une perruque et d'un karaoké.",n:"ラテン語occurrere（出会う、出くわす）から。英occur、仏occurrenceと同源。se me ocurre una idea（アイデアが浮かぶ）という使い方もある。"},
{w:"pasear",p:"v",en:"to go for a walk, to stroll",fr:"se promener",ex:"Los domingos por la tarde, toda la familia paseaba por el Malecón de La Habana.",exEn:"On Sunday afternoons, the whole family went for a stroll along the Malecón in Havana.",exFr:"Le dimanche après-midi, toute la famille se promenait le long du Malecón de La Havane.",n:"paso（歩み）から派生し、英pace・pass、仏passerと同じ系統。dar un paseo（散歩する）とも言う。夕方の散歩（paseo）はスペイン語圏の大切な習慣。"},
{w:"tirar",p:"v",en:"to throw, to pull, to throw away",fr:"jeter, tirer",ex:"En la Tomatina la gente tiraba tomates; en la Batalla del Vino de Haro, tiraba vino.",exEn:"At the Tomatina people threw tomatoes; at the Wine Battle in Haro, they threw wine.",exFr:"À la Tomatina, les gens lançaient des tomates ; à la Bataille du vin de Haro, ils lançaient du vin.",n:"語源ははっきりしない。「投げる」「捨てる」のほか、ドアに書かれたTirarは「引く」（Empujarは「押す」）。リオハ州アロではワインをかけ合う祭りが毎年6月に開かれる。"},
{w:"el nieto",p:"nm",en:"grandson, grandchild",fr:"le petit-fils",ex:"Mis abuelos tenían once nietos y se sabían el cumpleaños de todos.",exEn:"My grandparents had eleven grandchildren and knew everyone's birthday.",exFr:"Mes grands-parents avaient onze petits-enfants et connaissaient l'anniversaire de chacun.",n:"俗ラテン語neptus（孫）から。英nephew（甥）、仏neveuと同源だが、スペイン語では「孫」の意味になった。女性形はla nieta、複数のnietosは「孫たち」。"},
{w:"el sobrino",p:"nm",en:"nephew",fr:"le neveu",ex:"Mi sobrino de cinco años me preguntó si yo vivía en la época de los dinosaurios.",exEn:"My five-year-old nephew asked me if I lived in the time of the dinosaurs.",exFr:"Mon neveu de cinq ans m'a demandé si je vivais à l'époque des dinosaures.",n:"ラテン語sobrinus（母方のいとこ）から。英cousinの語源consobrinusと同じ仲間。女性形はla sobrina（姪）。"},
{w:"el jefe",p:"nm",en:"boss, chief",fr:"le chef, le patron",ex:"Mi jefe decía que la siesta era para los perezosos, pero lo vi dormido en su despacho.",exEn:"My boss used to say that the siesta was for lazy people, but I saw him asleep in his office.",exFr:"Mon patron disait que la sieste était pour les paresseux, mais je l'ai vu endormi dans son bureau.",n:"仏chefからの借用語で、ラテン語caput（頭）に遡る。英chief・chefと同源。女性形はla jefa。"},
{w:"el cocinero",p:"nm",en:"cook, chef",fr:"le cuisinier",ex:"El cocinero de El Bulli servía espuma de todo, y la gente esperaba un año para probarla.",exEn:"The chef at El Bulli served foam of everything, and people waited a year to taste it.",exFr:"Le cuisinier d'El Bulli servait de la mousse de tout, et les gens attendaient un an pour y goûter.",n:"cocina（台所）、cocinar（料理する）から。ラテン語coquere（煮る）に遡り、英cook・kitchen、仏cuisinierと同源。カタルーニャのEl Bulliは前衛料理で世界的に有名だった。"},
{w:"el dueño",p:"nm",en:"owner",fr:"le propriétaire",ex:"El dueño del bar conocía a todos los clientes y sabía qué tomaba cada uno.",exEn:"The owner of the bar knew all the customers and knew what each one drank.",exFr:"Le propriétaire du bar connaissait tous les clients et savait ce que chacun prenait.",n:"ラテン語dominus（主人）から。英dominate、仏dominerと同源。スペイン語の敬称don / doñaも同じ語から。女性形はla dueña。"},
{w:"el cliente",p:"nm",en:"customer, client",fr:"le client",ex:"En aquella tienda de Toledo, el cliente siempre tenía razón, excepto cuando hablaba de fútbol.",exEn:"In that shop in Toledo, the customer was always right, except when he talked about football.",exFr:"Dans cette boutique de Tolède, le client avait toujours raison, sauf quand il parlait de football.",n:"ラテン語cliens（庇護される人）から。英client、仏clientと同源。男女同形で、女性にはla clienteともla clientaとも言う。"},
{w:"la oficina",p:"nf",en:"office",fr:"le bureau",ex:"En verano la oficina cerraba a las tres porque en Sevilla por la tarde no se podía trabajar.",exEn:"In summer the office closed at three because in Seville you could not work in the afternoon.",exFr:"En été, le bureau fermait à trois heures parce qu'à Séville on ne pouvait pas travailler l'après-midi.",n:"ラテン語officina（作業場）から。英office、仏officine（薬局）と同源。スペインでは夏にjornada intensiva（午前集中勤務）を取る会社が多い。"},
{w:"la empresa",p:"nf",en:"company, business",fr:"l'entreprise",ex:"Zara empezó como una pequeña empresa de La Coruña y ahora tiene tiendas en todo el mundo.",exEn:"Zara started as a small company in A Coruña and now it has shops all over the world.",exFr:"Zara a commencé comme une petite entreprise de La Corogne et maintenant elle a des boutiques dans le monde entier.",n:"emprender（企てる）の過去分詞から。仏entrepriseと同じ組み立て（en＋prendre）。英enterpriseは仏語からの借用。"},
{w:"el hospital",p:"nm",en:"hospital",fr:"l'hôpital",ex:"El Hospital de los Reyes Católicos de Santiago es hoy un hotel de lujo.",exEn:"The Hospital of the Catholic Monarchs in Santiago is today a luxury hotel.",exFr:"L'Hôpital des Rois catholiques de Saint-Jacques est aujourd'hui un hôtel de luxe.",n:"ラテン語hospitalis（客を迎える）から。英hospital・hotel・host、仏hôpitalと同源。元は巡礼者を泊める施設で、サンティアゴのこの建物は巡礼者用の施設として建てられた。"},
{w:"la farmacia",p:"nf",en:"pharmacy, chemist's",fr:"la pharmacie",ex:"En España las farmacias tienen una cruz verde que se ve desde muy lejos.",exEn:"In Spain pharmacies have a green cross that you can see from very far away.",exFr:"En Espagne, les pharmacies ont une croix verte qu'on voit de très loin.",n:"ギリシャ語pharmakon（薬）から。英pharmacy、仏pharmacieと同源。スペイン語ではphをfと書く。夜間営業の当番薬局はfarmacia de guardiaと言う。"},
{w:"la biblioteca",p:"nf",en:"library",fr:"la bibliothèque",ex:"Íbamos a la biblioteca para estudiar, pero siempre acabábamos hablando en la cafetería.",exEn:"We went to the library to study, but we always ended up chatting in the cafeteria.",exFr:"Nous allions à la bibliothèque pour étudier, mais nous finissions toujours par bavarder à la cafétéria.",n:"ギリシャ語biblion（本）＋thēkē（箱、棚）から。仏bibliothèqueと同源。英libraryは「図書館」だが、スペイン語のlibreríaは「本屋」なので注意。"},
{w:"la universidad",p:"nf",en:"university",fr:"l'université",ex:"La Universidad de Salamanca se fundó en 1218; mi abuelo decía que él estudió allí el primer año.",exEn:"The University of Salamanca was founded in 1218; my grandfather used to say he studied there in the first year.",exFr:"L'université de Salamanque a été fondée en 1218 ; mon grand-père disait qu'il y avait étudié la première année.",n:"ラテン語universitas（全体、共同体）から。英university、仏universitéと同源。-dadで終わる名詞は女性名詞。サラマンカ大学はスペイン語圏で現存する最古の大学。"},
{w:"el castillo",p:"nm",en:"castle",fr:"le château",ex:"En Castilla hay tantos castillos que la región tomó su nombre de ellos.",exEn:"In Castile there are so many castles that the region took its name from them.",exFr:"En Castille, il y a tant de châteaux que la région a pris son nom d'eux.",n:"ラテン語castellum（小さな砦）から。英castle、仏châteauと同源。Castilla（カスティーリャ）の地名は「城の国」の意味とされる。"},
{w:"el puente",p:"nm",en:"bridge, long weekend",fr:"le pont",ex:"El jueves era fiesta, así que hicimos puente y nos fuimos cuatro días a la playa.",exEn:"Thursday was a holiday, so we took the Friday off too and went to the beach for four days.",exFr:"Jeudi était férié, alors nous avons fait le pont et nous sommes partis quatre jours à la plage.",n:"ラテン語pons, pontis（橋）から。英pontoon、仏pontと同源。祝日と週末の間の平日も休んで連休にすることをhacer puenteと言い、仏faire le pontとまったく同じ発想。"},
