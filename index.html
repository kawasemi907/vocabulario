{w:"la reina",p:"nf",en:"queen",fr:"la reine",ex:"La reina Isabel la Católica fue quien pagó el viaje de Colón en 1492.",exEn:"Queen Isabella the Catholic was the one who paid for Columbus's voyage in 1492.",exFr:"La reine Isabelle la Catholique est celle qui a payé le voyage de Colomb en 1492.",n:"ラテン語regina（女王）から。英regina、仏reineと同源。rey（王）の女性形。fue quien〜は「〜したのは…だった」という強調の関係詞構文。"},
{w:"el soldado",p:"nm",en:"soldier",fr:"le soldat",ex:"Los soldados de terracota que vimos en la exposición habían sido enterrados hacía más de dos mil años.",exEn:"The terracotta soldiers we saw at the exhibition had been buried more than two thousand years before.",exFr:"Les soldats en terre cuite que nous avons vus à l'exposition avaient été enterrés plus de deux mille ans auparavant.",n:"sueldo（給料、ラテン語solidus）と同じ語根で、「給料をもらって戦う者」。英soldier、仏soldatと同源。"},
{w:"el tesoro",p:"nm",en:"treasure",fr:"le trésor",ex:"Dicen que en el fondo del mar de Vigo todavía hay un tesoro que fue perdido en 1702.",exEn:"They say that at the bottom of the sea in Vigo there is still a treasure that was lost in 1702.",exFr:"On dit qu'au fond de la mer de Vigo, il y a encore un trésor perdu en 1702.",n:"ギリシャ語thēsauros（宝庫）から。英treasure・thesaurus、仏trésorと同源。1702年のビーゴ湾の海戦でスペインの宝船が沈んだという伝説がある。"},
{w:"el barco",p:"nm",en:"boat, ship",fr:"le bateau",ex:"El barco en el que viajó Colón se llamaba la Santa María y era más pequeño de lo que imaginamos.",exEn:"The ship Columbus traveled on was called the Santa María and was smaller than we imagine.",exFr:"Le bateau sur lequel Colomb a voyagé s'appelait la Santa María et était plus petit qu'on ne l'imagine.",n:"後期ラテン語barca（小舟）から。英bark（帆船）、仏barqueと同源。en el que は前置詞＋定冠詞＋que の関係詞。"},
{w:"la independencia",p:"nf",en:"independence",fr:"l'indépendance",ex:"Cuando México celebra su independencia, se grita ¡Viva México! en todas las plazas.",exEn:"When Mexico celebrates its independence, people shout Long live Mexico! in every square.",exFr:"Quand le Mexique fête son indépendance, on crie Vive le Mexique ! sur toutes les places.",n:"in-（否定）＋dependencia（依存）。英independence、仏indépendanceと同源。メキシコの独立記念日は9月16日で、前夜にGrito de Dolores が行われる。"},
{w:"la revolución",p:"nf",en:"revolution",fr:"la révolution",ex:"La revolución mexicana, que empezó en 1910, fue pintada por Diego Rivera en enormes murales.",exEn:"The Mexican Revolution, which began in 1910, was painted by Diego Rivera in huge murals.",exFr:"La révolution mexicaine, qui a commencé en 1910, a été peinte par Diego Rivera dans d'immenses fresques.",n:"ラテン語revolvere（回転させる）から。英revolution、仏révolutionと同源。ディエゴ・リベラはメキシコ壁画運動を代表する画家。"},
{w:"el periodista",p:"nm",en:"journalist",fr:"le journaliste",ex:"El periodista que escribió el artículo había pasado una semana entera en la Tomatina.",exEn:"The journalist who wrote the article had spent a whole week at the Tomatina.",exFr:"Le journaliste qui a écrit l'article avait passé une semaine entière à la Tomatina.",n:"periódico（新聞）から。-istaで終わる名詞は男女同形（el/la periodista）。仏journaliste はjournal（新聞）から。"},
{w:"la prensa",p:"nf",en:"press, newspapers",fr:"la presse",ex:"La noticia fue publicada por toda la prensa: un pulpo de Galicia había ganado un concurso de belleza.",exEn:"The news was published by all the press: an octopus from Galicia had won a beauty contest.",exFr:"La nouvelle a été publiée par toute la presse : un poulpe de Galice avait gagné un concours de beauté.",n:"prensar（押す）から、「印刷機」→「新聞・報道」となった。英press、仏presseと同源。rueda de prensaは「記者会見」。"},
{w:"la revista",p:"nf",en:"magazine",fr:"le magazine, la revue",ex:"En la peluquería de mi barrio, las revistas que se leen son de hace tres años.",exEn:"At the hairdresser's in my neighborhood, the magazines people read are from three years ago.",exFr:"Chez le coiffeur de mon quartier, les magazines qu'on lit datent d'il y a trois ans.",n:"revistar（見直す）から。英review、仏revueと同源。スペインの有名人のゴシップ誌はrevistas del corazón（心の雑誌）と呼ばれる。"},
{w:"el anuncio",p:"nm",en:"advertisement, announcement",fr:"la publicité, l'annonce",ex:"El anuncio de la lotería de Navidad, que se estrena cada noviembre, hace llorar a media España.",exEn:"The Christmas lottery advert, which premieres every November, makes half of Spain cry.",exFr:"La publicité de la loterie de Noël, qui sort chaque novembre, fait pleurer la moitié de l'Espagne.",n:"anunciar（知らせる）の名詞形。「広告」と「お知らせ」の両方の意味。スペインのクリスマス宝くじのCMは毎年感動的な内容で話題になる。"},
{w:"el programa",p:"nm",en:"program, show",fr:"le programme, l'émission",ex:"El programa de cocina que veía mi madre se emitía a la hora de comer, cuando todos teníamos hambre.",exEn:"The cooking show my mother watched was broadcast at lunchtime, when we were all hungry.",exFr:"L'émission de cuisine que regardait ma mère était diffusée à l'heure du déjeuner, quand nous avions tous faim.",n:"ギリシャ語programma（公示）から。英program、仏programmeと同源。-maで終わるが男性名詞（el programa）。テレビ番組もコンピュータのプログラムもprograma。"},
{w:"la televisión",p:"nf",en:"television",fr:"la télévision",ex:"En los años sesenta, el único televisor del pueblo estaba en el bar, donde se veían los partidos.",exEn:"In the sixties, the only television set in the village was in the bar, where the matches were watched.",exFr:"Dans les années soixante, le seul téléviseur du village était au bar, où l'on regardait les matchs.",n:"ギリシャ語tēle（遠く）＋visión（見ること）。英television、仏télévisionと同源。口語ではla tele。機械そのものはel televisor。"},
{w:"la radio",p:"nf",en:"radio",fr:"la radio",ex:"Mi abuelo escuchaba el fútbol en la radio mientras lo veía en la televisión sin sonido.",exEn:"My grandfather listened to football on the radio while he watched it on TV with the sound off.",exFr:"Mon grand-père écoutait le foot à la radio pendant qu'il le regardait à la télévision sans le son.",n:"radiotelefonía の短縮形で、-oで終わるが女性名詞（la radio）。ラテン語radius（光線）に遡る。中南米の一部ではel radio とも言う。スペインではラジオでサッカーを聞く人が今も多い。"},
{w:"el autor",p:"nm",en:"author",fr:"l'auteur",ex:"El autor del Lazarillo de Tormes es desconocido, porque el libro fue publicado sin nombre.",exEn:"The author of Lazarillo de Tormes is unknown, because the book was published without a name.",exFr:"L'auteur du Lazarillo de Tormes est inconnu, parce que le livre a été publié sans nom.",n:"ラテン語auctor（生み出す人）から。英author、仏auteurと同源。女性形はla autora。『ラサリーリョ・デ・トルメス』は16世紀の作者不明の小説。"},
{w:"el escritor",p:"nm",en:"writer",fr:"l'écrivain",ex:"Gabriel García Márquez fue un escritor cuyas novelas se han leído en todo el mundo.",exEn:"Gabriel García Márquez was a writer whose novels have been read all over the world.",exFr:"Gabriel García Márquez était un écrivain dont les romans ont été lus dans le monde entier.",n:"escribir（書く）から。-orで終わる名詞の女性形は-oraとなる（la escritora）。cuyas novelas は所有の関係詞。"},
{w:"el cantante",p:"nm",en:"singer",fr:"le chanteur",ex:"El cantante al que fuimos a ver en Madrid había cancelado el concierto tres veces.",exEn:"The singer we went to see in Madrid had cancelled the concert three times.",exFr:"Le chanteur que nous sommes allés voir à Madrid avait annulé le concert trois fois.",n:"cantar（歌う）の現在分詞から。-anteで終わる名詞は男女同形（el/la cantante）。al que は人を指す前置詞a＋関係詞。"},
{w:"el actor",p:"nm",en:"actor",fr:"l'acteur",ex:"El actor que hacía de Don Quijote se cayó del caballo, y el público pensó que era parte de la obra.",exEn:"The actor who played Don Quixote fell off the horse, and the audience thought it was part of the play.",exFr:"L'acteur qui jouait Don Quichotte est tombé du cheval, et le public a cru que ça faisait partie de la pièce.",n:"ラテン語actor（行う人）から。英actor、仏acteurと同源。女性形はla actriz。hacer de〜で「〜の役を演じる」。"},
{w:"el científico",p:"nm",en:"scientist",fr:"le scientifique",ex:"Santiago Ramón y Cajal fue el científico español que recibió el Premio Nobel en 1906.",exEn:"Santiago Ramón y Cajal was the Spanish scientist who received the Nobel Prize in 1906.",exFr:"Santiago Ramón y Cajal est le scientifique espagnol qui a reçu le prix Nobel en 1906.",n:"ciencia（科学、ラテン語scientia）から。英scientist、仏scientifiqueと同源。形容詞としても使う（un estudio científico）。ラモン・イ・カハールは神経科学の父とされる。"},
{w:"el ladrón",p:"nm",en:"thief",fr:"le voleur",ex:"El ladrón que entró en la tienda solo se llevó un jamón y dejó el dinero.",exEn:"The thief who broke into the shop only took a ham and left the money.",exFr:"Le voleur qui est entré dans la boutique n'a pris qu'un jambon et a laissé l'argent.",n:"ラテン語latro（盗賊）から。仏larron と同源。女性形はla ladrona。電気の「タコ足配線用の分岐プラグ」もladrónと呼ぶ。"},
{w:"el policía",p:"nm",en:"police officer",fr:"le policier",ex:"El policía que me paró en Sevilla solo quería saber dónde había comprado mi sombrero.",exEn:"The police officer who stopped me in Seville only wanted to know where I had bought my hat.",exFr:"Le policier qui m'a arrêté à Séville voulait seulement savoir où j'avais acheté mon chapeau.",n:"ギリシャ語politeia（国家運営）から。英police、仏policeと同源。el/la policía は「警察官」、la policía は「警察（組織）」の意味にもなる。"},
{w:"el vuelo",p:"nm",en:"flight",fr:"le vol",ex:"El vuelo a Buenos Aires, que había salido con dos horas de retraso, llegó a tiempo.",exEn:"The flight to Buenos Aires, which had left two hours late, arrived on time.",exFr:"Le vol pour Buenos Aires, qui était parti avec deux heures de retard, est arrivé à l'heure.",n:"volar（飛ぶ、ラテン語volare）から。仏volと同源。英volatile も同じ語根。"},
{w:"el pasajero",p:"nm",en:"passenger",fr:"le passager",ex:"Los pasajeros que viajen a Canarias deberán mostrar el DNI en la puerta de embarque.",exEn:"Passengers traveling to the Canaries will have to show their ID card at the boarding gate.",exFr:"Les passagers qui voyagent vers les Canaries devront montrer leur carte d'identité à la porte d'embarquement.",n:"pasaje（通行、乗船券）から。英passenger、仏passagerと同源。形容詞では「一時的な」の意味もある。DNIはスペインの身分証明書。"},
{w:"el metro",p:"nm",en:"metro, subway, meter",fr:"le métro, le mètre",ex:"El metro de Madrid, que fue inaugurado en 1919, tiene una estación que es también un museo.",exEn:"The Madrid metro, which was opened in 1919, has a station that is also a museum.",exFr:"Le métro de Madrid, qui a été inauguré en 1919, a une station qui est aussi un musée.",n:"「地下鉄」は仏métropolitain の短縮形。長さの「メートル」も同形のel metroで、ギリシャ語metron（尺度）に遡る。マドリードのChamberí駅は旧駅が博物館になっている。"},
{w:"el autobús",p:"nm",en:"bus",fr:"le bus, l'autobus",ex:"El autobús que va al aeropuerto ya habrá salido; cogeremos un taxi.",exEn:"The bus that goes to the airport will have left by now; we will take a taxi.",exFr:"Le bus qui va à l'aéroport sera déjà parti ; nous prendrons un taxi.",n:"auto-＋ómnibus（皆のための）の合成語。英bus、仏autobusと同源。複数形はautobuses。中南米では地域によりcamión、colectivo、guagua などと呼ぶ。"},
{w:"el taxi",p:"nm",en:"taxi",fr:"le taxi",ex:"El taxi que pedimos no llegó, así que al final fuimos andando y llegamos antes.",exEn:"The taxi we ordered did not arrive, so in the end we walked and got there sooner.",exFr:"Le taxi que nous avions commandé n'est pas arrivé, alors finalement nous y sommes allés à pied et nous sommes arrivés plus tôt.",n:"taxímetro（料金メーター）の短縮形で、ギリシャ語taxis（料金）に遡る。英taxi、仏taxiと同源。"},
{w:"la moto",p:"nf",en:"motorbike",fr:"la moto",ex:"En Barcelona las motos se aparcan en cualquier acera, y a veces parece que hay más motos que árboles.",exEn:"In Barcelona motorbikes are parked on any pavement, and sometimes it seems there are more motorbikes than trees.",exFr:"À Barcelone, les motos se garent sur n'importe quel trottoir, et parfois on dirait qu'il y a plus de motos que d'arbres.",n:"motocicleta の短縮形で、-oで終わるが女性名詞（la moto）。la foto と同じ。se aparcan は再帰受身。"},
{w:"la bandera",p:"nf",en:"flag",fr:"le drapeau",ex:"La bandera de México tiene un águila que se come una serpiente encima de un cactus.",exEn:"The Mexican flag has an eagle eating a snake on top of a cactus.",exFr:"Le drapeau du Mexique a un aigle qui mange un serpent sur un cactus.",n:"banda（帯、旗印）から。英banner と同源。メキシコ国旗の紋章は、アステカ人がテノチティトランを築いた場所の伝説に由来する。"},
{w:"el monumento",p:"nm",en:"monument",fr:"le monument",ex:"Uno de los monumentos más visitados de España es la Alhambra, que fue construida durante más de dos siglos.",exEn:"One of the most visited monuments in Spain is the Alhambra, which was built over more than two centuries.",exFr:"L'un des monuments les plus visités d'Espagne est l'Alhambra, qui a été construite pendant plus de deux siècles.",n:"ラテン語monumentum（思い出させるもの）から。英monument、仏monumentと同源。monere（思い出させる）が語根。"},
{w:"las ruinas",p:"nf pl",en:"ruins",fr:"les ruines",ex:"Las ruinas de Itálica, donde nació el emperador Trajano, están muy cerca de Sevilla.",exEn:"The ruins of Italica, where the emperor Trajan was born, are very close to Seville.",exFr:"Les ruines d'Italica, où est né l'empereur Trajan, sont tout près de Séville.",n:"ラテン語ruina（崩壊）から。英ruin、仏ruineと同源。遺跡の意味では複数形で使うことが多い。donde は場所を表す関係詞。"},
{w:"la catedral",p:"nf",en:"cathedral",fr:"la cathédrale",ex:"La catedral de Sevilla, que se construyó sobre una mezquita, conserva su antiguo minarete: la Giralda.",exEn:"Seville Cathedral, which was built on top of a mosque, keeps its old minaret: the Giralda.",exFr:"La cathédrale de Séville, qui a été construite sur une mosquée, conserve son ancien minaret : la Giralda.",n:"ギリシャ語kathedra（司教座）から。英cathedral、仏cathédraleと同源。ヒラルダの塔は元はモスクのミナレット（尖塔）だった。"},
{w:"el palacio",p:"nm",en:"palace",fr:"le palais",ex:"El Palacio Real de Madrid, en el que ya no vive el rey, tiene más de tres mil habitaciones.",exEn:"The Royal Palace of Madrid, where the king no longer lives, has more than three thousand rooms.",exFr:"Le Palais royal de Madrid, où le roi ne vit plus, compte plus de trois mille pièces.",n:"ローマのパラティヌス丘（Palatium）から。英palace、仏palaisと同源。スペイン国王は現在サルスエラ宮殿に住んでいる。"},
{w:"la pirámide",p:"nf",en:"pyramid",fr:"la pyramide",ex:"La pirámide de Chichén Itzá fue construida de forma que en primavera la sombra parece una serpiente.",exEn:"The pyramid at Chichén Itzá was built in such a way that in spring the shadow looks like a snake.",exFr:"La pyramide de Chichén Itzá a été construite de telle façon qu'au printemps l'ombre ressemble à un serpent.",n:"ギリシャ語pyramis から。英pyramid、仏pyramideと同源。チチェン・イッツァのピラミッドでは春分と秋分に蛇の影が現れる。"},
{w:"la lengua",p:"nf",en:"tongue, language",fr:"la langue",ex:"En España se hablan varias lenguas: el castellano, el catalán, el gallego y el euskera, cuyo origen es un misterio.",exEn:"Several languages are spoken in Spain: Castilian, Catalan, Galician and Basque, whose origin is a mystery.",exFr:"En Espagne, on parle plusieurs langues : le castillan, le catalan, le galicien et le basque, dont l'origine est un mystère.",n:"ラテン語lingua（舌、言語）から。英language・linguistics、仏langueと同源。「舌」と「言語」の両方の意味。バスク語（euskera）は系統不明の言語として有名。"},
{w:"la leyenda",p:"nf",en:"legend",fr:"la légende",ex:"Según la leyenda, el apóstol Santiago fue enterrado en Galicia, donde hoy está su catedral.",exEn:"According to legend, the apostle James was buried in Galicia, where his cathedral stands today.",exFr:"Selon la légende, l'apôtre Jacques a été enterré en Galice, là où se trouve aujourd'hui sa cathédrale.",n:"ラテン語legenda（読まれるべきもの）から。英legend、仏légendeと同源。サンティアゴ・デ・コンポステーラは聖ヤコブの墓の伝説から巡礼地になった。"},
{w:"histórico",p:"adj",en:"historic, historical",fr:"historique",ex:"El casco histórico de Toledo fue declarado Patrimonio de la Humanidad en 1986.",exEn:"The historic center of Toledo was declared a World Heritage Site in 1986.",exFr:"Le centre historique de Tolède a été déclaré patrimoine mondial en 1986.",n:"historia（歴史）から。英historic、仏historiqueと同源。casco histórico は「旧市街」。"},
{w:"conocido",p:"adj",en:"well-known",fr:"connu",ex:"El Camino de Santiago, que es conocido en todo el mundo, había sido casi olvidado hasta los años ochenta.",exEn:"The Camino de Santiago, which is known all over the world, had been almost forgotten until the eighties.",exFr:"Le Chemin de Saint-Jacques, qui est connu dans le monde entier, avait été presque oublié jusqu'aux années quatre-vingt.",n:"conocer（知る）の過去分詞。名詞で「知り合い」の意味にもなる（un conocido mío）。"},
{w:"desconocido",p:"adj",en:"unknown",fr:"inconnu",ex:"El pintor de este cuadro es desconocido, pero se sabe que fue pintado en Toledo.",exEn:"The painter of this picture is unknown, but it is known that it was painted in Toledo.",exFr:"Le peintre de ce tableau est inconnu, mais on sait qu'il a été peint à Tolède.",n:"des-＋conocido（知られた）。名詞で「見知らぬ人」の意味にもなる。se sabe que〜は無人称の「〜と知られている」。"},
{w:"enorme",p:"adj",en:"huge, enormous",fr:"énorme",ex:"Las esculturas de las Fallas son enormes, y todas se queman en una sola noche, excepto una.",exEn:"The Fallas sculptures are huge, and they are all burned in a single night, except one.",exFr:"Les sculptures des Fallas sont énormes, et elles sont toutes brûlées en une seule nuit, sauf une.",n:"ラテン語enormis（規格外の、e＋norma）から。英enormous、仏énormeと同源。ファジャスでは投票で選ばれた1体（ninot indultat）だけが燃やされずに残る。"},
{w:"pobre",p:"adj",en:"poor",fr:"pauvre",ex:"El pobre Lazarillo, que había servido a muchos amos, siempre tenía hambre.",exEn:"Poor Lazarillo, who had served many masters, was always hungry.",exFr:"Le pauvre Lazarillo, qui avait servi de nombreux maîtres, avait toujours faim.",n:"ラテン語pauper（貧しい）から。英poor・poverty、仏pauvreと同源。名詞の前では「かわいそうな」、後ろでは「貧しい」と意味が変わる（un hombre pobre / un pobre hombre）。"},
{w:"valiente",p:"adj",en:"brave",fr:"courageux",ex:"Mariana Pineda fue una mujer valiente que fue ejecutada en Granada por bordar una bandera.",exEn:"Mariana Pineda was a brave woman who was executed in Granada for embroidering a flag.",exFr:"Mariana Pineda était une femme courageuse qui a été exécutée à Grenade pour avoir brodé un drapeau.",n:"valer（価値がある、力がある）の現在分詞から。英valiant と同源。マリアナ・ピネダは19世紀の自由主義者で、グラナダの英雄とされる。"},
{w:"completo",p:"adj",en:"complete, full",fr:"complet",ex:"El hotel estaba completo, porque se habían reservado todas las habitaciones para la boda.",exEn:"The hotel was full, because all the rooms had been booked for the wedding.",exFr:"L'hôtel était complet, parce que toutes les chambres avaient été réservées pour le mariage.",n:"ラテン語completus（満たされた）から。英complete、仏completと同源。ホテルや交通機関の「満室・満席」はcompletoと表示される。"},
{w:"entero",p:"adj",en:"whole, entire",fr:"entier",ex:"Se comió un cochinillo entero él solo; cuando llegamos, ya no quedaba nada.",exEn:"He ate a whole suckling pig all by himself; when we arrived, there was nothing left.",exFr:"Il a mangé un cochon de lait entier à lui tout seul ; quand nous sommes arrivés, il ne restait plus rien.",n:"ラテン語integer（手つかずの）から。英entire・integer、仏entierと同源。el mundo entero（世界中）。"},
{w:"actual",p:"adj",en:"current, present-day",fr:"actuel",ex:"La actual Plaza Mayor de Madrid fue reconstruida después de un incendio en 1790.",exEn:"The present-day Plaza Mayor in Madrid was rebuilt after a fire in 1790.",exFr:"L'actuelle Plaza Mayor de Madrid a été reconstruite après un incendie en 1790.",n:"ラテン語actualis（実際の）から。英actual は「実際の」だが、スペイン語と仏actuelは「現在の」の意味なので注意（英actually ≠ actualmente）。"},
{w:"reciente",p:"adj",en:"recent",fr:"récent",ex:"Esta tortilla es muy reciente: la ha hecho mi madre hace diez minutos y ya ha desaparecido la mitad.",exEn:"This tortilla is very recent: my mother made it ten minutes ago and half of it has already disappeared.",exFr:"Cette tortilla est très récente : ma mère l'a faite il y a dix minutes et la moitié a déjà disparu.",n:"ラテン語recens（新しい）から。英recent、仏récentと同源。副詞はrecientemente、過去分詞の前ではrecién（recién llegado＝着いたばかり）。"},
{w:"principal",p:"adj",en:"main, principal",fr:"principal",ex:"La calle principal del pueblo, donde se celebra el mercado, fue cerrada a los coches.",exEn:"The main street of the village, where the market is held, was closed to cars.",exFr:"La rue principale du village, où se tient le marché, a été fermée aux voitures.",n:"ラテン語principalis（第一の）から。英principal、仏principalと同源。スペインの建物では、1階と2階の間の階をprincipalと呼ぶことがある。"},
{w:"verdadero",p:"adj",en:"true, real",fr:"vrai, véritable",ex:"El verdadero nombre de El Greco era Doménikos, y había nacido en Creta.",exEn:"El Greco's real name was Doménikos, and he had been born in Crete.",exFr:"Le vrai nom du Greco était Doménikos, et il était né en Crète.",n:"verdad（真実）から。英very（元は「本当の」）と遠い親戚。名詞の前に置くと「本物の、まさに」の意味が強まる。エル・グレコ（ギリシャ人）はクレタ島生まれの画家。"},
{w:"increíble",p:"adj",en:"incredible, amazing",fr:"incroyable",ex:"Es increíble que la Sagrada Familia se haya empezado a construir en 1882 y todavía no esté terminada.",exEn:"It is incredible that the Sagrada Familia began to be built in 1882 and is still not finished.",exFr:"C'est incroyable que la Sagrada Família ait commencé à être construite en 1882 et ne soit toujours pas terminée.",n:"in-（否定）＋creíble（信じられる、creer から）。英incredible、仏incroyableと同源。es increíble que＋接続法。"},
{w:"oficial",p:"adj",en:"official",fr:"officiel",ex:"El castellano es la lengua oficial de España, pero en Cataluña el catalán también es oficial.",exEn:"Castilian is the official language of Spain, but in Catalonia Catalan is also official.",exFr:"Le castillan est la langue officielle de l'Espagne, mais en Catalogne, le catalan est aussi officiel.",n:"oficio（職務、ラテン語officium）から。英official、仏officielと同源。名詞で「将校」の意味にもなる。"},
{w:"internacional",p:"adj",en:"international",fr:"international",ex:"El Festival Internacional de Cine de San Sebastián, que se celebra en septiembre, fue fundado en 1953.",exEn:"The San Sebastián International Film Festival, which is held in September, was founded in 1953.",exFr:"Le Festival international du film de Saint-Sébastien, qui a lieu en septembre, a été fondé en 1953.",n:"inter-（間の）＋nacional（国の）。英international、仏internationalと同源。男女同形。"},
{w:"grave",p:"adj",en:"serious, grave",fr:"grave",ex:"No es grave: solo se te ha caído el helado, y la heladería todavía no habrá cerrado.",exEn:"It is not serious: you have only dropped your ice cream, and the ice cream shop will not have closed yet.",exFr:"Ce n'est pas grave : tu as seulement fait tomber ta glace, et le glacier ne sera pas encore fermé.",n:"ラテン語gravis（重い）から。英grave・gravity、仏graveと同源。No es grave.（大したことない）は仏Ce n'est pas grave と同じ。"},
{w:"cuyo",p:"pron",en:"whose",fr:"dont",ex:"Visitamos un pueblo cuyos habitantes hablan con silbidos, como en La Gomera.",exEn:"We visited a village whose inhabitants talk by whistling, as on La Gomera.",exFr:"Nous avons visité un village dont les habitants parlent en sifflant, comme à La Gomera.",n:"ラテン語cuius（誰の）から。所有を表す関係形容詞で、後ろの名詞の性数に合わせる（cuyo, cuya, cuyos, cuyas）。書き言葉的で、会話ではあまり使わない。"},
{w:"donde",p:"adv",en:"where (relative)",fr:"où",ex:"Esta es la plaza donde se rodó una escena de la película, y donde mi abuela conoció a mi abuelo.",exEn:"This is the square where a scene from the film was shot, and where my grandmother met my grandfather.",exFr:"C'est la place où une scène du film a été tournée, et où ma grand-mère a rencontré mon grand-père.",n:"ラテン語de unde（どこから）から。関係詞のdondeはアクセント記号なし、疑問詞のdóndeはアクセント記号ありで区別する。"},
{w:"quien",p:"pron",en:"who (relative)",fr:"qui",ex:"Mi tía, quien había vivido en México, nos enseñó a hacer tacos de verdad.",exEn:"My aunt, who had lived in Mexico, taught us how to make real tacos.",exFr:"Ma tante, qui avait vécu au Mexique, nous a appris à faire de vrais tacos.",n:"ラテン語quem（誰を）から。人を指す関係代名詞で、アクセント記号なし（疑問詞はquién）。複数形はquienes。quien＋動詞で「〜する人は」（Quien mucho abarca, poco aprieta）。"},
{w:"lo que",p:"pron",en:"what, which",fr:"ce que",ex:"Lo que más me gustó de Sevilla fue lo que no había visto en ninguna guía: sus patios.",exEn:"What I liked most about Seville was what I had not seen in any guidebook: its patios.",exFr:"Ce qui m'a le plus plu à Séville, c'est ce que je n'avais vu dans aucun guide : ses patios.",n:"中性の定冠詞lo＋que で「〜すること・もの」。英what、仏ce que / ce qui に当たる。前の文全体を受けて「そのこと」を表すこともある。"},
{w:"jamás",p:"adv",en:"never, ever",fr:"jamais",ex:"Jamás había visto tanta gente en una plaza como en la Nochevieja de la Puerta del Sol.",exEn:"I had never seen so many people in a square as on New Year's Eve at the Puerta del Sol.",exFr:"Je n'avais jamais vu autant de monde sur une place qu'au réveillon de la Puerta del Sol.",n:"ラテン語iam magis（もはやこれ以上）から。仏jamais と同源。nunca より強い否定。nunca jamás（絶対に〜ない）と重ねても使う。"},
{w:"apenas",p:"adv",en:"hardly, barely",fr:"à peine",ex:"Apenas habíamos llegado a la playa cuando empezó a llover.",exEn:"We had barely arrived at the beach when it started to rain.",exFr:"Nous étions à peine arrivés à la plage qu'il a commencé à pleuvoir.",n:"a＋penas（苦労して）から。仏à peine とまったく同じ組み立て。「ほとんど〜ない」「〜するやいなや」の意味。"},
{w:"tras",p:"prep",en:"after, behind",fr:"après, derrière",ex:"Tras la reconquista de Granada en 1492, Colón fue recibido por los Reyes Católicos.",exEn:"After the reconquest of Granada in 1492, Columbus was received by the Catholic Monarchs.",exFr:"Après la reconquête de Grenade en 1492, Colomb a été reçu par les Rois catholiques.",n:"ラテン語trans（向こう側に）から。después de（〜の後で）、detrás de（〜の後ろに）の書き言葉的な言い方。新聞やニュースでよく使う。"},
{w:"a partir de",p:"loc",en:"from, starting from",fr:"à partir de",ex:"A partir de las diez, los bares se llenan; antes solo encontrarás turistas.",exEn:"From ten o'clock onwards, the bars fill up; before that you will only find tourists.",exFr:"À partir de dix heures, les bars se remplissent ; avant, tu ne trouveras que des touristes.",n:"partir（出発する）を使った表現で、仏à partir de とまったく同じ組み立て。時間・場所・数量の起点を表す。"},
{w:"a través de",p:"loc",en:"through, across",fr:"à travers",ex:"La luz entra a través de las vidrieras de la catedral de León, que fueron hechas en la Edad Media.",exEn:"The light comes in through the stained-glass windows of León Cathedral, which were made in the Middle Ages.",exFr:"La lumière entre à travers les vitraux de la cathédrale de León, qui ont été faits au Moyen Âge.",n:"través（横切ること）を使った表現で、仏à travers と同じ組み立て。「〜を通して」は手段の意味にも使う（a través de un amigo）。レオン大聖堂はステンドグラスで有名。"},
{w:"alrededor de",p:"loc",en:"around, about",fr:"autour de, environ",ex:"Alrededor de la plaza había terrazas donde se servía chocolate con churros.",exEn:"Around the square there were terraces where hot chocolate with churros was served.",exFr:"Autour de la place, il y avait des terrasses où l'on servait du chocolat avec des churros.",n:"古スペイン語al redor（周りに）から。場所の「〜の周りに」と、数量の「約〜」の両方に使う（alrededor de cien personas）。"},
{w:"a principios de",p:"loc",en:"at the beginning of",fr:"au début de",ex:"A principios de febrero ya habrán empezado los carnavales en muchos pueblos de Cádiz.",exEn:"By early February the carnivals will already have started in many towns in Cádiz.",exFr:"Début février, les carnavals auront déjà commencé dans beaucoup de villages de Cadix.",n:"principio（始まり）の複数形を使った表現。a mediados de（〜の中ごろに）、a finales de（〜の終わりに）とセットで覚える。"},
{w:"a finales de",p:"loc",en:"at the end of",fr:"à la fin de",ex:"A finales de agosto, cuando hayamos vuelto de la playa, pintaremos la casa.",exEn:"At the end of August, when we have come back from the beach, we will paint the house.",exFr:"Fin août, quand nous serons rentrés de la plage, nous repeindrons la maison.",n:"final（終わり）の複数形を使った表現。a fines de とも言う。cuando＋接続法現在完了（hayamos vuelto）は未来に完了していることを表す。"}
]},
  {id:10, title:"Nivel 10", range:"901–1000", words:[
{w:"alcanzar",p:"v",en:"to reach, to catch up with",fr:"atteindre, rattraper",ex:"Cuando alcanzamos la cima del Mulhacén, los demás ya se habían comido todos los bocadillos.",exEn:"When we reached the top of Mulhacén, the others had already eaten all the sandwiches.",exFr:"Quand nous avons atteint le sommet du Mulhacén, les autres avaient déjà mangé tous les sandwichs.",n:"俗ラテン語incalciare（かかとを追う）から来たとされる。「届く・追いつく・達成する」の意味。点過去1人称はalcancé（z→c）。ムラセン山はイベリア半島の最高峰。"},
{w:"apoyar",p:"v",en:"to support, to lean",fr:"soutenir, appuyer",ex:"Mis padres, que siempre me habían apoyado, no entendieron por qué quería estudiar flamenco en Jerez.",exEn:"My parents, who had always supported me, did not understand why I wanted to study flamenco in Jerez.",exFr:"Mes parents, qui m'avaient toujours soutenu, n'ont pas compris pourquoi je voulais étudier le flamenco à Jerez.",n:"イタリア語appoggiare（寄りかからせる）からとされる。仏appuyerと同源。物理的に「もたせかける」と精神的に「支える」の両方の意味。"},
{w:"colocar",p:"v",en:"to place, to put",fr:"placer, poser",ex:"El belén fue colocado en la plaza, y alguien había escondido un caganer detrás del establo.",exEn:"The nativity scene was placed in the square, and someone had hidden a caganer behind the stable.",exFr:"La crèche a été installée sur la place, et quelqu'un avait caché un caganer derrière l'étable.",n:"ラテン語collocare（並べて置く）から。仏coucher と同源。接続法ではc→qu（coloque）。カタルーニャの馬小屋の模型にはしゃがんで用を足す人形caganerを隠す伝統がある。"},
{w:"comunicar",p:"v",en:"to communicate, to be engaged (phone)",fr:"communiquer",ex:"Llamé a la pizzería diez veces, pero siempre comunicaba; al final, hicimos una tortilla.",exEn:"I called the pizzeria ten times, but it was always engaged; in the end, we made a tortilla.",exFr:"J'ai appelé la pizzeria dix fois, mais c'était toujours occupé ; finalement, nous avons fait une tortilla.",n:"ラテン語communicare（共有する）から。英communicate、仏communiquerと同源。スペインでは電話が「話し中である」の意味にも使う（está comunicando）。"},
{w:"corregir",p:"v",en:"to correct",fr:"corriger",ex:"Mi profesora de Salamanca me corregía cada error, incluso los que yo ya había corregido.",exEn:"My teacher in Salamanca corrected every mistake of mine, even the ones I had already corrected.",exFr:"Ma professeure de Salamanque corrigeait chaque erreur, même celles que j'avais déjà corrigées.",n:"ラテン語corrigere（まっすぐにする）から。英correct、仏corrigerと同源。e→i変化で、1人称現在はcorrijo（g→j）。"},
{w:"cubrir",p:"v",en:"to cover",fr:"couvrir",ex:"Por la mañana, las calles de Pamplona habían sido cubiertas de arena para el encierro.",exEn:"In the morning, the streets of Pamplona had been covered with sand for the bull run.",exFr:"Le matin, les rues de Pampelune avaient été couvertes de sable pour l'encierro.",n:"ラテン語cooperire（覆う）から。英cover、仏couvrirと同源。過去分詞は不規則でcubierto。descubrir（発見する）の元の動詞。"},
{w:"disfrutar",p:"v",en:"to enjoy",fr:"profiter, apprécier",ex:"Disfruta de la sobremesa: en España nadie se levanta de la mesa hasta que se ha terminado el café.",exEn:"Enjoy the after-dinner chat: in Spain nobody gets up from the table until the coffee has been finished.",exFr:"Profite de la sobremesa : en Espagne, personne ne se lève de table tant que le café n'est pas terminé.",n:"fruto（果実）から作られた語で、「実りを味わう」が原義とされる。英fruit と同源。disfrutar de〜で「〜を楽しむ」。スペイン語の会話で非常によく使う。"},
{w:"enamorarse",p:"v refl",en:"to fall in love",fr:"tomber amoureux",ex:"Mi abuelo se enamoró de mi abuela en una verbena, mientras sonaba un pasodoble.",exEn:"My grandfather fell in love with my grandmother at a street party, while a pasodoble was playing.",exFr:"Mon grand-père est tombé amoureux de ma grand-mère lors d'une fête de quartier, pendant qu'un paso doble jouait.",n:"en-＋amor（愛）から「愛の中に入る」。enamorarse de〜で「〜に恋をする」（前置詞deに注意）。pasodobleはスペインの伝統的なダンス音楽。"},
{w:"engordar",p:"v",en:"to put on weight",fr:"grossir",ex:"Cuando termine la Navidad, habré engordado tres kilos por culpa del turrón.",exEn:"By the time Christmas is over, I will have put on three kilos because of the turrón.",exFr:"Quand Noël sera fini, j'aurai pris trois kilos à cause du touron.",n:"gordo（太った）から作られた動詞。反対語はadelgazar。未来完了（habré engordado）で未来のある時点までに完了していることを表す。"},
{w:"adelgazar",p:"v",en:"to lose weight",fr:"maigrir",ex:"Dicen que caminando el Camino de Santiago se adelgaza, pero con tanto pulpo es imposible.",exEn:"They say you lose weight walking the Camino de Santiago, but with so much octopus it is impossible.",exFr:"On dit qu'on maigrit en faisant le Chemin de Saint-Jacques, mais avec tant de poulpe, c'est impossible.",n:"delgado（やせた）から作られた動詞。点過去1人称はadelgacé（z→c）。se adelgaza は無人称のse（人は一般に〜）。"},
{w:"envolver",p:"v",en:"to wrap",fr:"envelopper, emballer",ex:"¿Quiere que se lo envuelva para regalo? —Sí, y que no se vea que es un jamón.",exEn:"Would you like me to gift-wrap it for you? — Yes, and make sure it cannot be seen that it is a ham.",exFr:"Vous voulez que je vous fasse un paquet cadeau ? — Oui, et qu'on ne voie pas que c'est un jambon.",n:"ラテン語involvere（包む）から。英involve と同源。o→ue変化（envuelvo）、過去分詞はenvuelto。お店で¿Es para regalo?（プレゼント用ですか）と聞かれる。"},
{w:"exigir",p:"v",en:"to demand, to require",fr:"exiger",ex:"Mi abuela exige que la paella se coma en la paellera, directamente, con cuchara de madera.",exEn:"My grandmother insists that paella be eaten straight from the pan, with a wooden spoon.",exFr:"Ma grand-mère exige que la paella se mange directement dans la poêle, avec une cuillère en bois.",n:"ラテン語exigere（取り立てる）から。英exigent、仏exigerと同源。1人称現在はexijo（g→j）。exigir que＋接続法。バレンシアではパエリアを鍋から直接食べる習慣もある。"},
{w:"fijarse",p:"v refl",en:"to notice, to pay attention",fr:"remarquer, faire attention",ex:"Fíjate en los azulejos de esta estación; fueron pintados a mano hace cien años.",exEn:"Look closely at the tiles in this station; they were hand-painted a hundred years ago.",exFr:"Regarde bien les azulejos de cette gare ; ils ont été peints à la main il y a cent ans.",n:"fijo（固定した、ラテン語fixus）から「視線を固定する」。英fix と同源。fijarse en〜で「〜に注目する」。¡Fíjate!は「ほら、見て／考えてもみて」。"},
{w:"hundirse",p:"v refl",en:"to sink, to collapse",fr:"couler, s'effondrer",ex:"El galeón que se hundió cerca de Cádiz fue encontrado por unos buzos que buscaban otra cosa.",exEn:"The galleon that sank near Cádiz was found by some divers who were looking for something else.",exFr:"Le galion qui avait coulé près de Cadix a été retrouvé par des plongeurs qui cherchaient autre chose.",n:"ラテン語fundere（注ぐ、倒す）から来たとされる。語頭のラテン語f-がスペイン語でh-になった例（facere→hacer）。「沈む」「崩れる」「落ち込む」の意味。"},
{w:"juntar",p:"v",en:"to put together, to gather",fr:"réunir, rassembler",ex:"En Navidad se juntan todos los primos, y la casa, que había estado tan tranquila, se convierte en un mercado.",exEn:"At Christmas all the cousins get together, and the house, which had been so quiet, turns into a market.",exFr:"À Noël, tous les cousins se réunissent, et la maison, qui avait été si calme, devient un marché.",n:"junto（一緒の）から作られた動詞。英join と同源。juntarse で「集まる」。"},
{w:"matar",p:"v",en:"to kill",fr:"tuer",ex:"En muchos pueblos, la matanza del cerdo se hacía en noviembre, y era una fiesta para toda la familia.",exEn:"In many villages, the pig slaughter was done in November, and it was a celebration for the whole family.",exFr:"Dans beaucoup de villages, on tuait le cochon en novembre, et c'était une fête pour toute la famille.",n:"語源ははっきりしない。matarse で「死ぬ思いで〜する」の比喩にも使う（me mato a estudiar）。matanzaは冬に家族で豚をさばいて腸詰めなどを作る伝統行事。"},
{w:"meter",p:"v",en:"to put in, to insert",fr:"mettre, introduire",ex:"Mete las croquetas en el horno, que los invitados habrán llegado antes de las diez.",exEn:"Put the croquettes in the oven, because the guests will have arrived before ten.",exFr:"Mets les croquettes au four, les invités seront arrivés avant dix heures.",n:"ラテン語mittere（送る）から。仏mettre と同源。「中に入れる」の意味。meter un gol（ゴールを決める）、meterse en〜（〜に首を突っ込む）。"},
{w:"ocupar",p:"v",en:"to occupy, to take up",fr:"occuper",ex:"Las toallas de los turistas ya habían ocupado las mejores hamacas antes de las siete.",exEn:"The tourists' towels had already taken the best sunbeds before seven.",exFr:"Les serviettes des touristes avaient déjà occupé les meilleurs transats avant sept heures.",n:"ラテン語occupare（占める）から。英occupy、仏occuperと同源。ocuparse de〜で「〜を担当する」。朝早くタオルで場所取りをするのはヨーロッパのリゾートの定番ジョーク。"},
{w:"pegar",p:"v",en:"to stick, to hit",fr:"coller, frapper",ex:"Pega las fotos del viaje en el álbum antes de que se pierdan en el móvil.",exEn:"Stick the photos from the trip in the album before they get lost on your phone.",exFr:"Colle les photos du voyage dans l'album avant qu'elles se perdent dans le portable.",n:"ラテン語picare（松やにを塗る）から。「貼る」「殴る」「（病気を）うつす」などの意味がある。接続法ではg→gu（pegue）。"},
{w:"pesar",p:"v",en:"to weigh",fr:"peser",ex:"La maleta pesaba tanto que en el aeropuerto pensaron que había metido a mi abuela dentro.",exEn:"The suitcase weighed so much that at the airport they thought I had put my grandmother inside.",exFr:"La valise pesait tellement qu'à l'aéroport, ils ont pensé que j'avais mis ma grand-mère dedans.",n:"ラテン語pensare（重さを量る）から。英pensive、仏peserと同源。pensar（考える）も同じ語から分かれた。a pesar de（〜にもかかわらず）も同じ語根。"},
{w:"proponer",p:"v",en:"to propose, to suggest",fr:"proposer",ex:"Te propongo que vayamos a Asturias en septiembre, cuando ya se hayan ido los turistas.",exEn:"I suggest we go to Asturias in September, when the tourists have already left.",exFr:"Je te propose qu'on aille dans les Asturies en septembre, quand les touristes seront déjà partis.",n:"pro-＋poner（置く）から。英propose、仏proposerと同源。poner と同じ不規則活用（propongo, propuse）。proponer que＋接続法。"},
{w:"quemar",p:"v",en:"to burn",fr:"brûler",ex:"En la noche de San Juan se queman muebles viejos en la playa, y con ellos, los malos recuerdos.",exEn:"On the night of San Juan, old furniture is burned on the beach, and with it, bad memories.",exFr:"La nuit de la Saint-Jean, on brûle de vieux meubles sur la plage, et avec eux, les mauvais souvenirs.",n:"ラテン語cremare（燃やす）から来たとされ、英cremate と同源。quemarse は「やけどする・日焼けする」。se queman は再帰受身。"},
{w:"rodear",p:"v",en:"to surround",fr:"entourer",ex:"Toledo está rodeada por el río Tajo, que la protegió durante siglos.",exEn:"Toledo is surrounded by the Tagus River, which protected it for centuries.",exFr:"Tolède est entourée par le Tage, qui l'a protégée pendant des siècles.",n:"rueda（車輪、ラテン語rota）から「周りを回る」。英rotate と同源。トレドは三方をタホ川に囲まれた天然の要塞。"},
{w:"saltar",p:"v",en:"to jump",fr:"sauter",ex:"En Castrillo de Murcia, un hombre disfrazado de diablo salta por encima de los bebés que han nacido ese año.",exEn:"In Castrillo de Murcia, a man dressed as the devil jumps over the babies born that year.",exFr:"À Castrillo de Murcia, un homme déguisé en diable saute par-dessus les bébés nés dans l'année.",n:"ラテン語saltare（跳ね回る）から。英somersault、仏sauterと同源。ブルゴス県のカストリーリョ・デ・ムルシアでは、悪魔に扮した男が赤ちゃんを跳び越える祭り（El Colacho）が行われる。"},
{w:"soportar",p:"v",en:"to stand, to bear",fr:"supporter",ex:"No soporto el calor de Sevilla en agosto, pero tampoco soporto estar lejos de ella.",exEn:"I cannot stand the heat of Seville in August, but I cannot stand being far from it either.",exFr:"Je ne supporte pas la chaleur de Séville en août, mais je ne supporte pas non plus d'être loin d'elle.",n:"ラテン語supportare（下から運ぶ）から。英support、仏supporterと同源だが、スペイン語では「我慢する・耐える」の意味が中心（英support＝「支える」はapoyar）。"},
{w:"unir",p:"v",en:"to join, to unite",fr:"unir, relier",ex:"El puente que une las dos orillas de la ría de Bilbao fue construido en 1893 y todavía funciona.",exEn:"The bridge that joins the two banks of the Bilbao estuary was built in 1893 and still works.",exFr:"Le pont qui relie les deux rives de la ría de Bilbao a été construit en 1893 et fonctionne encore.",n:"ラテン語unire（一つにする）から。英unite、仏unirと同源。ビルバオ近郊のビスカヤ橋（1893年）は現役の運搬橋で世界遺産。"},
{w:"vencer",p:"v",en:"to defeat, to win, to expire",fr:"vaincre, expirer",ex:"El pasaporte había vencido la semana anterior, y no me dejaron subir al avión.",exEn:"My passport had expired the week before, and they did not let me board the plane.",exFr:"Mon passeport avait expiré la semaine précédente, et on ne m'a pas laissé monter dans l'avion.",n:"ラテン語vincere（勝つ）から。英victory・convince、仏vaincreと同源。「打ち負かす」のほか、書類の「期限が切れる」の意味にもなる。1人称現在はvenzo。"},
{w:"vigilar",p:"v",en:"to watch, to keep an eye on",fr:"surveiller",ex:"Vigila la paella mientras voy a por el vino, y no dejes que nadie la toque.",exEn:"Keep an eye on the paella while I go and get the wine, and do not let anyone touch it.",exFr:"Surveille la paella pendant que je vais chercher le vin, et ne laisse personne y toucher.",n:"ラテン語vigilare（目を覚ましている）から。英vigilant、仏veillerと同源。"},
{w:"votar",p:"v",en:"to vote",fr:"voter",ex:"En la plaza del pueblo se votó dónde se celebraría la fiesta, y ganó el bar.",exEn:"In the village square they voted on where the party would be held, and the bar won.",exFr:"Sur la place du village, on a voté pour savoir où aurait lieu la fête, et c'est le bar qui a gagné.",n:"ラテン語votum（誓い、願い）から。英vote、仏voterと同源。boda（結婚式）も同じvotum から生まれた語。"},
{w:"atender",p:"v",en:"to attend to, to serve",fr:"s'occuper de, servir",ex:"En aquella tienda nos atendió una señora que había trabajado allí cuarenta años.",exEn:"In that shop we were served by a lady who had worked there for forty years.",exFr:"Dans cette boutique, nous avons été servis par une dame qui y avait travaillé quarante ans.",n:"ラテン語attendere（注意を向ける）から。英attend、仏attendre（待つ）と同源だが意味がずれている。スペイン語では「応対する・世話をする」。e→ie変化（atiendo）。"},
{w:"brillar",p:"v",en:"to shine",fr:"briller",ex:"Las estrellas brillaban tanto en el desierto de Atacama que parecía que se podían tocar.",exEn:"The stars shone so brightly in the Atacama Desert that it seemed you could touch them.",exFr:"Les étoiles brillaient tellement dans le désert d'Atacama qu'on avait l'impression de pouvoir les toucher.",n:"イタリア語brillare から入ったとされる。英brilliant、仏brillerと同源。チリのアタカマ砂漠は世界有数の天体観測地。"},
{w:"cazar",p:"v",en:"to hunt, to catch",fr:"chasser",ex:"Mi gato cazó un ratón y nos lo dejó en la cama: para él, era un regalo.",exEn:"My cat caught a mouse and left it on our bed: for him, it was a present.",exFr:"Mon chat a attrapé une souris et nous l'a laissée sur le lit : pour lui, c'était un cadeau.",n:"俗ラテン語captiare（捕まえる）から。英chase・catch、仏chasserと同源。点過去1人称はcacé（z→c）。「狩りをする」のほか、口語で「（意味を）つかむ」の意味にもなる。"},
{w:"pescar",p:"v",en:"to fish, to catch",fr:"pêcher",ex:"El pescado que se sirve en este chiringuito ha sido pescado esta misma mañana.",exEn:"The fish served at this beach bar was caught this very morning.",exFr:"Le poisson servi dans ce chiringuito a été pêché ce matin même.",n:"ラテン語piscari（魚を捕る）から。仏pêcher と同源。生きた魚はel pez、食材としての魚はel pescado（pescarの過去分詞）と区別する。"},
{w:"recorrer",p:"v",en:"to travel around, to cover",fr:"parcourir",ex:"En un mes recorrimos toda la costa de Galicia, y no vimos el sol ni una vez.",exEn:"In a month we traveled the whole coast of Galicia, and we did not see the sun once.",exFr:"En un mois, nous avons parcouru toute la côte de Galice, et nous n'avons pas vu le soleil une seule fois.",n:"re-＋correr（走る）から。仏parcourir と意味が同じ。「〜を巡る・踏破する」。名詞el recorrido（道のり、ルート）。"},
{w:"la vista",p:"nf",en:"view, sight",fr:"la vue",ex:"La habitación desde la que se ve la Alhambra fue reservada por mi padre hace un año.",exEn:"The room from which you can see the Alhambra was booked by my father a year ago.",exFr:"La chambre d'où l'on voit l'Alhambra a été réservée par mon père il y a un an.",n:"ver（見る）の過去分詞の女性形から。英view・vista、仏vueと同源。「視力」の意味もある。¡Hasta la vista!（またね）。"},
{w:"el balcón",p:"nm",en:"balcony",fr:"le balcon",ex:"Desde el balcón de mi abuela, que da a la plaza, se veía pasar la procesión.",exEn:"From my grandmother's balcony, which looks onto the square, you could see the procession go by.",exFr:"Depuis le balcon de ma grand-mère, qui donne sur la place, on voyait passer la procession.",n:"イタリア語balcone から。英balcony、仏balconと同源。dar a〜で「〜に面している」。"},
{w:"el salón",p:"nm",en:"living room, hall",fr:"le salon",ex:"En el salón de mis abuelos había un sofá de plástico que nadie había usado nunca.",exEn:"In my grandparents' living room there was a plastic-covered sofa that nobody had ever used.",exFr:"Dans le salon de mes grands-parents, il y avait un canapé sous plastique que personne n'avait jamais utilisé.",n:"イタリア語salone（大広間）から。英salon、仏salonと同源。家の「居間」のほか「会場」の意味もある。"},
{w:"el dormitorio",p:"nm",en:"bedroom",fr:"la chambre",ex:"El dormitorio que nos habían dado tenía una ventana a un patio lleno de ropa tendida.",exEn:"The bedroom they had given us had a window onto a courtyard full of hanging laundry.",exFr:"La chambre qu'on nous avait donnée avait une fenêtre sur une cour pleine de linge étendu.",n:"dormir（眠る）から。英dormitory、仏dortoirと同源。habitación、cuarto も「部屋」の意味でよく使う。"},
{w:"la nevera",p:"nf",en:"fridge",fr:"le réfrigérateur, le frigo",ex:"Cuando volvimos de vacaciones, la nevera se había estropeado y el queso había tomado vida propia.",exEn:"When we came back from holiday, the fridge had broken down and the cheese had taken on a life of its own.",exFr:"Quand nous sommes rentrés de vacances, le frigo était tombé en panne et le fromage avait pris vie.",n:"nieve（雪）から、元は「雪を貯めておく所」。el frigorífico とも言い、中南米ではrefrigerador やheladera が一般的。"},
{w:"el horno",p:"nm",en:"oven",fr:"le four",ex:"El cordero asado de Segovia se hace en un horno de leña que fue construido hace siglos.",exEn:"Segovia's roast lamb is made in a wood-fired oven that was built centuries ago.",exFr:"L'agneau rôti de Ségovie se prépare dans un four à bois qui a été construit il y a des siècles.",n:"ラテン語furnus（かまど）から。仏four と同源。語頭のラテン語f-がh-になった例。no está el horno para bollos（今はそれどころではない）という慣用句もある。"},
{w:"la lavadora",p:"nf",en:"washing machine",fr:"la machine à laver",ex:"Pon la lavadora por la noche, cuando la luz es más barata.",exEn:"Run the washing machine at night, when electricity is cheaper.",exFr:"Lance la machine à laver le soir, quand l'électricité est moins chère.",n:"lavar（洗う）から。-doraは「〜する機械」を表す（secadora＝乾燥機、aspiradora＝掃除機）。poner la lavadora（洗濯機を回す）。"},
{w:"el techo",p:"nm",en:"ceiling, roof",fr:"le plafond, le toit",ex:"El techo de la Sala de los Abencerrajes fue decorado con miles de pequeñas piezas que parecen estrellas.",exEn:"The ceiling of the Hall of the Abencerrajes was decorated with thousands of small pieces that look like stars.",exFr:"Le plafond de la salle des Abencérages a été décoré de milliers de petites pièces qui ressemblent à des étoiles.",n:"ラテン語tectum（屋根）から。英protect と同じ語根。部屋の「天井」がtecho、建物の「屋根」はel tejado。アルハンブラ宮殿の鍾乳石状の天井装飾は有名。"},
{w:"la pared",p:"nf",en:"wall",fr:"le mur",ex:"En la pared de la cocina colgaba un calendario de 1998 que mi abuela no había querido quitar.",exEn:"On the kitchen wall hung a calendar from 1998 that my grandmother had not wanted to take down.",exFr:"Au mur de la cuisine était accroché un calendrier de 1998 que ma grand-mère n'avait pas voulu enlever.",n:"ラテン語paries, parietis（壁）から。英parietal と同源。部屋の「壁」はpared、町を囲む「城壁」はmuralla、塀はmuro。"},
{w:"el mueble",p:"nm",en:"piece of furniture",fr:"le meuble",ex:"Los muebles que habíamos comprado en Madrid no cabían por la puerta del piso de Cádiz.",exEn:"The furniture we had bought in Madrid did not fit through the door of the flat in Cádiz.",exFr:"Les meubles que nous avions achetés à Madrid ne passaient pas par la porte de l'appartement de Cadix.",n:"ラテン語mobilis（動かせる）から。英mobile、仏meuble と同源。「動かせる財産」が「家具」になった。複数形los muebles で家具全体。"},
{w:"el espejo",p:"nm",en:"mirror",fr:"le miroir",ex:"Los espejos del callejón del Gato, que salen en una obra de Valle-Inclán, deforman a todo el mundo.",exEn:"The mirrors in the Callejón del Gato, which appear in a play by Valle-Inclán, distort everyone.",exFr:"Les miroirs du Callejón del Gato, qui apparaissent dans une pièce de Valle-Inclán, déforment tout le monde.",n:"ラテン語speculum（鏡）から。英speculate と同源。マドリードの路地にあったゆがんだ鏡は、作家バリェ＝インクランの作品に登場することで有名。"},
{w:"el cajón",p:"nm",en:"drawer, box",fr:"le tiroir, la caisse",ex:"En el cajón de la cocina hay de todo: pilas, llaves que no abren nada y cien bolsas de plástico.",exEn:"In the kitchen drawer there is everything: batteries, keys that open nothing and a hundred plastic bags.",exFr:"Dans le tiroir de la cuisine, il y a de tout : des piles, des clés qui n'ouvrent rien et cent sacs en plastique.",n:"caja（箱）の拡大形。「引き出し」のほか、ペルー発祥の打楽器cajónもこの名前で、フラメンコでも使われる。"},
{w:"la manta",p:"nf",en:"blanket",fr:"la couverture",ex:"En Burgos dormí con tres mantas, aunque me habían dicho que era verano.",exEn:"In Burgos I slept with three blankets, although they had told me it was summer.",exFr:"À Burgos, j'ai dormi avec trois couvertures, alors qu'on m'avait dit que c'était l'été.",n:"ラテン語mantum（外套）から来たとされる。英mantle と同源。tirar de la manta（秘密を暴露する）という慣用句もある。"},
{w:"la almohada",p:"nf",en:"pillow",fr:"l'oreiller",ex:"Consúltalo con la almohada, y mañana me dices si quieres venir a vivir a Valencia.",exEn:"Sleep on it, and tomorrow you can tell me if you want to come and live in Valencia.",exFr:"La nuit porte conseil, et demain tu me diras si tu veux venir vivre à Valence.",n:"アラビア語al-mujadda（枕）に由来するとされ、al-は定冠詞の名残。consultar con la almohada（一晩寝て考える）は仏la nuit porte conseil と同じ発想。"},
{w:"el jabón",p:"nm",en:"soap",fr:"le savon",ex:"El jabón de aceite de oliva, que se hacía en casa, se usaba para lavar la ropa y también a los niños.",exEn:"Olive oil soap, which was made at home, was used to wash clothes and the children too.",exFr:"Le savon à l'huile d'olive, qu'on fabriquait à la maison, servait à laver le linge et aussi les enfants.",n:"後期ラテン語sapo（石けん）から。英soap、仏savonと同源。dar jabón a alguien は口語で「おだてる」。"},
{w:"la toalla",p:"nf",en:"towel",fr:"la serviette",ex:"Cuando llegamos a la playa, alguien ya había puesto su toalla en nuestro sitio de siempre.",exEn:"When we got to the beach, someone had already put their towel in our usual spot.",exFr:"Quand nous sommes arrivés à la plage, quelqu'un avait déjà mis sa serviette à notre place habituelle.",n:"ゲルマン語thwahlja（洗う布）から入ったとされる。英towel、仏touailleと同源。tirar la toalla（さじを投げる）はボクシングから来た表現。"},
{w:"el oso",p:"nm",en:"bear",fr:"l'ours",ex:"En los montes de Asturias todavía vive el oso pardo, que había estado a punto de desaparecer.",exEn:"The brown bear still lives in the mountains of Asturias, and it had been on the verge of disappearing.",exFr:"L'ours brun vit encore dans les montagnes des Asturies, alors qu'il avait été sur le point de disparaître.",n:"ラテン語ursus（熊）から。仏ours、英ursine と同源。アストゥリアスのヒグマは保護によって個体数が回復した。"},
{w:"el lobo",p:"nm",en:"wolf",fr:"le loup",ex:"Mi abuelo, que había sido pastor, decía que el lobo nunca atacaba cuando había perros.",exEn:"My grandfather, who had been a shepherd, used to say that the wolf never attacked when there were dogs.",exFr:"Mon grand-père, qui avait été berger, disait que le loup n'attaquait jamais quand il y avait des chiens.",n:"ラテン語lupus（狼）から。仏loupと同源。人名Lope もこの語から。スペイン北西部には今もイベリアオオカミが生息している。"},
{w:"el águila",p:"nf",en:"eagle",fr:"l'aigle",ex:"El águila imperial ibérica, que solo vive en la península, fue salvada gracias a los ecologistas.",exEn:"The Spanish imperial eagle, which only lives on the peninsula, was saved thanks to environmentalists.",exFr:"L'aigle impérial ibérique, qui ne vit que dans la péninsule, a été sauvé grâce aux écologistes.",n:"ラテン語aquila（鷲）から。仏aigle と同源。女性名詞だが、強勢のあるa-で始まるので単数ではel águila と言う（el agua と同じ）。形容詞は女性形（el águila imperial ibérica）。"},
{w:"la oveja",p:"nf",en:"sheep",fr:"le mouton, la brebis",ex:"El queso manchego se hace con leche de oveja, que es la que había en La Mancha.",exEn:"Manchego cheese is made with sheep's milk, which is what there was in La Mancha.",exFr:"Le fromage manchego est fait avec du lait de brebis, qui est celui qu'on trouvait dans la Manche.",n:"ラテン語ovicula（小さな羊）から。仏ouaille（信者）と同源。英ovine も同じ語根。マンチェゴはラ・マンチャ地方の羊乳チーズ。"},
{w:"el cerdo",p:"nm",en:"pig, pork",fr:"le cochon, le porc",ex:"Del cerdo se aprovecha todo, como dice el refrán, hasta los andares.",exEn:"Every part of the pig is used, as the saying goes, even the way it walks.",exFr:"Dans le cochon, tout est bon, comme dit le proverbe, même sa démarche.",n:"語源ははっきりしない。del cerdo se aprovecha todo, hasta los andares（豚は歩き方まで無駄にしない）はスペインのことわざ。イベリコ豚はcerdo ibérico。"},
{w:"la gallina",p:"nf",en:"hen",fr:"la poule",ex:"En Santo Domingo de la Calzada hay un gallo y una gallina vivos dentro de la catedral.",exEn:"In Santo Domingo de la Calzada there are a live rooster and hen inside the cathedral.",exFr:"À Santo Domingo de la Calzada, il y a un coq et une poule vivants à l'intérieur de la cathédrale.",n:"ラテン語gallina（雌鶏）から。gallo（雄鶏）の女性形。ser un gallina は「臆病者」。リオハ州のこの大聖堂には伝説にちなんで生きた鶏が飼われている。"},
{w:"el burro",p:"nm",en:"donkey",fr:"l'âne",ex:"Sancho Panza viajaba en un burro, mientras Don Quijote iba en un caballo que había visto mejores días.",exEn:"Sancho Panza traveled on a donkey, while Don Quixote rode a horse that had seen better days.",exFr:"Sancho Panza voyageait sur un âne, tandis que Don Quichotte allait sur un cheval qui avait connu des jours meilleurs.",n:"語源ははっきりしない。ser un burro は「頭が悪い・頑固だ」。スペインでは親しみを込めてカタルーニャのロバ（burro catalán）がステッカーになっている。"},
{w:"el pez",p:"nm",en:"fish (live)",fr:"le poisson",ex:"En el acuario de Valencia vimos peces que nunca habíamos visto, y luego comimos pescado.",exEn:"At the Valencia aquarium we saw fish we had never seen, and then we ate fish.",exFr:"À l'aquarium de Valence, nous avons vu des poissons que nous n'avions jamais vus, puis nous avons mangé du poisson.",n:"ラテン語piscis（魚）から。英Pisces、仏poissonと同源。複数形はpeces（z→c）。生きた魚はpez、食材の魚はpescado。"},
{w:"la serpiente",p:"nf",en:"snake",fr:"le serpent",ex:"La serpiente emplumada era un dios para los aztecas y los mayas, que la llamaban de formas distintas.",exEn:"The feathered serpent was a god for the Aztecs and the Maya, who called it by different names.",exFr:"Le serpent à plumes était un dieu pour les Aztèques et les Mayas, qui l'appelaient de différentes façons.",n:"ラテン語serpens（這うもの）から。英serpent、仏serpentと同源。羽毛の蛇はアステカではケツァルコアトル、マヤではククルカンと呼ばれた。"},
{w:"la mariposa",p:"nf",en:"butterfly",fr:"le papillon",ex:"Cada invierno llegan a Michoacán millones de mariposas monarca que han volado desde Canadá.",exEn:"Every winter millions of monarch butterflies that have flown from Canada arrive in Michoacán.",exFr:"Chaque hiver, des millions de papillons monarques qui ont volé depuis le Canada arrivent au Michoacán.",n:"Mari（マリア）＋posa（とまれ）から生まれたとされる。オオカバマダラ（mariposa monarca）はメキシコのミチョアカン州で越冬する。"},
{w:"la temporada",p:"nf",en:"season (period)",fr:"la saison",ex:"La temporada de setas empieza en otoño, cuando ya habrá llovido bastante.",exEn:"Mushroom season starts in autumn, when it will already have rained enough.",exFr:"La saison des champignons commence en automne, quand il aura déjà assez plu.",n:"tiempo（時）から作られた語。四季のestación に対して、観光・スポーツ・収穫などの「時期・シーズン」を表す。temporada alta / baja（繁忙期・閑散期）。"},
{w:"la fecha",p:"nf",en:"date",fr:"la date",ex:"La fecha de la boda fue elegida por la madre de la novia, que ya había reservado la iglesia.",exEn:"The wedding date was chosen by the bride's mother, who had already booked the church.",exFr:"La date du mariage a été choisie par la mère de la mariée, qui avait déjà réservé l'église.",n:"hacer（する）の古い過去分詞fecho から、「作成された日」。英date、仏date とは別語源。日付の「〜日」はel día、年月日全体はla fecha。"},
{w:"el reloj",p:"nm",en:"clock, watch",fr:"l'horloge, la montre",ex:"El reloj de la Puerta del Sol, que marca las doce uvas, fue regalado a Madrid por un relojero.",exEn:"The clock at the Puerta del Sol, which marks the twelve grapes, was given to Madrid by a clockmaker.",exFr:"L'horloge de la Puerta del Sol, qui marque les douze raisins, a été offerte à Madrid par un horloger.",n:"ギリシャ語hōrologion（時を告げるもの）から来たとされる。英horology、仏horloge と同源。語末のjは発音されないことも多い。複数形はrelojes。"},
{w:"el minuto",p:"nm",en:"minute",fr:"la minute",ex:"Espera un minuto, que ya casi he terminado; en España un minuto puede durar media hora.",exEn:"Wait a minute, I have almost finished; in Spain a minute can last half an hour.",exFr:"Attends une minute, j'ai presque fini ; en Espagne, une minute peut durer une demi-heure.",n:"ラテン語minutus（小さく分けられた）から。英minute、仏minute と同源。仏語では女性名詞だが、スペイン語では男性名詞。"},
{w:"la madrugada",p:"nf",en:"early morning, small hours",fr:"le petit matin",ex:"Volvimos a las cinco de la madrugada, y mi abuela ya se había levantado para hacer el pan.",exEn:"We came back at five in the morning, and my grandmother had already got up to make the bread.",exFr:"Nous sommes rentrés à cinq heures du matin, et ma grand-mère s'était déjà levée pour faire le pain.",n:"madrugar（早起きする、ラテン語maturicare）から。深夜0時から夜明けまでを指す。A quien madruga, Dios le ayuda（早起きは三文の徳）。"},
{w:"el amanecer",p:"nm",en:"dawn, sunrise",fr:"l'aube, le lever du soleil",ex:"Vimos el amanecer desde la playa de Valencia, después de una noche que no habíamos planeado.",exEn:"We watched the sunrise from the beach in Valencia, after a night we had not planned.",exFr:"Nous avons regardé le lever du soleil depuis la plage de Valence, après une nuit que nous n'avions pas prévue.",n:"動詞amanecer（夜が明ける）をそのまま名詞にしたもの。mañana（朝）と同じ語根。¿Cómo amaneciste?は中南米で「おはよう、よく眠れた？」。"},
{w:"el atardecer",p:"nm",en:"dusk, sunset",fr:"le coucher du soleil",ex:"El atardecer en el templo de Debod, que fue regalado por Egipto, es uno de los más bonitos de Madrid.",exEn:"Sunset at the Temple of Debod, which was a gift from Egypt, is one of the most beautiful in Madrid.",exFr:"Le coucher du soleil au temple de Debod, qui a été offert par l'Égypte, est l'un des plus beaux de Madrid.",n:"動詞atardecer（日が暮れる）の名詞化。tarde（午後）と同じ語根。マドリードのデボー神殿はエジプトから贈られた古代神殿。"},
{w:"el mediodía",p:"nm",en:"midday, noon, lunchtime",fr:"midi",ex:"En España el mediodía no es a las doce, sino a la hora de comer, es decir, a las dos.",exEn:"In Spain midday is not at twelve, but at lunchtime, that is to say, at two.",exFr:"En Espagne, le midi, ce n'est pas à midi, mais à l'heure du déjeuner, c'est-à-dire à deux heures.",n:"medio（半分）＋día（日）。仏midi と同じ組み立て。スペインでは昼食の時間帯を広く指す。"},
{w:"la medianoche",p:"nf",en:"midnight",fr:"minuit",ex:"A medianoche ya nos habremos comido las doce uvas, si no nos atragantamos.",exEn:"By midnight we will have eaten the twelve grapes, if we do not choke.",exFr:"À minuit, nous aurons mangé les douze raisins, si nous ne nous étouffons pas.",n:"media（半分）＋noche（夜）。仏minuit と同じ組み立て。未来完了（habremos comido）で未来のある時点までの完了を表す。"},
{w:"el ambiente",p:"nm",en:"atmosphere, environment",fr:"l'ambiance",ex:"El ambiente del estadio, que se había llenado tres horas antes, era increíble.",exEn:"The atmosphere in the stadium, which had filled up three hours earlier, was incredible.",exFr:"L'ambiance du stade, qui s'était rempli trois heures avant, était incroyable.",n:"ラテン語ambiens（周りを取り巻く）から。英ambient、仏ambiance と同源。「雰囲気」「環境」の意味。¡Qué ambiente!（すごい盛り上がり！）。"},
{w:"el tamaño",p:"nm",en:"size",fr:"la taille",ex:"El bocadillo de calamares, que había sido pedido para compartir, tenía el tamaño de un brazo.",exEn:"The squid sandwich, which had been ordered to share, was the size of an arm.",exFr:"Le sandwich aux calamars, qui avait été commandé pour partager, avait la taille d'un bras.",n:"ラテン語tam magnus（それほど大きい）から来たとされる。物の大きさ全般に使う。服のサイズはtalla、靴はnúmero。"},
{w:"el peso",p:"nm",en:"weight, peso (currency)",fr:"le poids, le peso",ex:"En México el peso es la moneda, y en la báscula del hotel, el peso fue una mala noticia.",exEn:"In Mexico the peso is the currency, and on the hotel scales, my weight was bad news.",exFr:"Au Mexique, le peso est la monnaie, et sur la balance de l'hôtel, mon poids a été une mauvaise nouvelle.",n:"pesar（量る）から。英poise、仏poids と同源。「重さ」と、メキシコ・アルゼンチンなどの通貨「ペソ」（元は銀の重さ）の両方の意味。"},
{w:"profundo",p:"adj",en:"deep",fr:"profond",ex:"El lago de Sanabria es tan profundo que, según la leyenda, un pueblo entero fue tragado por sus aguas.",exEn:"Lake Sanabria is so deep that, according to legend, a whole village was swallowed by its waters.",exFr:"Le lac de Sanabria est si profond que, selon la légende, un village entier a été englouti par ses eaux.",n:"ラテン語profundus（底の深い）から。英profound、仏profondと同源。サモラ県のサナブリア湖には、湖底に沈んだ村の伝説がある。"},
{w:"redondo",p:"adj",en:"round",fr:"rond",ex:"Compramos una mesa redonda para que nadie pueda sentarse en la cabecera, pero mi abuelo ya ha encontrado una.",exEn:"We bought a round table so that nobody can sit at the head, but my grandfather has already found one.",exFr:"Nous avons acheté une table ronde pour que personne ne puisse s'asseoir en bout de table, mais mon grand-père en a déjà trouvé un.",n:"ラテン語rotundus（丸い）から。英round・rotund、仏rond と同源。en números redondos（ざっと、端数を切って）。"},
{w:"salvaje",p:"adj",en:"wild",fr:"sauvage",ex:"En Doñana viven caballos casi salvajes, que pasan todo el año en libertad.",exEn:"In Doñana there are almost wild horses, which spend the whole year roaming free.",exFr:"À Doñana vivent des chevaux presque sauvages, qui passent toute l'année en liberté.",n:"ラテン語silvaticus（森の）から、仏sauvage を経て入った。英savage と同源。selva（森林）と同じ語根。ドニャーナ国立公園はアンダルシアの湿地帯。"},
{w:"tierno",p:"adj",en:"tender, soft",fr:"tendre",ex:"El cordero estaba tan tierno que no hizo falta el cuchillo; mi abuelo había estado cocinándolo desde las seis.",exEn:"The lamb was so tender that the knife was not needed; my grandfather had been cooking it since six.",exFr:"L'agneau était si tendre qu'on n'a pas eu besoin du couteau ; mon grand-père le cuisait depuis six heures.",n:"ラテン語tener（柔らかい）から。英tender、仏tendre と同源。肉やパンが「柔らかい」、人が「優しい・かわいらしい」の意味。"},
{w:"crudo",p:"adj",en:"raw",fr:"cru",ex:"El pescado crudo del ceviche peruano había sido marinado en limón, así que en realidad está cocinado.",exEn:"The raw fish in Peruvian ceviche had been marinated in lime, so it is actually cooked.",exFr:"Le poisson cru du ceviche péruvien avait été mariné dans du citron vert, alors en réalité il est cuit.",n:"ラテン語crudus（生の、血の）から。英crude、仏cru と同源。jamón crudo は「生ハム」（スペインではjamón serrano）。ペルーのセビチェは生魚を柑橘で締めた料理。"},
{w:"maduro",p:"adj",en:"ripe, mature",fr:"mûr",ex:"Los tomates de mi abuelo ya habrán madurado cuando lleguemos al pueblo en agosto.",exEn:"My grandfather's tomatoes will already have ripened when we get to the village in August.",exFr:"Les tomates de mon grand-père auront déjà mûri quand nous arriverons au village en août.",n:"ラテン語maturus（熟した）から。英mature、仏mûr と同源。果物が「熟した」、人が「成熟した」の意味。動詞はmadurar。"},
{w:"amargo",p:"adj",en:"bitter",fr:"amer",ex:"El café de mi abuelo era tan amargo que había que tomarlo con tres terrones de azúcar.",exEn:"My grandfather's coffee was so bitter that you had to have it with three sugar lumps.",exFr:"Le café de mon grand-père était si amer qu'il fallait le prendre avec trois morceaux de sucre.",n:"ラテン語amarus（苦い）から。仏amer と同源。amarillo（黄色）もこの語から来たとされる。"},
{w:"sabroso",p:"adj",en:"tasty",fr:"savoureux",ex:"El plato más sabroso que he probado fue un cocido que había estado en el fuego toda la mañana.",exEn:"The tastiest dish I have tried was a stew that had been on the fire all morning.",exFr:"Le plat le plus savoureux que j'aie goûté était un cocido qui avait mijoté toute la matinée.",n:"sabor（味、ラテン語sapor）から。英savory、仏savoureux と同源。saber（知る）も元は「味がする」の意味で、sabe a limón（レモンの味がする）の用法に残る。"},
{w:"silencioso",p:"adj",en:"silent, quiet",fr:"silencieux",ex:"El Viernes Santo, las calles de Zamora están tan silenciosas que solo se oyen los tambores.",exEn:"On Good Friday, the streets of Zamora are so silent that you only hear the drums.",exFr:"Le vendredi saint, les rues de Zamora sont si silencieuses qu'on n'entend que les tambours.",n:"silencio（静けさ、ラテン語silentium）から。英silent、仏silencieux と同源。サモラの聖週間は静粛な行列で知られる。"},
{w:"ruidoso",p:"adj",en:"noisy",fr:"bruyant",ex:"Los españoles tienen fama de ruidosos, pero en la biblioteca de Salamanca no se oía ni una mosca.",exEn:"Spaniards have a reputation for being noisy, but in the library in Salamanca you could not hear a fly.",exFr:"Les Espagnols ont la réputation d'être bruyants, mais dans la bibliothèque de Salamanque, on n'entendait pas une mouche.",n:"ruido（騒音）から。-osoは「〜に満ちた」を表す接尾辞。no se oía ni una mosca（ハエの音一つしない）は「静まり返っている」の慣用句。"},
{w:"brillante",p:"adj",en:"bright, brilliant",fr:"brillant",ex:"Mi prima, que siempre había sido una estudiante brillante, dejó la carrera para abrir un bar.",exEn:"My cousin, who had always been a brilliant student, dropped out of her degree to open a bar.",exFr:"Ma cousine, qui avait toujours été une élève brillante, a abandonné ses études pour ouvrir un bar.",n:"brillar（輝く）の現在分詞から。英brilliant、仏brillant と同源。-nteで終わる形容詞は男女同形。"},
{w:"feo",p:"adj",en:"ugly",fr:"laid, moche",ex:"El jersey que me había regalado mi tía era tan feo que solo me lo puse el día de su cumpleaños.",exEn:"The sweater my aunt had given me was so ugly that I only wore it on her birthday.",exFr:"Le pull que ma tante m'avait offert était si moche que je ne l'ai mis que le jour de son anniversaire.",n:"ラテン語foedus（醜い、汚い）から。反対語はbonito, guapo。口語ではser más feo que Picio（ものすごく醜い）という言い回しもある。"},
{w:"hermoso",p:"adj",en:"beautiful",fr:"beau, magnifique",ex:"El pueblo más hermoso que he visto es uno de Cantabria cuyo nombre no recuerdo.",exEn:"The most beautiful village I have seen is one in Cantabria whose name I do not remember.",exFr:"Le plus beau village que j'aie vu est un village de Cantabrie dont je ne me rappelle pas le nom.",n:"ラテン語formosus（形の良い）から。語頭のf-がh-になった典型例。bonito より文語的・詩的な響き。"},
{w:"loco",p:"adj",en:"crazy, mad",fr:"fou",ex:"Mis amigos dijeron que estaba loco por correr delante de los toros, pero al final no corrí.",exEn:"My friends said I was mad to run in front of the bulls, but in the end I did not run.",exFr:"Mes amis ont dit que j'étais fou de courir devant les taureaux, mais finalement je n'ai pas couru.",n:"語源ははっきりしない。estar loco por〜で「〜に夢中だ」。¡Ni loco!は「絶対いやだ！」。"},
{w:"extraño",p:"adj",en:"strange",fr:"étrange",ex:"Era extraño: la calle, que siempre estaba llena, estaba vacía; hasta que recordé que jugaba España.",exEn:"It was strange: the street, which was always full, was empty; until I remembered that Spain was playing.",exFr:"C'était étrange : la rue, qui était toujours pleine, était vide ; jusqu'à ce que je me rappelle que l'Espagne jouait.",n:"ラテン語extraneus（外の）から。英strange、仏étrange と同源。名詞で「見知らぬ人」、動詞extrañar（恋しく思う・不思議に思う）と同じ語根。"},
{w:"mágico",p:"adj",en:"magic, magical",fr:"magique",ex:"La noche de San Juan tiene algo mágico: se dice que las hierbas recogidas esa noche curan todo.",exEn:"The night of San Juan has something magical about it: it is said that herbs picked that night cure everything.",exFr:"La nuit de la Saint-Jean a quelque chose de magique : on dit que les herbes cueillies cette nuit-là guérissent tout.",n:"ギリシャ語magikos から。英magic、仏magique と同源。se dice que〜は無人称の「〜と言われている」。"},
{w:"tampoco",p:"adv",en:"neither, not either",fr:"non plus",ex:"—Yo no había estado nunca en Galicia. —Yo tampoco, y ya he comido pulpo tres veces.",exEn:"I had never been to Galicia. — Me neither, and I have already eaten octopus three times.",exFr:"Je n'étais jamais allé en Galice. — Moi non plus, et j'ai déjà mangé du poulpe trois fois.",n:"tan＋poco から。否定文を受ける「〜もまた…ない」。肯定文を受けるtambién と対になる。yo tampoco は仏moi non plus と同じ。"},
{w:"el cual",p:"pron",en:"which, who (relative)",fr:"lequel",ex:"Visitamos la casa de Lorca, en la cual escribió muchas de sus obras.",exEn:"We visited Lorca's house, in which he wrote many of his works.",exFr:"Nous avons visité la maison de Lorca, dans laquelle il a écrit beaucoup de ses œuvres.",n:"定冠詞＋cual の関係代名詞で、先行詞の性数に合わせる（la cual, los cuales, las cuales）。前置詞の後によく使い、書き言葉的。仏lequel と同じ仕組み。"},
{w:"salvo",p:"prep",en:"except",fr:"sauf",ex:"Todos los museos estaban abiertos, salvo el que yo había venido a ver.",exEn:"All the museums were open, except the one I had come to see.",exFr:"Tous les musées étaient ouverts, sauf celui que j'étais venu voir.",n:"ラテン語salvus（無事な）から。仏sauf とまったく同じ意味の変化。excepto と同じ意味。形容詞では「無事な」（sano y salvo）。"},
{w:"a la vez",p:"loc",en:"at the same time",fr:"en même temps",ex:"Mi madre es capaz de hablar por teléfono, cocinar y ver la telenovela a la vez.",exEn:"My mother can talk on the phone, cook and watch the soap opera at the same time.",exFr:"Ma mère est capable de parler au téléphone, cuisiner et regarder la telenovela en même temps.",n:"vez（回）を使った表現で「同じ回に」。al mismo tiempo と同じ意味。"},
{w:"sin duda",p:"loc",en:"undoubtedly, without a doubt",fr:"sans doute, sans aucun doute",ex:"Sin duda, la mejor tortilla del mundo es la de tu madre; eso no se discute.",exEn:"Without a doubt, the best tortilla in the world is your mother's; that is not up for debate.",exFr:"Sans aucun doute, la meilleure tortilla du monde est celle de ta mère ; ça ne se discute pas.",n:"duda（疑い）を使った表現で「疑いなく」。仏sans doute は「たぶん」の意味で使うことが多いので注意。"},
{w:"de hecho",p:"loc",en:"in fact, actually",fr:"en fait, d'ailleurs",ex:"No es tan difícil aprender a bailar sevillanas; de hecho, mi abuelo aprendió a los setenta.",exEn:"It is not that hard to learn to dance sevillanas; in fact, my grandfather learned at seventy.",exFr:"Ce n'est pas si difficile d'apprendre à danser les sevillanas ; d'ailleurs, mon grand-père a appris à soixante-dix ans.",n:"hecho（事実、hacer の過去分詞）を使った表現。前の内容を補強する「実際に」。"},
{w:"en realidad",p:"loc",en:"actually, in reality",fr:"en réalité",ex:"Todos creen que la paella es plato nacional, pero en realidad es de Valencia.",exEn:"Everyone thinks paella is the national dish, but it is actually from Valencia.",exFr:"Tout le monde croit que la paella est le plat national, mais en réalité elle vient de Valence.",n:"realidad（現実）を使った表現。思い込みを訂正する「実は」。英actually に当たる（actualmente は「現在」なので注意）。"},
{w:"por lo tanto",p:"loc",en:"therefore",fr:"par conséquent, donc",ex:"El museo cierra los lunes; por lo tanto, iremos el martes, cuando ya se habrá ido el grupo de turistas.",exEn:"The museum is closed on Mondays; therefore, we will go on Tuesday, when the tour group will have left.",exFr:"Le musée est fermé le lundi ; par conséquent, nous irons mardi, quand le groupe de touristes sera parti.",n:"tanto（それほど）を使った表現で「したがって」。así que より書き言葉的。por tanto とも言う。"},
{w:"al contrario",p:"loc",en:"on the contrary",fr:"au contraire",ex:"No me molesta que vengas con tu perro; al contrario, mi abuela estará encantada.",exEn:"I do not mind you coming with your dog; on the contrary, my grandmother will be delighted.",exFr:"Ça ne me dérange pas que tu viennes avec ton chien ; au contraire, ma grand-mère sera ravie.",n:"contrario（反対の）を使った表現で、仏au contraire と同じ組み立て。前の否定を受けて逆のことを述べる。"},
{w:"cada vez más",p:"loc",en:"more and more",fr:"de plus en plus",ex:"Cada vez más turistas visitan los pueblos pequeños, que antes habían sido olvidados.",exEn:"More and more tourists visit the small villages, which had previously been forgotten.",exFr:"De plus en plus de touristes visitent les petits villages, qui avaient été oubliés auparavant.",n:"cada vez（毎回）＋más（より多く）。反対はcada vez menos（ますます少なく）。"},
{w:"poco a poco",p:"loc",en:"little by little",fr:"peu à peu",ex:"Poco a poco fui entendiendo a mi suegra andaluza; al principio, solo entendía olé.",exEn:"Little by little I began to understand my Andalusian mother-in-law; at first, I only understood olé.",exFr:"Peu à peu, j'ai commencé à comprendre ma belle-mère andalouse ; au début, je ne comprenais que olé.",n:"poco（少し）を重ねた表現で、仏peu à peu と同じ組み立て。ir＋現在分詞（fui entendiendo）は「だんだん〜していく」。"},
{w:"de vez en cuando",p:"loc",en:"from time to time",fr:"de temps en temps",ex:"De vez en cuando mi abuelo nos contaba la historia del lobo, que cada vez era más grande.",exEn:"From time to time my grandfather told us the story of the wolf, which got bigger every time.",exFr:"De temps en temps, mon grand-père nous racontait l'histoire du loup, qui était chaque fois plus grand.",n:"vez（回）とcuando（〜する時）を使った表現で「時々」。a veces より頻度が低いことが多い。"}
]}
];
const TOTAL_LEVELS = 15;

/* ============ STATE ============ */
const KEY = "es4-progress";
let S = {learned:{}, last:{}, rate:0.85, hideLearned:false, autoplay:false, mode:"card", autoLast:{}, bgAudio:false};
let view = "home", cur = null, auto = null;

async function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) S = Object.assign(S, JSON.parse(raw));
  }catch(e){ console.warn("storage unavailable", e); }
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ console.error("save failed", e); }
  }, 250);
}

/* ============ AUDIO ============ */
let esVoice = null, enVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  esVoice = vs.find(v=>/^es[-_]ES/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
  enVoice = vs.find(v=>/^en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if (window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[¡¿—]/g," "));
  u.lang = "es-ES"; u.rate = S.rate;
  if(esVoice) u.voice = esVoice;
  speechSynthesis.speak(u);
}

/* 聞き流しモード用：読み上げが終わるまで待つ */
const forSpeech = t => t.replace(/\([^)]*\)/g,"").replace(/[¡¿—]/g," ").replace(/\s+/g," ").trim();
let _utt = null;
function speak(text, lang, rate){
  return new Promise(res=>{
    if(!window.speechSynthesis || !text) return res();
    const u = new SpeechSynthesisUtterance(forSpeech(text));
    u.lang = lang; u.rate = rate;
    const v = lang.startsWith("es") ? esVoice : enVoice;
    if(v) u.voice = v;
    let done = false;
    const fin = ()=>{ if(done) return; done = true; clearTimeout(t); res(); };
    u.onend = fin; u.onerror = fin;
    // onend が発火しない端末向けの保険
    const t = setTimeout(fin, 4000 + text.length * 110 / rate);
    _utt = u;
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r=>setTimeout(r, ms));

/* ============ HELPERS ============ */
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lvKey = (lv,i) => lv+":"+i;
function stats(lv){
  const L = LEVELS.find(x=>x.id===lv);
  if(!L) return {done:0,total:100,pct:0};
  const done = L.words.reduce((a,_,i)=> a + (S.learned[lvKey(lv,i)]?1:0), 0);
  return {done, total:L.words.length, pct: Math.round(done/L.words.length*100)};
}
const SPK = '<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>';

/* ============ RENDER ============ */
const app = document.getElementById("app");

function renderHome(){
  let all=0, allDone=0;
  LEVELS.forEach(L=>{ const s=stats(L.id); all+=s.total; allDone+=s.done; });
  const cards = [];
  for(let i=1;i<=TOTAL_LEVELS;i++){
    const L = LEVELS.find(x=>x.id===i);
    if(!L){
      cards.push(`<button class="lv" disabled><span class="n">Nivel ${i}</span><span class="r">${(i-1)*100+1}–${i*100}</span><div class="bar"><i style="width:0"></i></div><span class="st">準備中</span></button>`);
      continue;
    }
    const s = stats(i);
    cards.push(`<button class="lv ${s.pct===100?"done":""}" data-lv="${i}">
      <span class="n">${L.title}</span><span class="r">${L.range}</span>
      <div class="bar"><i style="width:${s.pct}%"></i></div>
      <span class="st"><span>${s.done} / ${s.total}</span><span>${s.pct}%</span></span></button>`);
  }
  app.innerHTML = `
    <div class="masthead"><h1 class="serif">Vocabulario</h1><span>西検4級</span></div>
    <div class="totals"><b>${all?Math.round(allDone/all*100):0}%</b><small>覚えた単語 ${allDone} / ${all}</small></div>
    <div class="seg" role="tablist">
      <button data-m="card" class="${S.mode==="card"?"on":""}">カード学習</button>
      <button data-m="auto" class="${S.mode==="auto"?"on":""}">聞き流し</button>
    </div>
    <div class="opts">
      <label class="opt"><span class="lb">覚えた単語を出さない</span>
        <input type="checkbox" id="hl" ${S.hideLearned?"checked":""}><span class="sw"></span></label>
      ${S.mode==="card" ? `<label class="opt"><span class="lb">カードを開いたら音声を再生</span>
        <input type="checkbox" id="ap" ${S.autoplay?"checked":""}><span class="sw"></span></label>`
      : `<label class="opt"><span class="lb">バックグラウンド再生（試験的）</span>
        <input type="checkbox" id="bg" ${S.bgAudio?"checked":""}><span class="sw"></span></label>`}
      <div class="opt"><label for="rt">読み上げ速度</label>
        <input type="range" id="rt" min="0.5" max="1.2" step="0.05" value="${S.rate}"></div>
    </div>
    <div class="levels">${cards.join("")}</div>`;

  app.querySelector("#hl").onchange = e=>{ S.hideLearned = e.target.checked; save(); };
  const ap = app.querySelector("#ap"); if(ap) ap.onchange = e=>{ S.autoplay = e.target.checked; save(); };
  const bg = app.querySelector("#bg"); if(bg) bg.onchange = e=>{ S.bgAudio = e.target.checked; save(); };
  app.querySelectorAll(".seg button").forEach(b=> b.onclick = ()=>{ S.mode = b.dataset.m; save(); renderHome(); });
  app.querySelector("#rt").oninput = e=>{ S.rate = parseFloat(e.target.value); save(); };
  app.querySelectorAll(".lv[data-lv]").forEach(b=> b.onclick = ()=> S.mode==="auto" ? startAuto(+b.dataset.lv) : startLevel(+b.dataset.lv));
}

function startLevel(lv){
  const L = LEVELS.find(x=>x.id===lv);
  let idx = L.words.map((_,i)=>i);
  if(S.hideLearned) idx = idx.filter(i=>!S.learned[lvKey(lv,i)]);
  const last = S.last[lv] ?? -1;
  let pos = idx.findIndex(i=>i>last);
  if(pos < 0) pos = 0;
  cur = {lv, idx, pos, open:false};
  view = "study";
  render();
}

function renderStudy(){
  const {lv, idx, pos, open} = cur;
  const L = LEVELS.find(x=>x.id===lv);
  if(!idx.length){
    app.innerHTML = `<div class="top"><button class="back" id="bk">← レベル一覧</button></div>
      <div class="empty">このレベルは全部覚えました。<br>「覚えた単語を出さない」をオフにすると復習できます。</div>`;
    app.querySelector("#bk").onclick = ()=>{ view="home"; render(); };
    return;
  }
  const i = idx[pos], d = L.words[i];
  const known = !!S.learned[lvKey(lv,i)];
  const s = stats(lv);
  app.innerHTML = `
    <div class="top"><button class="back" id="bk">← レベル一覧</button>
      <span class="pos">${pos+1} / ${idx.length}　·　覚えた ${s.done}</span></div>
    <div class="topbar"><i style="width:${(pos+1)/idx.length*100}%"></i></div>
    <div class="card ${known?"known":""}">
      <div class="headword serif">${esc(d.w)}</div>
      <span class="tag">${esc(d.p)}</span>
      <button class="say" data-say="w">${SPK}word</button>
      <p class="ex">${esc(d.ex)} <button class="say" data-say="e">${SPK}frase</button></p>
      <div id="back" class="${open?"":"hide"}">
        <div class="rule"></div>
        <div class="trs">
          <div class="tr"><span class="lg">EN</span><span>${esc(d.en)}</span></div>
          <div class="tr"><span class="lg">FR</span><span>${esc(d.fr)}</span></div>
        </div>
        <div class="trs">
          <div class="tr"><span class="lg">EN</span><span class="sm">${esc(d.exEn)}</span></div>
          <div class="tr"><span class="lg">FR</span><span class="sm">${esc(d.exFr)}</span></div>
        </div>
        <div class="note"><h3>NOTA</h3>${esc(d.n)}</div>
      </div>
    </div>
    <div class="acts">${ open
      ? `<button class="btn ghost" id="skip">まだ</button><button class="btn yes" id="got">覚えた</button>`
      : `<button class="btn primary" id="show">答えを見る</button>` }</div>`;

  app.querySelector("#bk").onclick = ()=>{ view="home"; render(); };
  app.querySelectorAll("[data-say]").forEach(b=> b.onclick = ()=> say(b.dataset.say==="w" ? d.w : d.ex));
  if(!open){
    app.querySelector("#show").onclick = ()=>{ cur.open = true; render(); };
    if(S.autoplay) say(d.w);
  }else{
    app.querySelector("#got").onclick = ()=>{ S.learned[lvKey(lv,i)] = true; advance(); };
    app.querySelector("#skip").onclick = ()=>{ advance(); };
  }
}

function advance(){
  const {lv, idx, pos} = cur;
  S.last[lv] = idx[pos];
  save();
  if(pos + 1 >= idx.length){
    view = "home"; render(); return;
  }
  cur.pos = pos + 1; cur.open = false;
  render();
  window.scrollTo(0,0);
}

/* ============ 聞き流しモード ============ */
let runId = 0, wakeLock = null, bgEl = null;
const IC = {
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M5 5h2.5v14H5zM20 5v14L8.5 12z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M16.5 5H19v14h-2.5zM4 5v14l11.5-7z"/></svg>'
};

function startAuto(lv){
  const L = LEVELS.find(x=>x.id===lv);
  let idx = L.words.map((_,i)=>i);
  if(S.hideLearned) idx = idx.filter(i=>!S.learned[lvKey(lv,i)]);
  const last = S.autoLast[lv] ?? -1;
  let pos = idx.findIndex(i=>i>last);
  if(pos < 0) pos = 0;
  auto = {lv, idx, pos, playing:false, ph:-1};
  view = "auto";
  render();
  if(idx.length) play();   // タップ操作の直後に開始（ブラウザの自動再生制限対策）
}

async function play(){
  if(!auto || auto.playing || !auto.idx.length) return;
  auto.playing = true;
  keepAwake();
  if(S.bgAudio) startBg();
  const id = ++runId;
  const L = LEVELS.find(x=>x.id===auto.lv);
  while(auto && auto.playing && id===runId){
    const i = auto.idx[auto.pos], d = L.words[i];
    renderAuto(); setMeta(d);
    const steps = [[d.w,"es-ES",S.rate,700],[d.en,"en-US",1,1000],[d.ex,"es-ES",S.rate,700],[d.exEn,"en-US",1,1800]];
    for(let k=0;k<steps.length;k++){
      if(id!==runId) return;
      const [t,lg,r,gap] = steps[k];
      setPhase(k);
      await speak(t,lg,r);
      if(id!==runId) return;
      await wait(gap);
    }
    if(id!==runId) return;
    S.autoLast[auto.lv] = i; save();
    auto.pos = (auto.pos + 1) % auto.idx.length;   // 最後まで行ったら先頭に戻って繰り返す
  }
}
function pause(){
  if(!auto) return;
  auto.playing = false; runId++;
  if(window.speechSynthesis) speechSynthesis.cancel();
  auto.ph = -1;
  renderAuto(); setMeta();
}
function skip(delta){
