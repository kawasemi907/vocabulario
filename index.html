{w:"el sombrero",p:"nm",en:"hat",fr:"le chapeau",ex:"Ponte un sombrero en la Feria del Caballo, que el sol de Jerez no tiene piedad.",exEn:"Wear a hat at the Horse Fair, because the Jerez sun has no mercy.",exFr:"Mets un chapeau à la Feria del Caballo, parce que le soleil de Jerez est sans pitié.",n:"sombra（影）から、「影を作るもの」。英sombrero は メキシコの帽子を指すが、スペイン語では帽子一般に使う。ヘレスの馬祭りではつばの平らなsombrero cordobésが定番。"},
{w:"la talla",p:"nf",en:"size (clothes)",fr:"la taille",ex:"Pídele una talla más grande, que después de la Navidad la vas a necesitar.",exEn:"Ask her for a bigger size, because after Christmas you are going to need it.",exFr:"Demande-lui une taille au-dessus, parce qu'après Noël tu vas en avoir besoin.",n:"tallar（彫る、刻む）から。仏tailleと同源。服のサイズはtalla、靴のサイズはnúmero（¿Qué número calzas?）と使い分ける。"},
{w:"la moda",p:"nf",en:"fashion",fr:"la mode",ex:"No sigas la moda de Madrid en Galicia: allí lo que se lleva es el paraguas.",exEn:"Do not follow Madrid fashion in Galicia: there what everyone wears is an umbrella.",exFr:"Ne suis pas la mode de Madrid en Galice : là-bas, ce qui se porte, c'est le parapluie.",n:"仏modeからの借用語で、ラテン語modus（方法）に遡る。英mode・model と同源。estar de moda（流行している）。"},
{w:"el bolso",p:"nm",en:"handbag, bag",fr:"le sac à main",ex:"Lleva el bolso delante en Las Ramblas, para que nadie te lo quite.",exEn:"Carry your bag in front of you on Las Ramblas, so that nobody takes it from you.",exFr:"Porte ton sac devant toi sur la Rambla, pour que personne ne te le prenne.",n:"ギリシャ語byrsa（革袋）からラテン語bursaを経た語。英purse と同源。bolsa（買い物袋）、bolsillo（ポケット）も仲間。"},
{w:"la tarjeta",p:"nf",en:"card",fr:"la carte",ex:"—¿Puedo pagar con tarjeta? —Sí, pero el churrero prefiere que pagues en efectivo.",exEn:"Can I pay by card? — Yes, but the churro seller prefers that you pay in cash.",exFr:"Je peux payer par carte ? — Oui, mais le vendeur de churros préfère que tu paies en espèces.",n:"古フランス語targe（盾）の縮小形に由来するとされる。carta（手紙）と別語。tarjeta de crédito（クレジットカード）、pagar en efectivo（現金で払う）。"},
{w:"la caja",p:"nf",en:"box, till, checkout",fr:"la boîte, la caisse",ex:"Paga en la caja y después pide tu bocadillo en la barra.",exEn:"Pay at the till and then order your sandwich at the bar.",exFr:"Paie à la caisse et ensuite commande ton sandwich au comptoir.",n:"ラテン語capsa（箱）から。英case・cash、仏caisseと同源。「箱」と「レジ」の両方の意味。caja fuerte は「金庫」。"},
{w:"el paquete",p:"nm",en:"parcel, package",fr:"le paquet, le colis",ex:"Si llega un paquete de Galicia, no lo abras: es el pulpo para el domingo.",exEn:"If a parcel comes from Galicia, do not open it: it is the octopus for Sunday.",exFr:"Si un colis arrive de Galice, ne l'ouvre pas : c'est le poulpe pour dimanche.",n:"仏paquet（包み）からの借用語。英pack・package と同源。"},
{w:"el correo",p:"nm",en:"mail, post, email",fr:"le courrier",ex:"Mándame un correo con las fotos de la boda, pero no las de la barra libre.",exEn:"Send me an email with the wedding photos, but not the ones from the open bar.",exFr:"Envoie-moi un mail avec les photos du mariage, mais pas celles du bar à volonté.",n:"correr（走る）から、元は「走って知らせを運ぶ人」。仏courrierと同源。correo electrónico（電子メール）、Correos（スペインの郵便局）。"},
{w:"el mensaje",p:"nm",en:"message",fr:"le message",ex:"No me mandes mensajes de voz de diez minutos; escríbeme, que estoy en el cine.",exEn:"Do not send me ten-minute voice messages; text me, because I am at the cinema.",exFr:"Ne m'envoie pas de messages vocaux de dix minutes ; écris-moi, je suis au cinéma.",n:"仏messageからの借用語で、ラテン語missus（送られた）に遡る。英message と同源。-ajeで終わる名詞は男性名詞。"},
{w:"la llamada",p:"nf",en:"call, phone call",fr:"l'appel",ex:"Si recibes una llamada de tu madre, contesta ya, que si no, llama a la policía.",exEn:"If you get a call from your mother, answer right away, because otherwise she calls the police.",exFr:"Si tu reçois un appel de ta mère, réponds tout de suite, sinon elle appelle la police.",n:"llamar（呼ぶ、電話する）の過去分詞の女性形から。ラテン語clamare（叫ぶ）に遡り、英claim と同源。ラテン語のcl-がスペイン語でll-になった例。"},
{w:"el ordenador",p:"nm",en:"computer",fr:"l'ordinateur",ex:"Apaga el ordenador y sal a pasear; la vida no está en la pantalla.",exEn:"Turn off the computer and go out for a walk; life is not on the screen.",exFr:"Éteins l'ordinateur et va te promener ; la vie n'est pas sur l'écran.",n:"ordenar（整理する）から、仏ordinateurをまねて作られた語。スペインではordenador、中南米ではcomputadoraを使う。"},
{w:"la foto",p:"nf",en:"photo",fr:"la photo",ex:"Hazme una foto delante de la Sagrada Familia, pero que se vean las grúas.",exEn:"Take a photo of me in front of the Sagrada Familia, but make sure the cranes are visible.",exFr:"Prends-moi en photo devant la Sagrada Família, mais qu'on voie les grues.",n:"fotografía の短縮形で、-oで終わるが女性名詞（la foto）。la moto（motocicleta）も同じ。hacer / sacar una foto（写真を撮る）。"},
{w:"la novela",p:"nf",en:"novel",fr:"le roman",ex:"Lee una novela de García Márquez en la playa, y verás que en Macondo también hace calor.",exEn:"Read a novel by García Márquez on the beach, and you will see it is hot in Macondo too.",exFr:"Lis un roman de García Márquez à la plage, et tu verras qu'à Macondo aussi il fait chaud.",n:"イタリア語novella（新しい話）から。英novel と同源。仏roman とは別語。telenovela（連続テレビドラマ）も同じ語から。"},
{w:"el cine",p:"nm",en:"cinema, movies",fr:"le cinéma",ex:"Vamos al cine de verano: la película es vieja, pero las estrellas son de verdad.",exEn:"Let us go to the summer open-air cinema: the film is old, but the stars are real.",exFr:"Allons au cinéma en plein air : le film est vieux, mais les étoiles sont vraies.",n:"cinematógrafo の短縮形で、ギリシャ語kinēma（動き）に遡る。英cinema、仏cinéma と同源。夏には屋外で映画を上映するcine de veranoがある。"},
{w:"el teatro",p:"nm",en:"theater",fr:"le théâtre",ex:"Si vas a Mérida en julio, ve al teatro romano; allí todavía hacen obras clásicas.",exEn:"If you go to Mérida in July, go to the Roman theater; they still put on classical plays there.",exFr:"Si tu vas à Mérida en juillet, va au théâtre romain ; on y joue encore des pièces classiques.",n:"ギリシャ語theatron（見る場所）から。英theater、仏théâtre と同源。メリダのローマ劇場では毎夏古典演劇祭が開かれる。"},
{w:"el concierto",p:"nm",en:"concert",fr:"le concert",ex:"Compra las entradas del concierto hoy, antes de que se agoten.",exEn:"Buy the concert tickets today, before they sell out.",exFr:"Achète les billets du concert aujourd'hui, avant qu'ils ne soient épuisés.",n:"イタリア語concerto から。英concert、仏concert と同源。スペイン語では-ie-の二重母音になる。antes de que＋接続法。"},
{w:"la entrada",p:"nf",en:"ticket, entrance",fr:"le billet, l'entrée",ex:"Guarda bien la entrada de la Alhambra: sin ella no podrás entrar en los Palacios Nazaríes.",exEn:"Keep your Alhambra ticket safe: without it you will not be able to enter the Nasrid Palaces.",exFr:"Garde bien ton billet de l'Alhambra : sans lui, tu ne pourras pas entrer dans les palais nasrides.",n:"entrar（入る）の過去分詞の女性形から。「入口」と「入場券」の両方の意味。乗り物の切符はbillete、コンサートや試合の券はentradaと使い分ける。"},
{w:"la cola",p:"nf",en:"queue, line, tail",fr:"la queue, la file",ex:"No te cueles en la cola de la churrería; aquí la gente se enfada de verdad.",exEn:"Do not jump the queue at the churro shop; people here really get angry.",exFr:"Ne resquille pas dans la file de la churrería ; ici, les gens se fâchent vraiment.",n:"ラテン語cauda（尾）から。仏queue と同源。hacer cola（列に並ぶ）、colarse（割り込む）。飲み物のコーラもla cola。"},
{w:"el turista",p:"nm",en:"tourist",fr:"le touriste",ex:"No hagas como el turista que pide paella a las ocho de la tarde en la Plaza Mayor.",exEn:"Do not be like the tourist who orders paella at eight in the evening in the Plaza Mayor.",exFr:"Ne fais pas comme le touriste qui commande une paella à huit heures du soir sur la Plaza Mayor.",n:"英tourist、仏touriste と同源で、tour（一周）から。-istaで終わる名詞は男女同形。スペインではパエリアは本来昼に食べる料理。"},
{w:"el recuerdo",p:"nm",en:"memory, souvenir",fr:"le souvenir",ex:"Cómprale un recuerdo a tu abuela, pero que no sea un toro de plástico.",exEn:"Buy your grandmother a souvenir, but not a plastic bull.",exFr:"Achète un souvenir à ta grand-mère, mais pas un taureau en plastique.",n:"recordar（思い出す）から。「思い出」と「おみやげ」の両方の意味。Recuerdos a tu familiaは「ご家族によろしく」。"},
{w:"el paraguas",p:"nm",en:"umbrella",fr:"le parapluie",ex:"Aunque haga sol, lleva el paraguas en Santiago; allí el tiempo cambia en cinco minutos.",exEn:"Even if it is sunny, take your umbrella in Santiago; the weather there changes in five minutes.",exFr:"Même s'il fait beau, prends ton parapluie à Saint-Jacques ; là-bas, le temps change en cinq minutes.",n:"parar（止める）＋aguas（水）の合成語。単数も複数も同じ形（el/los paraguas）。仏parapluie と同じ組み立て。"},
{w:"la nube",p:"nf",en:"cloud",fr:"le nuage",ex:"Ojalá que no haya nubes esta noche, que queremos ver las estrellas en el Teide.",exEn:"I hope there are no clouds tonight, because we want to see the stars on the Teide.",exFr:"Pourvu qu'il n'y ait pas de nuages ce soir, nous voulons voir les étoiles sur le Teide.",n:"ラテン語nubes（雲）から。仏nuage と同源。estar en las nubes（上の空である）。「クラウド（ネット）」もla nube。"},
{w:"la tormenta",p:"nf",en:"storm",fr:"l'orage, la tempête",ex:"Si hay tormenta, no te bañes en el mar y quédate en el chiringuito.",exEn:"If there is a storm, do not swim in the sea and stay at the beach bar.",exFr:"S'il y a un orage, ne te baigne pas dans la mer et reste au chiringuito.",n:"ラテン語tormentum（苦しめるもの）から。英torment と同源。chiringuito は浜辺の簡易バル。"},
{w:"la nieve",p:"nf",en:"snow",fr:"la neige",ex:"Cuando haya nieve en Sierra Nevada, vamos a esquiar y luego a comer a Granada.",exEn:"When there is snow in Sierra Nevada, let us go skiing and then eat in Granada.",exFr:"Quand il y aura de la neige dans la Sierra Nevada, allons skier et ensuite manger à Grenade.",n:"ラテン語nix, nivis（雪）から。仏neige と同源。動詞nevar（雪が降る）の名詞形。cuando＋接続法（未来）。"},
{w:"la temperatura",p:"nf",en:"temperature",fr:"la température",ex:"En Sevilla la temperatura llega a cuarenta y cinco grados, así que no salgas a mediodía.",exEn:"In Seville the temperature reaches forty-five degrees, so do not go out at midday.",exFr:"À Séville, la température atteint quarante-cinq degrés, alors ne sors pas à midi.",n:"ラテン語temperatura（適度な調和）から。英temperature、仏température と同源。スペイン語圏では気温を摂氏（grados）で表す。"},
{w:"el clima",p:"nm",en:"climate",fr:"le climat",ex:"Canarias tiene un clima tan suave que las llaman las islas de la eterna primavera.",exEn:"The Canaries have such a mild climate that they call them the islands of eternal spring.",exFr:"Les Canaries ont un climat si doux qu'on les appelle les îles de l'éternel printemps.",n:"ギリシャ語klima（傾き）から。英climate、仏climat と同源。-aで終わるが男性名詞（el clima）。el tiempo は日々の「天気」、el clima は「気候」。"},
{w:"la boda",p:"nf",en:"wedding",fr:"le mariage, les noces",ex:"En una boda española, no te vayas antes de la barra libre, que es lo mejor.",exEn:"At a Spanish wedding, do not leave before the open bar, because it is the best part.",exFr:"À un mariage espagnol, ne pars pas avant le bar à volonté, c'est le meilleur moment.",n:"ラテン語vota（誓い）から。英vow と同源。結婚式の後の食事会では、飲み放題のbarra libreが定番。"},
{w:"la sorpresa",p:"nf",en:"surprise",fr:"la surprise",ex:"Prepara una fiesta sorpresa para tu padre, pero que tu madre no se lo cuente.",exEn:"Prepare a surprise party for your father, but make sure your mother does not tell him.",exFr:"Prépare une fête surprise pour ton père, mais que ta mère ne le lui dise pas.",n:"sorprender（驚かせる）の名詞形。英surprise、仏surprise と同源。que＋接続法（que no se lo cuente）で第三者への願い。"},
{w:"la broma",p:"nf",en:"joke, prank",fr:"la blague, la plaisanterie",ex:"El 28 de diciembre no creas nada de lo que te digan: en España es el día de las bromas.",exEn:"On December 28th, do not believe anything they tell you: in Spain it is the day of pranks.",exFr:"Le 28 décembre, ne crois rien de ce qu'on te dit : en Espagne, c'est le jour des blagues.",n:"ギリシャ語brōma（木食い虫）からとされる。gastar una broma（いたずらする）。12月28日のDía de los Santos Inocentesはスペイン語圏のエイプリルフール。"},
{w:"el chiste",p:"nm",en:"joke",fr:"la blague",ex:"Cuéntame un chiste de Jaimito, pero que no sea el del colegio otra vez.",exEn:"Tell me a Jaimito joke, but not the one about school again.",exFr:"Raconte-moi une blague de Jaimito, mais pas encore celle de l'école.",n:"語源ははっきりしない。話して笑わせる「笑い話」がchiste、仕掛けるいたずらがbroma。Jaimitoはスペイン語圏の小話の定番キャラクター。"},
{w:"el amor",p:"nm",en:"love",fr:"l'amour",ex:"En Teruel dicen que los amantes murieron de amor; si vas, visita su tumba.",exEn:"In Teruel they say the lovers died of love; if you go, visit their tomb.",exFr:"À Teruel, on dit que les amants sont morts d'amour ; si tu y vas, visite leur tombeau.",n:"ラテン語amor（愛）から。英amorous、仏amour と同源。テルエルの恋人たち（Los Amantes de Teruel）はスペインの有名な恋愛伝説。"},
{w:"la alegría",p:"nf",en:"joy, happiness",fr:"la joie",ex:"¡Qué alegría que vengáis a la boda! Traed ganas de bailar.",exEn:"How wonderful that you are coming to the wedding! Bring your dancing spirit.",exFr:"Quelle joie que vous veniez au mariage ! Venez avec l'envie de danser.",n:"alegre（陽気な）の名詞形。¡Qué alegría que＋接続法!で「〜してくれてうれしい」。vosotros の命令形はtraed（-rを-dに変える）。"},
{w:"delgado",p:"adj",en:"thin, slim",fr:"mince",ex:"No te preocupes por estar delgado; en casa de mi abuela nadie sale delgado.",exEn:"Do not worry about being slim; nobody leaves my grandmother's house slim.",exFr:"Ne t'inquiète pas d'être mince ; personne ne sort mince de chez ma grand-mère.",n:"ラテン語delicatus（繊細な）から。英delicate と同源。人にはdelgado、物にはfino（薄い）を使うことが多い。"},
{w:"corto",p:"adj",en:"short",fr:"court",ex:"Haz el discurso corto, que en las bodas españolas la gente quiere comer.",exEn:"Keep the speech short, because at Spanish weddings people want to eat.",exFr:"Fais un discours court, parce qu'aux mariages espagnols, les gens veulent manger.",n:"ラテン語curtus（短くされた）から。英curt、仏court と同源。人の背が低いのはbajo、長さが短いのがcorto。"},
{w:"ligero",p:"adj",en:"light",fr:"léger",ex:"Cena algo ligero, que mañana subimos al Aneto.",exEn:"Have something light for dinner, because tomorrow we are climbing Aneto.",exFr:"Dîne léger, parce que demain nous montons l'Aneto.",n:"仏légerからの借用語とされ、ラテン語levis（軽い）に遡る。英levity と同源。アネトはピレネー山脈の最高峰。"},
{w:"pesado",p:"adj",en:"heavy, annoying",fr:"lourd, pénible",ex:"No seas pesado con el fútbol; hoy es el cumpleaños de tu hermana.",exEn:"Do not be a pain about football; today is your sister's birthday.",exFr:"Ne sois pas pénible avec le foot ; aujourd'hui, c'est l'anniversaire de ta sœur.",n:"pesar（重さを量る）の過去分詞から。「重い」のほか、人について「しつこい・うっとうしい」の意味でよく使う。"},
{w:"suave",p:"adj",en:"soft, smooth, mild",fr:"doux",ex:"Pruébate este jersey de lana de merino; es tan suave que no querrás quitártelo.",exEn:"Try on this merino wool sweater; it is so soft that you will not want to take it off.",exFr:"Essaie ce pull en laine mérinos ; il est si doux que tu ne voudras plus l'enlever.",n:"ラテン語suavis（甘い、心地よい）から。英suave、仏suave と同源。メリノ種の羊はスペイン原産とされる。"},
{w:"elegante",p:"adj",en:"elegant, smart",fr:"élégant",ex:"Vístete elegante para ir al Liceo, aunque luego tomemos algo en un bar del Raval.",exEn:"Dress smartly to go to the Liceu, even if afterwards we have a drink in a bar in the Raval.",exFr:"Habille-toi élégamment pour aller au Liceu, même si après on boit un verre dans un bar du Raval.",n:"ラテン語elegans（選び抜かれた）から。eligere（選ぶ）と同源で、英elegant、仏élégant も同じ。リセウはバルセロナのオペラ劇場。"},
{w:"gratis",p:"adj",en:"free (of charge)",fr:"gratuit",ex:"Los domingos por la tarde el Prado es gratis, así que ve temprano para que no haya cola.",exEn:"On Sunday afternoons the Prado is free, so go early so there is no queue.",exFr:"Le dimanche après-midi, le Prado est gratuit, alors vas-y tôt pour qu'il n'y ait pas de queue.",n:"ラテン語gratiis（好意によって）から。gracias と同じ語根。形は変化せず、副詞としても使う（entrar gratis）。libre（自由な）とは区別する。"},
{w:"roto",p:"adj",en:"broken, torn",fr:"cassé, déchiré",ex:"No compres ese paraguas roto del mercadillo, que en Galicia no dura ni un día.",exEn:"Do not buy that broken umbrella from the flea market; in Galicia it will not last a day.",exFr:"N'achète pas ce parapluie cassé du marché aux puces ; en Galice, il ne tiendra pas un jour.",n:"romper（壊す）の不規則な過去分詞。形容詞として「壊れた・破れた」に使う。mercadillo は露天の市場。"},
{w:"abierto",p:"adj",en:"open",fr:"ouvert",ex:"Busca una farmacia abierta; en el cartel verde pone cuál está de guardia.",exEn:"Look for an open pharmacy; the green sign says which one is on duty.",exFr:"Cherche une pharmacie ouverte ; le panneau vert indique laquelle est de garde.",n:"abrir（開ける）の不規則な過去分詞。ラテン語apertus から。英aperture と同源。店の表示はAbierto / Cerrado。"},
{w:"cerrado",p:"adj",en:"closed",fr:"fermé",ex:"No vayas a las tiendas a las tres; en muchos pueblos todo está cerrado hasta las cinco.",exEn:"Do not go to the shops at three; in many villages everything is closed until five.",exFr:"Ne va pas dans les magasins à trois heures ; dans beaucoup de villages, tout est fermé jusqu'à cinq heures.",n:"cerrar（閉める）の過去分詞。スペインの小さな町では昼休みに店が閉まる習慣が今も残る。"},
{w:"vacío",p:"adj",en:"empty",fr:"vide",ex:"En agosto Madrid está casi vacío, porque todos se van a la playa.",exEn:"In August Madrid is almost empty, because everyone goes to the beach.",exFr:"En août, Madrid est presque vide, parce que tout le monde part à la plage.",n:"ラテン語vacivus（空の）から。英vacant・vacuum、仏vide と同源。la España vacía（過疎化した内陸部）という表現もある。"},
{w:"distinto",p:"adj",en:"different",fr:"différent",ex:"Cada región tiene un turrón distinto, así que pruébalos todos antes de elegir.",exEn:"Every region has a different turrón, so try them all before you choose.",exFr:"Chaque région a un touron différent, alors goûte-les tous avant de choisir.",n:"ラテン語distinctus（区別された）から。英distinct と同源。diferente とほぼ同じ意味。"},
{w:"parecido",p:"adj",en:"similar, alike",fr:"semblable, ressemblant",ex:"El catalán y el español son parecidos, pero no digas que son iguales en Barcelona.",exEn:"Catalan and Spanish are similar, but do not say they are the same in Barcelona.",exFr:"Le catalan et l'espagnol se ressemblent, mais ne dis pas qu'ils sont identiques à Barcelone.",n:"parecer（似ている、〜に見える）の過去分詞。parecido a〜で「〜に似た」。カタルーニャ語はスペインの公用語の一つ。"},
{w:"junto",p:"adj",en:"together, next to",fr:"ensemble, à côté",ex:"Sentémonos juntos en el tren, que el viaje a Galicia es largo.",exEn:"Let us sit together on the train, because the journey to Galicia is long.",exFr:"Asseyons-nous ensemble dans le train, parce que le voyage jusqu'en Galice est long.",n:"ラテン語junctus（結ばれた）から。英joint・junction と同源。形容詞として主語の性数に合わせる（juntos, juntas）。junto a〜は「〜のそばに」。"},
{w:"orgulloso",p:"adj",en:"proud",fr:"fier",ex:"Mi padre está orgulloso de que aprenda español, aunque diga cerveza con acento.",exEn:"My father is proud that I am learning Spanish, even if I say beer with an accent.",exFr:"Mon père est fier que j'apprenne l'espagnol, même si je dis bière avec un accent.",n:"orgullo（誇り、ゲルマン語起源とされる）から。仏orgueilleux と同源。estar orgulloso de que＋接続法。"},
{w:"cariñoso",p:"adj",en:"affectionate, loving",fr:"affectueux",ex:"Sé cariñoso con tu abuela, que te guarda siempre el mejor trozo de tortilla.",exEn:"Be affectionate with your grandmother, because she always saves you the best piece of tortilla.",exFr:"Sois affectueux avec ta grand-mère, elle te garde toujours le meilleur morceau de tortilla.",n:"cariño（愛情）から。スペインではcariño（ねえ、あなた）を恋人や子どもへの呼びかけにも使う。"},
{w:"aún",p:"adv",en:"still, yet",fr:"encore",ex:"Aún no has probado el cocido madrileño; no te vayas de Madrid sin comerlo.",exEn:"You still have not tried the Madrid stew; do not leave Madrid without eating it.",exFr:"Tu n'as pas encore goûté le cocido madrileño ; ne quitte pas Madrid sans en manger.",n:"ラテン語adhuc（今まで）から。todavía と同じ「まだ」。アクセントなしのaunは「〜さえ」の意味になる（aun así＝それでも）。"},
{w:"incluso",p:"adv",en:"even",fr:"même",ex:"En Sevilla todos bailan sevillanas, incluso los abuelos y los bebés.",exEn:"In Seville everyone dances sevillanas, even the grandparents and the babies.",exFr:"À Séville, tout le monde danse des sevillanas, même les grands-parents et les bébés.",n:"ラテン語inclusus（含まれた）から。英include と同源。「〜さえ、〜でも」の意味で、hastaとほぼ同じ。"},
{w:"sobre todo",p:"loc",en:"above all, especially",fr:"surtout",ex:"Visita Granada y, sobre todo, no te pierdas el atardecer desde el Albaicín.",exEn:"Visit Granada and, above all, do not miss the sunset from the Albaicín.",exFr:"Visite Grenade et, surtout, ne rate pas le coucher de soleil depuis l'Albaicín.",n:"sobre（上に）＋todo（すべて）で「すべての上に」。仏surtout とまったく同じ組み立て。アルバイシンはグラナダの旧イスラム街。"},
{w:"en vez de",p:"loc",en:"instead of",fr:"au lieu de",ex:"En vez de coger el taxi, ve andando por el Retiro; es más bonito.",exEn:"Instead of taking a taxi, walk through the Retiro; it is nicer.",exFr:"Au lieu de prendre un taxi, va à pied par le Retiro ; c'est plus joli.",n:"vez（回、順番）を使った表現で、「〜の番の代わりに」が原義。後ろには名詞や不定詞が来る。en lugar de〜も同じ意味。"},
{w:"a pesar de",p:"loc",en:"despite, in spite of",fr:"malgré",ex:"A pesar de la lluvia, la procesión salió, y nadie abrió el paraguas.",exEn:"Despite the rain, the procession went out, and nobody opened an umbrella.",exFr:"Malgré la pluie, la procession est sortie, et personne n'a ouvert de parapluie.",n:"pesar（悲しみ、重さ）を使った表現。a pesar de＋名詞・不定詞、a pesar de que＋節（事実なら直説法）。"},
{w:"sin que",p:"conj",en:"without (someone doing)",fr:"sans que",ex:"Entra en casa sin que te oiga la abuela, que está durmiendo la siesta.",exEn:"Come into the house without Grandma hearing you, because she is having her siesta.",exFr:"Entre dans la maison sans que Mamie t'entende, elle fait la sieste.",n:"sin（〜なしに）＋que。後ろは必ず接続法。主語が同じならsin＋不定詞（sin hacer ruido）。"},
{w:"con tal de que",p:"conj",en:"as long as, provided that",fr:"pourvu que, à condition que",ex:"Te presto el coche con tal de que me traigas ensaimadas de Mallorca.",exEn:"I will lend you the car as long as you bring me ensaimadas from Mallorca.",exFr:"Je te prête la voiture à condition que tu me rapportes des ensaïmadas de Majorque.",n:"条件を表す接続句で、後ろは必ず接続法。siempre que＋接続法も同じ意味になる。ensaimadaはマヨルカ島の渦巻きパン。"},
{w:"cuanto antes",p:"loc",en:"as soon as possible",fr:"le plus tôt possible",ex:"Reserva el hotel cuanto antes, que en San Fermín no queda ni una cama.",exEn:"Book the hotel as soon as possible, because during San Fermín there is not a single bed left.",exFr:"Réserve l'hôtel le plus tôt possible, parce que pendant la San Fermín, il ne reste pas un lit.",n:"「早ければ早いほど」の意味。lo antes posible と同じ。サン・フェルミン祭の時期のパンプローナは宿泊先を見つけるのが難しい。"},
{w:"de acuerdo",p:"loc",en:"agreed, OK",fr:"d'accord",ex:"—Pago yo las cañas y tú las tapas. —De acuerdo, pero no pidas jamón.",exEn:"I pay for the beers and you pay for the tapas. — Agreed, but do not order ham.",exFr:"Moi, je paie les bières et toi les tapas. — D'accord, mais ne commande pas de jambon.",n:"acuerdo（合意、acordar から）を使った表現で、仏d'accord とまったく同じ組み立て。estar de acuerdo con〜で「〜に賛成だ」。"},
{w:"venga",p:"interj",en:"come on!, OK then",fr:"allez !, allez, d'accord",ex:"¡Venga, levántate, que la churrería cierra a las once!",exEn:"Come on, get up, the churro shop closes at eleven!",exFr:"Allez, lève-toi, la churrería ferme à onze heures !",n:"venir（来る）の接続法3人称の形から。人を急かす「さあ」、同意の「じゃあね・OK」など、スペインの会話で非常によく使う。"},
{w:"oye",p:"interj",en:"hey, listen",fr:"écoute, dis donc",ex:"Oye, ¿me pasas la sal? Y, oye, no te comas todas las patatas.",exEn:"Hey, can you pass me the salt? And hey, do not eat all the potatoes.",exFr:"Dis donc, tu me passes le sel ? Et écoute, ne mange pas toutes les frites.",n:"oír（聞く）の tú への命令形から。親しい相手への呼びかけに使い、usted にはoiga と言う。"},
{w:"enhorabuena",p:"interj",en:"congratulations",fr:"félicitations",ex:"¡Enhorabuena por el trabajo! Ahora invítanos a unas cañas.",exEn:"Congratulations on the job! Now buy us a few beers.",exFr:"Félicitations pour le travail ! Maintenant, offre-nous quelques bières.",n:"en＋hora＋buena（良い時に）が一語になった。努力の成果への祝いに使い、誕生日などにはfelicidades を使う。"}
]},
  {id:8, title:"Nivel 8", range:"701–800", words:[
{w:"aprobar",p:"v",en:"to pass (an exam), to approve",fr:"réussir (un examen), approuver",ex:"Cuando apruebes el DELE, te invito a un menú del día con postre y café.",exEn:"When you pass the DELE, I will treat you to a set lunch with dessert and coffee.",exFr:"Quand tu auras réussi le DELE, je t'invite à un menú del día avec dessert et café.",n:"ラテン語approbare（認める）から。英approve、仏approuverと同源。o→ue変化（apruebo）。cuando＋接続法（未来のこと）。反対語はsuspender。"},
{w:"suspender",p:"v",en:"to fail (an exam), to suspend",fr:"échouer, recaler, suspendre",ex:"No te preocupes si suspendes matemáticas; en septiembre hay otra oportunidad.",exEn:"Do not worry if you fail maths; in September there is another chance.",exFr:"Ne t'inquiète pas si tu rates les maths ; en septembre, il y a une autre chance.",n:"ラテン語suspendere（つるす）から。英suspend、仏suspendreと同源。スペインでは「試験に落ちる・落とす」の意味でよく使う。落第者には9月に追試がある。"},
{w:"contratar",p:"v",en:"to hire",fr:"embaucher, engager",ex:"Es importante que contraten a alguien que hable inglés para el hotel de Benidorm.",exEn:"It is important that they hire someone who speaks English for the hotel in Benidorm.",exFr:"Il est important qu'ils embauchent quelqu'un qui parle anglais pour l'hôtel de Benidorm.",n:"contrato（契約）から作られた動詞。英contract、仏contracterと同源。alguien que＋接続法は「（まだ見つかっていない）〜するような人」を表す。"},
{w:"jubilarse",p:"v refl",en:"to retire",fr:"prendre sa retraite",ex:"Cuando me jubile, me iré a vivir a Alicante, como la mitad de Europa.",exEn:"When I retire, I will go and live in Alicante, like half of Europe.",exFr:"Quand je prendrai ma retraite, j'irai vivre à Alicante, comme la moitié de l'Europe.",n:"ラテン語iubilare（歓声を上げる）から。英jubilee と同源で、「退職は喜ばしいこと」という発想とされる。名詞はla jubilación。"},
{w:"firmar",p:"v",en:"to sign",fr:"signer",ex:"No firmes el contrato del piso hasta que veas la cocina con tus propios ojos.",exEn:"Do not sign the flat contract until you see the kitchen with your own eyes.",exFr:"Ne signe pas le contrat de l'appartement avant d'avoir vu la cuisine de tes propres yeux.",n:"ラテン語firmare（固める）から。英confirm、仏fermeと同源。名詞はla firma（署名）。hasta que＋接続法。"},
{w:"rellenar",p:"v",en:"to fill in, to stuff",fr:"remplir, farcir",ex:"Rellena este formulario con letras mayúsculas, que el funcionario no lee otra cosa.",exEn:"Fill in this form in capital letters, because the civil servant does not read anything else.",exFr:"Remplis ce formulaire en majuscules, parce que le fonctionnaire ne lit rien d'autre.",n:"re-＋llenar（満たす）から。書類に「記入する」のほか、料理で「詰め物をする」の意味もある（pimientos rellenos）。"},
{w:"entregar",p:"v",en:"to hand in, to deliver",fr:"remettre, livrer",ex:"Entrega el trabajo antes del viernes, o el profesor no te lo corregirá.",exEn:"Hand in the assignment before Friday, or the teacher will not mark it.",exFr:"Rends le travail avant vendredi, sinon le professeur ne le corrigera pas.",n:"ラテン語integrare（完全にする）から来たとされ、英integrate と同源。「手渡す・提出する・配達する」の意味。接続法ではg→gu（entregue）。"},
{w:"imprimir",p:"v",en:"to print",fr:"imprimer",ex:"Imprime las entradas del AVE, por si no funciona el móvil en la estación.",exEn:"Print the AVE tickets, in case your phone does not work at the station.",exFr:"Imprime les billets de l'AVE, au cas où ton portable ne marcherait pas à la gare.",n:"ラテン語imprimere（押しつける）から。英print・impress、仏imprimerと同源。過去分詞はimpreso。AVEはスペインの高速鉄道。"},
{w:"cargar",p:"v",en:"to load, to charge",fr:"charger",ex:"Carga el móvil antes de salir, para que puedas hacer fotos de toda la procesión.",exEn:"Charge your phone before you go out, so that you can take photos of the whole procession.",exFr:"Charge ton portable avant de sortir, pour que tu puisses prendre en photo toute la procession.",n:"carro（荷車）から作られた語で、「荷を積む」が原義。英charge・cargo、仏chargerと同源。接続法ではg→gu（cargue）。"},
{w:"arreglar",p:"v",en:"to fix, to arrange",fr:"réparer, arranger",ex:"Busca a alguien que arregle la persiana antes de que llegue el verano.",exEn:"Find someone who can fix the blind before summer comes.",exFr:"Trouve quelqu'un qui répare le store avant que l'été arrive.",n:"regla（規則、ラテン語regula）から「整える」。英regular と同源。arreglarse は「身支度をする」。スペインの家の窓の外付けブラインド（persiana）は夏の必需品。"},
{w:"funcionar",p:"v",en:"to work, to function",fr:"fonctionner, marcher",ex:"Si el aire acondicionado no funciona, cierra las persianas de día y abre las ventanas de noche, como hacían los abuelos.",exEn:"If the air conditioning does not work, close the blinds during the day and open the windows at night, as our grandparents did.",exFr:"Si la climatisation ne marche pas, ferme les stores le jour et ouvre les fenêtres la nuit, comme le faisaient les grands-parents.",n:"función（機能、ラテン語functio）から作られた動詞。英function と同源。機械が「動く・作動する」の意味。計画などが「うまくいく」にも使う。¿Cómo funciona esto?は「これはどうやって使うの？」。"},
{w:"proteger",p:"v",en:"to protect",fr:"protéger",ex:"Protege tu piel del sol, aunque estés en el norte y parezca que está nublado.",exEn:"Protect your skin from the sun, even if you are in the north and it looks cloudy.",exFr:"Protège ta peau du soleil, même si tu es dans le nord et que le temps semble nuageux.",n:"ラテン語protegere（前を覆う）から。英protect、仏protégerと同源。1人称現在と接続法はg→j（protejo, proteja）。"},
{w:"reciclar",p:"v",en:"to recycle",fr:"recycler",ex:"Recicla el vidrio en el contenedor verde, pero no lo hagas a las tres de la mañana.",exEn:"Recycle glass in the green bin, but do not do it at three in the morning.",exFr:"Recycle le verre dans le conteneur vert, mais ne le fais pas à trois heures du matin.",n:"re-＋ciclo（循環）から。英recycle、仏recyclerと同源。スペインでは瓶は緑、プラスチックは黄、紙は青のコンテナに分けて捨てる。"},
{w:"respetar",p:"v",en:"to respect",fr:"respecter",ex:"Respeta la hora de la siesta: en mi pueblo nadie hace ruido de tres a cinco.",exEn:"Respect siesta time: in my village nobody makes noise from three to five.",exFr:"Respecte l'heure de la sieste : dans mon village, personne ne fait de bruit de trois à cinq heures.",n:"ラテン語respectare（振り返って見る）から。英respect、仏respecterと同源。名詞はel respeto。"},
{w:"reducir",p:"v",en:"to reduce",fr:"réduire",ex:"El médico quiere que reduzca la sal, pero sin sal el jamón no es jamón.",exEn:"The doctor wants me to cut down on salt, but without salt ham is not ham.",exFr:"Le médecin veut que je réduise le sel, mais sans sel, le jambon n'est pas du jambon.",n:"ラテン語reducere（引き戻す）から。英reduce、仏réduireと同源。1人称現在と接続法はzc（reduzco, reduzca）。"},
{w:"aumentar",p:"v",en:"to increase",fr:"augmenter",ex:"Ojalá que me aumenten el sueldo; con lo que gano, solo puedo pagar el alquiler y las cañas.",exEn:"I hope they raise my salary; with what I earn, I can only pay the rent and the beers.",exFr:"Pourvu qu'on m'augmente mon salaire ; avec ce que je gagne, je ne peux payer que le loyer et les bières.",n:"ラテン語augmentare（増やす）から。英augment、仏augmenterと同源。反対語はreducir / disminuir。"},
{w:"desaparecer",p:"v",en:"to disappear",fr:"disparaître",ex:"No dejes el turrón en la mesa, que en esta casa las cosas dulces desaparecen enseguida.",exEn:"Do not leave the turrón on the table, because in this house sweet things disappear right away.",exFr:"Ne laisse pas le touron sur la table, parce que dans cette maison, les choses sucrées disparaissent tout de suite.",n:"des-＋aparecer（現れる）から。1人称現在はdesaparezco。仏disparaître、英disappear と同じ組み立て。"},
{w:"aparecer",p:"v",en:"to appear, to show up",fr:"apparaître, se montrer",ex:"Cuando aparezca el sol, salimos a la terraza; hasta entonces, chocolate con churros.",exEn:"When the sun comes out, we will go out onto the terrace; until then, hot chocolate with churros.",exFr:"Quand le soleil apparaîtra, on sortira sur la terrasse ; d'ici là, chocolat et churros.",n:"ラテン語apparere（現れる）から。英appear、仏apparaîtreと同源。1人称現在はaparezco。cuando＋接続法。"},
{w:"convertirse",p:"v refl",en:"to become, to turn into",fr:"devenir, se transformer",ex:"En Carnaval, mi tío se convierte en otra persona; no te asustes si lo ves vestido de reina.",exEn:"At Carnival, my uncle turns into someone else; do not be scared if you see him dressed as a queen.",exFr:"Au carnaval, mon oncle devient quelqu'un d'autre ; n'aie pas peur si tu le vois habillé en reine.",n:"ラテン語convertere（向きを変える）から。英convert、仏convertirと同源。e→ie変化。convertirse en〜で「〜に変わる」。"},
{w:"quedar",p:"v",en:"to be left, to meet, to arrange",fr:"rester, se retrouver",ex:"Quedemos en la Puerta del Sol, debajo del oso, para que no nos perdamos.",exEn:"Let us meet at the Puerta del Sol, under the bear statue, so that we do not lose each other.",exFr:"Retrouvons-nous à la Puerta del Sol, sous l'ours, pour ne pas nous perdre.",n:"quedarse（とどまる）の非再帰形。「残る」（no queda pan）、「待ち合わせる」（quedar con alguien）、「似合う」（te queda bien）など用途が広い。熊とイチゴノキの像はマドリードの待ち合わせの定番。"},
{w:"sobrar",p:"v",en:"to be left over, to be too much",fr:"rester, être en trop",ex:"Si sobra paella, guárdala para mañana; fría también está buena.",exEn:"If there is paella left over, save it for tomorrow; it is good cold too.",exFr:"S'il reste de la paella, garde-la pour demain ; froide, elle est bonne aussi.",n:"ラテン語superare（上回る）から。英superior と同源。gustarと同じ構文も取る（me sobra tiempo）。名詞las sobrasは「残り物」。"},
{w:"caber",p:"v",en:"to fit",fr:"tenir, rentrer",ex:"No creo que quepan diez personas en el coche, aunque en mi pueblo lo hacían.",exEn:"I do not think ten people fit in the car, although in my village they used to do it.",exFr:"Je ne crois pas que dix personnes tiennent dans la voiture, même si dans mon village on le faisait.",n:"ラテン語capere（取る、収める）から。英capacity と同源。1人称現在はquepo、接続法はquepaと不規則。no creer que＋接続法。"},
{w:"bastar",p:"v",en:"to be enough",fr:"suffire",ex:"Basta con que traigas el pan; la tortilla y el vino ya los tenemos.",exEn:"It is enough that you bring the bread; we already have the tortilla and the wine.",exFr:"Il suffit que tu apportes le pain ; la tortilla et le vin, on les a déjà.",n:"俗ラテン語bastare（足りる）から。英bastion とは別語。basta con que＋接続法で「〜しさえすればいい」。¡Basta!は「もうたくさんだ！」。"},
{w:"acostumbrarse",p:"v refl",en:"to get used to",fr:"s'habituer",ex:"Es normal que te cueste acostumbrarte a cenar a las diez, pero lo conseguirás.",exEn:"It is normal that you find it hard to get used to having dinner at ten, but you will manage.",exFr:"C'est normal que tu aies du mal à t'habituer à dîner à dix heures, mais tu y arriveras.",n:"costumbre（習慣）から作られた動詞。仏s'accoutumer と同じ組み立て。acostumbrarse a〜で「〜に慣れる」。es normal que＋接続法。"},
{w:"atreverse",p:"v refl",en:"to dare",fr:"oser",ex:"Atrévete a probar los caracoles; en Lleida hay una fiesta solo para ellos.",exEn:"Dare to try the snails; in Lleida there is a festival just for them.",exFr:"Ose goûter les escargots ; à Lérida, il y a une fête rien que pour eux.",n:"ラテン語tribuere（与える）に由来するとされ、「自分に許す」→「思い切って〜する」。atreverse a＋不定詞。リェイダでは毎年カタツムリ祭り（Aplec del Caragol）が開かれる。"},
{w:"obligar",p:"v",en:"to force, to oblige",fr:"obliger, forcer",ex:"No me obligues a bailar la conga en la boda, que la última vez me caí.",exEn:"Do not make me dance the conga at the wedding, because last time I fell over.",exFr:"Ne m'oblige pas à danser la conga au mariage, la dernière fois je suis tombé.",n:"ラテン語obligare（縛りつける）から。英oblige・obligation、仏obligerと同源。obligar a＋不定詞。否定命令ではg→gu（no obligues）。"},
{w:"avisar",p:"v",en:"to let know, to warn",fr:"prévenir, avertir",ex:"Avísame cuando llegues a casa, que ya sabes cómo es tu madre.",exEn:"Let me know when you get home, because you know what your mother is like.",exFr:"Préviens-moi quand tu arrives à la maison, tu sais comment est ta mère.",n:"仏aviser（知らせる）からの借用語とされ、英advise と同源。「知らせる」「警告する」の意味。名詞el avisoは「お知らせ・警告」。"},
{w:"resolver",p:"v",en:"to solve, to resolve",fr:"résoudre",ex:"Resuelve el problema tú solo, que yo me voy al bar a ver el partido.",exEn:"Solve the problem by yourself, because I am off to the bar to watch the match.",exFr:"Résous le problème tout seul, moi je vais au bar voir le match.",n:"ラテン語resolvere（ほどく）から。英resolve・solve、仏résoudreと同源。o→ue変化（resuelvo）、過去分詞はresuelto。"},
{w:"comprobar",p:"v",en:"to check, to verify",fr:"vérifier",ex:"Comprueba que llevas el pasaporte antes de salir; el año pasado lo dejamos en la nevera.",exEn:"Check that you have your passport before leaving; last year we left it in the fridge.",exFr:"Vérifie que tu as ton passeport avant de partir ; l'année dernière, on l'a laissé dans le frigo.",n:"com-＋probar（試す）から。o→ue変化（compruebo）。英prove、仏prouver と同じ語根。"},
{w:"notar",p:"v",en:"to notice",fr:"remarquer, sentir",ex:"No creo que nadie note que la paella es de ayer, si la calientas bien.",exEn:"I do not think anyone will notice the paella is from yesterday, if you heat it up well.",exFr:"Je ne crois pas que quelqu'un remarque que la paella date d'hier, si tu la réchauffes bien.",n:"ラテン語notare（印を付ける）から。英note・notice、仏noterと同源。「気づく・感じる」の意味。成績のla nota も同じ語根。"},
{w:"aprovechar",p:"v",en:"to make the most of, to take advantage of",fr:"profiter de",ex:"Aprovecha que hace sol y ve a la playa, que en Galicia no dura mucho.",exEn:"Make the most of the sun and go to the beach, because in Galicia it does not last long.",exFr:"Profite du soleil et va à la plage, parce qu'en Galice ça ne dure pas longtemps.",n:"provecho（利益、ラテン語profectus）から。英profit と同源。食事の前後に言う¡Que aproveche! / ¡Buen provecho!は「召し上がれ」。"},
{w:"lograr",p:"v",en:"to achieve, to manage",fr:"réussir à, obtenir",ex:"Espero que logres subir al Teide antes de que se ponga el sol.",exEn:"I hope you manage to climb the Teide before the sun goes down.",exFr:"J'espère que tu réussiras à monter au Teide avant que le soleil se couche.",n:"ラテン語lucrari（もうける）から。英lucrative と同源。lograr＋不定詞で「〜を成し遂げる」。conseguirとほぼ同じ意味。"},
{w:"merecer",p:"v",en:"to deserve",fr:"mériter",ex:"Te mereces unas vacaciones; vete a Menorca y no mires el correo.",exEn:"You deserve a holiday; go to Menorca and do not check your email.",exFr:"Tu mérites des vacances ; va à Minorque et ne regarde pas tes mails.",n:"ラテン語merere（得る、値する）から。英merit、仏mériterと同源。1人称現在はmerezco。merecer la pena（〜する価値がある）は重要表現。"},
{w:"valer",p:"v",en:"to be worth, to cost",fr:"valoir, coûter",ex:"Vale la pena que vayas a Granada solo para ver la Alhambra de noche.",exEn:"It is worth going to Granada just to see the Alhambra at night.",exFr:"Ça vaut la peine que tu ailles à Grenade rien que pour voir l'Alhambra de nuit.",n:"ラテン語valere（力がある）から。英value・valid、仏valoirと同源。1人称現在はvalgo。¿Cuánto vale?（いくら？）、vale la pena（価値がある）。会話のValeもこの動詞から。"},
{w:"la carrera",p:"nf",en:"degree, career, race",fr:"les études, la carrière, la course",ex:"Estudia la carrera que te guste, aunque tu abuela quiera que seas médico.",exEn:"Study the degree you like, even if your grandmother wants you to be a doctor.",exFr:"Fais les études qui te plaisent, même si ta grand-mère veut que tu sois médecin.",n:"carro（車）から、元は「車の走る道」。英career、仏carrièreと同源。「大学の専攻・学位課程」「経歴」「競走」の意味がある。"},
{w:"la asignatura",p:"nf",en:"(school) subject",fr:"la matière",ex:"Mi asignatura favorita era el recreo; la segunda, la historia de España.",exEn:"My favorite subject was break time; the second, the history of Spain.",exFr:"Ma matière préférée était la récréation ; la deuxième, l'histoire de l'Espagne.",n:"asignar（割り当てる、ラテン語assignare）から。英assign と同源。落とした科目が翌年に残ることはasignatura pendienteと言い、「やり残したこと」の比喩にもなる。"},
{w:"el horario",p:"nm",en:"schedule, timetable, opening hours",fr:"l'horaire",ex:"Mira el horario del museo antes de ir, que los lunes suele estar cerrado.",exEn:"Check the museum's opening hours before you go, because it is usually closed on Mondays.",exFr:"Regarde les horaires du musée avant d'y aller, parce qu'il est souvent fermé le lundi.",n:"hora（時間）から作られた語。英hour、仏horaireと同源。スペインは地理的にはイギリスと同じ時間帯だが、中央ヨーロッパ時間を使っている。"},
{w:"la reunión",p:"nf",en:"meeting",fr:"la réunion",ex:"No pongas la reunión a las dos, que a esa hora en España todo el mundo está comiendo.",exEn:"Do not schedule the meeting at two, because at that time everyone in Spain is having lunch.",exFr:"Ne fixe pas la réunion à deux heures, parce qu'à cette heure-là, en Espagne, tout le monde déjeune.",n:"re-＋unión（結合）から。英reunion、仏réunionと同源。-ciónと同じく-iónで終わる名詞は女性名詞。"},
{w:"el sueldo",p:"nm",en:"salary, wages",fr:"le salaire",ex:"En España muchos cobran el sueldo en catorce pagas: dos extra en verano y Navidad.",exEn:"In Spain many people are paid their salary in fourteen payments: two extra in summer and at Christmas.",exFr:"En Espagne, beaucoup touchent leur salaire en quatorze mensualités : deux en plus en été et à Noël.",n:"古いローマの金貨solidus に由来するとされ、英soldier（給料をもらう兵）と同源。スペインでは年14回払いの給与（pagas extra）が一般的。"},
{w:"el contrato",p:"nm",en:"contract",fr:"le contrat",ex:"Lee bien el contrato antes de firmar, sobre todo la letra pequeña.",exEn:"Read the contract carefully before signing, especially the small print.",exFr:"Lis bien le contrat avant de signer, surtout les petits caractères.",n:"ラテン語contractus（結ばれたもの）から。英contract、仏contratと同源。la letra pequeñaは「小さな字の注意書き」。"},
{w:"la entrevista",p:"nf",en:"interview",fr:"l'entretien, l'interview",ex:"Llega pronto a la entrevista y no hables de fútbol, a menos que te pregunten.",exEn:"Arrive early for the interview and do not talk about football, unless they ask you.",exFr:"Arrive tôt à l'entretien et ne parle pas de football, à moins qu'on ne te le demande.",n:"entre＋vista（見ること）から。英interview、仏entrevueと同じ組み立て。a menos que＋接続法。"},
{w:"el negocio",p:"nm",en:"business, deal",fr:"l'affaire, le commerce",ex:"Mis tíos tienen un negocio de churros en Madrid desde 1950; no se lo digas a nadie, pero la receta es secreta.",exEn:"My aunt and uncle have had a churro business in Madrid since 1950; do not tell anyone, but the recipe is secret.",exFr:"Mon oncle et ma tante tiennent un commerce de churros à Madrid depuis 1950 ; ne le dis à personne, mais la recette est secrète.",n:"ラテン語negotium（仕事、nec＋otium＝暇でないこと）から。英negotiate、仏négoceと同源。"},
{w:"el éxito",p:"nm",en:"success, hit",fr:"le succès",ex:"Te deseo mucho éxito en tu nuevo trabajo en Barcelona.",exEn:"I wish you great success in your new job in Barcelona.",exFr:"Je te souhaite beaucoup de succès dans ton nouveau travail à Barcelone.",n:"ラテン語exitus（出口、結末）から。英exit と同源だが、スペイン語では「成功」の意味になった。英successに当たる。tener éxito（成功する）。"},
{w:"el esfuerzo",p:"nm",en:"effort",fr:"l'effort",ex:"Haz un esfuerzo y habla español con el camarero, aunque te conteste en inglés.",exEn:"Make an effort and speak Spanish with the waiter, even if he answers you in English.",exFr:"Fais un effort et parle espagnol avec le serveur, même s'il te répond en anglais.",n:"es-＋fuerza（力）から。英effort、仏effortと同じ組み立て（ex＋fortis）。hacer un esfuerzo（努力する）。"},
{w:"la experiencia",p:"nf",en:"experience",fr:"l'expérience",ex:"Vivir un año en Sevilla será la mejor experiencia de tu vida; prepárate para el calor.",exEn:"Living in Seville for a year will be the best experience of your life; get ready for the heat.",exFr:"Vivre un an à Séville sera la meilleure expérience de ta vie ; prépare-toi à la chaleur.",n:"ラテン語experientia（試すこと）から。英experience、仏expérienceと同源。「経験」と「実験」の両方の意味。"},
{w:"el medio ambiente",p:"nm",en:"environment",fr:"l'environnement",ex:"Para cuidar el medio ambiente, lleva tu propia bolsa al mercado.",exEn:"To look after the environment, take your own bag to the market.",exFr:"Pour protéger l'environnement, apporte ton propre sac au marché.",n:"medio（中間）＋ambiente（周囲）で「周りを取り巻くもの」。英ambient と同源。2語だが一つの名詞として使う。"},
{w:"la naturaleza",p:"nf",en:"nature",fr:"la nature",ex:"Si te gusta la naturaleza, visita Picos de Europa antes de que lleguen los turistas de agosto.",exEn:"If you like nature, visit the Picos de Europa before the August tourists arrive.",exFr:"Si tu aimes la nature, visite les Picos de Europa avant que les touristes d'août n'arrivent.",n:"ラテン語natura（生まれつきのもの）から。英nature、仏natureと同源。ピコス・デ・エウロパはスペイン北部の国立公園。"},
{w:"el paisaje",p:"nm",en:"landscape, scenery",fr:"le paysage",ex:"Mira el paisaje desde el tren: olivos y más olivos hasta el horizonte, eso es Jaén.",exEn:"Look at the scenery from the train: olive trees and more olive trees to the horizon, that is Jaén.",exFr:"Regarde le paysage depuis le train : des oliviers et encore des oliviers jusqu'à l'horizon, c'est ça, Jaén.",n:"仏paysageからの借用語で、país（国、土地）と同じ語根。-ajeで終わる名詞は男性名詞。ハエン県は世界最大級のオリーブ産地。"},
{w:"la costa",p:"nf",en:"coast",fr:"la côte",ex:"Recorre la costa de Cantabria en coche, para que veas pueblos que parecen de cuento.",exEn:"Drive along the Cantabrian coast, so that you see villages that look like something out of a fairy tale.",exFr:"Parcours la côte de Cantabrie en voiture, pour voir des villages qui semblent sortis d'un conte.",n:"ラテン語costa（肋骨、脇）から。英coast、仏côteと同源。Costa del Sol、Costa Bravaなど、スペインの海岸には愛称がある。"},
{w:"el desierto",p:"nm",en:"desert",fr:"le désert",ex:"En el desierto de Tabernas, en Almería, rodaron muchas películas del Oeste.",exEn:"In the Tabernas desert, in Almería, they shot many Westerns.",exFr:"Dans le désert de Tabernas, en Almería, on a tourné beaucoup de westerns.",n:"ラテン語desertus（見捨てられた）から。英desert、仏désertと同源。アルメリアのタベルナス砂漠はヨーロッパ唯一の砂漠と呼ばれ、西部劇の撮影地として有名。"},
{w:"la selva",p:"nf",en:"jungle, rainforest",fr:"la jungle, la forêt vierge",ex:"Cuando vayas a la selva de Costa Rica, no toques ninguna rana de colores.",exEn:"When you go to the Costa Rican rainforest, do not touch any colorful frogs.",exFr:"Quand tu iras dans la forêt tropicale du Costa Rica, ne touche aucune grenouille colorée.",n:"ラテン語silva（森）から。英sylvan、仏sauvage（元は「森の」）と同源。人名Silviaも同じ語から。"},
{w:"el volcán",p:"nm",en:"volcano",fr:"le volcan",ex:"En Lanzarote te cocinan el pollo con el calor del volcán; no te lo pierdas.",exEn:"In Lanzarote they cook your chicken with the heat of the volcano; do not miss it.",exFr:"À Lanzarote, on te cuit le poulet avec la chaleur du volcan ; ne rate pas ça.",n:"ローマ神話の火の神Vulcanusから。英volcano、仏volcanと同源。ランサローテ島のティマンファヤ国立公園では地熱で料理をするレストランがある。"},
{w:"la ola",p:"nf",en:"wave",fr:"la vague",ex:"No te bañes si las olas son muy grandes; en el Cantábrico el mar no es como en Benidorm.",exEn:"Do not go in the water if the waves are very big; the Cantabrian Sea is not like Benidorm.",exFr:"Ne te baigne pas si les vagues sont très grosses ; dans la mer Cantabrique, ce n'est pas comme à Benidorm.",n:"語源ははっきりしない。「波」のほか、ola de calor（熱波）、ola de frío（寒波）のようにも使う。hola（こんにちは）とは発音が同じだが別語。"},
{w:"la arena",p:"nf",en:"sand",fr:"le sable",ex:"Sacude bien la toalla, que no quiero arena de la playa en el coche.",exEn:"Shake the towel well, because I do not want sand from the beach in the car.",exFr:"Secoue bien la serviette, je ne veux pas de sable de la plage dans la voiture.",n:"ラテン語arena（砂）から。英arena（元は砂を敷いた闘技場）と同源。闘牛場の砂場もla arena。"},
{w:"el planeta",p:"nm",en:"planet",fr:"la planète",ex:"Cuidemos el planeta: no hay otro con tapas, siesta y playa.",exEn:"Let us look after the planet: there is no other one with tapas, siestas and beaches.",exFr:"Prenons soin de la planète : il n'y en a pas d'autre avec des tapas, la sieste et la plage.",n:"ギリシャ語planētēs（さまよう者）から。英planet と同源。-aで終わるが男性名詞（el planeta）。"},
{w:"la energía",p:"nf",en:"energy",fr:"l'énergie",ex:"Necesito que me des energía: pásame otro café con leche y una tostada.",exEn:"I need you to give me energy: pass me another white coffee and a piece of toast.",exFr:"J'ai besoin que tu me donnes de l'énergie : passe-moi un autre café au lait et une tartine.",n:"ギリシャ語energeia（活動）から。英energy、仏énergieと同源。スペインは風力や太陽光などの再生可能エネルギーの利用が進んでいる。"},
{w:"la sociedad",p:"nf",en:"society, company",fr:"la société",ex:"En una sociedad gastronómica vasca, los socios cocinan juntos y nadie mira el reloj.",exEn:"In a Basque gastronomic society, the members cook together and nobody looks at the clock.",exFr:"Dans une société gastronomique basque, les membres cuisinent ensemble et personne ne regarde l'heure.",n:"ラテン語societas（仲間の集まり）から。英society、仏sociétéと同源。バスク地方には会員制の料理クラブ（sociedad gastronómica）の伝統がある。"},
{w:"el gobierno",p:"nm",en:"government",fr:"le gouvernement",ex:"No hables del gobierno en la comida de Navidad, a no ser que quieras una guerra.",exEn:"Do not talk about the government at Christmas lunch, unless you want a war.",exFr:"Ne parle pas du gouvernement au repas de Noël, à moins que tu ne veuilles une guerre.",n:"ラテン語gubernare（舵を取る）から。英govern、仏gouvernementと同源。a no ser que＋接続法（〜でない限り）。"},
{w:"la ley",p:"nf",en:"law",fr:"la loi",ex:"Hay una ley que prohíbe fumar en los bares, y ahora la ropa no huele a tabaco.",exEn:"There is a law that bans smoking in bars, and now your clothes do not smell of tobacco.",exFr:"Il y a une loi qui interdit de fumer dans les bars, et maintenant les vêtements ne sentent plus le tabac.",n:"ラテン語lex, legis（法）から。英legal、仏loiと同源。複数形はleyes。スペインでは2011年から屋内の飲食店は全面禁煙。"},
{w:"el derecho",p:"nm",en:"right, law (subject)",fr:"le droit",ex:"Todo el mundo tiene derecho a una siesta, aunque sea de diez minutos.",exEn:"Everyone has the right to a siesta, even if it is only ten minutes long.",exFr:"Tout le monde a droit à une sieste, même si c'est seulement dix minutes.",n:"ラテン語directus（まっすぐな）から。英direct、仏droitと同源。名詞で「権利」「法律学」、形容詞で「右の・まっすぐな」。tener derecho a〜で「〜する権利がある」。"},
{w:"la paz",p:"nf",en:"peace",fr:"la paix",ex:"Déjame en paz, que estoy viendo la final y quedan dos minutos.",exEn:"Leave me in peace, I am watching the final and there are two minutes left.",exFr:"Laisse-moi tranquille, je regarde la finale et il reste deux minutes.",n:"ラテン語pax, pacis（平和）から。英peace、仏paixと同源。複数形はpaces（z→c）。dejar en paz（放っておく）。"},
{w:"la cultura",p:"nf",en:"culture",fr:"la culture",ex:"Para entender la cultura española, pasa un domingo en el Rastro y luego come en una terraza.",exEn:"To understand Spanish culture, spend a Sunday at the Rastro and then eat on a terrace.",exFr:"Pour comprendre la culture espagnole, passe un dimanche au Rastro et mange ensuite en terrasse.",n:"ラテン語cultura（耕作）から。英culture・agriculture、仏cultureと同源。エル・ラストロはマドリードの日曜の蚤の市。"},
{w:"el arte",p:"nm",en:"art",fr:"l'art",ex:"Si te gusta el arte moderno, no te pierdas el Reina Sofía; si no, ve al Prado.",exEn:"If you like modern art, do not miss the Reina Sofía; if not, go to the Prado.",exFr:"Si tu aimes l'art moderne, ne rate pas le Reina Sofía ; sinon, va au Prado.",n:"ラテン語ars, artis（技術）から。英art、仏artと同源。単数は男性（el arte moderno）、複数は女性（las bellas artes）になることが多い特殊な名詞。"},
{w:"la obra",p:"nf",en:"work, play, construction work",fr:"l'œuvre, les travaux",ex:"Cuando termine la obra de la calle, podremos dormir la siesta otra vez.",exEn:"When the roadworks on the street are finished, we will be able to have a siesta again.",exFr:"Quand les travaux de la rue seront finis, nous pourrons refaire la sieste.",n:"ラテン語opera（仕事）から。英opera・operate、仏œuvreと同源。「作品」「演劇」「工事」の意味がある。obra maestraは「傑作」。"},
{w:"la época",p:"nf",en:"time, period, era",fr:"l'époque",ex:"En la época de los romanos, Mérida era una de las ciudades más importantes de Hispania.",exEn:"In Roman times, Mérida was one of the most important cities in Hispania.",exFr:"À l'époque romaine, Mérida était l'une des villes les plus importantes d'Hispanie.",n:"ギリシャ語epochē（停止点）から。英epoch、仏époqueと同源。en esta época del año（この時期は）もよく使う。"},
{w:"el futuro",p:"nm",en:"future",fr:"l'avenir, le futur",ex:"No te preocupes por el futuro: come, bebe y aprende el subjuntivo.",exEn:"Do not worry about the future: eat, drink and learn the subjunctive.",exFr:"Ne t'inquiète pas pour l'avenir : mange, bois et apprends le subjonctif.",n:"ラテン語futurus（これから起きる）から。英future、仏futurと同源。文法の「未来形」もel futuro。"},
{w:"el principio",p:"nm",en:"beginning, principle",fr:"le début, le principe",ex:"Al principio no entenderás a los andaluces, pero después de un mes hablarás como ellos.",exEn:"At first you will not understand Andalusians, but after a month you will speak like them.",exFr:"Au début, tu ne comprendras pas les Andalous, mais après un mois, tu parleras comme eux.",n:"ラテン語principium（始まり）から。英principle・prince、仏principeと同源。al principio（最初は）、a principios de mes（月初めに）。"},
{w:"el final",p:"nm",en:"end",fr:"la fin",ex:"No me cuentes el final de la serie; todavía voy por la segunda temporada.",exEn:"Do not tell me the end of the series; I am still on the second season.",exFr:"Ne me raconte pas la fin de la série ; j'en suis encore à la deuxième saison.",n:"fin（終わり）から作られた語。英final と同源。el final は「結末」、la final は「決勝戦」と冠詞で意味が変わる。"},
{w:"la mitad",p:"nf",en:"half",fr:"la moitié",ex:"Dame la mitad de tu bocadillo y te doy la mitad de mi horchata.",exEn:"Give me half of your sandwich and I will give you half of my horchata.",exFr:"Donne-moi la moitié de ton sandwich et je te donne la moitié de mon horchata.",n:"ラテン語medietas（中間）から。仏moitiéと同源。medio（半分の）と同じ語根。horchataはバレンシアのカヤツリグサの塊茎で作る甘い飲み物。"},
{w:"la razón",p:"nf",en:"reason",fr:"la raison",ex:"Tienes razón: el gazpacho está mejor con pepino, pero no se lo digas a mi madre.",exEn:"You are right: gazpacho is better with cucumber, but do not tell my mother.",exFr:"Tu as raison : le gazpacho est meilleur avec du concombre, mais ne le dis pas à ma mère.",n:"ラテン語ratio（計算、理性）から。英reason・ratio、仏raisonと同源。tener razón（正しい）は仏avoir raisonと同じ発想。"},
{w:"la idea",p:"nf",en:"idea",fr:"l'idée",ex:"¡Qué buena idea que vayamos a Cádiz en Carnaval! Busca un disfraz.",exEn:"What a good idea for us to go to Cádiz for Carnival! Find a costume.",exFr:"Quelle bonne idée d'aller à Cadix pour le carnaval ! Trouve un déguisement.",n:"ギリシャ語idea（見た目、形）から。英idea、仏idéeと同源。No tengo ni idea.（全然わからない）は会話の定番。"},
{w:"la opinión",p:"nf",en:"opinion",fr:"l'opinion",ex:"No cambies de opinión ahora; ya hemos pedido la paella para ocho.",exEn:"Do not change your mind now; we have already ordered paella for eight.",exFr:"Ne change pas d'avis maintenant ; nous avons déjà commandé la paella pour huit.",n:"ラテン語opinio（考え）から。英opinion、仏opinionと同源。en mi opinión（私の考えでは）、cambiar de opinión（考えを変える）。"},
{w:"cierto",p:"adj",en:"true, certain",fr:"vrai, certain",ex:"No es cierto que los españoles duerman la siesta todos los días; casi nadie tiene tiempo.",exEn:"It is not true that Spaniards have a siesta every day; hardly anyone has the time.",exFr:"Il n'est pas vrai que les Espagnols fassent la sieste tous les jours ; presque personne n'a le temps.",n:"ラテン語certus（確かな）から。英certain、仏certainと同源。es cierto que＋直説法、no es cierto que＋接続法。名詞の前では「ある〜」の意味（cierto día）。"},
{w:"falso",p:"adj",en:"false, fake",fr:"faux",ex:"Es falso que en España todos bailen flamenco; en Galicia bailan la muiñeira.",exEn:"It is false that everyone in Spain dances flamenco; in Galicia they dance the muiñeira.",exFr:"Il est faux que tout le monde danse le flamenco en Espagne ; en Galice, on danse la muiñeira.",n:"ラテン語falsus（偽りの）から。英false、仏fauxと同源。es falso que＋接続法。muiñeiraはガリシアの伝統舞踊。"},
{w:"justo",p:"adj",en:"fair, just, exact",fr:"juste",ex:"No es justo que tú te comas todas las gambas y yo solo las cabezas.",exEn:"It is not fair that you eat all the prawns and I only get the heads.",exFr:"Ce n'est pas juste que tu manges toutes les crevettes et moi seulement les têtes.",n:"ラテン語iustus（正しい）から。英just・justice、仏justeと同源。副詞として「ちょうど」の意味にもなる（justo a tiempo）。スペインではエビの頭を吸うのが通の食べ方。"},
{w:"capaz",p:"adj",en:"capable, able",fr:"capable",ex:"No creo que seas capaz de comer doce uvas en doce campanadas; es más difícil de lo que parece.",exEn:"I do not think you can eat twelve grapes in twelve chimes; it is harder than it looks.",exFr:"Je ne crois pas que tu sois capable de manger douze raisins en douze coups ; c'est plus difficile qu'il n'y paraît.",n:"ラテン語capax（収容できる）から。英capable、仏capableと同源。複数形はcapaces。ser capaz de＋不定詞。"},
{w:"responsable",p:"adj",en:"responsible",fr:"responsable",ex:"Sé responsable y no conduzcas después de la fiesta; volvemos en taxi.",exEn:"Be responsible and do not drive after the party; we will go back by taxi.",exFr:"Sois responsable et ne conduis pas après la fête ; on rentre en taxi.",n:"ラテン語respondere（応える）から。英responsible、仏responsableと同源。男女同形。conducirの否定命令はno conduzcas。"},
{w:"público",p:"adj",en:"public",fr:"public",ex:"La sanidad pública en España es buena, pero pide cita con tiempo.",exEn:"Public health care in Spain is good, but ask for an appointment in advance.",exFr:"La santé publique en Espagne est bonne, mais prends rendez-vous à l'avance.",n:"ラテン語publicus（民衆の）から。英public、仏publicと同源。名詞el públicoは「観客・聴衆」。"},
{w:"privado",p:"adj",en:"private",fr:"privé",ex:"No publiques fotos de la boda en redes; la familia de la novia quiere que sea algo privado.",exEn:"Do not post wedding photos online; the bride's family wants it to be private.",exFr:"Ne publie pas de photos du mariage sur les réseaux ; la famille de la mariée veut que ça reste privé.",n:"ラテン語privatus（個人の）から。英private、仏privéと同源。反対語はpúblico。"},
{w:"natural",p:"adj",en:"natural, fresh",fr:"naturel",ex:"Pide un zumo de naranja natural, no de botella; en Valencia es otra cosa.",exEn:"Order a freshly squeezed orange juice, not a bottled one; in Valencia it is something else.",exFr:"Commande un jus d'orange pressé, pas en bouteille ; à Valence, c'est autre chose.",n:"naturaleza（自然）と同じ語根。英natural、仏naturelと同源。飲食では「生の・搾りたての」の意味にもなる。es natural que＋接続法。"},
{w:"tradicional",p:"adj",en:"traditional",fr:"traditionnel",ex:"Si quieres una boda tradicional en Sevilla, es necesario que haya sevillanas y mucho jamón.",exEn:"If you want a traditional wedding in Seville, there have to be sevillanas and lots of ham.",exFr:"Si tu veux un mariage traditionnel à Séville, il faut qu'il y ait des sevillanas et beaucoup de jambon.",n:"tradición（伝統、ラテン語traditio＝引き渡し）から。英traditional、仏traditionnelと同源。"},
{w:"extranjero",p:"adj",en:"foreign",fr:"étranger",ex:"No te preocupes por tu acento extranjero; en Madrid la mitad de la gente es de fuera.",exEn:"Do not worry about your foreign accent; in Madrid half the people are from elsewhere.",exFr:"Ne t'inquiète pas pour ton accent étranger ; à Madrid, la moitié des gens viennent d'ailleurs.",n:"ラテン語extraneus（外の）から、仏étranger を経て入ったとされる。英strange と同源。名詞で「外国人」、el extranjeroで「外国」（vivir en el extranjero）。"},
{w:"mayor",p:"adj",en:"older, bigger, elderly",fr:"plus âgé, plus grand, âgé",ex:"Respeta a las personas mayores en el autobús y deja que se sienten.",exEn:"Respect elderly people on the bus and let them sit down.",exFr:"Respecte les personnes âgées dans le bus et laisse-les s'asseoir.",n:"ラテン語maior（より大きい）から。英major・mayor、仏majeurと同源。grandeの比較級で、年齢では「年上の」。Plaza Mayor（中央広場）のmayorも同じ。"},
{w:"menor",p:"adj",en:"younger, smaller, minor",fr:"plus jeune, plus petit, mineur",ex:"Mi hermano menor quiere que lo lleve a la Tomatina, pero es menor de edad.",exEn:"My younger brother wants me to take him to the Tomatina, but he is under age.",exFr:"Mon petit frère veut que je l'emmène à la Tomatina, mais il est mineur.",n:"ラテン語minor（より小さい）から。英minor、仏mineurと同源。pequeñoの比較級で、年齢では「年下の」。menor de edadは「未成年」。"},
{w:"propio",p:"adj",en:"own, typical of",fr:"propre",ex:"Trae tu propia toalla a la playa; la mía ya tiene suficiente arena.",exEn:"Bring your own towel to the beach; mine already has enough sand on it.",exFr:"Apporte ta propre serviette à la plage ; la mienne a déjà assez de sable.",n:"ラテン語proprius（自分自身の）から。英proper・property、仏propreと同源。所有詞の後に置いて「自分自身の」を強調する。propio de〜で「〜に特有の」。"},
{w:"especial",p:"adj",en:"special",fr:"spécial",ex:"Guarda este vino para una ocasión especial, como el día que apruebes el examen.",exEn:"Save this wine for a special occasion, like the day you pass the exam.",exFr:"Garde ce vin pour une occasion spéciale, comme le jour où tu réussiras l'examen.",n:"ラテン語specialis（特定の種類の）から。英special、仏spécialと同源。el día que＋接続法で「〜する日（未来）」。"},
{w:"próximo",p:"adj",en:"next",fr:"prochain",ex:"La próxima vez que vengas, trae un jamón; es broma, trae dos.",exEn:"Next time you come, bring a ham; just kidding, bring two.",exFr:"La prochaine fois que tu viens, apporte un jambon ; je plaisante, apporte-en deux.",n:"ラテン語proximus（最も近い）から。英proximity、仏prochainと同源。la próxima vez que＋接続法（次に〜するとき）。"},
{w:"siguiente",p:"adj",en:"following, next",fr:"suivant",ex:"Si el tren va lleno, espera al siguiente; en el metro de Madrid pasa uno cada pocos minutos.",exEn:"If the train is full, wait for the next one; on the Madrid metro one comes every few minutes.",exFr:"Si la rame est pleine, attends la suivante ; dans le métro de Madrid, il en passe une toutes les quelques minutes.",n:"seguir（続く）の現在分詞から。英sequent、仏suivantと同源。el día siguiente（翌日）。¡El siguiente!（次の方どうぞ）。"},
{w:"alguien",p:"pron",en:"someone, anyone",fr:"quelqu'un",ex:"¿Hay alguien que sepa hacer una tortilla sin que se rompa al darle la vuelta?",exEn:"Is there anyone who knows how to make a tortilla without it breaking when you flip it?",exFr:"Il y a quelqu'un qui sait faire une tortilla sans qu'elle se casse quand on la retourne ?",n:"ラテン語aliquem（誰か）から。反対語はnadie。存在が不確かな人を表すalguien que＋接続法（〜できる人はいるか）。"},
{w:"cualquiera",p:"pron",en:"anyone, any",fr:"n'importe qui, n'importe lequel",ex:"Pregúntale a cualquiera en Valencia y te dirá que la paella no lleva chorizo.",exEn:"Ask anyone in Valencia and they will tell you that paella does not have chorizo in it.",exFr:"Demande à n'importe qui à Valence et on te dira que la paella ne contient pas de chorizo.",n:"cual＋quiera（望むもの）から。名詞の前ではcualquierになる（cualquier día）。仏n'importe qui に当たる。"},
{w:"así",p:"adv",en:"like this, so, this way",fr:"ainsi, comme ça",ex:"La tortilla se da la vuelta así, con un plato y mucha fe.",exEn:"You flip the tortilla like this, with a plate and a lot of faith.",exFr:"On retourne la tortilla comme ça, avec une assiette et beaucoup de foi.",n:"ラテン語sic（そのように）から来たとされ、sí（はい）と同源。así así（まあまあ）、así es（その通り）など会話でよく使う。"},
{w:"así que",p:"conj",en:"so, therefore",fr:"donc, alors",ex:"Mañana hay huelga de metro, así que ve andando y sal temprano.",exEn:"There is a metro strike tomorrow, so walk and leave early.",exFr:"Demain il y a grève du métro, alors va à pied et pars tôt.",n:"así（そのように）＋que。前の文の結果を述べる「だから」。por lo tantoより口語的。"},
{w:"por eso",p:"loc",en:"that is why",fr:"c'est pour ça que",ex:"Mi abuela es de Cádiz; por eso habla tan rápido y cuenta tantos chistes.",exEn:"My grandmother is from Cádiz; that is why she talks so fast and tells so many jokes.",exFr:"Ma grand-mère est de Cadix ; c'est pour ça qu'elle parle si vite et raconte tant de blagues.",n:"por（理由）＋eso（それ）で「そのために」。直前に述べた理由を受ける。"},
{w:"en cambio",p:"loc",en:"on the other hand, instead",fr:"en revanche",ex:"En el norte llueve mucho; en cambio, en Almería casi no llueve nunca.",exEn:"In the north it rains a lot; on the other hand, in Almería it hardly ever rains.",exFr:"Dans le nord, il pleut beaucoup ; en revanche, à Almería, il ne pleut presque jamais.",n:"cambio（変化、交換）を使った表現。二つのことを対比する「一方で」。仏en revanche と同じ働き。"},
{w:"por lo menos",p:"loc",en:"at least",fr:"au moins",ex:"Quédate por lo menos una semana en Andalucía; tres días no son suficientes.",exEn:"Stay at least a week in Andalusia; three days are not enough.",exFr:"Reste au moins une semaine en Andalousie ; trois jours, ce n'est pas assez.",n:"menos（より少なく）を使った表現で「最も少なくても」。al menosも同じ意味。"},
{w:"es decir",p:"loc",en:"that is to say, in other words",fr:"c'est-à-dire",ex:"Nos vemos después de comer, es decir, a las cinco en España.",exEn:"See you after lunch, in other words, at five in Spain.",exFr:"On se voit après le déjeuner, c'est-à-dire à cinq heures en Espagne.",n:"直訳は「言うことである」。前の内容を言い換える。o sea は口語的な同義表現。"},
{w:"a lo mejor",p:"loc",en:"maybe, perhaps",fr:"peut-être",ex:"A lo mejor vamos a la playa mañana, si no hace viento.",exEn:"Maybe we will go to the beach tomorrow, if it is not windy.",exFr:"Peut-être qu'on ira à la plage demain, s'il n'y a pas de vent.",n:"直訳は「たぶん一番よいことに」。quizásやtal vezと違い、後ろは直説法になる点に注意。スペインの会話で非常によく使う。"},
{w:"ni siquiera",p:"loc",en:"not even",fr:"même pas",ex:"No te vayas sin probar el pulpo; ni siquiera los de Madrid lo hacen como aquí.",exEn:"Do not leave without trying the octopus; not even people in Madrid make it like here.",exFr:"Ne pars pas sans goûter le poulpe ; même à Madrid, on ne le fait pas comme ici.",n:"ni（〜もない）＋siquiera（少なくとも）で「〜さえない」。動詞の前に置くとnoは不要（ni siquiera lo sé）。"},
{w:"ya que",p:"conj",en:"since, because",fr:"puisque",ex:"Ya que estás en Asturias, prueba la fabada y la sidra.",exEn:"Since you are in Asturias, try the fabada and the cider.",exFr:"Puisque tu es dans les Asturies, goûte la fabada et le cidre.",n:"ya（もう）＋que。すでに分かっている理由を述べる「〜なのだから」。後ろは直説法。"},
{w:"de todas formas",p:"loc",en:"anyway, in any case",fr:"de toute façon",ex:"De todas formas, llévate el paraguas; en Bilbao nunca se sabe.",exEn:"Anyway, take your umbrella; in Bilbao you never know.",exFr:"De toute façon, prends ton parapluie ; à Bilbao, on ne sait jamais.",n:"forma（形、方法）を使った表現で「どのような形でも」。de todos modos、de todas manerasも同じ意味。"}
]},
  {id:9, title:"Nivel 9", range:"801–900", words:[
{w:"descubrir",p:"v",en:"to discover, to find out",fr:"découvrir",ex:"Cuando llegamos a Altamira, descubrimos que alguien había pintado bisontes hacía miles de años.",exEn:"When we arrived at Altamira, we discovered that someone had painted bison thousands of years before.",exFr:"Quand nous sommes arrivés à Altamira, nous avons découvert que quelqu'un avait peint des bisons des milliers d'années auparavant.",n:"des-＋cubrir（覆う）で「覆いを取る」。英discover、仏découvrirと同じ組み立て。過去分詞はdescubierto。アルタミラの洞窟壁画は旧石器時代のもの。"},
{w:"inventar",p:"v",en:"to invent, to make up",fr:"inventer",ex:"El chupa-chups fue inventado en Barcelona, y su logotipo lo dibujó Dalí.",exEn:"The Chupa Chups lollipop was invented in Barcelona, and its logo was drawn by Dalí.",exFr:"La sucette Chupa Chups a été inventée à Barcelone, et son logo a été dessiné par Dalí.",n:"ラテン語invenire（見つける）から。英invent、仏inventerと同源。ser＋過去分詞の受け身では、過去分詞が主語の性数に合う（fue inventado）。チュッパチャプスのロゴはダリのデザインとして知られる。"},
{w:"fundar",p:"v",en:"to found, to establish",fr:"fonder",ex:"Buenos Aires fue fundada dos veces, porque la primera ciudad había sido abandonada.",exEn:"Buenos Aires was founded twice, because the first city had been abandoned.",exFr:"Buenos Aires a été fondée deux fois, parce que la première ville avait été abandonnée.",n:"ラテン語fundare（基礎を置く）から。英found・fundamental、仏fonderと同源。ブエノスアイレスは1536年と1580年の2度建設された。"},
{w:"conquistar",p:"v",en:"to conquer, to win over",fr:"conquérir",ex:"Los árabes conquistaron casi toda la península en solo siete años, y se quedaron casi ocho siglos.",exEn:"The Arabs conquered almost the whole peninsula in only seven years, and stayed almost eight centuries.",exFr:"Les Arabes ont conquis presque toute la péninsule en seulement sept ans, et y sont restés presque huit siècles.",n:"ラテン語conquirere（探し求める）から。英conquer、仏conquérirと同源。人の心を「つかむ」の意味にもなる。711年から1492年までイスラム勢力がイベリア半島に存在した。"},
{w:"destruir",p:"v",en:"to destroy",fr:"détruire",ex:"El puente romano de Córdoba no fue destruido por las guerras; todavía lo cruzamos cada día.",exEn:"The Roman bridge in Córdoba was not destroyed by the wars; we still cross it every day.",exFr:"Le pont romain de Cordoue n'a pas été détruit par les guerres ; nous le traversons encore tous les jours.",n:"ラテン語destruere（取り壊す）から。英destroy、仏détruireと同源。construirと同じく現在形でyが入る（destruyo）。"},
{w:"publicar",p:"v",en:"to publish, to post",fr:"publier",ex:"La primera parte del Quijote se publicó en 1605 y fue un éxito inmediato.",exEn:"The first part of Don Quixote was published in 1605 and was an immediate success.",exFr:"La première partie du Don Quichotte a été publiée en 1605 et a connu un succès immédiat.",n:"ラテン語publicare（公にする）から。英publish、仏publierと同源。se publicó はseを使った受け身（再帰受身）。"},
{w:"traducir",p:"v",en:"to translate",fr:"traduire",ex:"El Quijote ha sido traducido a más de cien lenguas, pero los chistes de Sancho son difíciles de traducir.",exEn:"Don Quixote has been translated into more than a hundred languages, but Sancho's jokes are hard to translate.",exFr:"Le Don Quichotte a été traduit dans plus de cent langues, mais les blagues de Sancho sont difficiles à traduire.",n:"ラテン語traducere（向こうへ導く）から。仏traduireと同源。点過去はtraduje, tradujo、1人称現在はtraduzco。"},
{w:"producir",p:"v",en:"to produce",fr:"produire",ex:"En esta bodega se produce el vino que se había servido en la boda de mis abuelos.",exEn:"This winery produces the wine that had been served at my grandparents' wedding.",exFr:"Dans cette cave, on produit le vin qui avait été servi au mariage de mes grands-parents.",n:"ラテン語producere（前に導く）から。英produce、仏produireと同源。1人称現在はproduzco、点過去はproduje。se produce は再帰受身。"},
{w:"dirigir",p:"v",en:"to direct, to manage",fr:"diriger",ex:"Pedro Almodóvar ha dirigido películas que han sido vistas en todo el mundo.",exEn:"Pedro Almodóvar has directed films that have been seen all over the world.",exFr:"Pedro Almodóvar a réalisé des films qui ont été vus dans le monde entier.",n:"ラテン語dirigere（まっすぐにする）から。英direct、仏dirigerと同源。1人称現在と接続法はg→j（dirijo, dirija）。「映画を監督する」「会社を経営する」「手紙を宛てる（dirigirse a）」の意味。"},
{w:"declarar",p:"v",en:"to declare, to state",fr:"déclarer",ex:"El flamenco fue declarado Patrimonio de la Humanidad en 2010.",exEn:"Flamenco was declared a Heritage of Humanity in 2010.",exFr:"Le flamenco a été déclaré patrimoine de l'humanité en 2010.",n:"ラテン語declarare（明らかにする）から。英declare、仏déclarerと同源。フラメンコは2010年にユネスコの無形文化遺産に登録された。"},
{w:"anunciar",p:"v",en:"to announce, to advertise",fr:"annoncer",ex:"Anunciaron que el tren había sido cancelado, así que fuimos a Toledo en autobús.",exEn:"They announced that the train had been cancelled, so we went to Toledo by bus.",exFr:"On a annoncé que le train avait été annulé, alors nous sommes allés à Tolède en bus.",n:"ラテン語nuntius（使者）から。英announce、仏annoncerと同源。名詞el anuncioは「お知らせ・広告」。"},
{w:"informar",p:"v",en:"to inform, to report",fr:"informer",ex:"Nos informaron de que el museo se había cerrado por obras, justo el día que llegamos.",exEn:"They informed us that the museum had been closed for works, just on the day we arrived.",exFr:"On nous a informés que le musée avait été fermé pour travaux, justement le jour où nous sommes arrivés.",n:"ラテン語informare（形を与える）から。英inform、仏informerと同源。informar de〜で「〜について知らせる」。名詞la información、口語でlas noticias。"},
{w:"investigar",p:"v",en:"to investigate, to research",fr:"enquêter, faire des recherches",ex:"Los científicos que investigan el lince ibérico dicen que ya se ha salvado de la extinción.",exEn:"The scientists who study the Iberian lynx say that it has now been saved from extinction.",exFr:"Les scientifiques qui étudient le lynx ibérique disent qu'il a maintenant été sauvé de l'extinction.",n:"ラテン語investigare（足跡をたどる）から。英investigate と同源。「捜査する」と「研究する」の両方の意味。スペインオオヤマネコは保護活動で数が回復した。"},
{w:"robar",p:"v",en:"to steal, to rob",fr:"voler",ex:"Cuando volví a la mesa, alguien ya me había robado las patatas bravas.",exEn:"When I came back to the table, someone had already stolen my patatas bravas.",exFr:"Quand je suis revenu à la table, quelqu'un m'avait déjà volé mes patatas bravas.",n:"ゲルマン語raubōn（奪う）から。英rob、仏dérober と同源。「人から物を盗む」はrobar algo a alguien。patatas bravasは辛いソースのかかったジャガイモ。"},
{w:"detener",p:"v",en:"to stop, to arrest",fr:"arrêter",ex:"El ladrón que había robado el jamón fue detenido en la estación con el jamón en la maleta.",exEn:"The thief who had stolen the ham was arrested at the station with the ham in his suitcase.",exFr:"Le voleur qui avait volé le jambon a été arrêté à la gare avec le jambon dans sa valise.",n:"de-＋tener（持つ）から「引き止める」。英detain、仏détenirと同源。tenerと同じ不規則活用（detengo, detuve）。"},
{w:"esconder",p:"v",en:"to hide",fr:"cacher",ex:"Mi abuela escondía el dinero en un libro de recetas que nadie había abierto nunca.",exEn:"My grandmother hid money in a recipe book that nobody had ever opened.",exFr:"Ma grand-mère cachait l'argent dans un livre de recettes que personne n'avait jamais ouvert.",n:"ラテン語abscondere（隠す）から。英abscond（逃亡する）と同源。esconderseで「隠れる」。"},
{w:"sufrir",p:"v",en:"to suffer",fr:"souffrir",ex:"En 1755 Cádiz sufrió un maremoto: el terremoto que lo había causado ya había destruido Lisboa.",exEn:"In 1755 Cádiz suffered a tsunami: the earthquake that had caused it had already destroyed Lisbon.",exFr:"En 1755, Cadix a subi un raz-de-marée : le tremblement de terre qui l'avait provoqué avait déjà détruit Lisbonne.",n:"ラテン語sufferre（下で支える、耐える）から。英suffer、仏souffrirと同源。1755年のリスボン地震による津波はカディスにも大きな被害をもたらした。"},
{w:"sobrevivir",p:"v",en:"to survive",fr:"survivre",ex:"La Mezquita de Córdoba sobrevivió porque se construyó una catedral dentro de ella.",exEn:"The Mosque of Córdoba survived because a cathedral was built inside it.",exFr:"La Mosquée de Cordoue a survécu parce qu'une cathédrale a été construite à l'intérieur.",n:"sobre-（上に、越えて）＋vivir（生きる）。英survive、仏survivre と同じ組み立て。コルドバのメスキータは内部にキリスト教の大聖堂が建てられている。"},
{w:"salvar",p:"v",en:"to save, to rescue",fr:"sauver",ex:"El socorrista que me había salvado el verano anterior me reconoció y se rio.",exEn:"The lifeguard who had saved me the previous summer recognized me and laughed.",exFr:"Le maître-nageur qui m'avait sauvé l'été précédent m'a reconnu et a ri.",n:"ラテン語salvare（救う）から。英save・salvation、仏sauverと同源。Salvador（救世主）もこの語から。"},
{w:"restaurar",p:"v",en:"to restore",fr:"restaurer",ex:"El Ecce Homo de Borja fue restaurado por una vecina de ochenta años, y el pueblo se hizo famoso.",exEn:"The Ecce Homo in Borja was restored by an eighty-year-old local woman, and the town became famous.",exFr:"L'Ecce Homo de Borja a été restauré par une habitante de quatre-vingts ans, et le village est devenu célèbre.",n:"ラテン語restaurare（再建する）から。英restore、仏restaurerと同源。restaurante（レストラン）も「元気を回復させる所」でこの語から。ボルハの壁画の「修復」は2012年に世界的な話題になった。"},
{w:"conservar",p:"v",en:"to keep, to preserve",fr:"conserver",ex:"En la cocina de mi abuela se conservan recetas que ya se habían olvidado en el pueblo.",exEn:"My grandmother's kitchen preserves recipes that had already been forgotten in the village.",exFr:"Dans la cuisine de ma grand-mère, on conserve des recettes qui avaient déjà été oubliées au village.",n:"ラテン語conservare（保つ）から。英conserve、仏conserverと同源。名詞las conservasは「缶詰」で、スペインの缶詰（ツナ、イワシなど）は質が高いことで有名。"},
{w:"reconocer",p:"v",en:"to recognize, to admit",fr:"reconnaître",ex:"No te reconocí con el disfraz; ¡habías venido vestido de gallina!",exEn:"I did not recognize you in the costume; you had come dressed as a hen!",exFr:"Je ne t'ai pas reconnu avec le déguisement ; tu étais venu habillé en poule !",n:"re-＋conocer（知る）から。英recognize、仏reconnaîtreと同源。1人称現在はreconozco。「認める」の意味にもなる。"},
{w:"admirar",p:"v",en:"to admire",fr:"admirer",ex:"Admiramos la Alhambra, cuyos palacios fueron construidos por los nazaríes.",exEn:"We admired the Alhambra, whose palaces were built by the Nasrids.",exFr:"Nous avons admiré l'Alhambra, dont les palais ont été construits par les Nasrides.",n:"ラテン語admirari（驚嘆する）から。英admire、仏admirerと同源。cuyo（〜の）は所有を表す関係詞で、後ろの名詞に性数を合わせる（cuyos palacios）。"},
{w:"imaginar",p:"v",en:"to imagine",fr:"imaginer",ex:"Nunca me había imaginado que en Tenerife también nevaba en invierno.",exEn:"I had never imagined that it also snowed in Tenerife in winter.",exFr:"Je n'avais jamais imaginé qu'il neigeait aussi à Tenerife en hiver.",n:"ラテン語imaginari（思い描く）から。英imagine、仏imaginerと同源。imaginarse も同じ意味でよく使う。テネリフェ島のテイデ山頂は冬に雪が積もる。"},
{w:"suponer",p:"v",en:"to suppose, to assume",fr:"supposer",ex:"Supongo que ya habrán llegado a Sevilla; habían salido de Madrid a las ocho.",exEn:"I suppose they will have arrived in Seville by now; they had left Madrid at eight.",exFr:"Je suppose qu'ils seront déjà arrivés à Séville ; ils étaient partis de Madrid à huit heures.",n:"sub-＋poner（置く）から。英suppose、仏supposerと同源。poner と同じ不規則活用（supongo, supuse）。未来完了（habrán llegado）は過去のことの推量にも使う。"},
{w:"pertenecer",p:"v",en:"to belong",fr:"appartenir",ex:"Este castillo había pertenecido a una familia noble, pero ahora es un parador donde se puede dormir.",exEn:"This castle had belonged to a noble family, but now it is a parador where you can sleep.",exFr:"Ce château avait appartenu à une famille noble, mais c'est maintenant un parador où l'on peut dormir.",n:"古スペイン語pertener（属する）から。仏appartenir と同じ語根tenere。1人称現在はpertenezco。pertenecer a〜で「〜に属する」。"},
{w:"existir",p:"v",en:"to exist",fr:"exister",ex:"Hasta 2002 existía la peseta, cuyas monedas de veinticinco tenían un agujero en el centro.",exEn:"Until 2002 there was the peseta, whose twenty-five-peseta coins had a hole in the middle.",exFr:"Jusqu'en 2002 existait la peseta, dont les pièces de vingt-cinq avaient un trou au milieu.",n:"ラテン語exsistere（現れ出る）から。英exist、仏existerと同源。ユーロ導入までスペインの通貨はペセタで、25ペセタ硬貨には中央に穴が開いていた。"},
{w:"desarrollar",p:"v",en:"to develop",fr:"développer",ex:"En los años sesenta se desarrolló el turismo en la costa, y los pueblos de pescadores se convirtieron en ciudades.",exEn:"In the sixties tourism developed on the coast, and the fishing villages turned into cities.",exFr:"Dans les années soixante, le tourisme s'est développé sur la côte, et les villages de pêcheurs sont devenus des villes.",n:"des-＋arrollar（巻く）で「巻いたものを広げる」。仏développer と同じ発想。英develop とも同源とされる。"},
{w:"mejorar",p:"v",en:"to improve",fr:"améliorer",ex:"Mi español ha mejorado mucho desde que vivo con una familia de Valladolid.",exEn:"My Spanish has improved a lot since I have been living with a family from Valladolid.",exFr:"Mon espagnol s'est beaucoup amélioré depuis que je vis avec une famille de Valladolid.",n:"mejor（より良い）から作られた動詞。仏améliorer（meilleur から）と同じ発想。反対語はempeorar（peor から）。¡Que te mejores!は「お大事に」。"},
{w:"emigrar",p:"v",en:"to emigrate",fr:"émigrer",ex:"Mi bisabuelo, que había emigrado a Cuba, volvió rico y construyó una casa de indianos.",exEn:"My great-grandfather, who had emigrated to Cuba, came back rich and built an indiano house.",exFr:"Mon arrière-grand-père, qui avait émigré à Cuba, est revenu riche et a construit une maison d'indiano.",n:"ラテン語emigrare（移り住む）から。英emigrate、仏émigrerと同源。アストゥリアスやカンタブリアには、アメリカ大陸で財を成して帰国した人（indiano）の豪邸が残っている。"},
{w:"heredar",p:"v",en:"to inherit",fr:"hériter",ex:"Heredé de mi abuelo una casa en el pueblo, cuyo tejado se había caído hacía años.",exEn:"I inherited a house in the village from my grandfather, whose roof had fallen in years before.",exFr:"J'ai hérité de mon grand-père une maison au village, dont le toit s'était effondré des années auparavant.",n:"ラテン語hereditare（相続する）から。英heredity・heir、仏hériterと同源。名詞はla herencia（遺産）。"},
{w:"cancelar",p:"v",en:"to cancel",fr:"annuler",ex:"El concierto fue cancelado por la lluvia, pero la gente se quedó bailando en la plaza.",exEn:"The concert was cancelled because of the rain, but people stayed dancing in the square.",exFr:"Le concert a été annulé à cause de la pluie, mais les gens sont restés danser sur la place.",n:"ラテン語cancellare（格子状に線を引いて消す）から。英cancel と同源。スペインではanular も同じ意味でよく使う。"},
{w:"aterrizar",p:"v",en:"to land",fr:"atterrir",ex:"Cuando el avión aterrizó en Canarias, los pasajeros ya se habían quitado los abrigos.",exEn:"When the plane landed in the Canaries, the passengers had already taken off their coats.",exFr:"Quand l'avion a atterri aux Canaries, les passagers avaient déjà enlevé leurs manteaux.",n:"tierra（陸）から「陸に着く」。仏atterrir（terre から）とまったく同じ発想。点過去1人称はaterricé（z→c）。"},
{w:"despegar",p:"v",en:"to take off (plane)",fr:"décoller",ex:"Para cuando despegue el avión, ya habré terminado el bocadillo de tortilla.",exEn:"By the time the plane takes off, I will already have finished my tortilla sandwich.",exFr:"D'ici à ce que l'avion décolle, j'aurai déjà fini mon sandwich à la tortilla.",n:"des-＋pegar（貼る）で「はがす」→「離陸する」。仏décoller（coller＝貼る）とまったく同じ発想。未来完了（habré terminado）は未来のある時点までに完了していることを表す。"},
{w:"el invento",p:"nm",en:"invention",fr:"l'invention",ex:"La fregona es un invento español del que están muy orgullosos todos los que limpian.",exEn:"The mop is a Spanish invention that everyone who cleans is very proud of.",exFr:"La serpillière à manche est une invention espagnole dont tous ceux qui nettoient sont très fiers.",n:"inventar（発明する）の名詞形。英invention、仏invention と同源。スペイン人の発明品としてはfregona（モップ）やchupa-chupsがよく話題になる。del que は前置詞＋関係詞。"},
{w:"la batalla",p:"nf",en:"battle",fr:"la bataille",ex:"En la batalla de Trafalgar, que tuvo lugar en 1805, la flota franco-española fue derrotada.",exEn:"In the Battle of Trafalgar, which took place in 1805, the Franco-Spanish fleet was defeated.",exFr:"Lors de la bataille de Trafalgar, qui a eu lieu en 1805, la flotte franco-espagnole a été vaincue.",n:"後期ラテン語battualia（剣の練習）から。英battle、仏batailleと同源。トラファルガー岬はカディス県にある。"},
{w:"la guerra",p:"nf",en:"war",fr:"la guerre",ex:"Mi abuelo, que había vivido la guerra, nunca tiraba ni un trozo de pan.",exEn:"My grandfather, who had lived through the war, never threw away even a piece of bread.",exFr:"Mon grand-père, qui avait vécu la guerre, ne jetait jamais le moindre morceau de pain.",n:"ゲルマン語werra（混乱）から。英war、仏guerreと同源。ゲルマン語のw-がgu-になる典型例。スペインでは1936〜39年の内戦をla Guerra Civilと呼ぶ。"},
{w:"el imperio",p:"nm",en:"empire",fr:"l'empire",ex:"En el imperio de Felipe II, se decía que nunca se ponía el sol.",exEn:"In Philip II's empire, it was said that the sun never set.",exFr:"Dans l'empire de Philippe II, on disait que le soleil ne se couchait jamais.",n:"ラテン語imperium（命令権）から。英empire・imperial、仏empireと同源。se decía que〜はseを使った無人称表現「〜と言われていた」。"},
