  if(!auto || !auto.idx.length) return;
  const was = auto.playing;
  auto.playing = false; runId++;
  if(window.speechSynthesis) speechSynthesis.cancel();
  auto.pos = (auto.pos + delta + auto.idx.length) % auto.idx.length;
  auto.ph = -1;
  if(was) play(); else renderAuto();
}
function exitAuto(){
  pause();
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  if(bgEl) bgEl.pause();
  if("mediaSession" in navigator) navigator.mediaSession.metadata = null;
  auto = null; view = "home"; render();
}

function setPhase(k){
  if(!auto) return;
  auto.ph = k;
  app.querySelectorAll(".card.auto .line").forEach(el=> el.classList.toggle("cur", +el.dataset.ph===k || k<0));
}

function renderAuto(){
  const {lv, idx, pos, playing} = auto;
  const L = LEVELS.find(x=>x.id===lv);
  if(!idx.length){
    app.innerHTML = `<div class="top"><button class="back" id="bk">← レベル一覧</button></div>
      <div class="empty">このレベルは全部覚えました。<br>「覚えた単語を出さない」をオフにすると聞き流せます。</div>`;
    app.querySelector("#bk").onclick = exitAuto;
    return;
  }
  const d = L.words[idx[pos]];
  app.innerHTML = `
    <div class="top"><button class="back" id="bk">← レベル一覧</button>
      <span class="pos">${L.title}　${pos+1} / ${idx.length}</span></div>
    <div class="topbar"><i style="width:${(pos+1)/idx.length*100}%"></i></div>
    <div class="card auto">
      <div class="line" data-ph="0"><div class="headword serif">${esc(d.w)}</div></div>
      <div class="line" data-ph="1"><div class="en">${esc(d.en)}</div></div>
      <div class="line" data-ph="2"><p class="ex">${esc(d.ex)}</p></div>
      <div class="line" data-ph="3"><div class="en">${esc(d.exEn)}</div></div>
    </div>
    <div class="ctrl">
      <button id="prev" aria-label="前の単語">${IC.prev}</button>
      <button id="pp" class="pp" aria-label="${playing?"一時停止":"再生"}">${playing?IC.pause:IC.play}</button>
      <button id="next" aria-label="次の単語">${IC.next}</button>
    </div>
    <p class="hint">再生中は画面がつけたままになります。最後の単語まで行くと先頭に戻って繰り返します。<br>
    ${S.bgAudio ? "バックグラウンド再生：オン（画面を消しても続くかは端末によります）" : "画面を消すと止まります。止めたくない場合はレベル一覧で「バックグラウンド再生」をお試しください。"}</p>`;
  app.querySelector("#bk").onclick = exitAuto;
  app.querySelector("#pp").onclick = ()=> auto.playing ? pause() : play();
  app.querySelector("#prev").onclick = ()=> skip(-1);
  app.querySelector("#next").onclick = ()=> skip(1);
  setPhase(auto.ph);
}

/* 画面を消さない（Wake Lock） */
async function keepAwake(){
  try{
    if("wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
    }
  }catch(e){ console.warn("wake lock", e); }
}
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && auto && auto.playing) keepAwake();
});

/* バックグラウンド再生（試験的）：無音の音声を流してメディアとして扱わせ、
   車のハンドル・Bluetoothの再生/停止/次へボタンにも対応させる */
function silentWav(sec){
  const rate = 8000, n = rate*sec, buf = new ArrayBuffer(44+n), v = new DataView(buf);
  const w = (o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i, str.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n,true); w(8,"WAVE"); w(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate,true); v.setUint16(32,1,true); v.setUint16(34,8,true);
  w(36,"data"); v.setUint32(40,n,true);
  for(let i=0;i<n;i++) v.setUint8(44+i,128);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
function startBg(){
  if(!bgEl){ bgEl = new Audio(silentWav(10)); bgEl.loop = true; }
  bgEl.play().catch(e=>console.warn("bg audio", e));
  if("mediaSession" in navigator){
    const ms = navigator.mediaSession;
    ms.setActionHandler("play", ()=>play());
    ms.setActionHandler("pause", ()=>pause());
    ms.setActionHandler("nexttrack", ()=>skip(1));
    ms.setActionHandler("previoustrack", ()=>skip(-1));
  }
}
function setMeta(d){
  if(!S.bgAudio || !("mediaSession" in navigator) || !auto) return;
  const ms = navigator.mediaSession;
  if(d && "MediaMetadata" in window){
    ms.metadata = new MediaMetadata({title:d.w, artist:d.en, album:"Vocabulario Nivel "+auto.lv,
      artwork:[{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});
  }
  ms.playbackState = auto.playing ? "playing" : "paused";
}

function render(){
  if(view==="home") renderHome();
  else if(view==="auto") renderAuto();
  else renderStudy();
}

load().then(render);
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(e=>console.warn("sw", e));
}
</script>
</body>
</html>
